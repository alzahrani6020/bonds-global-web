<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تم تأكيد الحساب — Bonds</title>
  <link rel="stylesheet" href="../../styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../../assets/bonds-mark.svg">
  <link rel="stylesheet" href="confirmed.css" />
  <link rel="canonical" href="https://bonds-global.com/calculators/auth/confirmed" />
  <meta property="og:title" content="تم تأكيد الحساب — Bonds" />
  <meta property="og:description" content="حاسبات مالية متخصصة واستشارات اقتصادية من بوندز." />
  <meta property="og:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />
  <meta property="og:url" content="https://bonds-global.com/calculators/auth/confirmed" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="تم تأكيد الحساب — Bonds" />
  <meta name="twitter:description" content="حاسبات مالية متخصصة واستشارات اقتصادية من بوندز." />
  <meta name="twitter:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />

  <meta name="description" content="حاسبات مالية متخصصة واستشارات اقتصادية من بوندز." />

</head>
<body>
  <div class="container">
    <div class="card" id="card">
      <div class="spinner" id="spinner"></div>
      <p id="status" style="color:var(--text-secondary)">جاري تأكيد حسابك...</p>
    </div>
  </div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3"></script>
  <script>
    (async () => {
      const card = document.getElementById('card');
      const spinner = document.getElementById('spinner');
      const status = document.getElementById('status');

      // Wait a moment for Supabase to process the session from URL
      await new Promise(r => setTimeout(r, 1500));

      const { data } = await window.BondsAuth.getSession();
      const user = data?.session?.user;

      spinner.style.display = 'none';

      if (user) {
        // Complete signup if pending password exists (magic link / OAuth signup)
        const pendingPassword = sessionStorage.getItem('otp_pending_password');
        if (pendingPassword) {
          status.textContent = 'جارِ إعداد حسابك...';
          try {
            const { error: pwError } = await window.BondsAuth.updateUser({ password: pendingPassword });
            if (pwError) console.warn('[Confirmed] Password set warning:', pwError);
          } catch (e) { console.warn('[Confirmed] Password set exception:', e); }
          sessionStorage.removeItem('otp_pending_password');
          try {
            const metadata = {
              id: user.id,
              restaurant_name: sessionStorage.getItem('otp_pending_name') || user.user_metadata?.restaurant_name || '',
              phone: sessionStorage.getItem('otp_pending_phone') || user.user_metadata?.phone || '',
              language: 'ar'
            };
            await window.BondsAuth.updateProfile(user.id, metadata);
          } catch (profileErr) { console.warn('[Confirmed] Profile update warning:', profileErr); }
          sessionStorage.removeItem('otp_pending_name');
          sessionStorage.removeItem('otp_pending_phone');
          if (typeof gtag !== 'undefined') gtag('event', 'sign_up', { method: 'email_otp' });
        }

        // Email confirmed and session active
        // Check if onboarding is needed
        window.BondsAuth.getProfile(user.id).then(({ data: profile }) => {
          const needsOnboarding = !profile || !profile.city || !profile.business_type || !profile.bio || !profile.needs;
          if (needsOnboarding) {
            card.innerHTML = `
              <span class="icon">🎉</span>
              <h1>تم تأكيد حسابك!</h1>
              <p>
                مرحباً <strong>${user.user_metadata?.restaurant_name || user.email}</strong>!<br><br>
                تم تأكيد حسابك بنجاح. بقي خطوة أخيرة لإكمال ملفك.
              </p>
              <a href="/calculators/auth/onboarding.html" class="btn">أكمل معلوماتك</a>
            `;
          } else {
            card.innerHTML = `
              <span class="icon">🎉</span>
              <h1>تم تأكيد حسابك!</h1>
              <p>
                مرحباً <strong>${user.user_metadata?.restaurant_name || user.email}</strong>!<br><br>
                تم تأكيد حسابك في <span class="brand">Bonds للاستشارات المالية</span> بنجاح.<br>
                يمكنك الآن استخدام جميع الخدمات.
              </p>
              <a href="/calculators/dashboard.html" class="btn">لوحة التحكم</a>
            `;
          }
        }).catch(() => {
          card.innerHTML = `
            <span class="icon">🎉</span>
            <h1>تم تأكيد حسابك!</h1>
            <p>
              مرحباً <strong>${user.user_metadata?.restaurant_name || user.email}</strong>!<br><br>
              تم تأكيد حسابك بنجاح.
            </p>
            <a href="/calculators/auth/onboarding.html" class="btn">أكمل معلوماتك</a>
          `;
        });
        return;
      } else {
        // No session — maybe already confirmed or token expired
        card.innerHTML = `
          <span class="icon">✅</span>
          <h1>تم تأكيد الحساب!</h1>
          <p>
            تم تأكيد بريدك الإلكتروني في <span class="brand">Bonds للاستشارات المالية</span>.<br><br>
            يمكنك الآن تسجيل الدخول واستخدام جميع الخدمات.
          </p>
          <a href="./index.html" class="btn">تسجيل الدخول</a>
        `;
      }
    })();
  </script>
<script>

</script>
  <script src="../../page-tracker-v2.js"></script>
</body>
</html>
