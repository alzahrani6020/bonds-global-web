<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حسابي — Bonds</title>
  <link rel="stylesheet" href="../../styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="../../assets/bonds-mark.svg" />
  <link rel="stylesheet" href="auth-shared.css" />
  <style>body{font-family:'Tajawal','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:var(--space-6)}
.account-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-8);flex-wrap:wrap;gap:var(--space-4)}
.account-header h1{font-size:1.8rem;font-weight:800;color:var(--gold)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-6);margin-bottom:var(--space-6)}
.card h2{font-size:1.1rem;font-weight:700;color:var(--gold);margin-bottom:var(--space-4);display:flex;align-items:center;gap:var(--space-3)}
.card h2 span{font-size:1.3rem}
.info-row{display:flex;justify-content:space-between;padding:var(--space-3) 0;border-bottom:1px solid var(--border);font-size:0.95rem}
.info-row:last-child{border-bottom:none}
.info-row .label{color:var(--text-secondary)}
.info-row .value{font-weight:700}
.tier-badge{display:inline-block;padding:0.3rem 0.8rem;border-radius:20px;font-size:0.8rem;font-weight:700}
.tier-free{background:rgba(150,150,150,0.15);color:#aaa}
.tier-pro{background:rgba(212,168,83,0.15);color:var(--gold);border:1px solid rgba(212,168,83,0.3)}
.tier-enterprise{background:rgba(138,43,226,0.15);color:#a855f7;border:1px solid rgba(138,43,226,0.3)}
.btn{padding:var(--space-3) var(--space-6);border-radius:var(--radius-md);font-family:inherit;font-size:0.95rem;font-weight:700;cursor:pointer;border:none;transition:all 0.2s;text-decoration:none;display:inline-block}
.btn-secondary:hover{border-color:var(--gold)}
.btn-danger{background:#3a1515;color:#ff8a8a;border:1px solid #5a2525}
.btn-danger:hover{background:#4a2020}
.actions{display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-6)}
.empty-state{text-align:center;color:var(--text-secondary);padding:var(--space-8)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6)}
@media(max-width:768px){.grid-2{grid-template-columns:1fr}</style>
</head>
<body>
  <div class="container">
    <div class="account-header">
      <div>
        <h1>👤 حسابي</h1>
        <p style="color:var(--text-secondary);margin-top:0.5rem;">إدارة اشتراكك وسيناريوهاتك</p>
      </div>
      <a href="../../calculator.html" class="btn btn-secondary">← العودة للحاسبة</a>
    </div>

    <div class="grid-2">
      <!-- Profile Card -->
      <div class="card">
        <h2><span>🍽️</span> الملف الشخصي</h2>
        <div id="profileLoading" class="empty-state">جاري التحميل...</div>
        <div id="profileContent" style="display:none;">
          <div class="info-row"><span class="label">الاسم</span><span class="value" id="accName">—</span></div>
          <div class="info-row"><span class="label">البريد</span><span class="value" id="accEmail">—</span></div>
          <div class="info-row"><span class="label">الدولة</span><span class="value" id="accCountry">—</span></div>
          <div class="info-row"><span class="label">المدينة</span><span class="value" id="accCity">—</span></div>
          <div class="info-row"><span class="label">النشاط التجاري</span><span class="value" id="accBiz">—</span></div>
          <div class="info-row"><span class="label">عدد الرواد</span><span class="value" id="accEmp">—</span></div>
          <div class="info-row"><span class="label">نبذة</span><span class="value" id="accBio" style="white-space:pre-wrap;font-size:0.85rem;">—</span></div>
          <div class="info-row"><span class="label">احتياجات</span><span class="value" id="accNeeds" style="white-space:pre-wrap;font-size:0.85rem;">—</span></div>
          <div class="info-row"><span class="label">اللغة</span><span class="value" id="accLang">—</span></div>
          <div style="margin-top:1rem;"><button class="btn btn-primary" onclick="toggleEdit()">✏️ تعديل</button></div>
        </div>

        <!-- Edit Form -->
        <div id="profileEdit" style="display:none;">
          <div class="info-row" style="flex-direction:column;align-items:stretch;gap:0.5rem;border:none;padding:0.75rem 0;">
            <label style="color:var(--text-secondary);font-size:0.85rem;font-weight:700;">الاسم</label>
            <input type="text" id="editName" style="padding:0.6rem 0.9rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text);font-family:inherit;">
          </div>
          <div class="info-row" style="flex-direction:column;align-items:stretch;gap:0.5rem;border:none;padding:0.75rem 0;">
            <label style="color:var(--text-secondary);font-size:0.85rem;font-weight:700;">الدولة</label>
            <input type="text" id="editCountry" style="padding:0.6rem 0.9rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text);font-family:inherit;">
          </div>
          <div class="info-row" style="flex-direction:column;align-items:stretch;gap:0.5rem;border:none;padding:0.75rem 0;">
            <label style="color:var(--text-secondary);font-size:0.85rem;font-weight:700;">المدينة</label>
            <input type="text" id="editCity" style="padding:0.6rem 0.9rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text);font-family:inherit;">
          </div>
          <div class="info-row" style="flex-direction:column;align-items:stretch;gap:0.5rem;border:none;padding:0.75rem 0;">
            <label style="color:var(--text-secondary);font-size:0.85rem;font-weight:700;">النشاط التجاري</label>
            <input type="text" id="editBiz" style="padding:0.6rem 0.9rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text);font-family:inherit;">
          </div>
          <div class="info-row" style="flex-direction:column;align-items:stretch;gap:0.5rem;border:none;padding:0.75rem 0;">
            <label style="color:var(--text-secondary);font-size:0.85rem;font-weight:700;">عدد الرواد / الموظفين</label>
            <input type="number" id="editEmp" style="padding:0.6rem 0.9rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text);font-family:inherit;">
          </div>
          <div class="info-row" style="flex-direction:column;align-items:stretch;gap:0.5rem;border:none;padding:0.75rem 0;">
            <label style="color:var(--text-secondary);font-size:0.85rem;font-weight:700;">نبذة عن عملك</label>
            <textarea id="editBio" rows="3" style="padding:0.6rem 0.9rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text);font-family:inherit;resize:vertical;"></textarea>
          </div>
          <div class="info-row" style="flex-direction:column;align-items:stretch;gap:0.5rem;border:none;padding:0.75rem 0;">
            <label style="color:var(--text-secondary);font-size:0.85rem;font-weight:700;">احتياجاتك</label>
            <textarea id="editNeeds" rows="3" style="padding:0.6rem 0.9rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text);font-family:inherit;resize:vertical;"></textarea>
          </div>
          <div id="editMsg" style="color:#ef4444;font-size:0.85rem;text-align:center;margin-top:0.5rem;display:none;"></div>
          <div style="display:flex;gap:0.75rem;margin-top:1rem;">
            <button class="btn btn-primary" onclick="saveProfile()">💾 حفظ</button>
            <button class="btn btn-secondary" onclick="toggleEdit()">إلغاء</button>
          </div>
        </div>
      </div>

      <!-- Subscription Card -->
      <div class="card">
        <h2><span>💳</span> الاشتراك</h2>
        <div id="subLoading" class="empty-state">جاري التحميل...</div>
        <div id="subContent" style="display:none;">
          <div class="info-row"><span class="label">الباقة</span><span class="value" id="accTier">—</span></div>
          <div class="info-row"><span class="label">الحالة</span><span class="value" id="accStatus">—</span></div>
          <div class="info-row" id="renewalRow" style="display:none;"><span class="label">التجديد</span><span class="value" id="accRenewal">—</span></div>
          <div class="actions">
            <button id="btnManageSub" class="btn btn-primary" style="display:none;">إدارة الاشتراك</button>
            <a href="../../pricing.html" id="btnUpgrade" class="btn btn-primary" style="display:none;">الترقية</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Scenarios Card -->
    <div class="card">
      <h2><span>📁</span> سيناريوهاتي المحفوظة</h2>
      <div id="scenariosLoading" class="empty-state">جاري التحميل...</div>
      <div id="scenariosList" style="display:none;"></div>
    </div>

    <!-- Health Score History -->
    <div class="card" id="healthCard" style="display:none;">
      <h2><span>❤️</span> تاريخ Health Score</h2>
      <div id="healthHistoryList"></div>
    </div>

    <div class="actions" style="justify-content:center;">
      <button onclick="window.BondsAuth.signOut().then(()=>location.href='../../index.html')" class="btn btn-danger">🚪 تسجيل الخروج</button>
    </div>
  </div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js"></script>
  <script src="../../v3/master-data/countries-governorates-cities.js"></script>
  <script src="../../calculators/shared-geo.js"></script>

  <script>
    // Env validation
    setTimeout(function(){
      var env = window.__ENV || {};
      if (!env.SUPABASE_URL || !env.SUPABASE_ANON_KEY) {
        var banner = document.createElement('div');
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#5a1a1a;color:#ff8a8a;padding:12px;text-align:center;z-index:99999;font-size:0.9rem;';
        banner.innerHTML = '⚠️ لم يتم إعداد متغيرات البيئة (Environment Variables). يرجى مراجعة دليل النشر.';
        document.body.prepend(banner);
      }
    }, 500);
    (async function() {
      'use strict';

      const { data: sessionData } = await window.BondsAuth.getSession();
      const session = sessionData?.session;
      if (!session) {
        window.location.href = 'index.html?redirect=' + encodeURIComponent(location.pathname);
        return;
      }

      const user = session.user;
      const sb = window.BondsAuth.getSupabase();

      // Load profile
      const { data: profile } = await window.BondsAuth.getProfile(user.id);
      document.getElementById('profileLoading').style.display = 'none';
      document.getElementById('profileContent').style.display = 'block';
      document.getElementById('accName').textContent = profile?.restaurant_name || user.user_metadata?.restaurant_name || '—';
      document.getElementById('accEmail').textContent = user.email;
      const countryCode = profile?.country || user.user_metadata?.country || '';
      const cityCode = profile?.city || profile?.city_code || '';
      document.getElementById('accCountry').textContent = countryCode ? window.BondsGeo.getCountryName(countryCode, 'ar') : '—';
      const cityInfo = cityCode ? window.BondsGeo.findCityByCode(cityCode) : null;
      document.getElementById('accCity').textContent = cityInfo ? cityInfo.city.name : (cityCode || '—');
      document.getElementById('accBiz').textContent = profile?.business_type || '—';
      document.getElementById('accEmp').textContent = profile?.employee_count || '—';
      document.getElementById('accBio').textContent = profile?.bio || '—';
      document.getElementById('accNeeds').textContent = profile?.needs || '—';
      document.getElementById('accLang').textContent = profile?.language === 'en' ? 'English' : 'العربية';

      window.__currentProfile = profile;

      function toggleEdit() {
        const view = document.getElementById('profileContent');
        const edit = document.getElementById('profileEdit');
        const isEdit = edit.style.display === 'block';
        view.style.display = isEdit ? 'block' : 'none';
        edit.style.display = isEdit ? 'none' : 'block';
        if (!isEdit) {
          document.getElementById('editName').value = profile?.restaurant_name || '';
          document.getElementById('editCountry').value = profile?.country || '';
          document.getElementById('editCity').value = profile?.city || '';
          document.getElementById('editBiz').value = profile?.business_type || '';
          document.getElementById('editEmp').value = profile?.employee_count || '';
          document.getElementById('editBio').value = profile?.bio || '';
          document.getElementById('editNeeds').value = profile?.needs || '';
        }
      }
      window.toggleEdit = toggleEdit;

      async function saveProfile() {
        const msg = document.getElementById('editMsg');
        msg.style.display = 'none';
        const updates = {
          restaurant_name: document.getElementById('editName').value.trim(),
          country: document.getElementById('editCountry').value.trim(),
          city: document.getElementById('editCity').value.trim(),
          business_type: document.getElementById('editBiz').value.trim(),
          employee_count: parseInt(document.getElementById('editEmp').value) || 0,
          bio: document.getElementById('editBio').value.trim(),
          needs: document.getElementById('editNeeds').value.trim(),
          updated_at: new Date().toISOString()
        };
        const { error } = await sb.from('profiles').update(updates).eq('id', user.id);
        if (error) { msg.textContent = 'خطأ: ' + error.message; msg.style.display = 'block'; return; }
        location.reload();
      }
      window.saveProfile = saveProfile;

      // Load subscription
      const { data: sub } = await window.BondsAuth.getSubscription(user.id);
      document.getElementById('subLoading').style.display = 'none';
      document.getElementById('subContent').style.display = 'block';

      const tier = sub?.tier || 'free';
      const status = sub?.status || 'inactive';
      const tierLabel = tier === 'enterprise' ? 'Enterprise' : (tier === 'pro' ? 'Pro' : 'Free');
      const tierClass = tier === 'enterprise' ? 'tier-enterprise' : (tier === 'pro' ? 'tier-pro' : 'tier-free');
      const statusLabel = status === 'active' ? 'نشط' : (status === 'trialing' ? 'فترة تجريبية' : (status === 'past_due' ? 'متأخر' : 'غير نشط'));

      document.getElementById('accTier').innerHTML = `<span class="tier-badge ${tierClass}">${tierLabel}</span>`;
      document.getElementById('accStatus').textContent = statusLabel;

      if (sub?.current_period_end) {
        document.getElementById('renewalRow').style.display = 'flex';
        document.getElementById('accRenewal').textContent = new Date(sub.current_period_end).toLocaleDateString('ar-SA');
      }

      if (tier === 'free') {
        document.getElementById('btnUpgrade').style.display = 'inline-block';
      } else if (sub?.stripe_subscription_id) {
        document.getElementById('btnManageSub').style.display = 'inline-block';
        document.getElementById('btnManageSub').addEventListener('click', async () => {
          // Create portal session via API
          try {
            const res = await fetch('/api/create-portal', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ customerId: sub.stripe_customer_id, returnUrl: location.href })
            });
            const json = await res.json();
            if (json.url) window.location.href = json.url;
          } catch(e) { alert('تعذر فتح بوابة الإدارة'); }
        });
      }

      // Load scenarios
      const { data: scenarios } = await sb.from('scenarios').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
      document.getElementById('scenariosLoading').style.display = 'none';
      const list = document.getElementById('scenariosList');
      list.style.display = 'block';

      if (!scenarios || scenarios.length === 0) {
        list.innerHTML = '<div class="empty-state">لا توجد سيناريوهات محفوظة. <a href="../../calculators/restaurant.html" style="color:var(--gold);">اذهب للحاسبة</a></div>';
      } else {
        list.innerHTML = scenarios.map(s => `
          <div class="info-row" style="align-items:center;">
            <div>
              <div style="font-weight:700;">${s.name}</div>
              <div style="font-size:0.8rem;color:var(--text-secondary);">${window.BondsGeo.getCountryName(s.country, 'ar')} · ${new Date(s.created_at).toLocaleDateString('ar-SA')}</div>
            </div>
            <a href="../../calculators/restaurant.html?country=${s.country}&load=${s.id}" class="btn btn-secondary" style="font-size:0.8rem;padding:0.4rem 0.8rem;">فتح</a>
          </div>
        `).join('');
      }

      // Load health score history (Pro only)
      if (tier === 'pro' || tier === 'enterprise') {
        const { data: healthScores } = await sb.from('health_scores').select('*').eq('user_id', user.id).order('created_at', { ascending: false }).limit(20);
        if (healthScores && healthScores.length > 0) {
          document.getElementById('healthCard').style.display = 'block';
          document.getElementById('healthHistoryList').innerHTML = healthScores.map(h => `
            <div class="info-row" style="align-items:center;">
              <div>
                <div style="font-weight:700;">${window.BondsGeo.getCountryName(h.country, 'ar')}</div>
                <div style="font-size:0.8rem;color:var(--text-secondary);">${new Date(h.created_at).toLocaleDateString('ar-SA')}</div>
              </div>
              <div class="tier-badge ${h.score >= 80 ? 'tier-pro' : (h.score >= 50 ? 'tier-free' : 'tier-danger')}" style="font-size:0.85rem;padding:0.2rem 0.6rem;">${h.score}/100</div>
            </div>
          `).join('');
        }
      }
    })();
  </script>
<script>

</script>
  <script src="../../page-tracker-v2.js"></script>
</body>
</html>
