<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../styles.css" />
  <title>أكمل معلوماتك | بوندز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="../../assets/bonds-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./auth-shared.css?v=2" />
  <link rel="canonical" href="https://bonds-global.com/calculators/auth/onboarding" />
  <meta property="og:title" content="أكمل معلوماتك | بوندز" />
  <meta property="og:description" content="حاسبات مالية متخصصة واستشارات اقتصادية من بوندز." />
  <meta property="og:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />
  <meta property="og:url" content="https://bonds-global.com/calculators/auth/onboarding" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="أكمل معلوماتك | بوندز" />
  <meta name="twitter:description" content="حاسبات مالية متخصصة واستشارات اقتصادية من بوندز." />
  <meta name="twitter:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />

  <meta name="description" content="حاسبات مالية متخصصة واستشارات اقتصادية من بوندز." />

<link rel="stylesheet" href="../../components/universal-dropdown.css?v=2.51.8" />
<script src="/calculators/auth-gate.js?v=2"></script>
  </head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <img src="../../assets/bonds-logo-2026-sm.webp?v=2026" alt="Bonds" />
        <span>Bonds</span>
      </div>

      <h1>أكمل معلومات منشأتك</h1>
      <p class="subtitle">بيانات دقيقة تساعدنا في تقديم استشارة مخصصة لك.</p>

      <div class="progress">
        <div class="dot active"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>

      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>

      <form id="onboardingForm">
        <div class="form-group">
          <label for="restaurantName">اسم المطعم / الشركة *</label>
          <input type="text" id="restaurantName" required placeholder="مثال: مطعم الذواقة" />
        </div>

        <div class="row">
          <div class="form-group">
            <label for="country">الدولة *</label>
            <select data-universal-dropdown="true" data-ud-search="true" data-ud-sort="true" data-ud-deduplicate="true" data-ud-remove-empty="true" data-ud-max-results="50" id="country" required>
              <option value="">اختر الدولة</option>
            </select>
          </div>
          <div class="form-group">
            <label for="governorate">المحافظة / المنطقة *</label>
            <select data-universal-dropdown="true" data-ud-search="true" data-ud-sort="true" data-ud-deduplicate="true" data-ud-remove-empty="true" id="governorate" required>
              <option value="">اختر المحافظة</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="city">المدينة *</label>
            <select data-universal-dropdown="true" data-ud-search="true" data-ud-sort="true" data-ud-deduplicate="true" data-ud-remove-empty="true" id="city" required>
              <option value="">اختر المدينة</option>
            </select>
          </div>
          <div class="form-group">
            <label for="phone">رقم الجوال *</label>
            <input type="tel" id="phone" required placeholder="05xxxxxxxx" dir="ltr" />
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="businessType">نوع النشاط التجاري *</label>
            <select data-universal-dropdown="true" id="businessType" required>
              <option value="">اختر النشاط</option>
              <option value="restaurant">مطعم / مطعم سريع</option>
              <option value="cafe">مقهى</option>
              <option value="bakery">مخبز / حلويات</option>
              <option value="food_truck">عربة طعام</option>
              <option value="catering">تموين</option>
              <option value="retail">متجر تجزئة</option>
              <option value="manufacturing">تصنيع غذائي</option>
              <option value="other">أخرى</option>
            </select>
          </div>
          <div class="form-group">
            <label for="employeeCount">عدد الموظفين *</label>
            <input type="number" id="employeeCount" required min="0" placeholder="مثال: 12" />
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="branchCount">عدد فروع المنشأة *</label>
            <input type="number" id="branchCount" required min="1" placeholder="مثال: 1" />
          </div>
          <div class="form-group">
            <label for="bio">نبذة عن المشروع *</label>
            <textarea id="bio" required rows="3" placeholder="اكتب نبذة مختصرة عن مشروعك..."></textarea>
          </div>
        </div>

        <div class="form-group">
          <label for="needs">الاحتياجات والخدمات المطلوبة *</label>
          <textarea id="needs" required rows="3" placeholder="مثال: تحليل مالي، دراسة جدوى متكاملة، تسعير..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="saveBtn">
          <span class="spinner"></span>
          <span class="btn-text">💾 حفظ والمتابعة</span>
        </button>
        <button type="button" class="btn btn-secondary" id="skipBtn" style="margin-top:0.75rem;width:100%;">⏭️ تخطي الآن (إكمال لاحقاً)</button>
      </form>
    </div>
  </div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3.0.5"></script>
  <script src="../../v3/master-data/countries-governorates-cities.js"></script>
  <script src="../../calculators/shared-geo.js?v=6"></script>

  <script>
    (function() {
      'use strict';

      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const saveBtn = document.getElementById('saveBtn');
      const countrySelect = document.getElementById('country');
      const governorateSelect = document.getElementById('governorate');
      const citySelect = document.getElementById('city');

      // Initialize cascading country/governorate/city selectors
      const geoBinding = window.BondsGeo.bindCascading({
        countryId: 'country',
        governorateId: 'governorate',
        cityId: 'city'
      });

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
        successMsg.style.display = 'none';
      }
      function showSuccess(msg) {
        successMsg.textContent = msg;
        successMsg.style.display = 'block';
        errorMsg.style.display = 'none';
      }
      function setLoading(loading) {
        saveBtn.disabled = loading;
        saveBtn.classList.toggle('loading', loading);
      }

      // Country-aware phone validation (Saudi strict, international loose)
      function isValidPhone(phone, country) {
        return window.BondsAuth.isValidPhone(phone, country);
      }

      async function init() {

        const { data: { user } } = await window.BondsAuth.getUser();
        if (!user) return location.href = 'index.html';

        // Pre-fill from user metadata if available
        document.getElementById('restaurantName').value = user.user_metadata?.restaurant_name || '';
        document.getElementById('phone').value = user.user_metadata?.phone || '';

        // Load existing profile if any
        const { data: profile } = await window.BondsAuth.getProfile(user.id);
        if (profile) {
          if (profile.restaurant_name) document.getElementById('restaurantName').value = profile.restaurant_name;
          if (profile.country) {
            geoBinding.setValues(profile.country, profile.governorate, profile.city_code || profile.city);
          }
          if (profile.business_type) document.getElementById('businessType').value = profile.business_type;
          if (profile.phone) document.getElementById('phone').value = profile.phone;
          if (profile.employee_count !== null && profile.employee_count !== undefined) document.getElementById('employeeCount').value = profile.employee_count;
          if (profile.branch_count !== null && profile.branch_count !== undefined) document.getElementById('branchCount').value = profile.branch_count;
          if (profile.bio) document.getElementById('bio').value = profile.bio;
          if (profile.needs) document.getElementById('needs').value = profile.needs;
        }
      }
      init();

      document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        setLoading(true);

        const { data: { user } } = await window.BondsAuth.getUser();
        if (!user) {
          setLoading(false);
          return location.href = 'index.html';
        }

        const country = countrySelect.value;
        const phone = document.getElementById('phone').value.trim().replace(/\s+/g, '');
        if (!isValidPhone(phone, country)) {
          setLoading(false);
          return showError(country === 'SA'
            ? 'رقم الجوال يجب أن يبدأ بـ 05 أو +9665 ويتكون من 10 أرقام'
            : 'رقم الجوال غير صالح — أدخل رقم محلي أو دولي (مثلاً +20xxxxxxxx)');
        }

        const selectedCity = citySelect.options[citySelect.selectedIndex];
        const payload = {
          id: user.id,
          restaurant_name: document.getElementById('restaurantName').value.trim(),
          country: country,
          governorate: governorateSelect.value,
          city: citySelect.value,
          city_name: selectedCity && selectedCity.value ? selectedCity.textContent : '',
          business_type: document.getElementById('businessType').value,
          phone: phone,
          employee_count: parseInt(document.getElementById('employeeCount').value) || 0,
          branch_count: parseInt(document.getElementById('branchCount').value) || 1,
          bio: document.getElementById('bio').value.trim(),
          needs: document.getElementById('needs').value.trim(),
          language: 'ar'
        };

        const { error } = await window.BondsAuth.updateProfile(user.id, payload);
        setLoading(false);

        if (error) {
          showError('خطأ في الحفظ: ' + (error.message || error));
          return;
        }

        showSuccess('✅ تم الحفظ! جاري التوجيه...');
        const redirect = sessionStorage.getItem('auth_redirect') || '/index.html';
        sessionStorage.removeItem('auth_redirect');
        setTimeout(() => location.href = redirect, 1000);
      });

      document.getElementById('skipBtn').addEventListener('click', async () => {
        setLoading(true);
        const { data: { user } } = await window.BondsAuth.getUser();
        if (!user) {
          setLoading(false);
          return location.href = 'index.html';
        }
        const payload = {
          id: user.id,
          restaurant_name: document.getElementById('restaurantName').value.trim() || (user.email?.split('@')[0] || 'مستخدم'),
          country: countrySelect.value || '',
          governorate: governorateSelect.value || '',
          city: citySelect.value || '',
          city_name: '',
          business_type: document.getElementById('businessType').value || 'other',
          phone: (document.getElementById('phone').value.trim() || '').replace(/\s+/g, ''),
          employee_count: parseInt(document.getElementById('employeeCount').value) || 0,
          branch_count: parseInt(document.getElementById('branchCount').value) || 1,
          bio: document.getElementById('bio').value.trim() || '—',
          needs: document.getElementById('needs').value.trim() || '—',
          language: 'ar'
        };
        await window.BondsAuth.updateProfile(user.id, payload);
        sessionStorage.setItem('bonds_onboarding_skipped', Date.now().toString());
        setLoading(false);
        const redirect = sessionStorage.getItem('auth_redirect') || '/index.html';
        sessionStorage.removeItem('auth_redirect');
        location.href = redirect;
      });
    })();
  </script>

  <script src="../../page-tracker-v2.js"></script>
<script src="../../components/universal-dropdown.js?v=2.51.8"></script>
<script src="../../components/universal-dropdown-init.js"></script>
</body>
</html>
