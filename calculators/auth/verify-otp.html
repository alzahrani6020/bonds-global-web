<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>تأكيد البريد الإلكتروني — Bonds</title>
  <link rel="stylesheet" href="../../styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="../../assets/bonds-mark.svg" />
  <link rel="stylesheet" href="./auth-shared.css?v=2" />
  <link rel="stylesheet" href="verify-otp.css" />
  <link rel="canonical" href="https://bonds-global.com/calculators/auth/verify-otp" />
  <meta property="og:title" content="تأكيد البريد الإلكتروني — Bonds" />
  <meta property="og:description" content="حاسبات مالية متخصصة واستشارات اقتصادية من بوندز." />
  <meta property="og:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />
  <meta property="og:url" content="https://bonds-global.com/calculators/auth/verify-otp" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="تأكيد البريد الإلكتروني — Bonds" />
  <meta name="twitter:description" content="حاسبات مالية متخصصة واستشارات اقتصادية من بوندز." />
  <meta name="twitter:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />

  <meta name="description" content="حاسبات مالية متخصصة واستشارات اقتصادية من بوندز." />

<script src="/calculators/auth-gate.js?v=2"></script>
  </head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <img src="../../assets/bonds-logo-2026-sm.webp?v=2026" alt="Bonds" />
        <span>Bonds</span>
      </div>
      <div class="auth-top-nav">
        <a href="../../index.html" class="auth-home-link">← الرئيسية</a>
        <a href="../../en/calculators/auth/verify-otp.html" class="auth-lang-link">EN</a>
      </div>
      <h1>تأكيد البريد الإلكتروني</h1>
      <p class="subtitle" id="subtitle">أدخل الرمز المؤلف من 6 أرقام الذي أرسلناه إلى بريدك الإلكتروني.</p>
      <p id="emailHint" style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:var(--space-4);line-height:1.6;">
        💡 إذا لم تجد رمزاً من 6 أرقام، فقد يكون البريد يحتوي على <strong style="color:var(--gold)">رابط دخول</strong> — اضغطه مباشرة وسيتم تسجيل دخولك.
      </p>

      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>
      <div id="infoMsg" class="info-msg"></div>

      <form id="otpForm">
        <div class="otp-inputs" id="otpInputs">
          <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 1" />
          <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 2" />
          <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 3" />
          <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 4" />
          <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 5" />
          <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 6" />
        </div>
        <button type="submit" class="btn btn-primary" id="verifyBtn">
          <span class="spinner"></span>
          <span class="btn-text">تحقق من الرمز</span>
        </button>
      </form>

      <button type="button" class="btn btn-secondary" id="resendBtn">
        <span class="spinner"></span>
        <span class="btn-text">إعادة إرسال الرمز</span>
      </button>

      <a href="./index.html" class="back-link">← العودة لتسجيل الدخول</a>
    </div>
  </div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3.0.7"></script>
  <script>
    (function() {
      'use strict';

      const params = new URLSearchParams(window.location.search);
      const email = params.get('email') || sessionStorage.getItem('otp_email') || '';
      sessionStorage.setItem('otp_email', email);
      const phone = params.get('phone') || sessionStorage.getItem('otp_phone') || '';
      if (phone) sessionStorage.setItem('otp_phone', phone);

      const subtitle = document.getElementById('subtitle');
      if (phone) {
        document.querySelector('h1').textContent = 'تأكيد رقم الجوال';
        subtitle.innerHTML = 'أدخل الرمز المؤلف من 6 أرقام الذي أرسلناه إلى <strong style="color:var(--gold)">' + escapeHtml(phone) + '</strong>';
        var emailHint = document.getElementById('emailHint');
        if (emailHint) emailHint.style.display = 'none';
      } else if (email) {
        subtitle.innerHTML = 'أدخل الرمز المؤلف من 6 أرقام الذي أرسلناه إلى <strong style="color:var(--gold)">' + escapeHtml(email) + '</strong>';
      }

      const inputs = Array.from(document.querySelectorAll('#otpInputs input'));
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const infoMsg = document.getElementById('infoMsg');

      function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; successMsg.style.display = 'none'; infoMsg.style.display = 'none'; }
      function showSuccess(msg) { successMsg.textContent = msg; successMsg.style.display = 'block'; errorMsg.style.display = 'none'; infoMsg.style.display = 'none'; }
      function showInfo(msg) { infoMsg.textContent = msg; infoMsg.style.display = 'block'; errorMsg.style.display = 'none'; successMsg.style.display = 'none'; }

      // Auto-fill token from magic-link URL and submit automatically.
      const urlToken = params.get('token');
      if (urlToken && urlToken.length === 6 && !phone) {
        urlToken.split('').forEach((digit, i) => {
          if (inputs[i]) inputs[i].value = digit;
        });
        if (email) {
          showInfo('جاري تسجيل الدخول تلقائياً...');
          setTimeout(() => {
            document.getElementById('otpForm').dispatchEvent(new Event('submit'));
          }, 500);
        }
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function setLoading(btnId, loading) {
        const btn = document.getElementById(btnId);
        btn.disabled = loading;
        btn.classList.toggle('loading', loading);
      }

      function getToken() {
        return inputs.map(i => i.value.trim()).join('');
      }

      // OTP input behavior
      inputs.forEach((input, idx) => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && idx > 0) {
            inputs[idx - 1].focus();
          }
        });
        input.addEventListener('input', (e) => {
          const val = input.value.replace(/[^0-9]/g, '');
          input.value = val.slice(0, 1);
          if (val && idx < inputs.length - 1) {
            inputs[idx + 1].focus();
          }
          if (getToken().length === 6) {
            document.getElementById('otpForm').dispatchEvent(new Event('submit'));
          }
        });
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0, 6);
          paste.split('').forEach((digit, i) => { if (inputs[i]) inputs[i].value = digit; });
          const nextIdx = Math.min(paste.length, inputs.length - 1);
          inputs[nextIdx].focus();
          if (paste.length === 6) {
            document.getElementById('otpForm').dispatchEvent(new Event('submit'));
          }
        });
      });

      // Verify
      document.getElementById('otpForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = getToken();
        if (token.length !== 6) { showError('الرجاء إدخال الرمز كاملاً (6 أرقام)'); return; }
        if (!email && !phone) { showError('البريد الإلكتروني أو رقم الجوال مفقود. عد إلى صفحة تسجيل الدخول.'); return; }

        setLoading('verifyBtn', true);
        hideMessages();

        try {
          if (phone) {
            // Phone OTP (SMS) verification — login flow
            const sbPhone = window.BondsAuth.getSupabase();
            const { error: vErr } = await sbPhone.auth.verifyOtp({ phone: phone, token: token, type: 'sms' });
            setLoading('verifyBtn', false);
            if (vErr) {
              const vmsg = vErr.message || '';
              if (vmsg.includes('expired')) { showError('الرمز منتهي الصلاحية. اضغط "إعادة إرسال الرمز".'); }
              else if (vmsg.includes('Invalid') || vmsg.includes('token')) { showError('الرمز غير صحيح. تأكد من إدخاله بشكل صحيح.'); }
              else { showError(vmsg); }
              return;
            }
            sessionStorage.removeItem('otp_phone');
            if (typeof gtag !== 'undefined') gtag('event', 'login', { method: 'phone_otp' });
            showSuccess('تم تسجيل الدخول بنجاح! جاري التوجيه...');
            setTimeout(() => { window.location.href = window.BondsAuth.getRedirectUrl(); }, 800);
            return;
          }

          const pendingPassword = sessionStorage.getItem('otp_pending_password');
          const { data, error } = await window.BondsAuth.verifyOtpViaProxy(email, token, { type: 'email', pendingPassword: pendingPassword || undefined });
          if (error) {
            setLoading('verifyBtn', false);
            const msg = error.message || '';
            if (msg.includes('Token has expired')) {
              showError('الرمز منتهي الصلاحية. اضغط "إعادة إرسال الرمز".');
            } else if (msg.includes('Invalid token') || msg.includes('token')) {
              showError('الرمز غير صحيح. تأكد من إدخاله بشكل صحيح.');
            } else {
              showError(msg);
            }
            return;
          }

          showSuccess('تم التحقق من البريد الإلكتروني ✅');
          sessionStorage.removeItem('otp_pending_password');

          // Save/update profile
          const user = data?.user;
          if (user) {
            const metadata = {
              id: user.id,
              restaurant_name: sessionStorage.getItem('otp_pending_name') || user.user_metadata?.restaurant_name || '',
              phone: sessionStorage.getItem('otp_pending_phone') || user.user_metadata?.phone || '',
              country: sessionStorage.getItem('otp_pending_country') || user.user_metadata?.country || '',
              city: sessionStorage.getItem('otp_pending_city') || user.user_metadata?.city || '',
              language: 'ar'
            };
            try {
              await window.BondsAuth.updateProfile(user.id, metadata);
            } catch (profileErr) {
              console.warn('[OTP] Profile update warning:', profileErr);
            }
            sessionStorage.removeItem('otp_pending_name');
            sessionStorage.removeItem('otp_pending_phone');
            sessionStorage.removeItem('otp_pending_country');
            sessionStorage.removeItem('otp_pending_city');
          }

          sessionStorage.removeItem('otp_email');

          // Track signup
          if (typeof gtag !== 'undefined') gtag('event', 'sign_up', { method: 'email_otp' });

          showSuccess('تم إنشاء حسابك بنجاح! جاري التوجيه...');
          setTimeout(() => {
            window.location.href = './onboarding.html';
          }, 1000);
        } catch (err) {
          setLoading('verifyBtn', false);
          showError('خطأ غير متوقع: ' + (err?.message || String(err)));
        }
      });

      // Resend
      document.getElementById('resendBtn').addEventListener('click', async () => {
        if (!email && !phone) { showError('البريد الإلكتروني أو رقم الجوال مفقود. عد إلى صفحة تسجيل الدخول.'); return; }
        setLoading('resendBtn', true);
        hideMessages();
        if (phone) {
          const sbResend = window.BondsAuth.getSupabase();
          const { error: rErr } = await sbResend.auth.signInWithOtp({ phone: phone });
          setLoading('resendBtn', false);
          if (rErr) { showError(rErr.message); return; }
          showInfo('تم إعادة إرسال الرمز إلى جوالك 📱');
          return;
        }
        const { error } = await window.BondsAuth.sendOtpViaProxy(email);
        setLoading('resendBtn', false);
        if (error) { showError(error.message); return; }
        showInfo('تم إعادة الإرسال 📧 تحقق من بريدك وجرب الرابط إذا لم يكن هناك رمز.');
      });

      function hideMessages() { errorMsg.style.display = 'none'; successMsg.style.display = 'none'; infoMsg.style.display = 'none'; }
    })();
  </script>
  <script src="../../page-tracker-v2.js"></script>
</body>
</html>
