  <div class="box">
    <h2><span class="emoji-icon" style="display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;" aria-hidden="true"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#9AAAB4" d="M27.388 24.642L24.56 27.47l-4.95-4.95 2.828-2.828z"/><path fill="#66757F" d="M34.683 29.11l-5.879-5.879c-.781-.781-2.047-.781-2.828 0l-2.828 2.828c-.781.781-.781 2.047 0 2.828l5.879 5.879c1.562 1.563 4.096 1.563 5.658 0 1.56-1.561 1.559-4.094-.002-5.656z"/><circle fill="#8899A6" cx="13.586" cy="13.669" r="13.5"/><circle fill="#BBDDF5" cx="13.586" cy="13.669" r="9.5"/></svg></span> تشخيص نظام Bonds</h2>
    <p>اضغط الزر وانتظر النتائج:</p>
    <button id="runBtn" onclick="runDiag()">بدء التشخيص</button>
    <span class="spinner" id="spin" style="display:none"></span>
  </div>
  <div id="results"></div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3.0.7"></script>
  <script>
    async function runDiag() {
      document.getElementById('runBtn').disabled = true;
      document.getElementById('spin').style.display = 'inline-block';
      const out = document.getElementById('results');
      out.innerHTML = '';

      function add(title, content, isError) {
        const div = document.createElement('div');
        div.className = 'box';
        div.innerHTML = `<h2>${title}</h2><pre class="${isError ? 'err' : ''}">${content}</pre>`;
        out.appendChild(div);
      }

      try {
        // 1. Session
        const { data: sData } = await BondsAuth.getSession();
        const user = sData?.session?.user;
        if (!user) {
          add('❌ الجلسة', 'ما فيه مستمسك دخول! سجل دخولك أولاً.', true);
          return;
        }
        add('✅ المستخدم', `ID: ${user.id}\nEmail: ${user.email}\nMetadata.avatar_url: ${user.user_metadata?.avatar_url || '(فاضي)'}\nMetadata.restaurant_name: ${user.user_metadata?.restaurant_name || '(فاضي)'}`);

        // 2. localStorage
        add('💾 localStorage', `bonds_avatar_url: ${localStorage.getItem('bonds_avatar_url') || '(فاضي)'}\nbonds_restaurant_name: ${localStorage.getItem('bonds_restaurant_name') || '(فاضي)'}`);

        // 3. Profile from DB
        const { data: profile, error: pErr } = await BondsAuth.getProfile(user.id);
        if (pErr) {
          add('❌ جلب البروفايل', `خطأ: ${pErr.message}\nCode: ${pErr.code}`, true);
        } else if (!profile) {
          add('⚠️ البروفايل', 'ما فيه بروفايل في الداتابيس!', true);
        } else {
          add('✅ البروفايل من الداتابيس', `avatar_url: ${profile.avatar_url || '(فاضي)'}\nrestaurant_name: ${profile.restaurant_name || '(فاضي)'}\nphone: ${profile.phone || '(فاضي)'}\ncity: ${profile.city || '(فاضي)'}`);
        }

        // 4. Try loading avatar image
        const avatarUrl = profile?.avatar_url || user.user_metadata?.avatar_url || localStorage.getItem('bonds_avatar_url');
        if (avatarUrl) {
          const imgDiv = document.createElement('div');
          imgDiv.className = 'box';
          imgDiv.innerHTML = `<h2>🖼️ اختبار تحميل الصورة</h2><p>URL: ${avatarUrl}</p><img src="${avatarUrl}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'" style="display:block" loading="lazy" decoding="async"><p style="display:none;color:#ff8a8a">❌ الصورة ما تحملت (خطأ في الرابط أو الـ Bucket)</p>`;
          out.appendChild(imgDiv);

          // 5. Try authenticated download
          const pathMatch = avatarUrl.match(/\/avatars\/(.+)$/);
          if (pathMatch) {
            try {
              const sb = BondsAuth.getSupabase();
              const { data: blob, error: dErr } = await sb.storage.from('avatars').download(pathMatch[1]);
              if (dErr) {
                add('❌ تحميل من Storage', `خطأ: ${dErr.message}`, true);
              } else if (blob) {
                const blobUrl = URL.createObjectURL(blob);
                const div = document.createElement('div');
                div.className = 'box';
                div.innerHTML = `<h2>✅ تحميل مباشر (Authenticated)</h2><p>التحميل ناجح! Blob URL:</p><img src="${blobUrl}" loading="lazy" decoding="async">`;
                out.appendChild(div);
              }
            } catch (e) {
              add('❌ تحميل من Storage', `استثناء: ${e.message}`, true);
            }
          }
        } else {
          add('⚠️ الصورة', 'ما فيه رابط صورة في أي مصدر (DB, metadata, localStorage)', true);
        }

      } catch (err) {
        add('❌ خطأ عام', err.message || String(err), true);
      } finally {
        document.getElementById('runBtn').disabled = false;
        document.getElementById('spin').style.display = 'none';
      }
    }
  </script>
