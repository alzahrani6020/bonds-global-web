  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="shared-calculators.css" />
  <link rel="stylesheet" href="../styles/design-system.css" />

  <link rel="canonical" href="https://bonds-global.com/calculators/roi" />
  <script type="application/ld+json">
  {
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "حاسبة عائد الاستثمار",
  "applicationCategory": "BusinessApplication",
  "operatingSystem": "Any",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "SAR"
  },
  "url": "https://bonds-global.com/calculators/roi",
  "description": "احسب عائد الاستثمار ROI، فترة استرداد رأس المال، والقيمة الحالية الصافية NPV بخطوات بسيطة."
}
  </script>
</head>
<body>
  <div id="site-header"></div>

  <section class="hero calc-hero--tall">
    <div class="hero__orb hero__orb--1"></div>
    <div class="hero__orb hero__orb--2"></div>
    <div class="container hero__content reveal">
      <span class="hero__eyebrow">أداة مجانية</span>
      <h1 class="hero__title">حاسبة <span class="text-gradient">عائد الاستثمار</span></h1>
      <p class="hero__desc">احسب ROI، فترة استرداد رأس المال، والقيمة الحالية الصافية NPV بخطوات بسيطة.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="calc-grid">
        <div class="reveal calc-panel">
          <h2 class="calc-section-title">بيانات الاستثمار</h2>
          <div class="calc-input-group">
            <label for="initialInvestment">رأس المال المستثمر</label>
            <input type="number" id="initialInvestment" placeholder="مثلاً: 100000" min="0" />
          </div>
          <div class="calc-input-group">
            <label for="annualRevenue">الإيرادات السنوية</label>
            <input type="number" id="annualRevenue" placeholder="مثلاً: 50000" min="0" />
          </div>
          <div class="calc-input-group">
            <label for="annualCosts">التكاليف التشغيلية السنوية</label>
            <input type="number" id="annualCosts" placeholder="مثلاً: 20000" min="0" />
          </div>
          <div class="calc-input-group">
            <label for="projectYears">مدة المشروع (سنوات)</label>
            <input type="number" id="projectYears" placeholder="مثلاً: 5" min="1" max="50" value="5" />
          </div>
          <div class="calc-input-group">
            <label for="discountRate">معدل الخصم السنوي (%)</label>
            <input type="number" id="discountRate" placeholder="مثلاً: 10" min="0" max="100" step="0.01" value="10" />
          </div>
          <button class="btn btn-primary btn-lg" onclick="calculateROI()">احسب</button>
        </div>

        <div class="reveal calc-panel results-panel" id="resultsPanel" style="display:none;">
          <h2 class="calc-section-title">النتائج</h2>
          <div class="metric-card">
            <span class="metric-label">صافي الربح</span>
            <span class="metric-value" id="netProfit">—</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">عائد الاستثمار ROI</span>
            <span class="metric-value" id="roiResult">—</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">فترة الاسترداد</span>
            <span class="metric-value" id="paybackPeriod">—</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">القيمة الحالية الصافية NPV</span>
            <span class="metric-value" id="npvResult">—</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">التدفق النقدي السنوي</span>
            <span class="metric-value" id="annualCashFlow">—</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="../site-layout.js"></script>
  <script>
    function formatCurrency(value) {
      return new Intl.NumberFormat('ar-SA', { style: 'currency', currency: 'SAR', maximumFractionDigits: 0 }).format(value);
    }

    function calculateROI() {
      const investment = parseFloat(document.getElementById('initialInvestment').value) || 0;
      const revenue = parseFloat(document.getElementById('annualRevenue').value) || 0;
      const costs = parseFloat(document.getElementById('annualCosts').value) || 0;
      const years = parseFloat(document.getElementById('projectYears').value) || 5;
      const discountRate = (parseFloat(document.getElementById('discountRate').value) || 0) / 100;

      if (investment <= 0) {
        alert('أدخل رأس مال مستثمر أكبر من صفر.');
        return;
      }

      const annualNet = revenue - costs;
      const totalNet = annualNet * years;
      const netProfit = totalNet - investment;
      const roi = (netProfit / investment) * 100;
      const payback = annualNet > 0 ? (investment / annualNet) : Infinity;

      // NPV calculation
      let npv = -investment;
      for (let i = 1; i <= years; i++) {
        npv += annualNet / Math.pow(1 + discountRate, i);
      }

      document.getElementById('netProfit').textContent = formatCurrency(netProfit);
      document.getElementById('roiResult').textContent = roi.toFixed(2) + '%';
      document.getElementById('paybackPeriod').textContent = isFinite(payback) ? payback.toFixed(2) + ' سنة' : 'غير محدودة';
      document.getElementById('npvResult').textContent = formatCurrency(npv);
      document.getElementById('annualCashFlow').textContent = formatCurrency(annualNet);
      document.getElementById('resultsPanel').style.display = 'block';
      document.getElementById('resultsPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  </script>
</body>
</html>
