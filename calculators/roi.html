  {
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "حاسبة عائد الاستثمار",
  "applicationCategory": "BusinessApplication",
  "operatingSystem": "Any",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "SAR"
  },
  "url": "https://bonds-global.com/calculators/roi",
  "description": "احسب عائد الاستثمار ROI، فترة استرداد رأس المال، والقيمة الحالية الصافية NPV بخطوات بسيطة."
}
  </script>
</head>
<body>
  <div id="site-header"></div>

  <section class="hero calc-hero--tall">
    <div class="hero__orb hero__orb--1"></div>
    <div class="hero__orb hero__orb--2"></div>
    <div class="container hero__content reveal">
      <span class="hero__eyebrow">أداة مجانية</span>
      <h1 class="hero__title">حاسبة <span class="text-gradient">عائد الاستثمار</span></h1>
      <p class="hero__desc">احسب ROI، فترة استرداد رأس المال، والقيمة الحالية الصافية NPV بخطوات بسيطة.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="calc-grid">
        <div class="reveal calc-panel">
          <h2 class="calc-section-title">بيانات الاستثمار</h2>
          <div class="calc-input-group">
            <label for="initialInvestment">رأس المال المستثمر</label>
            <input type="number" id="initialInvestment" placeholder="مثلاً: 100000" min="0" />
          </div>
          <div class="calc-input-group">
            <label for="annualRevenue">الإيرادات السنوية</label>
            <input type="number" id="annualRevenue" placeholder="مثلاً: 50000" min="0" />
          </div>
          <div class="calc-input-group">
            <label for="annualCosts">التكاليف التشغيلية السنوية</label>
            <input type="number" id="annualCosts" placeholder="مثلاً: 20000" min="0" />
          </div>
          <div class="calc-input-group">
            <label for="projectYears">مدة المشروع (سنوات)</label>
            <input type="number" id="projectYears" placeholder="مثلاً: 5" min="1" max="50" value="5" />
          </div>
          <div class="calc-input-group">
            <label for="discountRate">معدل الخصم السنوي (%)</label>
            <input type="number" id="discountRate" placeholder="مثلاً: 10" min="0" max="100" step="0.01" value="10" />
          </div>
          <button class="btn btn-primary btn-lg" onclick="calculateROI()">احسب</button>
        </div>

        <div class="reveal calc-panel results-panel" id="resultsPanel" style="display:none;">
          <h2 class="calc-section-title">النتائج</h2>
          <div class="metric-card">
            <span class="metric-label">صافي الربح</span>
            <span class="metric-value" id="netProfit">—</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">عائد الاستثمار ROI</span>
            <span class="metric-value" id="roiResult">—</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">فترة الاسترداد</span>
            <span class="metric-value" id="paybackPeriod">—</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">القيمة الحالية الصافية NPV</span>
            <span class="metric-value" id="npvResult">—</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">التدفق النقدي السنوي</span>
            <span class="metric-value" id="annualCashFlow">—</span>
          </div>
          <div class="share-bar" style="margin-top:1.5rem;justify-content:center;">
            <button onclick="checkAuthForAction('save', saveROIProject)" class="btn btn-outline calc-btn-sm">💾 حفظ المشروع</button>
            <button onclick="checkAuthForAction('pdf', function(){ window.print(); })" class="btn btn-outline calc-btn-sm">🖨️ طباعة</button>
            <button onclick="checkAuthForAction('v3', convertROIToV3)" class="btn btn-primary calc-btn-sm" style="background:linear-gradient(135deg,#d4a853,#f0c96a);color:#0c0c0c;border:none;">🚀 حوّل إلى مشروع V3</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3.0.7"></script>
  <script src="shared-analytics.js"></script>
  <script src="auth-modal.js"></script>
  <script src="exit-intent.js"></script>
  <script src="../site-layout.js"></script>
  <script>
    function formatCurrency(value) {
      return new Intl.NumberFormat('ar-SA', { style: 'currency', currency: 'SAR', maximumFractionDigits: 0 }).format(value);
    }

    function updateSharedEnhancements(result, inputs) {
      if (window.BondsEnhancements) {
        window.BondsEnhancements.updateKpiCards({
          becKpiNetProfit: { text: formatCurrency(result.netProfit), color: result.netProfit >= 0 ? '#16a34a' : '#dc2626' },
          becKpiRoi: { text: result.roi.toFixed(2) + '%', color: result.roi >= 0 ? '#16a34a' : '#dc2626' },
          becKpiPayback: { text: result.paybackText, color: result.payback > 0 && result.payback <= inputs.years ? '#16a34a' : '#f59e0b' },
          becKpiNpv: { text: formatCurrency(result.npv), color: result.npv >= 0 ? '#16a34a' : '#dc2626' },
          becKpiAnnualCashFlow: { text: formatCurrency(result.annualNet), color: result.annualNet >= 0 ? '#16a34a' : '#dc2626' },
          becKpiTotalReturn: { text: formatCurrency(result.totalNet), color: result.totalNet >= inputs.investment ? '#16a34a' : '#f59e0b' }
        });
        window.BondsEnhancements.updateSmartAlerts({
          profitMargin: result.roi,
          revenue: inputs.revenue,
          fixedCosts: inputs.costs + inputs.investment,
          netProfit: result.netProfit,
          npv: result.npv,
          payback: result.payback,
          projectYears: inputs.years,
          annualNet: result.annualNet
        });
      }

      window.getCalculatorData = function() {
        return {
          country: 'SA',
          currency: 'SAR',
          inputs: inputs,
          kpis: [
            { label: 'صافي الربح', value: formatCurrency(result.netProfit), color: result.netProfit >= 0 ? '#16a34a' : '#dc2626' },
            { label: 'عائد الاستثمار ROI', value: result.roi.toFixed(2) + '%', color: result.roi >= 0 ? '#16a34a' : '#dc2626' },
            { label: 'فترة الاسترداد', value: result.paybackText, color: result.payback > 0 && result.payback <= inputs.years ? '#16a34a' : '#f59e0b' },
            { label: 'القيمة الحالية الصافية NPV', value: formatCurrency(result.npv), color: result.npv >= 0 ? '#16a34a' : '#dc2626' },
            { label: 'التدفق النقدي السنوي', value: formatCurrency(result.annualNet), color: result.annualNet >= 0 ? '#16a34a' : '#dc2626' }
          ],
          csvRows: [
            ['البند', 'القيمة'],
            ['رأس المال المستثمر', inputs.investment],
            ['الإيرادات السنوية', inputs.revenue],
            ['التكاليف التشغيلية السنوية', inputs.costs],
            ['مدة المشروع (سنوات)', inputs.years],
            ['معدل الخصم السنوي (%)', (inputs.discountRate * 100).toFixed(2)],
            ['', ''],
            ['التدفق النقدي السنوي', result.annualNet],
            ['إجمالي العائد', result.totalNet],
            ['صافي الربح', result.netProfit],
            ['عائد الاستثمار ROI (%)', result.roi],
            ['فترة الاسترداد (سنوات)', result.payback],
            ['القيمة الحالية الصافية NPV', result.npv]
          ],
          aiPayload: {
            initial_investment: inputs.investment,
            annual_revenue: inputs.revenue,
            annual_costs: inputs.costs,
            project_years: inputs.years,
            discount_rate_pct: inputs.discountRate * 100,
            annual_net_cash_flow: result.annualNet,
            total_return: result.totalNet,
            net_profit: result.netProfit,
            roi_pct: result.roi,
            payback_years: result.payback,
            npv: result.npv
          },
          aiType: 'roi_analysis'
        };
      };
    }

    window.loadCalculatorData = function(data) {
      if (!data || !data.inputs) return;
      var i = data.inputs;
      if (i.investment !== undefined) document.getElementById('initialInvestment').value = i.investment;
      if (i.revenue !== undefined) document.getElementById('annualRevenue').value = i.revenue;
      if (i.costs !== undefined) document.getElementById('annualCosts').value = i.costs;
      if (i.years !== undefined) document.getElementById('projectYears').value = i.years;
      if (i.discountRate !== undefined) document.getElementById('discountRate').value = i.discountRate;
      calculateROI();
    };

    function calculateROI() {
      if (window.BondsAnalytics && window.BondsAnalytics.trackEvent) {
        window.BondsAnalytics.trackEvent('calc_completed', { source: 'roi', country: 'SA' });
      }
      window._calcCompleted = true;
      const investment = parseFloat(document.getElementById('initialInvestment').value) || 0;
      const revenue = parseFloat(document.getElementById('annualRevenue').value) || 0;
      const costs = parseFloat(document.getElementById('annualCosts').value) || 0;
      const years = parseFloat(document.getElementById('projectYears').value) || 5;
      const discountRate = (parseFloat(document.getElementById('discountRate').value) || 0) / 100;

      if (investment <= 0) {
        alert('أدخل رأس مال مستثمر أكبر من صفر.');
        return;
      }

      const annualNet = revenue - costs;
      const totalNet = annualNet * years;
      const netProfit = totalNet - investment;
      const roi = (netProfit / investment) * 100;
      const payback = annualNet > 0 ? (investment / annualNet) : Infinity;

      // NPV calculation
      let npv = -investment;
      for (let i = 1; i <= years; i++) {
        npv += annualNet / Math.pow(1 + discountRate, i);
      }

      const inputs = { investment: investment, revenue: revenue, costs: costs, years: years, discountRate: discountRate };
      const result = {
        annualNet: annualNet,
        totalNet: totalNet,
        netProfit: netProfit,
        roi: roi,
        payback: payback,
        paybackText: isFinite(payback) ? payback.toFixed(2) + ' سنة' : 'غير محدودة',
        npv: npv
      };

      document.getElementById('netProfit').textContent = formatCurrency(netProfit);
      document.getElementById('roiResult').textContent = roi.toFixed(2) + '%';
      document.getElementById('paybackPeriod').textContent = result.paybackText;
      document.getElementById('npvResult').textContent = formatCurrency(npv);
      document.getElementById('annualCashFlow').textContent = formatCurrency(annualNet);
      document.getElementById('resultsPanel').style.display = 'block';
      updateSharedEnhancements(result, inputs);
      document.getElementById('resultsPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Auth-aware action gate: calculator is fully usable without login.
    // Login is only requested when the user tries to save, export, or convert to V3.
    (function () {
      function storeCurrentInputs() {
        try {
          var payload = {};
          ['initialInvestment','annualRevenue','annualCosts','projectYears','discountRate'].forEach(function(id) {
            var el = document.getElementById(id);
            payload[id] = el ? el.value : '';
          });
          sessionStorage.setItem('bonds_roi_draft', JSON.stringify(payload));
        } catch (e) {}
      }

      window.checkAuthForAction = async function(action, onAllowed) {
        storeCurrentInputs();
        if (window.BondsAnalytics && window.BondsAnalytics.trackEvent) {
          window.BondsAnalytics.trackEvent('calc_action_clicked', { action: action, source: 'roi', country: 'SA' });
        }
        const { data: userData } = await window.BondsAuth.getUser();
        if (userData?.user) {
          if (onAllowed) onAllowed();
          return true;
        }
        sessionStorage.setItem('auth_redirect', window.location.pathname + window.location.search);
        sessionStorage.setItem('bonds_pending_action', JSON.stringify({ source: window.location.pathname, action: action }));
        if (typeof showAuthModal === 'function') {
          showAuthModal(action, function() {
            if (window.BondsAnalytics && window.BondsAnalytics.trackEvent) {
              window.BondsAnalytics.trackEvent('calc_signup_prompt_confirmed', { action: action, source: 'roi' });
            }
            window.location.href = '/calculators/auth/index.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
          }, function() {
            if (window.BondsAnalytics && window.BondsAnalytics.trackEvent) {
              window.BondsAnalytics.trackEvent('calc_guest_continued', { action: action, source: 'roi' });
            }
          });
        } else {
          window.location.href = '/calculators/auth/index.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
        }
        return false;
      };

      window.saveROIProject = function() {
        try {
          if (window.BondsAnalytics && window.BondsAnalytics.trackEvent) {
            window.BondsAnalytics.trackEvent('calc_project_saved', { source: 'roi', country: 'SA' });
          }
          var roiText = document.getElementById('roiResult')?.textContent || '—';
          var paybackText = document.getElementById('paybackPeriod')?.textContent || '—';
          var title = 'دراسة عائد الاستثمار';
          var summary = 'ROI ' + roiText + ' · استرداد ' + paybackText;
          var projects = JSON.parse(localStorage.getItem('bonds_guest_projects') || '[]');
          projects.unshift({
            title: title,
            summary: summary,
            href: window.location.pathname + window.location.search,
            createdAt: new Date().toISOString(),
            source: 'roi'
          });
          localStorage.setItem('bonds_guest_projects', JSON.stringify(projects.slice(0, 20)));
          BondsUI.toast('✅ تم حفظ المشروع في مساحتك', 'success');
        } catch (e) {
          BondsUI.toast('⚠️ لم يتم الحفظ محلياً', 'warning');
        }
      };

      window.convertROIToV3 = async function() {
        try {
          BondsUI.toast('جاري إنشاء مشروع V3...', 'info');
          var investment = parseFloat(document.getElementById('initialInvestment')?.value) || 0;
          var revenue = parseFloat(document.getElementById('annualRevenue')?.value) || 0;
          var costs = parseFloat(document.getElementById('annualCosts')?.value) || 0;
          var years = parseFloat(document.getElementById('projectYears')?.value) || 5;
          var annualNet = revenue - costs;
          var payload = {
            name: 'دراسة عائد الاستثمار',
            sector: 'استثمار',
            activity: 'تقييم استثمار',
            cityCode: null,
            currency: 'SAR',
            capital: investment,
            revenue: revenue * years,
            annualProfit: annualNet * years,
            language: 'ar'
          };
          const { data: sessionData } = await window.BondsAuth.getSession();
          const token = sessionData?.session?.access_token;
          const res = await fetch('/api/v3/projects', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(token ? { 'Authorization': 'Bearer ' + token } : {})
            },
            body: JSON.stringify(payload)
          });
          const json = await res.json().catch(() => ({}));
          if (!res.ok) {
            BondsUI.toast('⚠️ ' + (json.error || 'فشل إنشاء المشروع'), 'error');
            return;
          }
          if (json.project?.id) {
            window.location.href = '/v3/project?id=' + encodeURIComponent(json.project.id);
          } else {
            BondsUI.toast('⚠️ لم يتم استلام رابط المشروع', 'error');
          }
        } catch (e) {
          BondsUI.toast('⚠️ فشل الاتصال بمشروع V3', 'error');
        }
      };

      // Track first user interaction
      (function trackFirstInteraction() {
        var tracked = false;
        function once() {
          if (tracked) return;
          tracked = true;
          if (window.BondsAnalytics && window.BondsAnalytics.trackEvent) {
            window.BondsAnalytics.trackEvent('calc_started', { source: 'roi', country: 'SA' });
          }
        }
        document.querySelectorAll('input, select').forEach(function(el) {
          el.addEventListener('input', once);
          el.addEventListener('change', once);
        });
      })();

      // Restore draft inputs if user returns from login
      (function restoreDraft() {
        try {
          var raw = sessionStorage.getItem('bonds_roi_draft');
          if (!raw) return;
          var draft = JSON.parse(raw);
          Object.keys(draft).forEach(function(id) {
            var el = document.getElementById(id);
            if (el && draft[id] !== undefined && draft[id] !== '') {
              el.value = draft[id];
            }
          });
          sessionStorage.removeItem('bonds_roi_draft');
        } catch (e) {}
      })();

      // Auto-execute pending action if user just returned from login
      (function handlePendingAction() {
        if (typeof window === 'undefined' || !window.BondsAuth) return;
        window.BondsAuth.getUser().then(function(userData) {
          if (!userData?.user) return;
          try {
            var pendingRaw = sessionStorage.getItem('bonds_pending_action');
            if (!pendingRaw) return;
            var pending = JSON.parse(pendingRaw);
            if (pending.source !== window.location.pathname) return;
            sessionStorage.removeItem('bonds_pending_action');
            if (pending.action === 'save' && window.saveROIProject) window.saveROIProject();
            else if (pending.action === 'pdf' && window.print) window.print();
            else if (pending.action === 'v3' && window.convertROIToV3) window.convertROIToV3();
          } catch (e) {}
        });
      })();
    })();
  </script>
<script src="shared-enhancements.js?v=1"></script>
<script>
(function() {
  if (!window.BondsEnhancements) return;
  window.BondsEnhancements.init({
    kpiContainer: '#resultsPanel',
    kpis: [
      { id: 'becKpiNetProfit', label: 'صافي الربح', color: 'green' },
      { id: 'becKpiRoi', label: 'عائد الاستثمار ROI', unit: '%', color: 'blue' },
      { id: 'becKpiPayback', label: 'فترة الاسترداد', color: 'gold' },
      { id: 'becKpiNpv', label: 'القيمة الحالية الصافية NPV', color: 'purple' },
      { id: 'becKpiAnnualCashFlow', label: 'التدفق النقدي السنوي', color: 'orange' },
      { id: 'becKpiTotalReturn', label: 'إجمالي العائد', color: 'red' }
    ],
    alertsContainer: '.calc-grid',
    exportContainer: '.share-bar',
    aiContainer: '.calc-grid',
    scenarioContainer: '.calc-grid',
    calcType: 'roi'
  });
})();
</script>
</body>
