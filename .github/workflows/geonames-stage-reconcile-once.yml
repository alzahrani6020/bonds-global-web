name: GeoNames build artifact one-shot

on:
  push:
    branches:
      - ops/geonames-stage-reconcile-20261021
    paths:
      - .github/workflows/geonames-stage-reconcile-once.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/geonames-stage-reconcile-20261021
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Download official GeoNames dumps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-geo
          for file in allCountries.zip alternateNamesV2.zip admin1CodesASCII.txt; do
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 1800               --output ".tmp-geo/$file" "https://download.geonames.org/export/dump/$file"
            test -s ".tmp-geo/$file"
          done
          unzip -tq .tmp-geo/allCountries.zip
          unzip -tq .tmp-geo/alternateNamesV2.zip
          unzip -p .tmp-geo/allCountries.zip allCountries.txt > .tmp-geo/allCountries.txt
          unzip -p .tmp-geo/alternateNamesV2.zip alternateNamesV2.txt > .tmp-geo/alternateNames.txt

      - name: Build canonical Arab locality dataset
        run: npm run geo:build-local

      - name: Hash evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .tmp-geo/arab-localities.ndjson > .tmp-geo/arab-localities.sha256
          wc -l .tmp-geo/arab-localities.ndjson > .tmp-geo/arab-localities.wc

      - name: Upload source-derived review artifact
        uses: actions/upload-artifact@v5
        with:
          name: geonames-arab-localities-${{ github.run_id }}
          path: |
            .tmp-geo/arab-localities.ndjson
            .tmp-geo/arab-localities-manifest.json
            .tmp-geo/arab-localities.sha256
            .tmp-geo/arab-localities.wc
            .tmp-geo/admin1CodesASCII.txt
          if-no-files-found: error
          retention-days: 30
