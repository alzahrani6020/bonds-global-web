name: Planner Production Telemetry Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/post-deploy-smoke.js'
      - '.github/workflows/planner-telemetry-probe.yml'

concurrency:
  group: planner-production-telemetry-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout exact probe revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Run planner telemetry probe
        run: node scripts/post-deploy-smoke.js
        env:
          PLANNER_TELEMETRY_ONLY: '1'
          PRODUCTION_URL: https://bonds-global.com
          GITHUB_SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
