name: Verify Calculators

on:
  push:
    branches: [main, master]
    paths:
      - 'calculators/**'
      - 'en/calculators/**'
      - 'scripts/extract-platform-data.js'
      - '.github/workflows/verify-calculators.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'calculators/**'
      - 'en/calculators/**'
      - 'scripts/extract-platform-data.js'
      - '.github/workflows/verify-calculators.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify shared-platforms.js is up to date
        run: |
          node scripts/extract-platform-data.js
          git diff --exit-code calculators/shared-platforms.js calculators/platform-data/

      - name: Check for old country-platforms-data references
        run: |
          if grep -R "country-platforms-data\.js\|country-platforms-data\.min\.js" calculators en/calculators 2>/dev/null | grep -q "\.html"; then
            echo "ERROR: calculator HTML files still reference country-platforms-data.js"
            grep -R "country-platforms-data\.js\|country-platforms-data\.min\.js" calculators en/calculators | grep "\.html"
            exit 1
          fi
          echo "OK: no calculator HTML references country-platforms-data.js"
