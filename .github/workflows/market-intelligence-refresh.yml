name: Market Intelligence Refresh

on:
  schedule:
    # Every 3 hours (00:00, 03:00, 06:00 ... UTC = 03:00, 06:00, 09:00 ... Riyadh)
    # Keep in sync with REFRESH_CRON_INTERVAL_HOURS in api/market-intelligence.js
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  refresh:
    name: Refresh market intelligence data
    runs-on: ubuntu-latest

    steps:
      - name: Trigger ingestion
        run: |
          curl -fsS -X POST "${SITE_URL}/api/market-intelligence?cronSecret=${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"action":"refresh"}'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://bonds-global.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
