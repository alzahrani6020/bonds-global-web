name: Regenerate Investment Calculators Fix

on:
  push:
    branches:
      - fix/regenerate-investment-calculators-295
    paths:
      - scripts/generate-investment-calculators.js
      - .github/workflows/regenerate-investment-calculators-fix.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/regenerate-investment-calculators-295
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate investment calculators
        run: node scripts/generate-investment-calculators.js
      - name: Validate generated calculator JavaScript
        run: npx jest tests/investment-center-syntax.test.js --runInBand
      - name: Commit regenerated files
        run: |
          if git diff --quiet -- calculators/investment-center en/calculators/investment-center; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculators/investment-center en/calculators/investment-center
          git commit -m "Regenerate investment calculators after escaping fix"
          git push origin HEAD:fix/regenerate-investment-calculators-295
