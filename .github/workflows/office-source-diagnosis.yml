name: Office document delivery acceptance

on:
  push:
    branches: [main, diagnose/office-document-delivery-20261118]
    paths:
      - '.github/workflows/office-source-diagnosis.yml'
      - 'lib/assistant/office-research.js'
      - 'lib/intelligence/claim-fabric.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  office-document:
    if: github.repository == 'alzahrani6020/bonds-global-web' && github.actor == 'alzahrani6020'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - name: Read public office evidence through authenticated governed tools
        run: npm run test:production-smoke
        env:
          OFFICE_TOOL_DIAGNOSIS_ONLY: 'true'
          PRODUCTION_URL: https://bonds-global.com
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
