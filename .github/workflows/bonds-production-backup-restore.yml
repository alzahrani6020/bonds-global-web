name: BONDS Production Encrypted Backup and Restore Gate
on:
  push:
    branches: [integration/hr-current-main-20261121, fix/backup-ephemeral-auth-20261124]
    paths: ['.github/workflows/bonds-production-backup-restore.yml']
  workflow_dispatch:
concurrency:
  group: bonds-production-backup-exclusive
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BONDS_BACKUP_AGE_RECIPIENT: ${{ secrets.BONDS_BACKUP_AGE_RECIPIENT }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Validate scoped prerequisites without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          test "${SUPABASE_PROJECT_REF:-}" = "hutxsqzplyuqgnghsrcs" || { echo "BLOCKED: project identity missing or different"; exit 1; }
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "BLOCKED: SUPABASE_ACCESS_TOKEN missing"; exit 1; }
          test -n "${BONDS_BACKUP_AGE_RECIPIENT:-}" || { echo "BLOCKED: BONDS_BACKUP_AGE_RECIPIENT missing"; exit 1; }
          [[ "$BONDS_BACKUP_AGE_RECIPIENT" == age1* ]] || { echo "BLOCKED: age public recipient invalid"; exit 1; }
          echo "PASS: scoped project prerequisites matched; verify newly rotated management token through ephemeral role provisioning"
      - name: Prepare temporary isolated runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          mkdir -p "$RUNNER_TEMP/bonds-backup"
          chmod 700 "$RUNNER_TEMP/bonds-backup"
      - name: Checkout pinned backup helper
        uses: actions/checkout@v4
      - name: Validate backup helper Python syntax
        run: python3 -m py_compile scripts/backup/ephemeral_backup_login.py
      - name: Provision temporary database login
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/backup/ephemeral_backup_login.py provision
      - name: Confirm temporary PostgreSQL login and read-only session
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(cat "$RUNNER_TEMP/bonds-backup/connection-url")"
          EXPECTED_ROLE="$(cat "$RUNNER_TEMP/bonds-backup/role-name")"
          sleep 60
          docker run --rm -e DATABASE_URL="$DB_URL" -e EXPECTED_ROLE="$EXPECTED_ROLE" postgres:17 sh -ec '
            psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT current_user, current_setting('\''default_transaction_read_only'\'');" | grep -Fx "$EXPECTED_ROLE|on"
          '
          unset DB_URL
          echo "PASS: dedicated backup role authenticated with read-only default"
      - name: Dump production through read-only pg_dump session
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(cat "$RUNNER_TEMP/bonds-backup/connection-url")"
          docker run --rm --user "$(id -u):$(id -g)" -e DATABASE_URL="$DB_URL" -v "$RUNNER_TEMP/bonds-backup:/backup" postgres:17 sh -ec 'pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl --file=/backup/production.dump'
          unset DB_URL
          test -s "$RUNNER_TEMP/bonds-backup/production.dump" || { echo "FAIL: empty archive"; exit 1; }
          docker run --rm -v "$RUNNER_TEMP/bonds-backup:/backup:ro" postgres:17 pg_restore --list /backup/production.dump > "$RUNNER_TEMP/bonds-backup/toc.txt"
          echo "PASS: nonempty pg_dump custom archive and readable TOC"
      - name: Verify complete restore in isolated Supabase PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name bonds-restore-gate --network none -e POSTGRES_HOST_AUTH_METHOD=trust supabase/postgres:17.12.0.002
          for i in $(seq 1 45); do
            if docker exec -u postgres bonds-restore-gate pg_isready -U supabase_admin -q; then break; fi
            sleep 2
          done
          docker exec -u postgres bonds-restore-gate pg_isready -U supabase_admin
          docker exec -u postgres bonds-restore-gate createdb -U supabase_admin -T template0 -E UTF8 bonds_restore_gate
          docker cp "$RUNNER_TEMP/bonds-backup/production.dump" bonds-restore-gate:/tmp/production.dump
          docker exec -u postgres bonds-restore-gate pg_restore -U supabase_admin -d bonds_restore_gate --no-owner --no-acl --exit-on-error /tmp/production.dump
          docker exec -u postgres bonds-restore-gate psql -U supabase_admin -d bonds_restore_gate -X -Atc "SELECT 'PUBLIC_TABLES',count(*) FROM pg_tables WHERE schemaname='public' UNION ALL SELECT 'AUTH_USERS',count(*) FROM auth.users UNION ALL SELECT 'STORAGE_OBJECTS',count(*) FROM storage.objects;"
          echo "PASS: complete isolated pg_restore --exit-on-error"
      - name: Encrypt and store only encrypted archive
        shell: bash
        run: |
          set -euo pipefail
          age -r "$BONDS_BACKUP_AGE_RECIPIENT" -o "$RUNNER_TEMP/bonds-backup/production.dump.age" "$RUNNER_TEMP/bonds-backup/production.dump"
          test -s "$RUNNER_TEMP/bonds-backup/production.dump.age"
          sha256sum "$RUNNER_TEMP/bonds-backup/production.dump.age" | cut -d ' ' -f1
          shred -u "$RUNNER_TEMP/bonds-backup/production.dump"
          rm -f "$RUNNER_TEMP/bonds-backup/toc.txt"
          echo "PASS: encrypted archive ready; plaintext removed from workspace"
      - name: Upload encrypted recovery artifact only
        uses: actions/upload-artifact@v4
        with:
          name: bonds-production-encrypted-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/bonds-backup/production.dump.age
          retention-days: 1
          if-no-files-found: error
      - name: Verify existing HR production schema and apply profile migration only to isolated restored snapshot
        shell: bash
        env:
          HR_PROFILE_SHA: 6c4d1699fb9c9a65a141baa26da2fc69b66f4caf
        run: |
          set -euo pipefail
          # Verify actual production clone, no writes to production: container has no network.
          test "$(docker inspect bonds-restore-gate --format '{{.HostConfig.NetworkMode}}')" = none
          query() {
            docker exec -u postgres bonds-restore-gate psql -U supabase_admin -d bonds_restore_gate -X -At -v ON_ERROR_STOP=1 -c "$1"
          }
          hr_count="$(query "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r' AND c.relname LIKE 'hr_saas_%';")"
          hr_protected="$(query "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r' AND c.relname LIKE 'hr_saas_%' AND c.relrowsecurity;")"
          employees_before="$(query 'SELECT count(*) FROM public.hr_saas_employees;')"
          members_before="$(query 'SELECT count(*) FROM public.hr_saas_memberships;')"
          test "$hr_count" -eq 19 && test "$hr_protected" -eq 19 || { echo "BLOCKED: restored HR schema does not match verified 19 RLS-enabled tables"; exit 1; }
          test "$employees_before" -ge 1 && test "$members_before" -ge 1 || { echo "BLOCKED: restored production HR employee/membership evidence missing"; exit 1; }
          test "$(query "SELECT count(*) FROM pg_class WHERE oid=to_regclass('public.hr_company_profiles');")" -eq 0 || { echo "BLOCKED: profile table already exists; review migrations"; exit 1; }
          git fetch --no-tags --depth=1 origin "$HR_PROFILE_SHA"
          git show "$HR_PROFILE_SHA:supabase/migrations/20261125190000_hr_company_profiles.sql" > "$RUNNER_TEMP/hr_company_profiles.sql"
          test -s "$RUNNER_TEMP/hr_company_profiles.sql"
          docker cp "$RUNNER_TEMP/hr_company_profiles.sql" bonds-restore-gate:/tmp/hr_company_profiles.sql
          docker exec -u postgres bonds-restore-gate psql -U supabase_admin -d bonds_restore_gate -X -v ON_ERROR_STOP=1 -f /tmp/hr_company_profiles.sql
          test "$(query "SELECT relrowsecurity::int FROM pg_class WHERE oid='public.hr_company_profiles'::regclass;")" -eq 1
          test "$(query "SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename='hr_company_profiles';")" -eq 3
          test "$(query "SELECT count(*) FROM storage.buckets WHERE id='hr-company-branding' AND public=false;")" -eq 1
          test "$(query 'SELECT count(*) FROM public.hr_saas_employees;')" = "$employees_before"
          test "$(query 'SELECT count(*) FROM public.hr_saas_memberships;')" = "$members_before"
          echo "PASS: offline restored production snapshot preserved employees/memberships; additive company profile and RLS valid"
      - name: Remove isolated restored database
        if: always()
        shell: bash
        run: |
          docker rm -f bonds-restore-gate >/dev/null 2>&1 || true
      - name: Disable temporary database login and scrub temporary credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/backup/ephemeral_backup_login.py disable
      - name: Destroy temporary runner plaintext on failure
        if: failure()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/bonds-backup/production.dump" "$RUNNER_TEMP/bonds-backup/toc.txt" "$RUNNER_TEMP/bonds-backup/connection-url"
      - name: Report gate
        run: |
          echo "STATUS: PASS - production snapshot archived encrypted after isolated restore"
