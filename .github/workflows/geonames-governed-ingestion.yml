name: GeoNames governed ingestion

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'stage_reconcile, promote, or rollback'
        required: true
        type: choice
        options:
          - stage_reconcile
          - promote
          - rollback
        default: stage_reconcile
      run_id:
        description: 'Existing geo_ingest run UUID for promote/rollback'
        required: false
        type: string
        default: ''
      confirmation:
        description: 'Type PROMOTE for promotion or ROLLBACK for rollback'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: geonames-governed-ingestion
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.GEO_DATABASE_URL }}
      PGSSLMODE: require
      GEO_SOURCE_CODE: geonames

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Validate requested action
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.action }}" in
            stage_reconcile) ;;
            promote)
              [[ "${{ inputs.run_id }}" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Valid run_id required"; exit 1; }
              [ "${{ inputs.confirmation }}" = "PROMOTE" ] || { echo "confirmation must be PROMOTE"; exit 1; }
              ;;
            rollback)
              [[ "${{ inputs.run_id }}" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Valid run_id required"; exit 1; }
              [ "${{ inputs.confirmation }}" = "ROLLBACK" ] || { echo "confirmation must be ROLLBACK"; exit 1; }
              ;;
            *) exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Resolve Production database connection
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail

          if [ -n "${DATABASE_URL:-}" ]; then
            echo "Using configured GEO_DATABASE_URL."
            exit 0
          fi

          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN is required when GEO_DATABASE_URL is absent"; exit 1; }
          test -n "${VERCEL_PROJECT_ID:-}" || { echo "VERCEL_PROJECT_ID is required when GEO_DATABASE_URL is absent"; exit 1; }
          test -n "${VERCEL_ORG_ID:-}" || { echo "VERCEL_ORG_ID is required when GEO_DATABASE_URL is absent"; exit 1; }

          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

          npx --no-install vercel pull --yes --environment=production --scope "$VERCEL_ORG_ID"

          env_file=".vercel/.env.production.local"
          test -s "$env_file" || { echo "Vercel Production env file was not created"; exit 1; }

          set +u
          set -a
          . "$env_file"
          set +a
          set -u

          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL is missing from Vercel Production"; exit 1; }
          echo "::add-mask::$SUPABASE_DB_URL"

          {
            echo 'DATABASE_URL<<__GEO_DB_URL__'
            printf '%s\n' "$SUPABASE_DB_URL"
            echo '__GEO_DB_URL__'
          } >> "$GITHUB_ENV"

          rm -rf .vercel
          unset SUPABASE_DB_URL

      - name: Verify database connection is available
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "Production database connection could not be resolved"; exit 1; }

      - name: Download official GeoNames dumps
        if: inputs.action == 'stage_reconcile'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-geo
          for file in allCountries.zip alternateNamesV2.zip admin1CodesASCII.txt; do
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 1800               --output ".tmp-geo/$file" "https://download.geonames.org/export/dump/$file"
            test -s ".tmp-geo/$file"
          done
          unzip -tq .tmp-geo/allCountries.zip
          unzip -tq .tmp-geo/alternateNamesV2.zip
          unzip -p .tmp-geo/allCountries.zip allCountries.txt > .tmp-geo/allCountries.txt
          unzip -p .tmp-geo/alternateNamesV2.zip alternateNamesV2.txt > .tmp-geo/alternateNames.txt

      - name: Build canonical Arab locality dataset
        if: inputs.action == 'stage_reconcile'
        run: npm run geo:build-local

      - name: Fetch current production cities
        if: inputs.action == 'stage_reconcile'
        shell: bash
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          test -n "${SITE_URL:-}" || { echo "SITE_URL secret is required"; exit 1; }
          curl --fail --location --retry 3 \
            --output .tmp-geo/current-cities.json \
            "${SITE_URL%/}/api/v3/cities?limit=2000"
          test -s .tmp-geo/current-cities.json

      - name: Build safe canonical-city candidate subset
        if: inputs.action == 'stage_reconcile'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/filter-geonames-safe-candidates.js \
            --cities .tmp-geo/current-cities.json \
            --source .tmp-geo/arab-localities.ndjson \
            --output .tmp-geo/geonames-safe-candidates.ndjson \
            --report .tmp-geo/geonames-safe-candidate-report.json \
            --max-rows 5000

          SAFE_ROWS="$(wc -l < .tmp-geo/geonames-safe-candidates.ndjson)"
          SOURCE_ROWS="$(wc -l < .tmp-geo/arab-localities.ndjson)"

          test "$SAFE_ROWS" -gt 0
          test "$SAFE_ROWS" -le 5000
          test "$SAFE_ROWS" -lt "$SOURCE_ROWS"

          sha256sum .tmp-geo/geonames-safe-candidates.ndjson > .tmp-geo/geonames-safe-candidates.sha256
      - name: Verify ADM1 source links
        if: inputs.action == 'stage_reconcile'
        shell: bash
        env:
          GEO_ADMIN1_APPLY: '1'
        run: |
          set -euo pipefail
          node scripts/link-local-geonames-admin1.js
          test -s .tmp-geo/geonames-admin1-review.json

      - name: Stage and reconcile only
        if: inputs.action == 'stage_reconcile'
        id: stage
        shell: bash
        env:
          GEO_STAGE_APPLY: '1'
          GEO_RECONCILE_APPLY: '1'
        run: |
          set -euo pipefail
          node scripts/stage-local-geo-dataset.js .tmp-geo/geonames-safe-candidates.ndjson | tee .tmp-geo/stage.log
          RUN_ID="$(sed -n 's/^GEO_RUN_ID=//p' .tmp-geo/stage.log | tail -1)"
          [[ "$RUN_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Missing run id"; exit 1; }
          printf 'run_id=%s\n' "$RUN_ID" >> "$GITHUB_OUTPUT"
          node scripts/reconcile-local-geo-run.js "$RUN_ID" | tee .tmp-geo/reconcile.log
          echo "Staged and reconciled run: $RUN_ID"
          echo "Promotion is intentionally NOT automatic."

      - name: Promote reviewed run
        if: inputs.action == 'promote'
        env:
          GEO_PROMOTE_APPLY: '1'
        run: node scripts/promote-local-geo-run.js "${{ inputs.run_id }}"

      - name: Roll back run
        if: inputs.action == 'rollback'
        env:
          GEO_ROLLBACK_APPLY: '1'
        run: node scripts/rollback-local-geo-run.js "${{ inputs.run_id }}"

      - name: Upload review evidence
        if: always() && inputs.action == 'stage_reconcile'
        uses: actions/upload-artifact@v5
        with:
          name: geonames-governed-ingestion-${{ github.run_id }}
          path: |
            .tmp-geo/arab-localities-manifest.json
            .tmp-geo/geonames-admin1-review.json
            .tmp-geo/geonames-safe-candidate-report.json
            .tmp-geo/geonames-safe-candidates.sha256
            .tmp-geo/stage.log
            .tmp-geo/reconcile.log
          if-no-files-found: warn
          retention-days: 30
