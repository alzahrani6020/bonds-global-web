name: Refresh Visual Baselines

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - name: Install Playwright Browser
        run: npx playwright install chromium
      - name: Start local dev server
        run: |
          npm run dev:local &
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:3005/api/env >/dev/null 2>&1; then break; fi
            sleep 1
          done
      - name: Regenerate baselines in the CI environment
        run: npm run test:visual:update
      - name: Open a pull request with the refreshed baselines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="chore/visual-baselines-$(date +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add tests/visual/baselines
          git commit -m "test(visual): regenerate baselines on the CI renderer (renderer-sensitive)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "test(visual): regenerate baselines on the CI renderer" \
            --body "Regenerated by the Refresh Visual Baselines workflow. Admin-merge to unblock the visual gate; the next CI run validates the new baselines."
