name: BONDS Offline Encrypted Backup Custody Tests
on:
  pull_request:
    paths:
      - 'scripts/backup/archive_encrypted_backup.py'
      - 'scripts/backup/test_archive_encrypted_backup.py'
      - '.github/workflows/bonds-offline-backup-custody-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custody-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate secure offline custody behavior
        run: python3 -m unittest discover -s scripts/backup -p 'test_archive_encrypted_backup.py' -v
