name: BONDS Offline Encrypted Backup Custody Tests
on:
  pull_request:
    paths:
      - 'scripts/backup/archive_encrypted_backup.py'
      - 'scripts/backup/test_archive_encrypted_backup.py'
      - 'scripts/backup/check_github_backup_schedule.py'
      - 'scripts/backup/test_check_github_backup_schedule.py'
      - 'scripts/backup/test_watchdog_schedule_order.py'
      - '.github/workflows/bonds-backup-freshness-watchdog.yml'
      - 'scripts/backup/export_storage_encrypted.py'
      - 'scripts/backup/verify_storage_restored.py'
      - 'scripts/backup/test_storage_encrypted.py'
      - 'scripts/backup/check_storage_db_alignment.py'
      - 'scripts/backup/test_check_storage_db_alignment.py'
      - '.github/workflows/bonds-storage-encrypted-backup.yml'
      - '.github/workflows/bonds-offline-backup-custody-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custody-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install AGE for real cryptographic roundtrip
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          command -v age
          command -v age-keygen
      - name: Validate secure offline custody behavior
        run: python3 -m unittest discover -s scripts/backup -p 'test_*.py' -v
