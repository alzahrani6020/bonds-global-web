name: BONDS Offline Encrypted Backup Custody Tests
on:
  pull_request:
    paths:
      - 'scripts/backup/archive_encrypted_backup.py'
      - 'scripts/backup/test_archive_encrypted_backup.py'
      - 'scripts/backup/check_github_backup_schedule.py'
      - 'scripts/backup/test_check_github_backup_schedule.py'
      - 'scripts/backup/test_watchdog_schedule_order.py'
      - '.github/workflows/bonds-backup-freshness-watchdog.yml'
      - 'scripts/backup/export_storage_encrypted.py'
      - 'scripts/backup/verify_storage_restored.py'
      - 'scripts/backup/test_storage_encrypted.py'
      - 'scripts/backup/check_storage_db_alignment.py'
      - 'scripts/backup/test_check_storage_db_alignment.py'
      - 'scripts/backup/test_storage_postgres_integration.py'
      - 'scripts/backup/export_isolated_storage_metadata.sql'
      - '.github/workflows/bonds-storage-encrypted-backup.yml'
      - '.github/workflows/bonds-offline-backup-custody-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custody-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-password-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install AGE for real cryptographic roundtrip
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          command -v age
          command -v age-keygen
      - name: Provision disposable isolated PostgreSQL database
        env:
          PGPASSWORD: test-password-only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 || sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bonds_restore_gate;'
      - name: Validate secure offline custody and real PostgreSQL alignment
        env:
          RUN_DISPOSABLE_PG_INTEGRATION: '1'
          ISOLATED_TEST_DATABASE_URL: postgresql://postgres:test-password-only@127.0.0.1:5432/bonds_restore_gate
        run: python3 -m unittest discover -s scripts/backup -p 'test_*.py' -v
