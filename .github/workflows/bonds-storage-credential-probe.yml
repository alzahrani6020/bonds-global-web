name: BONDS Storage Credential Read-Only Probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bonds-storage-credential-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production key can list Storage buckets (no object downloads)
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BONDS_STORAGE_SERVICE_ROLE_KEY: ${{ secrets.BONDS_STORAGE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          expected = "hutxsqzplyuqgnghsrcs"
          key = os.environ.get("BONDS_STORAGE_SERVICE_ROLE_KEY", "")
          if os.environ.get("SUPABASE_PROJECT_REF") != expected or not key.startswith("sb_secret_"):
              raise SystemExit("FAIL: incorrect project or missing modern storage secret")
          url = f"https://{expected}.supabase.co/storage/v1/bucket?limit=100&offset=0"
          try:
              with urlopen(Request(url, headers={"apikey": key}), timeout=20) as response:
                  data = json.load(response)
          except (HTTPError, URLError, TimeoutError):
              raise SystemExit("FAIL: Storage bucket listing authentication (details hidden)")
          if not isinstance(data, list) or len(data) == 0:
              raise SystemExit("FAIL: unexpected empty/invalid Storage inventory")
          names = [b.get("id") for b in data if isinstance(b, dict)]
          if len(names) != len(data) or any(not isinstance(x, str) or not x for x in names):
              raise SystemExit("FAIL: malformed Storage bucket inventory")
          print(f"PASS: privileged Storage bucket list succeeded, buckets={len(names)}")
          print("PASS: no Storage object content was downloaded")
          PY
