name: Apply Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Migration file to apply (relative to repo root). Leave empty to apply the latest migration.'
        required: false
        default: ''

jobs:
  migrate:
    name: Apply Supabase Migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine migration file
        id: migration
        run: |
          if [ -n "${{ github.event.inputs.migration_file }}" ]; then
            MIGRATION_FILE="${{ github.event.inputs.migration_file }}"
          else
            MIGRATION_FILE=$(ls -1 supabase/migrations/*.sql | sort | tail -n 1)
          fi

          if [ ! -f "$MIGRATION_FILE" ]; then
            echo "Migration file not found: $MIGRATION_FILE"
            exit 1
          fi

          echo "file=$MIGRATION_FILE" >> "$GITHUB_OUTPUT"
          echo "Applying migration: $MIGRATION_FILE"

      - name: Apply migration via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          MIGRATION_FILE="${{ steps.migration.outputs.file }}"
          QUERY=$(cat "$MIGRATION_FILE")

          echo "Applying migration: $MIGRATION_FILE"

          STATUS_CODE=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg query "$QUERY" '{query: $query}')")

          echo "Response status: $STATUS_CODE"
          cat response.json

          if [ "$STATUS_CODE" != "200" ] && [ "$STATUS_CODE" != "201" ]; then
            echo "Migration failed with status $STATUS_CODE"
            exit 1
          fi

          echo "Migration applied successfully"
