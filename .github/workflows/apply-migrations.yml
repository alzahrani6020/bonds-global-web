name: Apply Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Migration file to apply (relative to repo root). Leave empty to apply the latest migration file.'
        required: false
        default: ''

jobs:
  migrate:
    name: Apply Supabase Migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine migration file
        id: migration
        run: |
          if [ -n "${{ github.event.inputs.migration_file }}" ]; then
            MIGRATION_FILE="${{ github.event.inputs.migration_file }}"
          else
            MIGRATION_FILE=$(ls -1 supabase/migrations/*.sql | sort | tail -n 1)
          fi

          if [ ! -f "$MIGRATION_FILE" ]; then
            echo "Migration file not found: $MIGRATION_FILE"
            exit 1
          fi

          echo "file=$MIGRATION_FILE" >> "$GITHUB_OUTPUT"
          echo "Applying migration: $MIGRATION_FILE"

      - name: Apply migration via admin endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -e
          MIGRATION_FILE="${{ steps.migration.outputs.file }}"

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set. Cannot apply migration securely."
            exit 1
          fi
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL is not set. Cannot reach admin endpoint."
            exit 1
          fi

          echo "Applying migration via ${SITE_URL}/api/admin ..."
          STATUS_CODE=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${SITE_URL}/api/admin?action=run-migrations&cronSecret=${CRON_SECRET}&migration_file=${MIGRATION_FILE}")

          echo "Response status: $STATUS_CODE"
          cat response.json

          if [ "$STATUS_CODE" != "200" ]; then
            echo "Migration failed with status $STATUS_CODE"
            exit 1
          fi

          echo "Migration applied successfully"
