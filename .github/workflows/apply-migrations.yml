name: Apply Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/reconcile-production-migrations.js'
      - 'tests/db/production-migration-reconciliation.test.cjs'
      - '.github/workflows/apply-migrations.yml'
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Migration file to apply (relative to repo root)'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  verify-reconciliation:
    name: Verify migration safety gate (no production access)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate reconciliation contracts
        run: node --test tests/db/production-migration-reconciliation.test.cjs

  migrate:
    name: Apply Supabase Migrations
    if: github.event_name != 'pull_request'
    needs: verify-reconciliation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Determine migrations
        id: migrations
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MIGRATION_FILE="${{ github.event.inputs.migration_file }}"

            if [ -z "$MIGRATION_FILE" ]; then
              echo "migration_file is required for manual runs."
              exit 1
            fi

            case "$MIGRATION_FILE" in
              supabase/migrations/*.sql) ;;
              *)
                echo "Invalid migration path: $MIGRATION_FILE"
                exit 1
                ;;
            esac

            if [ ! -f "$MIGRATION_FILE" ]; then
              echo "Migration file not found: $MIGRATION_FILE"
              exit 1
            fi

            if [[ "$MIGRATION_FILE" == *_rollback.sql ]]; then
              echo "Rollback migrations must not be applied by this workflow."
              exit 1
            fi

            printf '%s\n' "$MIGRATION_FILE" > /tmp/migrations.txt
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "Cannot determine a safe previous commit for automatic migration detection."
              exit 1
            fi

            MUTATED_MIGRATIONS="$(git diff --diff-filter=MD --name-only "$BEFORE" "$AFTER" -- 'supabase/migrations/*.sql' | awk '!/_rollback[.]sql$/')"

            if [ -n "$MUTATED_MIGRATIONS" ]; then
              echo "Existing forward migration files are immutable once merged."
              echo "Create a new recovery migration instead of modifying or deleting:"
              printf '%s\n' "$MUTATED_MIGRATIONS"
              exit 1
            fi
            git diff --diff-filter=A --name-only "$BEFORE" "$AFTER" -- 'supabase/migrations/*.sql' \
              | grep -v '_rollback\.sql$' \
              | sort \
              > /tmp/migrations.txt || true
          fi

          echo "Migrations selected:"
          cat /tmp/migrations.txt || true

          COUNT=$(grep -c . /tmp/migrations.txt || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Verify migration reconciler contracts
        if: steps.migrations.outputs.count != '0'
        run: node --test tests/db/production-migration-reconciliation.test.cjs

      - name: Reconcile production migration SQL before any writes
        if: steps.migrations.outputs.count != '0'
        id: reconcile
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: hutxsqzplyuqgnghsrcs
          MIGRATIONS_INPUT: /tmp/migrations.txt
          MIGRATIONS_PENDING: /tmp/pending-migrations.txt
        run: |
          set -euo pipefail
          node scripts/reconcile-production-migrations.js

      - name: Apply migrations via admin endpoint
        if: steps.migrations.outputs.count != '0' && steps.reconcile.outputs.pending_count != '0'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set."
            exit 1
          fi

          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL is not set."
            exit 1
          fi

          while IFS= read -r MIGRATION_FILE; do
            [ -z "$MIGRATION_FILE" ] && continue

            echo "Applying migration: $MIGRATION_FILE"

            STATUS_CODE=$(curl -sS -o response.json -w "%{http_code}" \
              -H "X-Cron-Secret: ${CRON_SECRET}" \
              -G \
              -X POST \
              --data-urlencode "action=run-migrations" \
              --data-urlencode "migration_file=${MIGRATION_FILE}" \
              --data-urlencode "commit_sha=${GITHUB_SHA}" \
              "${SITE_URL}/api/admin")

            echo "Response status: $STATUS_CODE"
            cat response.json
            echo

            if [ "$STATUS_CODE" != "200" ]; then
              echo "Migration failed: $MIGRATION_FILE"
              exit 1
            fi

            echo "Migration applied successfully: $MIGRATION_FILE"
          done < /tmp/pending-migrations.txt

      - name: Already verified migration SQL in production
        if: steps.migrations.outputs.count != '0' && steps.reconcile.outputs.pending_count == '0'
        run: echo "All selected migration SQL matches recorded production history; no database writes performed."

      - name: No migrations to apply
        if: steps.migrations.outputs.count == '0'
        run: echo "No newly added migration files detected."
