name: Apply Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  migrate:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply migrations via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          MIGRATION_FILE="supabase/migrations/20260722000001_enable_rls_all_tables.sql"
          if [ ! -f "$MIGRATION_FILE" ]; then
            echo "Migration file not found: $MIGRATION_FILE"
            exit 1
          fi

          echo "Applying migration: $MIGRATION_FILE"
          QUERY=$(cat "$MIGRATION_FILE")

          # Send SQL via Supabase Management API
          STATUS_CODE=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg query "$QUERY" '{query: $query}')")

          echo "Response status: $STATUS_CODE"
          cat response.json

          if [ "$STATUS_CODE" != "200" ] && [ "$STATUS_CODE" != "201" ]; then
            echo "Migration failed with status $STATUS_CODE"
            exit 1
          fi

          echo "Migration applied successfully"
