name: CI — Tests, Audit & Visual Regression

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-bounded-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: crm-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Verify CRM migration and tenant RLS (disposable PostgreSQL)
        env:
          CRM_TEST_DATABASE_URL: postgres://postgres:crm-ci-only@localhost:5432/postgres
        run: node tests/crm/isolated-postgres-acceptance.js

      - name: Verify HR migration, tenant RLS and role isolation (disposable PostgreSQL)
        env:
          CRM_TEST_DATABASE_URL: postgres://postgres:crm-ci-only@localhost:5432/postgres
        run: node tests/hr/isolated-postgres-acceptance.js

      - name: Verify owner-authorized invitation server and failure handling
        run: node --test tests/crm/invite-handler-contract.cjs

      - name: Validate Bonds Native and Token Runtime operations
        shell: pwsh
        run: |
          $files = Get-ChildItem "services/bonds_native_inference", "services/bonds_token_runtime" -Recurse -Filter "*.ps1" -File | Select-Object -ExpandProperty FullName
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }

          $manifest = Get-Content -LiteralPath "services/bonds_native_inference/canonical-model.json" -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$manifest.source_repository)) { throw "canonical model source_repository is required" }
          if ([string]::IsNullOrWhiteSpace([string]$manifest.source_revision)) { throw "canonical model source_revision is required" }
          if ([string]::IsNullOrWhiteSpace([string]$manifest.artifact)) { throw "canonical model artifact is required" }
          if ([string]$manifest.sha256 -notmatch "^[0-9a-f]{64}$") { throw "canonical model sha256 must be 64 lowercase hex characters" }
          if ([int]$manifest.runtime.n_ctx -le 0 -or [int]$manifest.runtime.n_threads -le 0 -or [int]$manifest.runtime.max_tokens -le 0) {
            throw "canonical model runtime settings must be positive"
          }

      - name: Validate 8771 service-token contract
        working-directory: services/bonds_token_runtime
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Run Site Audit
        run: npm run audit

      - name: Generate and validate Tools Registry
        run: |
          npm run generate:tools
          git diff --exit-code
          npm run audit:tools

      - name: Run Open Graph Audit
        run: npm run audit:og

      - name: Run i18n Audit
        run: npm run audit:i18n

      - name: Run API Auth & Routing Audit
        run: npm run audit:api

      - name: Run Admin Architecture Contract Audit
        run: npm run audit:admin-contracts

      - name: Install Playwright Browser
        run: npx playwright install chromium

      - name: Verify feasibility PDF generation
        run: npm run verify:feasibility-pdf

      - name: Audit generated PDF references
        run: npm run audit:generated-pdfs

      - name: Start Local Dev Server
        run: npm run dev:local &

      - name: Wait for Server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3005 > /dev/null; then echo "Server ready"; exit 0; fi
            sleep 1
          done
          echo "Server did not start in time" && exit 1

      - name: Verify CRM browser workflow (isolated auth and database)
        run: node tests/crm/browser-acceptance.js

      - name: Verify HR browser workflow (isolated auth and database)
        run: node tests/hr/browser-acceptance.js

      - name: Run HR native policy and API tests
        run: node --test tests/hr/*.test.cjs

      - name: Run Assistant End-to-End CI Journeys
        run: npm run test:assistant:e2e-ci

      - name: Run Unit and Integration Tests
        run: npm test

      - name: Verify correspondence successor trigger on disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --name bonds-correspondence-test-pg -e POSTGRES_PASSWORD=isolated-fixture -d postgres:17-alpine
          trap 'docker rm -f bonds-correspondence-test-pg >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if docker exec bonds-correspondence-test-pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          # The image's temporary initialization server accepts Unix sockets
          # and then stops. Require the final TCP server before running SQL.
          connected=0
          for attempt in $(seq 1 30); do
            if docker exec -e PGPASSWORD=isolated-fixture -i bonds-correspondence-test-pg psql -h 127.0.0.1 -U postgres -c 'select 1' >/dev/null 2>&1; then connected=1; break; fi
            sleep 1
          done
          test "$connected" -eq 1
          docker exec -e PGPASSWORD=isolated-fixture -i bonds-correspondence-test-pg psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f - < tests/security/correspondence-ledger-bootstrap.pg.sql
          docker exec -e PGPASSWORD=isolated-fixture -i bonds-correspondence-test-pg psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f - < supabase/migrations/20261115030000_correspondence_atomic_successor_activation.sql
          docker exec -e PGPASSWORD=isolated-fixture -i bonds-correspondence-test-pg psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f - < tests/security/correspondence-ledger-acceptance.pg.sql


      - name: Run Accessibility Tests
        run: npm run test:a11y

      - name: Run Mobile Interaction Tests
        run: npm run test:mobile

      - name: Determine visual regression scope from PR base
        id: visual-scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          echo "scope=full" >> "$GITHUB_OUTPUT"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then exit 0; fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD > /tmp/bonds-pr-changed-files.txt
          cat /tmp/bonds-pr-changed-files.txt
          while IFS= read -r file; do
            case "$file" in
              lib/api/rate-limit.js|lib/api/rate-limit-distributed.js|scripts/post-deploy-smoke.js|scripts/assistant-production-smoke.js|tests/api/rate-limit-distributed.test.js|tests/api/rate-limit-retry-after.test.js|tests/assistant/assistant-production-smoke.test.js|components/service-discovery.js|en/v3/city-intelligence.html|en/v3/project/index.html|index.html|site-layout.js|styles/bonds-redesign-2026.css|tests/assistant/assistant-ui-interaction.test.js|v3/city-intelligence.html|v3/components/ai-chat-widget.js|v3/investment-map.html|v3/project/index.html|my-bonds/crm/*|en/my-bonds/crm/*|tests/crm/*|tests/admin/crm-client-workspace.test.js|bonds-auth-2026.js|tests/v3/revert-service-request-context.test.js|supabase/migrations/20261115193300_crm_multiple_owner_workspaces.sql|tests/visual/visual-tests.js|api/payments.js|api/platform.js|lib/api/company-programs.js|lib/api/hr-calculations.js|lib/hr/*|supabase/migrations/20261117*|supabase/migrations/20261118010000_hr_link_existing_company_workspaces.sql|tests/hr/*|tests/admin/company-programs-standalone-hr.test.js|tests/admin/crm-unified-shell.test.js|tests/auth-callback-bootstrap.test.js|jest.config.js|vercel.json|calculators/auth/index.html|en/calculators/auth/index.html|.github/workflows/ci.yml) ;;
              sw.js)
                # Only cache version and versioned asset references may differ.
                git show "$BASE_SHA:sw.js" > /tmp/bonds-base-sw-original.js
                sed -E -e "s/^(const CACHE_VERSION = )'v3[.]0[.][0-9]+';/\\1'NORMALIZED';/" -e "s@('/site-layout[.]js[?]v=)[^']+@\\1NORMALIZED@g" -e "s@('/bonds-auth-2026[.]js[?]v=)[^']+@\\1NORMALIZED@g" /tmp/bonds-base-sw-original.js > /tmp/bonds-base-sw-normalized.js
                sed -E -e "s/^(const CACHE_VERSION = )'v3[.]0[.][0-9]+';/\\1'NORMALIZED';/" -e "s@('/site-layout[.]js[?]v=)[^']+@\\1NORMALIZED@g" -e "s@('/bonds-auth-2026[.]js[?]v=)[^']+@\\1NORMALIZED@g" sw.js > /tmp/bonds-head-sw-normalized.js
                cmp -s /tmp/bonds-base-sw-normalized.js /tmp/bonds-head-sw-normalized.js || exit 0
                ;;
              *) exit 0 ;;
            esac
          done < /tmp/bonds-pr-changed-files.txt
          echo "scope=base-compare" >> "$GITHUB_OUTPUT"

      - name: Prepare exact PR-base homepage visual reference
        if: steps.visual-scope.outputs.scope == 'base-compare'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/bonds-ui-base" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/bonds-ui-base/node_modules"
          (cd "$RUNNER_TEMP/bonds-ui-base" && PORT=3006 node scripts/dev-server.js > "$RUNNER_TEMP/bonds-ui-base.log" 2>&1 &)
          ready=0
          for i in {1..30}; do
            if curl -fsS http://localhost:3006/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then cat "$RUNNER_TEMP/bonds-ui-base.log"; exit 1; fi

      - name: Run Visual Regression Tests
        env:
          BONDS_VISUAL_SCOPE: ${{ steps.visual-scope.outputs.scope }}
          BONDS_HOME_BASE_URL: http://localhost:3006
        run: npm run test:visual

      - name: Validate service manifests and token policies
        run: npm run services:check

      - name: Upload Visual Artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-diffs
          path: |
            tests/visual/diffs/
            tests/visual/snapshots/
          if-no-files-found: ignore
          retention-days: 1

  token-runtime-windows-acceptance:
    name: Token Runtime Windows service acceptance (isolated)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      BONDS_TOKEN_WINDOWS_ISOLATED_ACCEPTANCE: '1'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python for the isolated service
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install Windows service dependency on the disposable runner
        run: |
          python -m pip install pywin32==312
          if ($LASTEXITCODE -ne 0) { throw "pywin32 installation failed" }
          # The pinned wheel contains two script copies and one canonical entry point.
          python -c "import importlib.metadata as m, sys; entries = [p for p in m.distribution('pywin32').entry_points if p.group == 'console_scripts' and p.name == 'pywin32_postinstall']; assert len(entries) == 1, 'Installed pywin32 postinstall entry point is missing or ambiguous'; print('Running pywin32 postinstall entry point:', entries[0].value); sys.argv = ['pywin32_postinstall', '-install']; sys.exit(entries[0].load()())"
          if ($LASTEXITCODE -ne 0) { throw "pywin32 service registration prerequisites failed" }

      - name: Verify SCM restart, revocation persistence and failed rollout recovery
        run: ./services/bonds_token_runtime/tests/test_windows_service_lifecycle.ps1

      - name: Report isolated acceptance evidence
        if: always()
        run: |
          $report = Join-Path $env:RUNNER_TEMP "bonds-windows-token-lifecycle-acceptance.json"
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) { throw "Windows acceptance report is missing" }
          Get-Content -LiteralPath $report -Raw

      - name: Upload sanitized isolated acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: token-runtime-windows-acceptance
          path: ${{ runner.temp }}/bonds-windows-token-lifecycle-acceptance.json
          if-no-files-found: error
          retention-days: 14
