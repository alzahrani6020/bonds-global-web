name: CI — Tests, Audit & Visual Regression

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-bounded-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Bonds Native and Token Runtime operations
        shell: pwsh
        run: |
          $files = Get-ChildItem "services/bonds_native_inference", "services/bonds_token_runtime" -Recurse -Filter "*.ps1" -File | Select-Object -ExpandProperty FullName
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }

          $manifest = Get-Content -LiteralPath "services/bonds_native_inference/canonical-model.json" -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$manifest.source_repository)) { throw "canonical model source_repository is required" }
          if ([string]::IsNullOrWhiteSpace([string]$manifest.source_revision)) { throw "canonical model source_revision is required" }
          if ([string]::IsNullOrWhiteSpace([string]$manifest.artifact)) { throw "canonical model artifact is required" }
          if ([string]$manifest.sha256 -notmatch "^[0-9a-f]{64}$") { throw "canonical model sha256 must be 64 lowercase hex characters" }
          if ([int]$manifest.runtime.n_ctx -le 0 -or [int]$manifest.runtime.n_threads -le 0 -or [int]$manifest.runtime.max_tokens -le 0) {
            throw "canonical model runtime settings must be positive"
          }

      - name: Validate 8771 service-token contract
        working-directory: services/bonds_token_runtime
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Run Site Audit
        run: npm run audit

      - name: Generate and validate Tools Registry
        run: |
          npm run generate:tools
          git diff --exit-code
          npm run audit:tools

      - name: Run Open Graph Audit
        run: npm run audit:og

      - name: Run i18n Audit
        run: npm run audit:i18n

      - name: Run API Auth & Routing Audit
        run: npm run audit:api

      - name: Run Admin Architecture Contract Audit
        run: npm run audit:admin-contracts

      - name: Install Playwright Browser
        run: npx playwright install chromium

      - name: Verify feasibility PDF generation
        run: npm run verify:feasibility-pdf

      - name: Audit generated PDF references
        run: npm run audit:generated-pdfs

      - name: Start Local Dev Server
        run: npm run dev:local &

      - name: Wait for Server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3005 > /dev/null; then echo "Server ready"; exit 0; fi
            sleep 1
          done
          echo "Server did not start in time" && exit 1

      - name: Run Assistant End-to-End CI Journeys
        run: npm run test:assistant:e2e-ci

      - name: Run Unit and Integration Tests
        run: npm test

      - name: Run Accessibility Tests
        run: npm run test:a11y

      - name: Run Mobile Interaction Tests
        run: npm run test:mobile

      - name: Run Visual Regression Tests
        run: npm run test:visual

      - name: Export tablet English homepage baseline
        if: failure()
        shell: bash
        run: |
          f="tests/visual/snapshots/tablet/index-en.png"
          if [ -f "$f" ]; then
            echo "TABLET_EN_BEGIN"
            base64 "$f"
            echo "TABLET_EN_END"
          fi

      - name: Validate service manifests and token policies
        run: npm run services:check

      - name: Upload Visual Artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-diffs
          path: |
            tests/visual/diffs/
            tests/visual/snapshots/
          if-no-files-found: ignore
          retention-days: 1

  token-runtime-windows-acceptance:
    name: Token Runtime Windows service acceptance (isolated)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      BONDS_TOKEN_WINDOWS_ISOLATED_ACCEPTANCE: '1'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python for the isolated service
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install Windows service dependency on the disposable runner
        run: |
          python -m pip install pywin32==312
          if ($LASTEXITCODE -ne 0) { throw "pywin32 installation failed" }
          # The pinned wheel contains two script copies and one canonical entry point.
          python -c "import importlib.metadata as m, sys; entries = [p for p in m.distribution('pywin32').entry_points if p.group == 'console_scripts' and p.name == 'pywin32_postinstall']; assert len(entries) == 1, 'Installed pywin32 postinstall entry point is missing or ambiguous'; print('Running pywin32 postinstall entry point:', entries[0].value); sys.argv = ['pywin32_postinstall', '-install']; sys.exit(entries[0].load()())"
          if ($LASTEXITCODE -ne 0) { throw "pywin32 service registration prerequisites failed" }

      - name: Verify SCM restart, revocation persistence and failed rollout recovery
        run: ./services/bonds_token_runtime/tests/test_windows_service_lifecycle.ps1

      - name: Report isolated acceptance evidence
        if: always()
        run: |
          $report = Join-Path $env:RUNNER_TEMP "bonds-windows-token-lifecycle-acceptance.json"
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) { throw "Windows acceptance report is missing" }
          Get-Content -LiteralPath $report -Raw

      - name: Upload sanitized isolated acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: token-runtime-windows-acceptance
          path: ${{ runner.temp }}/bonds-windows-token-lifecycle-acceptance.json
          if-no-files-found: error
          retention-days: 14
