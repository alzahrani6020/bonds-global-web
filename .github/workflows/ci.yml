name: CI — Tests, Audit & Visual Regression

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Site Audit
        run: npm run audit

      - name: Run Open Graph Audit
        run: npm run audit:og

      - name: Run i18n Audit
        run: npm run audit:i18n

      - name: Run API Auth & Routing Audit
        run: npm run audit:api

      - name: Install Playwright Browser
        run: npx playwright install chromium

      - name: Start Local Dev Server
        run: npm run dev:local &

      - name: Wait for Server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3005 > /dev/null; then echo "Server ready"; exit 0; fi
            sleep 1
          done
          echo "Server did not start in time" && exit 1

      - name: Run Unit and Integration Tests
        run: npm test

      - name: Run Accessibility Tests
        run: npm run test:a11y

      - name: Run Mobile Interaction Tests
        run: npm run test:mobile

      - name: Run Visual Regression Tests
        run: npm run test:visual

      - name: Upload Visual Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/diffs/
          if-no-files-found: ignore
          retention-days: 1
