name: CI — Tests, Audit & Visual Regression

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-bounded-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: crm-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Verify CRM migration and tenant RLS (disposable PostgreSQL)
        env:
          CRM_TEST_DATABASE_URL: postgres://postgres:crm-ci-only@localhost:5432/postgres
        run: node tests/crm/isolated-postgres-acceptance.js

      - name: Verify owner-authorized invitation server and failure handling
        run: node --test tests/crm/invite-handler-contract.cjs

      - name: Validate Bonds Native and Token Runtime operations
        shell: pwsh
        run: |
          $files = Get-ChildItem "services/bonds_native_inference", "services/bonds_token_runtime" -Recurse -Filter "*.ps1" -File | Select-Object -ExpandProperty FullName
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }

          $manifest = Get-Content -LiteralPath "services/bonds_native_inference/canonical-model.json" -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$manifest.source_repository)) { throw "canonical model source_repository is required" }
          if ([string]::IsNullOrWhiteSpace([string]$manifest.source_revision)) { throw "canonical model source_revision is required" }
          if ([string]::IsNullOrWhiteSpace([string]$manifest.artifact)) { throw "canonical model artifact is required" }
          if ([string]$manifest.sha256 -notmatch "^[0-9a-f]{64}$") { throw "canonical model sha256 must be 64 lowercase hex characters" }
          if ([int]$manifest.runtime.n_ctx -le 0 -or [int]$manifest.runtime.n_threads -le 0 -or [int]$manifest.runtime.max_tokens -le 0) {
            throw "canonical model runtime settings must be positive"
          }

      - name: Validate 8771 service-token contract
        working-directory: services/bonds_token_runtime
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Run Site Audit
        run: npm run audit

      - name: Generate and validate Tools Registry
        run: |
          npm run generate:tools
          git diff --exit-code
          npm run audit:tools

      - name: Run Open Graph Audit
        run: npm run audit:og

      - name: Run i18n Audit
        run: npm run audit:i18n

      - name: Run API Auth & Routing Audit
        run: npm run audit:api

      - name: Run Admin Architecture Contract Audit
        run: npm run audit:admin-contracts

      - name: Install Playwright Browser
        run: npx playwright install chromium

      - name: Verify feasibility PDF generation
        run: npm run verify:feasibility-pdf

      - name: Audit generated PDF references
        run: npm run audit:generated-pdfs

      - name: Start Local Dev Server
        run: npm run dev:local &

      - name: Wait for Server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3005 > /dev/null; then echo "Server ready"; exit 0; fi
            sleep 1
          done
          echo "Server did not start in time" && exit 1

      - name: Verify CRM browser workflow (isolated auth and database)
        run: node tests/crm/browser-acceptance.js

      - name: Run Assistant End-to-End CI Journeys
        run: npm run test:assistant:e2e-ci

      - name: Run Unit and Integration Tests
        run: npm test

      - name: Verify correspondence successor trigger on disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --name bonds-correspondence-test-pg -e POSTGRES_PASSWORD=isolated-fixture -d postgres:17-alpine
          trap 'docker rm -f bonds-correspondence-test-pg >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if docker exec bonds-correspondence-test-pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          # The image's temporary initialization server accepts Unix sockets
          # and then stops. Require the final TCP server before running SQL.
          connected=0
          for attempt in $(seq 1 30); do
            if docker exec -e PGPASSWORD=isolated-fixture -i bonds-correspondence-test-pg psql -h 127.0.0.1 -U postgres -c 'select 1' >/dev/null 2>&1; then connected=1; break; fi
            sleep 1
          done
          test "$connected" -eq 1
          docker exec -e PGPASSWORD=isolated-fixture -i bonds-correspondence-test-pg psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f - < tests/security/correspondence-ledger-bootstrap.pg.sql
          docker exec -e PGPASSWORD=isolated-fixture -i bonds-correspondence-test-pg psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f - < supabase/migrations/20261115030000_correspondence_atomic_successor_activation.sql
          docker exec -e PGPASSWORD=isolated-fixture -i bonds-correspondence-test-pg psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f - < tests/security/correspondence-ledger-acceptance.pg.sql


      - name: Run Accessibility Tests
        run: npm run test:a11y

      - name: Run Mobile Interaction Tests
        run: npm run test:mobile

      - name: Determine visual regression scope from PR base
        id: visual-scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          echo "scope=full" >> "$GITHUB_OUTPUT"
          # The original Nov 15 screenshots remain immutable. The approved
          # Nov 20 mobile redesign is pinned to an immutable, production-smoke-
          # verified commit, not to HEAD and not to a freshly generated image.
          # This prevents every main push from comparing the redesigned home
          # against the legacy mobile reference while still detecting new drift.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            BASE_SHA="b40ec0e9bdeb1464cffc319d8647ff6d4702b1c7"
            # Checkout defaults to a shallow clone. Fetch complete ancestry
            # before verification; the pinned reference is hundreds of commits
            # behind main, so a bounded depth can incorrectly fail this gate.
            git fetch --no-tags --unshallow origin main "$BASE_SHA"
            if ! git merge-base --is-ancestor "$BASE_SHA" HEAD; then
              echo "Pinned homepage reference is not an ancestor; full visual gate required"
              exit 0
            fi
            # Compare the complete current UI against the immutable approved
            # homepage redesign commit, not the obsolete November 15 mobile
            # screenshot. Other page screenshots retain their original gates.
            # A genuine homepage pixel regression still fails this comparison.
            echo "reference-sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "scope=base-compare" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "reference-sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then exit 0; fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD > /tmp/bonds-pr-changed-files.txt
          cat /tmp/bonds-pr-changed-files.txt
          while IFS= read -r file; do
            echo "VISUAL_SCOPE_CLASSIFY: $file"
            case "$file" in
              components/service-request.js|lib/api/document-parser-core.js|tests/security/document-parser-pdf-process.test.js|tests/security/document-parser-containment.test.js|lib/finance/three-statement-consistency.js|tests/finance/three-statement-consistency.test.js|.github/workflows/financial-analysis-acceptance.yml|components/feasibility-report.js|components/financial-analysis-report.js|components/financial-analysis-lab.js|lib/finance/financial-analysis-lab.js|tests/finance/financial-analysis-lab.test.js|tests/v3/financial-analysis-lab-browser.test.js|lib/finance/financial-data-intake.js|lib/finance/engines/financial-analysis-engine.js|tests/finance/financial-analysis-end-to-end.test.js|tests/finance/financial-engine-registry.test.js|tests/finance/financial-analysis-derivation-gate.test.js|tests/finance/financial-analysis-institutional-evidence.test.js|tests/finance/financial-analysis-multiperiod-intake.test.js|tests/finance/feasibility-institutional-report.test.js|components/service-workspace.css|my-bonds/workspace/index.html|en/my-bonds/workspace/index.html|service-request.html|en/service-request.html|lib/finance/engines/feasibility-engine.js|lib/finance/feasibility-input-validator.js|lib/finance/feasibility-artifact-gate.js|tests/finance/feasibility-artifact-gate.test.js|lib/intent/intent-engine.js|tests/intent/intent-engine.test.js|lib/semantic/profiles.json|tests/orchestrator/trade-sector-acceptance.test.js|lib/services/studies-workspace-bindings.js|tests/v3/studies-research-preservation.test.js|lib/finance/shared/math.js|lib/orchestrator/intelligence-orchestrator.js|lib/orchestrator/ucp-bridge.js|tests/finance/feasibility-input-validator.test.js|tests/orchestrator/ucp-bridge.test.js|tests/v3/feasibility-integrity-gate.test.js|tests/v3/feasibility-workspace-browser.test.js|tests/v3/service-artifact-persistence-contract.test.js|tests/v3/service-request-readback-contract.test.js|tests/v3/service-request-success-destination.test.js|tests/v3/service-workspace-continuity.test.js|tests/v3/service-workspace-routing.test.js|v3/api/services.js|lib/capabilities/runtime-adapters.js|tests/capabilities/user-governed-execution.test.js|tests/v3/feasibility-orchestrator-response-envelope.test.js|tests/assistant/assistant-production-smoke.test.js) ;;
              components/correspondence-workspace-ui.css|components/correspondence-workspace-ui.js|tests/letterhead/correspondence-institutional-ui.test.js|tests/letterhead/correspondence-institutional-ui.browser.test.js|lib/api/correspondence-tenant-dispatch.js|tests/security/correspondence-tenant-dispatch.test.js|docs/correspondence-institutional-delivery-matrix-20261127.md|lib/api/institutional-directory.js|tests/security/institutional-directory-isolation.test.js|institutional-directory.html|en/institutional-directory.html|components/institutional-directory-ui.js|tests/security/institutional-directory-ui.test.js|components/institutional-directory-import.js|tests/security/institutional-directory-import.test.js|tests/security/institutional-directory-workspace-actions.test.js|assets/institutional-directory-import-template.csv)
                # Correspondence-only assets, security test and scope report are not homepage assets.
                # Existing paths are normal in follow-up fixes: compare real PR-base
                # homepage pixels instead of obsolete pre-redesign mobile snapshots.
                # Keep all unit, browser, mobile, audit and security checks active.
                test -s "$file" || exit 0
                ;;
              letterhead.html)
                # Exact correspondence navigation cache-bust only. The homepage
                # and all other letterhead bytes remain unchanged against base.
                git show "$BASE_SHA:letterhead.html" > /tmp/bonds-base-letterhead.html
                node <<'NODE'
          const fs=require('node:fs');
          const base=fs.readFileSync('/tmp/bonds-base-letterhead.html','utf8');
          const head=fs.readFileSync('letterhead.html','utf8');
          const oldJs='/components/correspondence-workspace-ui.js?v=2';
          const newJs='/components/correspondence-workspace-ui.js?v=3';
          if(base.split(oldJs).length!==2||head.split(newJs).length!==2)process.exit(1);
          if(head.replace(newJs,oldJs)!==base)process.exit(1);
          NODE
                ;;
              site-layout.js)
                # Permit ONLY the reviewed collapsed company-menu HR link.
                # The full homepage still runs pixel comparison against the
                # exact current PR base; no baseline changes or bypasses.
                git show "$BASE_SHA:site-layout.js" > /tmp/bonds-base-site-layout.js
                expected="      { label: isEn ? 'Human Resources System' : 'نظام الموارد البشرية', href: isEn ? '/en/my-bonds/crm/?program=hr' : '/my-bonds/crm/?program=hr' },"
                test "$(grep -Fxc "$expected" site-layout.js)" -eq 1
                grep -Fvx "$expected" site-layout.js > /tmp/bonds-head-site-layout-without-hr.js
                cmp -s /tmp/bonds-base-site-layout.js /tmp/bonds-head-site-layout-without-hr.js || exit 0
                ;;
              .github/workflows/apply-migrations.yml|scripts/reconcile-production-migrations.js|scripts/apply-production-migration-api.js|tests/db/production-migration-reconciliation.test.cjs|tests/db/production-migration-api-runner.test.cjs|.github/workflows/hr-isolated-acceptance.yml|.github/workflows/hr-production-connection-gate.yml|api/payments.js|api/platform.js|calculators/auth/index.html|docs/hr-delivery-matrix-20261121.md|en/my-bonds/crm/*|jest.config.js|lib/api/company-programs.js|lib/api/hr-calculations.js|lib/hr/*|my-bonds/crm/*|supabase/migrations/20261117040000_standalone_hr_saas_baseline.sql|supabase/migrations/20261117060000_hr_saas_attendance_leaves.sql|supabase/migrations/20261117070000_hr_saas_payroll_review.sql|supabase/migrations/20261117080000_hr_saas_employment_contracts.sql|supabase/migrations/20261117090000_hr_saas_entitlements.sql|supabase/migrations/20261117100000_hr_saas_leave_ledger.sql|supabase/migrations/20261117110000_hr_saas_roles_self_service.sql|supabase/migrations/20261118010000_hr_link_existing_company_workspaces.sql|supabase/migrations/20261121190000_hr_org_attendance_leave_workflows.sql|supabase/migrations/20261125190000_hr_company_profiles.sql|supabase/migrations/20261126010000_hr_production_calculation_draft_policy_integrity.sql|supabase/migrations/20261126082000_hr_branding_storage_owner_rls_fix.sql|tests/admin/company-programs-standalone-hr.test.js|tests/admin/crm-unified-shell.test.js|tests/auth-callback-bootstrap.test.js|tests/hr/*)
                # Non-home HR implementation; still execute all code, auth,
                # RLS, mobile and actual PR-base homepage pixel checks.
                ;;
              lib/api/rate-limit.js|lib/api/rate-limit-distributed.js|scripts/post-deploy-smoke.js|scripts/assistant-production-smoke.js|tests/api/rate-limit-distributed.test.js|tests/api/rate-limit-retry-after.test.js|tests/assistant/assistant-production-smoke.test.js|components/service-discovery.js|en/v3/city-intelligence.html|en/v3/project/index.html|index.html|site-layout.js|styles/bonds-redesign-2026.css|tests/assistant/assistant-ui-interaction.test.js|v3/city-intelligence.html|v3/components/ai-chat-widget.js|v3/investment-map.html|v3/project/index.html|my-bonds/crm/*|en/my-bonds/crm/*|tests/crm/*|tests/admin/crm-client-workspace.test.js|bonds-auth-2026.js|calculators/auth/auth-shared.css|calculators/auth/index.html|en/calculators/auth/index.html|supabase/migrations/20261115193300_crm_multiple_owner_workspaces.sql|tests/visual/visual-tests.js|tests/visual/auth-login-acceptance.js|.github/workflows/auth-ui-acceptance.yml|assets/bonds-mark-transparent.svg|tests/auth/mobile-onboarding-session.acceptance.cjs|.github/workflows/mobile-onboarding-session.yml|calculators/auth/onboarding.html|en/calculators/auth/onboarding.html) ;;
              components/letterhead-correspondence.js|lib/api/correspondence.js|tests/security/correspondence-artifact-immutability.test.js|tests/security/correspondence-classified-pdf.test.js|tests/security/correspondence-owner-surface-gate.test.js)
                # Current main added these correspondence files after this PR base.
                # Accept only exact, unchanged main copies in GitHub's synthetic merge.
                if git cat-file -e "$BASE_SHA:$file" 2>/dev/null; then exit 0; fi
                git fetch --no-tags --depth=1 origin main
                git show "FETCH_HEAD:$file" > /tmp/bonds-main-correspondence-file || exit 0
                git show "HEAD:$file" > /tmp/bonds-merge-correspondence-file || exit 0
                cmp -s /tmp/bonds-main-correspondence-file /tmp/bonds-merge-correspondence-file || exit 0
                ;;
              .github/workflows/bonds-backup-freshness-watchdog.yml)
                # Non-visual schedule-only change: require exact PR-base parity.
                # Any other change falls back to the full visual snapshot gate.
                git show "$BASE_SHA:$file" > /tmp/bonds-base-watchdog-workflow.yml || exit 0
                python3 - <<'PY' || exit 0
          from pathlib import Path
          base = Path('/tmp/bonds-base-watchdog-workflow.yml').read_text()
          head = Path('.github/workflows/bonds-backup-freshness-watchdog.yml').read_text()
          old = "# Every 3 hours at minute 15 UTC; does not start production backups.\n    - cron: '15 0,3,6,9,12,15,18,21 * * *'"
          new = "# Every 3 hours at minute 35 UTC; gives the 00:07 UTC daily backup time to finish.\n    - cron: '35 0,3,6,9,12,15,18,21 * * *'"
          if base.count(old) != 1 or head != base.replace(old, new):
              raise SystemExit(1)
          PY
                ;;
              .github/workflows/bonds-backup-freshness-watchdog.yml)
                # Only the exact reviewed schedule-proof block is non-visual.
                # Any further changes retain the existing full visual gate.
                git show "$BASE_SHA:$file" > /tmp/bonds-base-watchdog.yml || exit 0
                python3 - <<'PY' || exit 0
          from pathlib import Path
          base = Path('/tmp/bonds-base-watchdog.yml').read_text()
          head = Path('.github/workflows/bonds-backup-freshness-watchdog.yml').read_text()
          marker = "          artifact_name=\"bonds-production-encrypted-backup-$run_id\""
          addition = "          # Independently prove that a scheduled, successful backup exists.\n          # Manual successes remain valid for emergency recovery but must never\n          # conceal a broken daily GitHub schedule.\n          scheduled=\"$(gh api -X GET \"repos/$GH_REPO/actions/workflows/$workflow/runs?branch=main&event=schedule&status=success&per_page=1\")\"\n          scheduled_id=\"$(jq -r '.workflow_runs[0].id // empty' <<< \"$scheduled\")\"\n          scheduled_completed=\"$(jq -r '.workflow_runs[0].updated_at // empty' <<< \"$scheduled\")\"\n          if [[ -z \"$scheduled_id\" || -z \"$scheduled_completed\" ]]; then\n            # The first post-rollout scheduled backup is due 2026-11-28 00:07 UTC.\n            # Give GitHub scheduling and the isolated restore a two-hour grace.\n            # Before that instant, report PENDING rather than a false failure.\n            first_due_epoch=\"$(date -u -d '2026-11-28T02:07:00Z' +%s)\"\n            if (( now < first_due_epoch )); then\n              echo \"PENDING: first post-rollout scheduled backup not yet due (grace through 2026-11-28T02:07Z).\"\n            else\n              open_alert \"[BONDS Backup Watchdog] No successful scheduled backup\" \\\n                \"No successful event=schedule backup was recorded by the initial grace deadline. A manual backup does not satisfy the daily schedule gate. Check $source_url and tracking issue #1273.\"\n            fi\n          else\n            scheduled_epoch=\"$(date -u -d \"$scheduled_completed\" +%s)\"\n            scheduled_age=\"$((now - scheduled_epoch))\"\n            if (( scheduled_age < 0 )); then\n              echo \"FAIL: scheduled backup completion timestamp is in the future\"\n              exit 1\n            fi\n            if (( scheduled_age > max_age_seconds )); then\n              open_alert \"[BONDS Backup Watchdog] Scheduled backup overdue\" \\\n                \"Latest successful scheduled backup is older than 26h: run $scheduled_id, completed $scheduled_completed UTC. Manual successes do not resolve schedule freshness.\"\n            else\n              echo \"PASS: successful event=schedule backup $scheduled_id is within 26h.\"\n            fi\n          fi\n\n"
          if base.count(marker) != 1 or head != base.replace(marker, addition + marker):
              raise SystemExit(1)
          PY
                ;;
              .github/workflows/bonds-production-backup-restore.yml)
                # Cron-only change accepted only if all other bytes match PR base.
                # Retain the previously approved retention-only path below.
                git show "$BASE_SHA:$file" > /tmp/bonds-base-backup-cron.yml || exit 0
                if python3 - <<'PY'
          from pathlib import Path
          base = Path('/tmp/bonds-base-backup-cron.yml').read_text()
          head = Path('.github/workflows/bonds-production-backup-restore.yml').read_text()
          old = "# Every day 03:00 Asia/Riyadh = 00:00 UTC (Saudi Arabia observes no DST).\n    - cron: '0 0 * * *'"
          new = "# Every day 03:07 Asia/Riyadh = 00:07 UTC (Saudi Arabia observes no DST).\n    - cron: '7 0 * * *'"
          if base.count(old) != 1 or head != base.replace(old, new):
              raise SystemExit(1)
          PY
                then
                  continue
                fi
                # GitHub tests a synthetic merge commit that contains files
                # added to main after the PR branch diverged. This workflow
                # may be treated as main-only only when absent at the PR base
                # and byte-identical to the current main version.
                if git cat-file -e "$BASE_SHA:$file" 2>/dev/null; then
                  # Accept only one reviewed retention adjustment; compare
                  # all other workflow bytes with the exact PR base.
                  git show "$BASE_SHA:$file" > /tmp/bonds-base-backup-workflow.yml
                  test "$(grep -Fxc '          retention-days: 1' /tmp/bonds-base-backup-workflow.yml)" -eq 1 || exit 0
                  test "$(grep -Fxc '          retention-days: 30' "$file")" -eq 1 || exit 0
                  sed 's/retention-days: 30/retention-days: 1/' "$file" > /tmp/bonds-normalized-backup-workflow.yml
                  cmp -s /tmp/bonds-base-backup-workflow.yml /tmp/bonds-normalized-backup-workflow.yml || exit 0
                else
                  git fetch --no-tags --depth=1 origin main
                  git show "FETCH_HEAD:$file" > /tmp/bonds-current-main-workflow.yml || exit 0
                  git show "HEAD:$file" > /tmp/bonds-merge-workflow.yml || exit 0
                  cmp -s /tmp/bonds-current-main-workflow.yml /tmp/bonds-merge-workflow.yml || exit 0
                fi
                # The homepage still receives a real PR-base pixel comparison.
                ;;
              admin/commercial-systems.html)
                # Owner-only admin UX cannot alter homepage render; preserve
                # both permission guard and existing CRM endpoint.
                grep -Fq 'BondsAuth.initAdminGuard()' "$file" || exit 0
                grep -Fq "/api/admin?action=crm-overview" "$file" || exit 0
                grep -Fq "/api/admin?action=hr-overview" "$file" || exit 0
                ;;
              api/admin.js)
                # This PR adds aggregate-only HR observer route. Any additional
                # API edits force the full screenshot gate, not an exemption.
                git show "$BASE_SHA:$file" > /tmp/bonds-base-admin-api.js
                node <<'NODE' || exit 0
          const fs=require('node:fs');
          const before=fs.readFileSync('/tmp/bonds-base-admin-api.js','utf8');
          const after=fs.readFileSync('api/admin.js','utf8');
          const begin='// Platform-operator HR telemetry:';
          const end='async function getCrmOverview(sb) {';
          const a=after.indexOf(begin),b=after.indexOf(end,a);
          if(a<0||b<=a)process.exit(1);
          const helper=after.slice(a,b);
          if(!helper.includes("head: true")||!helper.includes("count: 'exact'")||!helper.includes("counts[key]"))process.exit(1);
          const route=["      if (action === 'hr-overview') {","        await requireAdminPermission(req, sb, 'observability.read');","        return res.status(200).json(await getHrAdminOverview(sb));","      }"].join('\n')+'\n';
          if(after.split(route).length!==2)process.exit(1);
          if(after.replace(helper,'').replace(route,'')!==before)process.exit(1);
          NODE
                ;;
              tests/admin/hr-owner-aggregate-overview.test.js|tests/admin/dashboard-correspondence-workspace-link.test.js)
                # Test-only non-home source; the unit suite runs the link contract.
                ;;
              admin/dashboard.html)
                # Permit exactly one reviewed sidebar entry; every other byte
                # of the owner's existing dashboard must match the PR base.
                git show "$BASE_SHA:$file" > /tmp/bonds-base-owner-dashboard.html
                node <<'NODE'
          const fs=require('node:fs');
          const base=fs.readFileSync('/tmp/bonds-base-owner-dashboard.html','utf8');
          const head=fs.readFileSync('admin/dashboard.html','utf8');
          const added=[
          '        <div class="nav-label">الأنظمة التجارية</div>',
          '        <button class="sidebar-link" data-target="/admin/commercial-systems.html?embed=1" data-title="مراقبة HR وCRM">',
          '          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 12h4l2-4 3 8 2-4"/></svg>',
          '          <span>مراقبة HR وCRM</span>',
          '        </button>',
          ].join('\n')+'\n';
          // Allow one precisely specified correspondence shortcut; no unrelated dashboard bytes.
          const correspondence=[
          '        <a class="sidebar-link" href="/letterhead.html?workspace=correspondence&amp;return_to=%2Fadmin%2Fdashboard.html" target="_blank" rel="noopener noreferrer" title="فتح مساحة المراسلات الحالية لإنشاء الخطابات ومراجعتها وإصدارها">',
          '          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
          '          <span>مساحة المراسلات</span>',
          '        </a>',
          ].join('\n')+'\n';
          const exactExisting=head.split(added).length===2 && head.replace(added,'')===base;
          const exactCorrespondence=head.split(correspondence).length===2 && head.replace(correspondence,'')===base;
          // Accept only these exact two source insertions on an otherwise identical dashboard.
          const savedShortcut="        // Preserve the existing correspondence workspace link before removing legacy groups.\n        const correspondenceLink = sidebar.querySelector('a.sidebar-link[href^=\"/letterhead.html?workspace=correspondence\"]');\n";
          const restoredShortcut="        // Place the retained workspace shortcut alongside the correspondence verification register.\n        const businessGroup = sidebar.querySelector('[data-ia-group=\"العملاء والأعمال\"]');\n        if (correspondenceLink && businessGroup) businessGroup.appendChild(correspondenceLink);\n";
          const exactSidebarFix=head.split(savedShortcut).length===2
            && head.split(restoredShortcut).length===2
            && head.replace(savedShortcut,'').replace(restoredShortcut,'')===base;
          if(!exactExisting && !exactCorrespondence && !exactSidebarFix)process.exit(1);
          NODE
                ;;
              tests/v3/revert-service-request-context.test.js)
                # This file is exclusively a Node/Jest assertion suite;
                # changes cannot alter rendered homepage assets. The full
                # code/tenant contract suite still runs above. Retain actual
                # pixel comparison against the immutable PR base, not old
                # mobile snapshots that predate the approved redesign.
                ;;
              .github/workflows/ci.yml)
                # This PR adjusts only the visual-scope classifier; enforce
                # byte-for-byte parity for every OTHER CI workflow section.
                # A changed build, test, or release step still requires full.
                git show "$BASE_SHA:$file" | sed '/^      - name: Determine visual regression scope from PR base$/,/^      - name: Prepare exact PR-base homepage visual reference$/c\VISUAL_SCOPE_CLASSIFIER' > /tmp/bonds-base-ci-other-steps.yml
                sed '/^      - name: Determine visual regression scope from PR base$/,/^      - name: Prepare exact PR-base homepage visual reference$/c\VISUAL_SCOPE_CLASSIFIER' "$file" > /tmp/bonds-head-ci-other-steps.yml
                cmp -s /tmp/bonds-base-ci-other-steps.yml /tmp/bonds-head-ci-other-steps.yml || exit 0
                ;;
              vercel.json)
                # Allow exactly two new route mappings to the existing platform
                # handler, with every other config byte identical to the PR base.
                git show "$BASE_SHA:vercel.json" > /tmp/bonds-base-vercel.json
                node <<'NODE' || exit 0
          const fs=require('node:fs');
          const base=fs.readFileSync('/tmp/bonds-base-vercel.json','utf8');
          const head=fs.readFileSync('vercel.json','utf8');
          const block='    {\n      "source": "/api/institutional-directory",\n      "destination": "/api/platform"\n    },\n    {\n      "source": "/api/institutional-directory/",\n      "destination": "/api/platform"\n    },\n';
          if(head.split(block).length!==2)process.exit(1);
          if(head.replace(block,'')!==base)process.exit(1);
          NODE
                ;;
              sw.js)
                # The feasibility workspace can bump its service-request URL
                # and the SW cache together without changing homepage assets.
                # Compare all remaining bytes exactly: any other SW edit
                # continues to require the full visual screenshot gate.
                git show "$BASE_SHA:sw.js" > /tmp/bonds-base-sw.js
                grep -Eq "^const CACHE_VERSION = 'v[0-9]+[.][0-9]+[.][0-9]+';" sw.js || exit 0
                sed -E -e '/^const CACHE_VERSION = /d' -e 's@/components/service-request[.]js[?]v=[0-9]+@/components/service-request.js?v=NORMALIZED@g' /tmp/bonds-base-sw.js > /tmp/bonds-base-sw-stable.js
                sed -E -e '/^const CACHE_VERSION = /d' -e 's@/components/service-request[.]js[?]v=[0-9]+@/components/service-request.js?v=NORMALIZED@g' sw.js > /tmp/bonds-head-sw-stable.js
                # Permit exactly one new, source-controlled report asset; compare every other byte.
                test "$(grep -Fxc "  '/components/feasibility-report.js?v=1'," sw.js)" -eq 1 || exit 0
                grep -Fvx "  '/components/feasibility-report.js?v=1'," /tmp/bonds-base-sw-stable.js > /tmp/bonds-base-sw-stable-without-report.js
                grep -Fvx "  '/components/feasibility-report.js?v=1'," /tmp/bonds-head-sw-stable.js > /tmp/bonds-head-sw-stable-without-report.js
                cmp -s /tmp/bonds-base-sw-stable-without-report.js /tmp/bonds-head-sw-stable-without-report.js || exit 0
                ;;
              *) exit 0 ;;
            esac
          done < /tmp/bonds-pr-changed-files.txt
          echo "scope=base-compare" >> "$GITHUB_OUTPUT"

      - name: Prepare exact PR-base homepage visual reference
        if: steps.visual-scope.outputs.scope == 'base-compare'
        shell: bash
        env:
          BASE_SHA: ${{ steps.visual-scope.outputs.reference-sha }}
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/bonds-ui-base" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/bonds-ui-base/node_modules"
          (cd "$RUNNER_TEMP/bonds-ui-base" && PORT=3006 node scripts/dev-server.js > "$RUNNER_TEMP/bonds-ui-base.log" 2>&1 &)
          ready=0
          for i in {1..30}; do
            if curl -fsS http://localhost:3006/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then cat "$RUNNER_TEMP/bonds-ui-base.log"; exit 1; fi

      - name: Run Visual Regression Tests
        env:
          BONDS_VISUAL_SCOPE: ${{ steps.visual-scope.outputs.scope }}
          BONDS_HOME_BASE_URL: http://localhost:3006
        run: npm run test:visual

      - name: Validate service manifests and token policies
        run: npm run services:check

      - name: Upload Visual Artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-diffs
          path: |
            tests/visual/diffs/
            tests/visual/snapshots/
          if-no-files-found: ignore
          retention-days: 1

  token-runtime-windows-acceptance:
    name: Token Runtime Windows service acceptance (isolated)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      BONDS_TOKEN_WINDOWS_ISOLATED_ACCEPTANCE: '1'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python for the isolated service
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install Windows service dependency on the disposable runner
        run: |
          python -m pip install pywin32==312
          if ($LASTEXITCODE -ne 0) { throw "pywin32 installation failed" }
          # The pinned wheel contains two script copies and one canonical entry point.
          python -c "import importlib.metadata as m, sys; entries = [p for p in m.distribution('pywin32').entry_points if p.group == 'console_scripts' and p.name == 'pywin32_postinstall']; assert len(entries) == 1, 'Installed pywin32 postinstall entry point is missing or ambiguous'; print('Running pywin32 postinstall entry point:', entries[0].value); sys.argv = ['pywin32_postinstall', '-install']; sys.exit(entries[0].load()())"
          if ($LASTEXITCODE -ne 0) { throw "pywin32 service registration prerequisites failed" }

      - name: Verify SCM restart, revocation persistence and failed rollout recovery
        run: ./services/bonds_token_runtime/tests/test_windows_service_lifecycle.ps1

      - name: Report isolated acceptance evidence
        if: always()
        run: |
          $report = Join-Path $env:RUNNER_TEMP "bonds-windows-token-lifecycle-acceptance.json"
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) { throw "Windows acceptance report is missing" }
          Get-Content -LiteralPath $report -Raw

      - name: Upload sanitized isolated acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: token-runtime-windows-acceptance
          path: ${{ runner.temp }}/bonds-windows-token-lifecycle-acceptance.json
          if-no-files-found: error
          retention-days: 14
