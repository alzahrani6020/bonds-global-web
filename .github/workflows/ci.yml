name: CI — Tests, Audit & Visual Regression

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run Unit Tests
        run: npm test

      - name: Run Site Audit
        run: npm run audit

      - name: Run Open Graph Audit
        run: npm run audit:og

      - name: Start Local Dev Server
        run: npm run dev:local &

      - name: Wait for Server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3005 > /dev/null; then echo "Server ready"; exit 0; fi
            sleep 1
          done
          echo "Server did not start in time" && exit 1

      - name: Run Accessibility Tests
        run: npm run test:a11y

      - name: Run Mobile Interaction Tests
        run: npm run test:mobile

      - name: Run Visual Regression Tests
        run: npm run test:visual

      - name: Upload Visual Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/diffs/
