name: Dependency Security Triage

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependency graph
        run: npm install --ignore-scripts --no-audit

      - name: Production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('audit-prod.json', 'utf8'));
          console.log('PRODUCTION_AUDIT_METADATA ' + JSON.stringify(a.metadata || {}));
          for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
            console.log('PROD_VULN ' + JSON.stringify({
              name,
              severity: v.severity,
              isDirect: v.isDirect,
              range: v.range,
              via: (v.via || []).map(x => typeof x === 'string' ? x : {
                source: x.source,
                name: x.name,
                dependency: x.dependency,
                title: x.title,
                url: x.url,
                severity: x.severity,
                range: x.range
              }),
              effects: v.effects,
              nodes: v.nodes,
              fixAvailable: v.fixAvailable
            }));
          }
          NODE

      - name: Full dependency audit
        shell: bash
        run: |
          npm audit --json > audit-all.json || true
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('audit-all.json', 'utf8'));
          console.log('FULL_AUDIT_METADATA ' + JSON.stringify(a.metadata || {}));
          for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
            console.log('ALL_VULN ' + JSON.stringify({
              name,
              severity: v.severity,
              isDirect: v.isDirect,
              range: v.range,
              via: (v.via || []).map(x => typeof x === 'string' ? x : {
                source: x.source,
                name: x.name,
                dependency: x.dependency,
                title: x.title,
                url: x.url,
                severity: x.severity,
                range: x.range
              }),
              effects: v.effects,
              nodes: v.nodes,
              fixAvailable: v.fixAvailable
            }));
          }
          NODE
