name: Check Cloudflare Secret Availability

on:
  push:
    branches:
      - "ops/check-cloudflare-secret"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_SECRET_AVAILABLE"
          else
            echo "CLOUDFLARE_SECRET_MISSING"
            exit 2
          fi
