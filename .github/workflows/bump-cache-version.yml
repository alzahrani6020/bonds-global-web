name: Verify Service Worker Cache Version

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-cache-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify CACHE_VERSION is updated with core assets
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: node scripts/bump-cache-version.js --check
