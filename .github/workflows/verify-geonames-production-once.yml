name: Verify GeoNames production markers

on:
  push:
    branches:
      - ops/verify-geonames-production-20261021
    paths:
      - .github/workflows/verify-geonames-production-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/verify-geonames-production-20261021
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify public APIs and map markers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-geo
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const base = 'https://bonds-global.com';
          const report = { api:{}, page_probes:[], browser:null };

          async function fetchCountry(cc) {
            const res = await fetch(base + '/api/v3/cities?country=' + cc + '&limit=2000', {
              headers: { accept:'application/json' }
            });
            const text = await res.text();
            let body;
            try { body = JSON.parse(text); } catch { body = null; }
            if (!res.ok || !body) throw new Error('API ' + cc + ' HTTP ' + res.status + ' body=' + text.slice(0,160));
            const cities = Array.isArray(body.cities) ? body.cities : [];
            const withCoords = cities.filter(c => Number.isFinite(Number(c.lat)) && Number.isFinite(Number(c.lng)));
            return {
              http_status:res.status,total:cities.length,with_coords:withCoords.length,
              sample:withCoords.slice(0,5).map(c=>({code:c.code,name_ar:c.name_ar,name_en:c.name_en,lat:c.lat,lng:c.lng}))
            };
          }

          async function probe(url) {
            const res = await fetch(url, { redirect:'follow' });
            const body = await res.text();
            const row = {
              requested:url,status:res.status,final_url:res.url,
              content_type:res.headers.get('content-type'),
              has_map_id:/id=["']map["']/.test(body),
              has_render_markers:/function\s+renderMarkers\s*\(/.test(body),
              title:(body.match(/<title>([^<]*)<\/title>/i)||[])[1]||null,
              body_prefix:body.slice(0,220).replace(/\s+/g,' ')
            };
            report.page_probes.push(row);
            return { row, body };
          }

          (async () => {
            for (const cc of ['SA','EG','AE','JO','TN']) report.api[cc]=await fetchCountry(cc);
            fs.writeFileSync('.tmp-geo/api-verification.json',JSON.stringify(report.api,null,2));
            console.log('API_REPORT='+JSON.stringify(report.api));

            if (report.api.SA.with_coords<1 || report.api.EG.with_coords<1 || report.api.AE.with_coords<1) {
              throw new Error('Expected coordinate coverage missing from primary countries');
            }

            let chosen=null;
            for (const path of ['/v3/investment-map','/v3/investment-map.html']) {
              const p=await probe(base+path);
              if (!chosen && p.row.status<400 && p.row.has_map_id) chosen=p.row.final_url;
            }
            fs.writeFileSync('.tmp-geo/page-probes.json',JSON.stringify(report.page_probes,null,2));
            console.log('PAGE_PROBES='+JSON.stringify(report.page_probes));

            if (!chosen) throw new Error('Production investment map HTML is not being served');

            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const consoleErrors=[];
            page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            page.on('pageerror',e=>consoleErrors.push(String(e.message||e)));
            const response=await page.goto(chosen,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#map',{state:'attached',timeout:30000});
            await page.waitForFunction(()=>document.querySelectorAll('.leaflet-marker-icon').length>0,{timeout:60000});

            const sa=await page.evaluate(()=>({
              selected_country:document.getElementById('countrySelect')?.value||null,
              marker_count:document.querySelectorAll('.leaflet-marker-icon').length,
              status:document.getElementById('status')?.textContent?.trim()||''
            }));
            await page.screenshot({path:'.tmp-geo/investment-map-sa.png',fullPage:true});

            await page.evaluate(()=>{
              const el=document.getElementById('countrySelect');
              el.value='EG';
              el.dispatchEvent(new Event('change',{bubbles:true}));
            });
            await page.waitForTimeout(4000);
            await page.waitForFunction(()=>document.getElementById('countrySelect')?.value==='EG' && document.querySelectorAll('.leaflet-marker-icon').length>0,{timeout:60000});
            const eg=await page.evaluate(()=>({
              selected_country:document.getElementById('countrySelect')?.value||null,
              marker_count:document.querySelectorAll('.leaflet-marker-icon').length,
              status:document.getElementById('status')?.textContent?.trim()||''
            }));
            await page.screenshot({path:'.tmp-geo/investment-map-eg.png',fullPage:true});

            report.browser={url:page.url(),sa,eg,console_errors:consoleErrors.slice(0,20)};
            fs.writeFileSync('.tmp-geo/production-verification.json',JSON.stringify(report,null,2));
            console.log('FINAL_REPORT='+JSON.stringify(report));
            if(sa.marker_count<1 || eg.marker_count<1) throw new Error('Expected map markers missing');
            await browser.close();
          })().catch(err=>{
            fs.writeFileSync('.tmp-geo/production-verification.json',JSON.stringify({...report,error:String(err.message||err)},null,2));
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: geonames-production-verification-${{ github.run_id }}
          path: |
            .tmp-geo/production-verification.json
            .tmp-geo/api-verification.json
            .tmp-geo/page-probes.json
            .tmp-geo/investment-map-sa.png
            .tmp-geo/investment-map-eg.png
          if-no-files-found: warn
          retention-days: 30

# trigger verification
