name: Production Release Verification

# Production deployment is handled by Vercel Git Integration.
# Pushes/merges to main deploy automatically via vercel.json.
# This workflow remains available as a manual pre-release verification gate
# and intentionally requires no Vercel access token or project secrets.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref or exact commit SHA to verify'
        required: true
        default: 'main'
        type: string

concurrency:
  group: production-release-verification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: 'Verify release candidate'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout requested release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Record exact release SHA
        id: release
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Verifying exact commit: $sha"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browser
        run: npx playwright install chromium

      - name: Start Local Dev Server
        run: npm run dev:local &

      - name: Wait for Server
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -s http://localhost:3005 > /dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in time"
          exit 1

      - name: Release gate
        run: |
          npm run audit
          npm run audit:api
          npm test -- --runInBand

      - name: Release summary
        run: |
          echo "Verified commit: ${{ steps.release.outputs.sha }}"
          echo "Production deployment is handled automatically by Vercel Git Integration when main is updated."
