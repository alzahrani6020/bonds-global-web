name: Production Release

on:
  workflow_run:
    workflows:
      - 'CI — Tests, Audit & Visual Regression'
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref or exact commit SHA to stage'
        required: true
        default: 'main'
        type: string
      promote:
        description: 'Promote the staged deployment to Production'
        required: true
        default: false
        type: boolean

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_PROJECT_ID: prj_djffUO1KXbGKtumZBWsziWxqJ6Qk
  VERCEL_ORG_ID: team_ENxUZq5el15Zn8pi4ahZMXpz

jobs:
  release:
    name: Stage, verify and promote Production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Record exact release SHA
        id: release
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "Release candidate: $sha"

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            expected="${{ github.event.workflow_run.head_sha }}"
            [[ "$sha" == "$expected" ]] || {
              echo "Checked out SHA $sha does not match successful CI SHA $expected"
              exit 1
            }
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Manual release gate
        if: github.event_name == 'workflow_dispatch' && inputs.promote
        run: |
          npm run audit
          npm run audit:api
          npm run test:security:critical

      - name: Prepare Vercel project metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Production Vercel settings
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install vercel pull --yes --environment=production --scope dr-talal
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build Production output in GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.release.outputs.sha }}"
          BONDS_RELEASE_SHA="$sha" npx --no-install vercel build --prod
          test -f .vercel/output/config.json
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Stage prebuilt Production deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.release.outputs.sha }}"
          output="$(npx --no-install vercel deploy --prebuilt --prod --skip-domain --yes --env "BONDS_RELEASE_SHA=$sha" --meta "githubCommitSha=$sha")"
          printf '%s\n' "$output"

          deployment_url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)"
          DEPLOYMENT_URL="$deployment_url" node --input-type=module -e '
            const value = process.env.DEPLOYMENT_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || !url.hostname.endsWith(".vercel.app")) process.exit(1);
          '
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Smoke test staged deployment
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="${{ steps.deploy.outputs.url }}"
          health_json="$(npx --no-install vercel curl "$deployment_url/api/health" -H 'Cache-Control: no-cache')"

          HEALTH_JSON="$health_json" EXPECTED_VERSION="${{ steps.release.outputs.short_sha }}"             node --input-type=module -e '
              const body = JSON.parse(process.env.HEALTH_JSON);
              if (body.status !== "ok") throw new Error("Staged health status is not ok");
              if (body.version !== process.env.EXPECTED_VERSION) {
                throw new Error(`Staged SHA mismatch: expected ${process.env.EXPECTED_VERSION}, got ${body.version || "missing"}`);
              }
              if (body.environment !== "production") {
                throw new Error(`Expected production environment, got ${body.environment || "missing"}`);
              }
              console.log(`Staged health PASS (commit=${body.version})`);
            '

          readiness_json="$(npx --no-install vercel curl "$deployment_url/api/readiness" -H 'Cache-Control: no-cache')"
          READINESS_JSON="$readiness_json" EXPECTED_VERSION="${{ steps.release.outputs.short_sha }}" node --input-type=module -e '
            import { createRequire } from "node:module";
            const require = createRequire(import.meta.url);
            const contract = require("./services/bonds_token_runtime/contract.json");
            const body = JSON.parse(process.env.READINESS_JSON);
            const runtime = body.token_runtime;
            const failures = [];
            if (body.version !== process.env.EXPECTED_VERSION) failures.push("version");
            if (body.environment !== "production") failures.push("environment");
            if (body.status !== "ready") failures.push("status");
            if (body.checks?.supabase !== "ok") failures.push("supabase");
            if (body.checks?.user_governance !== "ok" || body.user_governance?.status !== "ok") failures.push("user_governance");
            if (body.checks?.assistant !== "ok" || body.assistant?.status !== "ok") failures.push("assistant");
            if (body.assistant?.schema_version !== 1) failures.push("assistant_schema");
            if (body.checks?.token_runtime !== "ok" || runtime?.required !== true || runtime?.status !== "ok") failures.push("token_runtime");
            if (runtime?.channel_auth !== "verified") failures.push("token_channel");
            if (runtime?.broker_auth !== "configured") failures.push("token_broker");
            if (runtime?.contract_version !== contract.contractVersion) failures.push("token_contract");
            if (runtime?.schema_version !== contract.schemaVersion) failures.push("token_schema");
            if (!/^[0-9a-f]{40}$/.test(runtime?.build_commit || "")) failures.push("token_build");
            if (failures.length) {
              console.error("Staged readiness failures:", failures.join(","));
              console.error("Staged readiness status:", JSON.stringify({
                status:body.status,
                checks:body.checks,
                token_runtime:{
                  status:runtime?.status || null,
                  code:runtime?.code || null,
                  probe_code:runtime?.probe_code || null,
                  probe_stage:runtime?.probe_stage || null,
                  channel_auth:runtime?.channel_auth || null,
                  broker_auth:runtime?.broker_auth || null,
                  contract_version:runtime?.contract_version || null,
                  schema_version:runtime?.schema_version || null,
                  build_commit_valid:/^[0-9a-f]{40}$/.test(runtime?.build_commit || "")
                },
                assistant:body.assistant,
                user_governance:body.user_governance
              }));
              throw new Error("Staged integrated readiness is unproved; production promotion is blocked.");
            }
            console.log(`Staged channel, broker configuration and runtime contract PASS (runtime=${runtime.build_commit}); capability token acceptance remains a separate production check.`);
          '

          layout_js="$(npx --no-install vercel curl "$deployment_url/site-layout.js?tools-smoke=${{ steps.release.outputs.sha }}" -H 'Cache-Control: no-cache')"
          printf '%s' "$layout_js" | grep -F "navId: 'tools'" >/dev/null || {
            echo "Staged site-layout.js is missing the stable tools navigation selector"
            exit 1
          }

          for path in \
            "/calculators/investment-center" \
            "/en/calculators/investment-center" \
            "/calculators/cash-flow" \
            "/en/calculators/cash-flow" \
            "/calculator-wizard" \
            "/en/calculator-wizard" \
            "/calculators/medical-viability" \
            "/en/calculators/medical-viability"; do
            body="$(npx --no-install vercel curl "$deployment_url$path" -H 'Cache-Control: no-cache')"
            printf '%s' "$body" | grep -F "<!DOCTYPE html>" >/dev/null || {
              echo "Staged tools route did not return the expected HTML document: $path"
              exit 1
            }
          done

          ar_catalog="$(npx --no-install vercel curl "$deployment_url/calculators/investment-center" -H 'Cache-Control: no-cache')"
          en_catalog="$(npx --no-install vercel curl "$deployment_url/en/calculators/investment-center" -H 'Cache-Control: no-cache')"
          printf '%s' "$ar_catalog" | grep -F "INVESTMENT-TOOLS-GENERATED:START" >/dev/null || {
            echo "Arabic staged investment catalog is missing generated tools marker"
            exit 1
          }
          printf '%s' "$en_catalog" | grep -F "INVESTMENT-TOOLS-GENERATED:START" >/dev/null || {
            echo "English staged investment catalog is missing generated tools marker"
            exit 1
          }
          echo "Staged tools navigation and critical routes PASS"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify release candidate is current main
        if: github.event_name == 'workflow_run' || inputs.promote
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          current_main="$(git rev-parse origin/main)"
          release_sha="${{ steps.release.outputs.sha }}"

          if [[ "$current_main" != "$release_sha" ]]; then
            current_tree="$(git rev-parse "$current_main^{tree}")"
            release_tree="$(git rev-parse "$release_sha^{tree}")"

            if [[ "$current_tree" != "$release_tree" ]]; then
              echo "Refusing to promote stale release candidate with a different Git tree."
              echo "Release candidate: $release_sha"
              echo "Release tree:      $release_tree"
              echo "Current main:      $current_main"
              echo "Current tree:      $current_tree"
              exit 1
            fi

            echo "Release SHA differs from current main, but the Git trees are identical."
            echo "Release candidate: $release_sha"
            echo "Current main:      $current_main"
            echo "Equivalent tree:   $release_tree"
          else
            echo "Release candidate is still current main: $release_sha"
          fi

      - name: Promote tested deployment
        id: promote
        if: github.event_name == 'workflow_run' || inputs.promote
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="${{ steps.deploy.outputs.url }}"
          deployment_host="${deployment_url#https://}"
          deployment_id="$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_ORG_ID" \
            | node --input-type=module -e '
                let data = "";
                for await (const chunk of process.stdin) data += chunk;
                const body = JSON.parse(data);
                if (!body.id) process.exit(1);
                process.stdout.write(body.id);
              ')"

          curl --silent --show-error --fail \
            --request POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$deployment_id?teamId=$VERCEL_ORG_ID" \
            --data '{}'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify Production SHA
        if: github.event_name == 'workflow_run' || inputs.promote
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.release.outputs.short_sha }}"

          for attempt in {1..60}; do
            health_json="$(curl --silent --show-error --fail               -H 'Cache-Control: no-cache'               "https://bonds-global.com/api/health?release=${{ steps.release.outputs.sha }}" || true)"

            if HEALTH_JSON="$health_json" EXPECTED_VERSION="$expected" node --input-type=module -e '
              try {
                const body = JSON.parse(process.env.HEALTH_JSON || "{}");
                process.exit(body.status === "ok" && body.version === process.env.EXPECTED_VERSION ? 0 : 1);
              } catch {
                process.exit(1);
              }
            '; then
              echo "Production SHA verified: $expected"
              exit 0
            fi

            sleep 5
          done

          echo "Production did not converge to expected SHA $expected"
          exit 1

      - name: Verify webhook method guard
        if: github.event_name == 'workflow_run' || inputs.promote
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error             --output /tmp/email-webhook-response             --write-out '%{http_code}'             https://bonds-global.com/api/email-webhook)"
          if [[ "$status" != "405" ]]; then
            echo "Expected GET /api/email-webhook to return 405, got $status"
            cat /tmp/email-webhook-response || true
            exit 1
          fi
          echo "Webhook method guard PASS"

      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production Release"
            echo "- Commit: \`${{ steps.release.outputs.sha }}\`"
            echo "- Staged deployment: ${{ steps.deploy.outputs.url }}"
            if [[ "${{ github.event_name }}" == "workflow_run" || "${{ inputs.promote }}" == "true" ]]; then
              echo "- Promotion requested: yes"
            else
              echo "- Promotion requested: no (staging verification only)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
