name: Deploy to Vercel

# Production releases are intentionally manual.
# Git auto-deploy is disabled in vercel.json so repeated main commits do not
# exhaust the Vercel daily deployment quota.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref or exact commit SHA to release'
        required: true
        default: 'main'
        type: string

concurrency:
  group: vercel-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Record exact release SHA
        id: release
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing exact commit: $sha"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browser
        run: npx playwright install chromium

      - name: Start Local Dev Server
        run: npm run dev:local &

      - name: Wait for Server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3005 > /dev/null; then echo "Server ready"; exit 0; fi
            sleep 1
          done
          echo "Server did not start in time" && exit 1

      - name: Release gate
        run: |
          npm run audit
          npm run audit:api
          npm test -- --runInBand

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@56.3.2

      - name: Pull production environment
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build production artifact
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy tested artifact to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod)"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $deployment_url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify production health
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const url = process.env.DEPLOYMENT_URL;
          if (!url || !url.startsWith('https://') || !url.endsWith('.vercel.app')) {
            throw new Error('Unexpected Vercel deployment URL');
          }
          NODE
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$DEPLOYMENT_URL/api/v3/health" >/tmp/health.json
          node -e "const h=require('/tmp/health.json'); if (!h || (h.status && h.status !== 'ok' && h.status !== 'healthy')) process.exit(1)"

      - name: Release summary
        run: |
          echo "Commit: ${{ steps.release.outputs.sha }}"
          echo "Deployment: ${{ steps.deploy.outputs.url }}"
