name: Apply Social Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    name: Apply Social Migrations via Admin Endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Apply migrations
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -e
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set. Skipping migration run."
            exit 0
          fi
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL is not set. Cannot reach admin endpoint."
            exit 1
          fi

          echo "Applying social migrations via ${SITE_URL}/api/admin ..."
          STATUS_CODE=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${SITE_URL}/api/admin?action=run-migrations&cronSecret=${CRON_SECRET}")

          echo "Response status: $STATUS_CODE"
          cat response.json

          if [ "$STATUS_CODE" != "200" ]; then
            echo "Migration endpoint failed with status $STATUS_CODE"
            exit 1
          fi

          echo "Migrations applied successfully"
