<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UniversalDropdown Showcase | Bonds</title>
  <link rel="stylesheet" href="../universal-dropdown.css" />
  <style>
    body { font-family: Inter, system-ui, sans-serif; padding: 2rem; background: #0a0f1a; color: #e8ecf4; line-height: 1.6; }
    h1 { color: #d4a94a; }
    h2 { margin-top: 2rem; color: #f0c96a; border-bottom: 1px solid rgba(212,169,74,0.3); padding-bottom: 0.3rem; }
    .demo { max-width: 480px; margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 700; color: #94a3b8; }
    .light-section { background: #f5f0e8; color: #1a1a1a; padding: 1.5rem; border-radius: 12px; margin-top: 2rem; }
    .light-section h2 { color: #b8954e; border-color: rgba(184,149,78,0.3); }
    .light-section label { color: #555; }
    .log { background: rgba(255,255,255,0.05); padding: 0.75rem; border-radius: 8px; font-family: monospace; font-size: 0.85rem; min-height: 1.5rem; margin-top: 0.5rem; }
  </style>
  <script src="/global-auth-gate.js?v=2"></script>
</head>
<body>
  <h1><span class="emoji-icon" style="display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;" aria-hidden="true"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#CCD6DD" d="M36 32c0 2.209-1.791 4-4 4H4c-2.209 0-4-1.791-4-4V4c0-2.209 1.791-4 4-4h28c2.209 0 4 1.791 4 4v28z"/><circle fill="#67757F" cx="27" cy="20.6" r=".686"/><circle fill="#67757F" cx="30.2" cy="21.515" r=".686"/><circle fill="#67757F" cx="23.8" cy="21.515" r=".686"/><circle fill="#67757F" cx="21.514" cy="23.8" r=".686"/><circle fill="#67757F" cx="20.6" cy="27" r=".686"/><circle fill="#67757F" cx="32.486" cy="23.8" r=".686"/><circle fill="#DA2F47" cx="33.401" cy="27" r=".686"/><circle cx="27" cy="27" r="4.881"/><circle fill="#292F33" cx="27" cy="27" r="3.994"/><path fill="#E1E8ED" d="M28.182 24.118l-1.697 2.824c-.134.223-.062.512.161.646s.512.062.646-.161l1.697-2.824c.134-.223.062-.512-.161-.646-.223-.133-.512-.061-.646.161z"/><circle fill="#67757F" cx="9" cy="20.6" r=".686"/><circle fill="#67757F" cx="12.2" cy="21.515" r=".686"/><circle fill="#67757F" cx="5.8" cy="21.515" r=".686"/><circle fill="#67757F" cx="3.514" cy="23.8" r=".686"/><circle fill="#67757F" cx="2.6" cy="27" r=".686"/><circle fill="#67757F" cx="14.486" cy="23.8" r=".686"/><circle fill="#DA2F47" cx="15.401" cy="27" r=".686"/><circle cx="9" cy="27" r="4.881"/><circle fill="#292F33" cx="9.001" cy="26.999" r="3.994"/><path fill="#E1E8ED" d="M6.099 25.868l2.853 1.647c.225.13.513.053.643-.172.13-.225.053-.513-.172-.643L6.57 25.053c-.226-.13-.513-.053-.643.172-.13.225-.053.513.172.643z"/><circle fill="#67757F" cx="27" cy="3.6" r=".686"/><circle fill="#67757F" cx="30.2" cy="4.515" r=".686"/><circle fill="#67757F" cx="23.8" cy="4.515" r=".686"/><circle fill="#67757F" cx="21.514" cy="6.8" r=".686"/><circle fill="#67757F" cx="20.6" cy="10" r=".686"/><circle fill="#67757F" cx="32.486" cy="6.8" r=".686"/><circle fill="#DA2F47" cx="33.401" cy="10" r=".686"/><circle cx="27" cy="10" r="4.881"/><circle fill="#292F33" cx="27.001" cy="10" r="3.994"/><path fill="#E1E8ED" d="M25.011 7.603l1.697 2.824c.134.223.423.295.646.161.223-.134.295-.423.161-.646l-1.696-2.824c-.134-.223-.423-.295-.646-.161-.224.134-.296.424-.162.646z"/><circle fill="#67757F" cx="9" cy="3.6" r=".686"/><circle fill="#67757F" cx="12.2" cy="4.515" r=".686"/><circle fill="#67757F" cx="5.8" cy="4.515" r=".686"/><circle fill="#67757F" cx="3.514" cy="6.8" r=".686"/><circle fill="#67757F" cx="2.6" cy="10" r=".686"/><circle fill="#67757F" cx="14.486" cy="6.8" r=".686"/><circle fill="#DA2F47" cx="15.401" cy="10" r=".686"/><circle cx="9" cy="9.999" r="4.881"/><circle fill="#292F33" cx="8.999" cy="10" r="3.994"/><path fill="#E1E8ED" d="M11.431 8.053L8.578 9.7c-.225.13-.302.418-.172.643.13.225.418.302.643.172l2.853-1.647c.225-.13.302-.418.172-.643-.131-.225-.419-.302-.643-.172z"/></svg></span>️ UniversalDropdown Showcase</h1>
  <p>Interactive demo of all component features.</p>

  <h2>Basic single select</h2>
  <div class="demo">
    <label for="single">Rating</label>
    <select id="single" data-universal-dropdown="true">
      <option value="1">1 — Poor</option>
      <option value="2">2 — Fair</option>
      <option value="3" selected>3 — Good</option>
      <option value="4">4 — Very Good</option>
      <option value="5">5 — Excellent</option>
    </select>
  </div>

  <h2>Search + sort + deduplicate</h2>
  <div class="demo">
    <label for="country">Country</label>
    <select id="country" data-universal-dropdown="true" data-ud-search="true" data-ud-sort="true" data-ud-deduplicate="true" data-ud-remove-empty="true">
      <option value=""></option>
      <option value="sa">Saudi Arabia</option>
      <option value="ae">UAE</option>
      <option value="eg">Egypt</option>
      <option value="jo">Jordan</option>
      <option value="sa">Saudi Arabia</option>
    </select>
  </div>

  <h2>Multi-select with select all / clear all</h2>
  <div class="demo">
    <label for="multi">Required services</label>
    <select id="multi" data-universal-dropdown="true" multiple data-ud-sort="true" data-ud-deduplicate="true" data-ud-remove-empty="true">
      <option value="feasibility" selected>Feasibility Study</option>
      <option value="credit">Credit Assessment</option>
      <option value="city">City Analysis</option>
      <option value="review">Advisory Review</option>
    </select>
    <div class="log" id="multiLog">Select an option...</div>
  </div>

  <h2>Grouped options</h2>
  <div class="demo">
    <label for="grouped">Region / City</label>
    <select id="grouped" data-universal-dropdown="true" data-ud-search="true">
      <optgroup label="GCC">
        <option value="riyadh">Riyadh</option>
        <option value="dubai">Dubai</option>
        <option value="manama">Manama</option>
      </optgroup>
      <optgroup label="North Africa">
        <option value="cairo">Cairo</option>
        <option value="casablanca">Casablanca</option>
      </optgroup>
    </select>
  </div>

  <h2>Virtual long list (200+ items)</h2>
  <div class="demo">
    <label for="virtual">City</label>
    <select id="virtual" data-universal-dropdown="true" data-ud-search="true" data-ud-virtualize="true" data-ud-virtual-threshold="30"></select>
  </div>

  <div class="light-section" data-ud-theme="light">
    <h2>Light theme</h2>
    <div class="demo">
      <label for="light">Plan</label>
      <select id="light" data-universal-dropdown="true">
        <option value="free">Free</option>
        <option value="pro" selected>Pro</option>
        <option value="enterprise">Enterprise</option>
      </select>
    </div>
  </div>

  <h2>Async loading</h2>
  <div class="demo">
    <label for="async">Async options</label>
    <select id="async" data-universal-dropdown="true" data-ud-loading-text="Loading cities..."></select>
  </div>

  <h2>Dynamic injection</h2>
  <div class="demo">
    <label for="dynamic">Sector (added after 1 second)</label>
    <div id="dynamicContainer"></div>
  </div>

  <script src="../universal-dropdown.js"></script>
  <script src="../universal-dropdown-init.js"></script>
  <script>
    // Populate virtual select
    const virtual = document.getElementById('virtual');
    for (let i = 1; i <= 200; i++) {
      const o = document.createElement('option');
      o.value = 'c' + i;
      o.textContent = 'City ' + i;
      virtual.appendChild(o);
    }

    // Multi-select change log
    const multi = document.getElementById('multi');
    multi.addEventListener('change', () => {
      const values = Array.from(multi.selectedOptions).map(o => o.value);
      document.getElementById('multiLog').textContent = 'Selected: ' + values.join(', ');
    });

    // Async loading demo
    const asyncSelect = document.getElementById('async');
    const dd = window.UniversalDropdown.fromSelect(asyncSelect, {});
    dd.setLoading(true);
    setTimeout(() => {
      dd.setOptions([
        { value: 'jeddah', label: 'Jeddah' },
        { value: 'dammam', label: 'Dammam' },
        { value: 'khobar', label: 'Khobar' }
      ]);
      dd.setLoading(false);
    }, 1500);

    // Dynamic injection
    setTimeout(() => {
      const container = document.getElementById('dynamicContainer');
      const select = document.createElement('select');
      select.setAttribute('data-universal-dropdown', 'true');
      select.innerHTML = '<option value="retail">Retail</option><option value="food">Food</option><option value="tech">Tech</option>';
      container.appendChild(select);
    }, 1000);
  </script>
</body>
</html>
