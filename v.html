  <h1>System Verification</h1>
  <div class="test">
    <h3>1. Supabase Connection</h3>
    <div id="r1">Testing...</div>
    <pre id="r1d"></pre>
  </div>
  <div class="test">
    <h3>2. Sign In Test (wrong credentials)</h3>
    <div id="r2">Testing...</div>
    <pre id="r2d"></pre>
  </div>
  <div class="test">
    <h3>3. Your Session</h3>
    <div id="r3">Testing...</div>
    <pre id="r3d"></pre>
  </div>
  <button onclick="runTests()">Retest</button>
  <button onclick="location.href='auth-v2.html'" style="background:#16a34a;color:white;margin-left:0.5rem;">Go to Login</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://hutxsqzplyuqgnghsrcs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_45XVdlKR2isOJ_OvZVO61Q_oYbhnVnF';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function runTests() {
      const r1 = document.getElementById('r1');
      const r1d = document.getElementById('r1d');
      try {
        const { data, error } = await sb.auth.getSession();
        if (error) throw error;
        r1.innerHTML = '<span class="pass">PASS</span> — Supabase connected';
        r1d.textContent = 'URL: ' + SUPABASE_URL;
      } catch (e) {
        r1.innerHTML = '<span class="fail">FAIL</span> — ' + e.message;
      }

      const r2 = document.getElementById('r2');
      const r2d = document.getElementById('r2d');
      try {
        const { data, error } = await sb.auth.signInWithPassword({ email: 'test@example.com', password: 'wrong' });
        if (error && error.message.includes('Invalid')) {
          r2.innerHTML = '<span class="pass">PASS</span> — API responds correctly (rejected wrong password)';
          r2d.textContent = 'Error: ' + error.message;
        } else if (error) {
          r2.innerHTML = '<span class="fail">FAIL</span> — ' + error.message;
        } else {
          r2.innerHTML = '<span class="pass">PASS</span> — Login succeeded (unexpected!)';
        }
      } catch (e) {
        r2.innerHTML = '<span class="fail">FAIL</span> — ' + e.message;
      }

      const r3 = document.getElementById('r3');
      const r3d = document.getElementById('r3d');
      try {
        const { data } = await sb.auth.getSession();
        if (data.session) {
          r3.innerHTML = '<span class="pass">PASS</span> — You are logged in!';
          r3d.textContent = 'Email: ' + data.session.user.email;
        } else {
          r3.innerHTML = '<span class="fail">No session</span> — Not logged in (normal)';
          r3d.textContent = 'Try logging in first.';
        }
      } catch (e) {
        r3.innerHTML = '<span class="fail">FAIL</span> — ' + e.message;
      }
    }

    window.addEventListener('load', runTests);
  </script>
