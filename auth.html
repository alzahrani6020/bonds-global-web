<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>تسجيل الدخول | بوندز</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#c8a45c;--gold-light:#f5efe3;--bg:#0c0c0c;--bg-card:#141414;--bg-elevated:#1c1c1c;--border:#2a2a2a;--text:#f5f5f5;--text-secondary:#9a9a9a;--radius-lg:16px;--radius-md:10px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
    .auth-container{width:100%;max-width:420px}
    .auth-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2.5rem 1.5rem}
    .logo{display:flex;align-items:center;justify-content:center;gap:0.75rem;margin-bottom:2rem}
    .logo img{height:40px}
    .logo span{font-weight:800;font-size:1.4rem;color:var(--gold)}
    .tabs{display:flex;gap:0.75rem;margin-bottom:1.5rem;border-bottom:1px solid var(--border);padding-bottom:0.75rem}
    .tab-btn{flex:1;background:transparent;border:none;color:var(--text-secondary);padding:0.75rem;font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;border-radius:var(--radius-md);transition:all 0.2s}
    .tab-btn.active{background:var(--gold);color:#0c0c0c}
    .tab-btn:hover:not(.active){color:var(--text)}
    .tab-panel{display:none}
    .tab-panel.active{display:block}
    .form-group{margin-bottom:1rem}
    .form-group label{display:block;margin-bottom:0.35rem;font-size:0.85rem;font-weight:500;color:var(--text-secondary)}
    .form-group input, .form-group select, .form-group textarea{width:100%;padding:0.75rem 1rem;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text);font-family:inherit;font-size:1rem;outline:none;transition:border-color 0.2s}
    .form-group input:focus, .form-group select:focus{border-color:var(--gold)}
    .form-group input::placeholder{color:#666}
    .btn{width:100%;padding:0.75rem 1rem;border-radius:var(--radius-md);font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;border:none;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:0.5rem;margin-top:0.5rem}
    .btn:disabled{opacity:0.6;cursor:not-allowed}
    .btn-primary{background:var(--gold);color:#0c0c0c}
    .btn-primary:hover:not(:disabled){filter:brightness(1.1)}
    .btn-secondary{background:var(--bg-elevated);color:var(--text);border:1px solid var(--border)}
    .btn-google{background:#fff;color:#333}
    .error-msg{background:#3a1515;color:#ff8a8a;padding:0.75rem 1rem;border-radius:var(--radius-md);margin-bottom:1rem;font-size:0.9rem;display:none}
    .success-msg{background:#153a1f;color:#8affa0;padding:0.75rem 1rem;border-radius:var(--radius-md);margin-bottom:1rem;font-size:0.9rem;display:none}
    .divider{display:flex;align-items:center;gap:1rem;margin:1.5rem 0;color:var(--text-secondary);font-size:0.85rem}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
    .back-link{display:block;text-align:center;margin-top:1.5rem;color:var(--text-secondary);font-size:0.9rem;text-decoration:none}
    .back-link:hover{color:var(--gold)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    @media(max-width:480px){.row{grid-template-columns:1fr}}
    .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:currentColor;border-radius:50%;animation:spin 0.8s linear infinite;display:none}
    .btn.loading .spinner{display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <img src="assets/bonds-logo-2026.webp?v=2026" alt="Bonds">
        <span>Bonds</span>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login">تسجيل الدخول</button>
        <button class="tab-btn" data-tab="signup">حساب جديد</button>
      </div>

      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>

      <!-- Login Panel -->
      <div id="loginPanel" class="tab-panel active">
        <form id="loginForm">
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="loginEmail" required placeholder="your@email.com" dir="ltr">
          </div>
          <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="loginPassword" required placeholder="••••••••" dir="ltr">
          </div>
          <button type="submit" class="btn btn-primary" id="loginBtn">
            <span class="spinner"></span>
            <span>تسجيل الدخول</span>
          </button>
        </form>
        <div class="divider">أو</div>
        <button id="otpBtn" class="btn btn-secondary">إرسال رابط سحري 📧</button>
        <button id="googleBtn" class="btn btn-google" style="margin-top:0.5rem">🔍 تسجيل الدخول عبر Google</button>
      </div>

      <!-- Signup Panel -->
      <div id="signupPanel" class="tab-panel">
        <form id="signupForm">
          <div class="form-group">
            <label>اسم المطعم / الشركة *</label>
            <input type="text" id="signupName" required placeholder="مثال: مطعم الذواقة">
          </div>
          <div class="form-group">
            <label>البريد الإلكتروني *</label>
            <input type="email" id="signupEmail" required placeholder="your@email.com" dir="ltr">
          </div>
          <div class="form-group">
            <label>كلمة المرور * (8 أحرف على الأقل)</label>
            <input type="password" id="signupPassword" required minlength="8" placeholder="••••••••" dir="ltr">
          </div>
          <div class="form-group">
            <label>تأكيد كلمة المرور *</label>
            <input type="password" id="signupPasswordConfirm" required placeholder="أعد كتابة كلمة المرور" dir="ltr">
          </div>
          <div class="row">
            <div class="form-group">
              <label>الدولة</label>
              <input type="text" id="signupCountry" placeholder="السعودية">
            </div>
            <div class="form-group">
              <label>المدينة</label>
              <input type="text" id="signupCity" placeholder="الرياض">
            </div>
          </div>
          <div class="row">
            <div class="form-group">
              <label>رقم الجوال</label>
              <input type="tel" id="signupPhone" placeholder="05xxxxxxxx" dir="ltr">
            </div>
            <div class="form-group">
              <label>نوع النشاط</label>
              <select id="signupBusinessType">
                <option value="">اختر النشاط</option>
                <option value="restaurant">مطعم / مطعم سريع</option>
                <option value="cafe">مقهى</option>
                <option value="bakery">مخبز / حلويات</option>
                <option value="food_truck">عربة طعام</option>
                <option value="catering">تموين</option>
                <option value="retail">متجر تجزئة</option>
                <option value="manufacturing">تصنيع غذائي</option>
                <option value="other">أخرى</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>عدد الموظفين</label>
            <input type="number" id="signupEmployeeCount" min="0" placeholder="12">
          </div>
          <div class="form-group">
            <label>نبذة عن المشروع</label>
            <textarea id="signupBio" rows="2" placeholder="اكتب نبذة مختصرة..."></textarea>
          </div>
          <div class="form-group">
            <label>الاحتياجات والخدمات المطلوبة</label>
            <textarea id="signupNeeds" rows="2" placeholder="مثال: تحليل مالي، دراسة جدوى متكاملة..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary" id="signupBtn">
            <span class="spinner"></span>
            <span>إنشاء حساب</span>
          </button>
        </form>
      </div>

      <a href="calculator.html" class="back-link">← العودة للحاسبة</a>
    </div>
  </div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js"></script>
  <script>
    (function() {
      'use strict';

      // Tab switching
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(btn.dataset.tab + 'Panel').classList.add('active');
          hideMessages();
        });
      });

      function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
        document.getElementById('successMsg').style.display = 'none';
      }
      function showSuccess(msg) {
        const el = document.getElementById('successMsg');
        el.textContent = msg;
        el.style.display = 'block';
        document.getElementById('errorMsg').style.display = 'none';
      }
      function hideMessages() {
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('successMsg').style.display = 'none';
      }
      function setLoading(btnId, loading) {
        const btn = document.getElementById(btnId);
        btn.disabled = loading;
        btn.classList.toggle('loading', loading);
      }

      // LOGIN
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessages();
        setLoading('loginBtn', true);
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        const { data, error } = await window.BondsAuth.signIn(email, password);
        setLoading('loginBtn', false);

        if (error) {
          const msg = error.message || '';
          if (msg.includes('Invalid login credentials')) showError('البريد أو كلمة المرور غير صحيحة');
          else if (msg.includes('Email not confirmed')) showError('البريد غير مُفعّل');
          else showError(msg);
          return;
        }

        showSuccess('تم تسجيل الدخول! جاري التوجيه...');
        const redirectTo = window.BondsAuth.getRedirectUrl();
        window.BondsAuth.clearRedirectUrl();
        setTimeout(() => {
          window.location.href = redirectTo;
        }, 600);
      });

      // OTP
      document.getElementById('otpBtn').addEventListener('click', async () => {
        hideMessages();
        const email = document.getElementById('loginEmail').value.trim();
        if (!email) { showError('أدخل البريد الإلكتروني أولاً'); return; }
        setLoading('otpBtn', true);
        const { error } = await window.BondsAuth.signInWithOTP(email);
        setLoading('otpBtn', false);
        if (error) { showError(error.message); return; }
        showSuccess('تم إرسال رابط تسجيل الدخول إلى بريدك!');
      });

      // Google
      document.getElementById('googleBtn').addEventListener('click', async () => {
        hideMessages();
        const sb = window.BondsAuth.getSupabase();
        if (!sb) { showError('النظام غير جاهز'); return; }
        const { error } = await sb.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: 'https://bonds-global.com/calculators/auth/confirmed.html' }
        });
        if (error) showError(error.message);
      });

      // SIGNUP
      document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessages();
        setLoading('signupBtn', true);

        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value;
        const confirm = document.getElementById('signupPasswordConfirm').value;
        const name = document.getElementById('signupName').value.trim();

        if (password.length < 8) { showError('كلمة المرور يجب أن تكون 8 أحرف على الأقل'); setLoading('signupBtn', false); return; }
        if (password !== confirm) { showError('كلمة المرور غير متطابقة'); setLoading('signupBtn', false); return; }

        const { data, error } = await window.BondsAuth.signUp(email, password, {
          restaurant_name: name,
          country: document.getElementById('signupCountry').value.trim(),
          city: document.getElementById('signupCity').value.trim(),
          phone: document.getElementById('signupPhone').value.trim(),
          business_type: document.getElementById('signupBusinessType').value,
          employee_count: document.getElementById('signupEmployeeCount').value,
          bio: document.getElementById('signupBio').value.trim(),
          needs: document.getElementById('signupNeeds').value.trim(),
          language: 'ar'
        });
        setLoading('signupBtn', false);

        if (error) {
          const msg = error.message || '';
          if (msg.includes('already registered')) showError('هذا البريد مسجل مسبقاً');
          else showError(msg);
          return;
        }

        showSuccess('تم إنشاء الحساب! جاري التوجيه...');
        setTimeout(() => {
          window.location.href = 'https://bonds-global.com/calculator.html';
        }, 800);
      });
    })();
  </script>
</body>
</html>
