<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="manifest" href="/manifest.json" />  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تقرير Bonds Pro</title>
    <link rel="stylesheet" href="../styles/fonts-ar.css">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="/styles/institutional-system.css?v=4">

<script defer src="/calculators/auth-gate.js?v=3"></script>
  </head>
<body>
  <div class="container report-page">
    <div class="cta-bar no-print" style="margin-bottom:24px">
      <button onclick="window.print()" class="btn btn-primary">تحميل / طباعة PDF</button>
      <a href="index.html" class="btn btn-outline">حاسبة جديدة</a>
    </div>

    <div id="report-content" class="report-print">
      <h1>تقرير جدوى احترافي</h1>
      <p class="subtitle">Bonds Pro · جاري التحميل...</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    const report = document.getElementById('report-content');

    if (!sessionId || !sessionId.startsWith('cs_')) {
      report.innerHTML = '<h1>التقرير مدفوع</h1><p>يلزم إتمام الدفع والتحقق منه قبل عرض التقرير.</p><a href="index.html" class="btn btn-primary">العودة للحاسبة</a>';
    } else {
      const qs = new URLSearchParams({
        action: 'report',
        session_id: sessionId,
        format: 'html'
      });
      fetch('/api/pro?' + qs.toString(), { credentials: 'same-origin' })
        .then(async response => {
          if (!response.ok) {
            let message = 'تعذر التحقق من الدفع.';
            try {
              const body = await response.json();
              if (body && body.error) message = body.error;
            } catch (_) {}
            throw new Error(message);
          }
          return response.text();
        })
        .then(html => {
          report.innerHTML = html;
        })
        .catch(err => {
          report.innerHTML = '<h1>تعذر فتح التقرير</h1><p>' +
            String(err.message || 'Payment verification failed').replace(/[<>&"']/g, '') +
            '</p><a href="index.html" class="btn btn-primary">العودة</a>';
        });
    }
  </script>
<script src="/components/emoji-icons.js" defer></script>
<script src="/components/emoji-renderer.js" defer></script>
</body>
</html>
