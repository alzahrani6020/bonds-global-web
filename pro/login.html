<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل الدخول | Bonds Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
<script src="/calculators/auth-gate.js"></script>
  </head>
<body>
  <div class="container">
    <header class="navbar">
      <a href="index.html" class="logo">Bonds Pro</a>
      <nav>
        <a href="index.html">الرئيسية</a>
        <a href="login.html">تسجيل الدخول</a>
      </nav>
    </header>

    <div class="card login-box">
      <h2 style="margin-top:0;text-align:center">تسجيل الدخول</h2>
      <p style="text-align:center;color:var(--text-secondary)">سجّل دخولك للوصول لتقاريرك وحفظ مشاريعك.</p>
      <form id="login-form" class="form-grid" style="grid-template-columns:1fr">
        <div>
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="your@email.com" required />
        </div>
        <div>
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">دخول</button>
        <button type="button" id="signup-btn" class="btn btn-outline" style="width:100%">إنشاء حساب</button>
      </form>
      <p id="login-msg" style="text-align:center;color:var(--text-secondary);margin-top:16px"></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const msg = document.getElementById('login-msg');

    async function auth(action) {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/pro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Auth failed');
        if (data.token) localStorage.setItem('bonds_pro_token', data.token);
        msg.textContent = action === 'signup' ? 'تم إنشاء الحساب.' : 'تم تسجيل الدخول، جاري التحويل...';
        if (action !== 'signup') setTimeout(() => window.location.href = 'index.html', 600);
      } catch (err) {
        msg.textContent = 'خطأ: ' + err.message;
      }
    }

    form.addEventListener('submit', e => { e.preventDefault(); auth('signin'); });
    document.getElementById('signup-btn').addEventListener('click', () => auth('signup'));
  </script>
</body>
</html>
