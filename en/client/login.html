<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Client Portal — Sign In | Bonds</title>
  <meta name="description" content="Sign in to the Bonds client portal to track projects and reports." />
  <link rel="icon" href="/assets/bonds-mark.svg" type="image/png" />
  <link rel="stylesheet" href="/client/portal.css" />
  <link rel="canonical" href="https://bonds-global.com/en/client/login.html" />
  <meta property="og:title" content="Client Portal — Sign In | Bonds" />
  <meta property="og:description" content="Sign in to the Bonds client portal to track projects and reports." />
  <meta property="og:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />
</head>
<body>
  <div class="portal-login">
    <div class="portal-login__card">
      <div class="portal-login__logo">
        <img src="/assets/bonds-logo-2026-header.webp?v=2026" alt="Bonds" />
        <span>Client Portal</span>
      </div>

      <div id="msg" class="portal-msg"></div>

      <form id="loginForm">
        <div class="portal-form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="your@email.com" dir="ltr" />
        </div>
        <div class="portal-form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" dir="ltr" />
        </div>
        <div class="portal-form__actions">
          <a class="portal-link" href="/calculators/auth/index.html?redirect=/en/client/index.html">Create account</a>
          <a class="portal-link" href="/calculators/auth/reset.html">Forgot password?</a>
        </div>
        <button type="submit" class="portal-btn" id="loginBtn" style="width:100%;justify-content:center;">
          <span id="btnText">Sign in</span>
        </button>
      </form>

      <div style="text-align:center;margin-top:1.5rem;">
        <a class="portal-link" href="/client/login.html">العربية</a>
      </div>
    </div>
  </div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js"></script>
  <script>
    (function() {
      'use strict';

      function showError(msg) {
        const el = document.getElementById('msg');
        el.textContent = msg;
        el.className = 'portal-msg portal-msg--error';
        el.style.display = 'block';
      }
      function showSuccess(msg) {
        const el = document.getElementById('msg');
        el.textContent = msg;
        el.className = 'portal-msg portal-msg--success';
        el.style.display = 'block';
      }

      window.BondsAuth.getUser().then(({ data }) => {
        if (data?.user) {
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect') || '/en/client/index.html';
          window.location.replace(redirect);
        }
      });

      document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        btn.disabled = true;
        btnText.textContent = 'Signing in...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const { data, error } = await window.BondsAuth.signIn(email, password);
        if (error) {
          showError(error.message || 'Sign in failed. Please check your email and password.');
          btn.disabled = false;
          btnText.textContent = 'Sign in';
          return;
        }

        showSuccess('Signed in successfully. Redirecting...');
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/en/client/index.html';
        window.location.replace(redirect);
      });
    })();
  </script>
</body>
</html>
