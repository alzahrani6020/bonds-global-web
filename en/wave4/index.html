  <style>
    :root { font-family: 'Inter', system-ui, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    .brand {
      display: flex; align-items: center; gap: 0.75rem;
      font-weight: 800; font-size: 1.25rem; color: var(--gold);
      margin-bottom: 2rem;
    }
    .brand img { height: 36px; }
    .hero { text-align: center; margin-bottom: 2.5rem; }
    .hero h1 { font-size: 2rem; margin: 0 0 0.5rem; }
    .hero p { color: var(--text-secondary); margin: 0; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-md);
    }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-secondary); }
    textarea, input, select {
      width: 100%;
      padding: 0.9rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font: inherit;
      box-sizing: border-box;
    }
    textarea { min-height: 96px; resize: vertical; }
    textarea:focus, input:focus, select:focus { outline: none; border-color: var(--gold); }
    .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    .chip {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: var(--transition);
    }
    .chip:hover, .chip.active { border-color: var(--gold); color: var(--gold); background: var(--gold-glow); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      background: var(--gold);
      color: #0a0f1a;
      border: none;
      padding: 0.9rem 1.6rem;
      border-radius: var(--radius-sm);
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn:hover { background: var(--gold-bright); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
    .field { margin-bottom: 1rem; }
    .field small { color: var(--text-muted); font-size: 0.8rem; }
    .field-populated input, .field-populated select { border-color: var(--gold-dim); }
    .source-badge {
      display: inline-block; font-size: 0.75rem; color: var(--gold);
      border: 1px solid var(--gold-dim); padding: 0.1rem 0.4rem; border-radius: 4px; margin-left: 0.5rem;
    }
    .hidden { display: none; }
    .result-meta { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .meta-box { background: var(--bg-secondary); padding: 0.75rem 1rem; border-radius: var(--radius-sm); flex: 1; min-width: 140px; }
    .meta-box strong { display: block; color: var(--gold); font-size: 1.1rem; }
    .meta-box span { color: var(--text-secondary); font-size: 0.85rem; }
    .evidence-list { list-style: none; padding: 0; margin: 0; }
    .evidence-list li { padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
    .error { color: #ef4444; background: rgba(239,68,68,0.1); padding: 1rem; border-radius: var(--radius-sm); }
    h2 { font-size: 1.25rem; margin-top: 0; color: var(--gold-bright); }
  </style>

<body>
  <div class="container">
    <div class="brand">
      <img src="../../assets/bonds-logo-v2.webp" alt="BONDS" / width="1536" height="1024">
      <span>BONDS — Intelligent Economic Platform</span>
    </div>

    <section class="hero">
      <h1>What do you want to achieve?</h1>
      <p>No calculators, no sectors, no complex models. Start with your goal and we'll build everything automatically.</p>
    </section>

    <div class="card" id="intent-card">
      <label for="intent-input">Describe your goal in one sentence</label>
      <textarea id="intent-input" placeholder="e.g. I want a feasibility study for a fast-food restaurant in Riyadh"></textarea>
      <div class="chips" id="intent-chips">
        <button class="chip" data-text="I want to value an asset">Value Asset</button>
        <button class="chip" data-text="I want to buy a property">Buy Asset</button>
        <button class="chip" data-text="I want financing for my project">Request Financing</button>
        <button class="chip" data-text="I want a feasibility study">Feasibility Study</button>
        <button class="chip" data-text="I want to compare investment opportunities">Compare Opportunities</button>
        <button class="chip" data-text="I want to issue a valuation certificate">Issue Certificate</button>
      </div>

      <div class="form-grid" style="margin-top: 1rem;">
        <div class="field">
          <label for="sector-select">Sector (optional)</label>
          <select id="sector-select">
            <option value="">Auto-detect</option>
            <option value="restaurant">Restaurant</option>
            <option value="manufacturing">Manufacturing</option>
            <option value="retail">Retail</option>
            <option value="hotel">Hotel</option>
            <option value="healthcare">Healthcare</option>
            <option value="education">Education</option>
            <option value="company">Company</option>
          </select>
        </div>
        <div class="field">
          <label for="country-select">Country</label>
          <select id="country-select">
            <option value="SA" selected>Saudi Arabia</option>
            <option value="AE">UAE</option>
            <option value="EG">Egypt</option>
          </select>
        </div>
      </div>

      <button class="btn" id="build-form-btn" style="margin-top: 1rem;">Start Journey</button>
    </div>

    <div id="form-section" class="hidden">
      <div class="card">
        <h2 id="form-title">Required Information</h2>
        <p id="form-subtitle" style="color: var(--text-secondary);"></p>
        <form id="dynamic-form"></form>
        <button class="btn" id="run-btn" style="margin-top: 1rem;">Calculate & Explore Result</button>
      </div>
    </div>

    <div id="result-section" class="hidden"></div>
    <div id="error-section"></div>
  </div>

  <script>
    const API_BASE = '/api/v3';
    const intentInput = document.getElementById('intent-input');
    const chips = document.querySelectorAll('.chip');
    const buildBtn = document.getElementById('build-form-btn');
    const formSection = document.getElementById('form-section');
    const dynamicForm = document.getElementById('dynamic-form');
    const runBtn = document.getElementById('run-btn');
    const resultSection = document.getElementById('result-section');
    const errorSection = document.getElementById('error-section');
    const sectorSelect = document.getElementById('sector-select');
    const countrySelect = document.getElementById('country-select');

    let currentForm = null;

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        intentInput.value = chip.dataset.text;
      });
    });

    function showError(msg) {
      errorSection.innerHTML = `<div class="error">${msg}</div>`;
    }
    function clearError() { errorSection.innerHTML = ''; }

    function setLoading(el, loading) {
      el.disabled = loading;
      el.dataset.original = el.dataset.original || el.innerHTML;
      el.innerHTML = loading ? 'Loading...' : el.dataset.original;
    }

    async function post(path, body) {
      const res = await fetch(API_BASE + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function renderForm(data) {
      currentForm = data;
      const form = data.form;
      document.getElementById('form-title').textContent = `Goal: ${data.intent.names.en}`;
      document.getElementById('form-subtitle').textContent = `Sector: ${form.sectorName.en || form.sector} · Context: ${data.context ? data.context.names.en : 'General'}`;

      dynamicForm.innerHTML = '';
      for (const field of form.fields) {
        if (field.hidden) continue;
        const div = document.createElement('div');
        div.className = 'field' + (field.populated ? ' field-populated' : '');
        const label = document.createElement('label');
        label.textContent = (field.label && field.label.en) || field.name;
        if (field.required) label.innerHTML += ' <span style="color:var(--gold)">*</span>';
        if (field.populated) {
          const badge = document.createElement('span');
          badge.className = 'source-badge';
          badge.textContent = (field.populationMode === 'auto' ? 'Auto' : 'Suggested') + ': ' + (field.populationSource || field.source);
          label.appendChild(badge);
        }
        div.appendChild(label);

        const input = document.createElement('input');
        input.type = field.type === 'integer' ? 'number' : (field.type === 'string' ? 'text' : 'number');
        input.step = field.type === 'integer' ? '1' : 'any';
        input.name = field.name;
        input.placeholder = field.helpText || '';
        if (field.value !== undefined && field.value !== null) input.value = field.value;
        if (field.default !== undefined && field.default !== null && input.value === '') input.value = field.default;
        div.appendChild(input);

        if (field.helpText) {
          const small = document.createElement('small');
          small.textContent = field.helpText;
          div.appendChild(small);
        }
        dynamicForm.appendChild(div);
      }
      formSection.classList.remove('hidden');
      formSection.scrollIntoView({ behavior: 'smooth' });
    }

    buildBtn.addEventListener('click', async () => {
      clearError();
      if (!intentInput.value.trim()) return showError('Please describe your goal first.');
      setLoading(buildBtn, true);
      try {
        const body = {
          input: intentInput.value,
          sector: sectorSelect.value || intentInput.value,
          country: countrySelect.value,
          userTier: 'pro',
          language: 'en'
        };
        const data = await post('/wave4/intent', body);
        renderForm(data);
      } catch (err) {
        showError(err.message);
      } finally {
        setLoading(buildBtn, false);
      }
    });

    runBtn.addEventListener('click', async () => {
      clearError();
      setLoading(runBtn, true);
      try {
        const values = {};
        const inputs = dynamicForm.querySelectorAll('input, select');
        inputs.forEach(input => {
          const v = input.type === 'number' ? parseFloat(input.value) : input.value;
          if (!Number.isNaN(v)) values[input.name] = v;
        });

        const data = await post('/wave4/run', {
          input: intentInput.value,
          sector: currentForm.sector.sector,
          country: countrySelect.value,
          userTier: 'pro',
          language: 'en',
          values
        });
        renderResult(data);
      } catch (err) {
        showError(err.message);
      } finally {
        setLoading(runBtn, false);
      }
    });

    function formatValue(v) {
      if (v === null || v === undefined) return '—';
      if (typeof v === 'number') return v.toLocaleString('en-US');
      return String(v);
    }

    function renderResult(data) {
      const r = data.confidence || {};
      const outputs = data.ucp && data.ucp.outputs ? data.ucp.outputs : {};
      const evidence = data.evidence || [];
      const scenarios = data.ucp && data.ucp.scenarios ? data.ucp.scenarios : [];

      let outputsHtml = '<div class="form-grid">';
      for (const [key, out] of Object.entries(outputs)) {
        const val = typeof out === 'object' ? out.value : out;
        outputsHtml += `<div class="meta-box"><strong>${key.replace(/_/g, ' ')}</strong><span>${formatValue(val)}</span></div>`;
      }
      outputsHtml += '</div>';

      let evidenceHtml = '';
      if (evidence.length) {
        evidenceHtml = '<ul class="evidence-list">' + evidence.slice(0, 10).map(e => `
          <li>
            <strong>${e.evidence_type || e.source || 'Input'}</strong>
            ${e.evidence_code ? `: ${e.evidence_code}` : ''}
            <span style="color:var(--text-secondary);display:block;font-size:0.85rem;">${formatValue(e.value)} · confidence ${e.confidence !== undefined ? Math.round(e.confidence * 100) / 100 : '—'}</span>
          </li>
        `).join('') + '</ul>';
      }

      let scenariosHtml = '';
      if (scenarios.length > 1) {
        scenariosHtml = '<h3>Scenarios</h3><div class="form-grid">' + scenarios.map(s => {
          const np = s.outputs && s.outputs.net_profit ? s.outputs.net_profit.value : '—';
          return `<div class="meta-box"><strong>${s.scenarioType === 'expected' ? 'Expected' : (s.scenarioType === 'optimistic' ? 'Optimistic' : 'Pessimistic')}</strong><span>Net profit: ${formatValue(np)}</span></div>`;
        }).join('') + '</div>';
      }

      resultSection.innerHTML = `
        <div class="card">
          <h2>Result & Explanation</h2>
          <div class="result-meta">
            <div class="meta-box"><strong>${r.grade || '—'}</strong><span>Confidence (${r.score || 0})</span></div>
            <div class="meta-box"><strong>${data.intent.names.en}</strong><span>Intent</span></div>
            <div class="meta-box"><strong>${data.form.sectorName.en || data.form.sector}</strong><span>Sector</span></div>
          </div>
          <p>${data.explanation ? data.explanation.summary || data.explanation.text || '' : ''}</p>
          ${outputsHtml}
          ${scenariosHtml}
        </div>
        <div class="card">
          <h2>Evidence & Sources</h2>
          ${evidenceHtml || '<p style="color:var(--text-secondary)">No recorded evidence.</p>'}
        </div>
      `;
      resultSection.classList.remove('hidden');
      resultSection.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
<script src="/components/emoji-icons.js" defer></script>
<script src="/components/emoji-renderer.js" defer></script>
</body>
</html>
