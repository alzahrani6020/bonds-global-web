          { id: 'nursery', icon: '<svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg>', title: 'Nursery', desc: 'Children nursery.' },
          { id: 'private-university', icon: '<svg class="bonds-icon bonds-icon--graduation-cap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10l-10-6L2 10l10 6 10-6z"></path><path d="M6 12v5a6 6 0 0 0 12 0v-5"></path><path d="M12 22V16"></path></svg>', title: 'Private University', desc: 'Private university.' },
          { id: 'training-center', icon: '<svg class="bonds-icon bonds-icon--book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>', title: 'Training Center', desc: 'Vocational and academic training.' },
          { id: 'e-learning-platform', icon: '<svg class="bonds-icon bonds-icon--laptop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><line x1="2" y1="20" x2="22" y2="20"></line></svg>', title: 'E-Learning Platform', desc: 'E-learning platform.' },
          { id: 'technology', icon: '<svg class="bonds-icon bonds-icon--laptop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><line x1="2" y1="20" x2="22" y2="20"></line></svg>', title: 'Technology Sector', desc: 'Software companies, SaaS, and applications.' },
        ]
      },
      {
        id: 'commerce',
        title: 'Commerce & Logistics',
        desc: 'General trade, retail, transport, warehousing, and agriculture.',
        sectors: [
          { id: 'commercial', icon: '<svg class="bonds-icon bonds-icon--handshake" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 7.65l.77.78 7.65 7.65 7.65-7.65.77-.78a5.4 5.4 0 0 0 0-7.65z"></path><path d="M16 8l-4 4-4-4"></path><path d="M4 14l4 4"></path><path d="M20 14l-4 4"></path></svg>', title: 'Commercial Sector', desc: 'Trading agencies, import/export, and general trade.' },
          { id: 'retail', icon: '<svg class="bonds-icon bonds-icon--shopping-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>', title: 'Retail Sector', desc: 'Retail stores, supermarkets, and e-commerce.' },
          { id: 'logistics', icon: '<svg class="bonds-icon bonds-icon--truck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>', title: 'Logistics Sector', desc: 'Transportation, warehousing, delivery, and supply chain.' },
          { id: 'shipping-company', icon: '<svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg>', title: 'Shipping Company', desc: 'Local and international shipping.' },
          { id: 'transport-fleet', icon: '<svg class="bonds-icon bonds-icon--truck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>', title: 'Transport Fleet', desc: 'Own and operate a transport fleet.' },
          { id: 'distribution-center', icon: '<svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg>', title: 'Distribution Center', desc: 'Order sorting and distribution.' },
          { id: 'last-mile-delivery', icon: '<svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg>', title: 'Last-Mile Delivery', desc: 'Last-mile delivery service.' },
          { id: 'agriculture', icon: '<svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg>', title: 'Agriculture Sector', desc: 'Farms, poultry farms, and food production.' },
        ]
      }
    ];

    const main = document.getElementById('investmentMain');
    const searchInput = document.getElementById('sectorSearch');
    const searchClear = document.getElementById('searchClear');
    const categoryChips = document.getElementById('categoryChips');
    const resultsCount = document.getElementById('resultsCount');

    function createCard(sector) {
      const card = document.createElement('a');
      card.href = sector.id + '.html';
      card.className = 'sector-card';
      card.dataset.title = sector.title;
      card.dataset.category = sector.categoryId;
      card.innerHTML = `
        <div class="sector-card__icon">${sector.icon}</div>
        <div class="sector-card__title">${sector.title}</div>
        <div class="sector-card__desc">${sector.desc}</div>
      `;
      return card;
    }

    function render() {
      main.innerHTML = '';
      groups.forEach(group => {
        const section = document.createElement('section');
        section.className = 'sector-group';
        section.dataset.category = group.id;
        section.innerHTML = `
          <div class="sector-group__header">
            <h2 class="sector-group__title">${group.title}</h2>
            <p class="sector-group__desc">${group.desc}</p>
          </div>
          <div class="sectors-grid"></div>
        `;
        const grid = section.querySelector('.sectors-grid');
        group.sectors.forEach(s => {
          s.categoryId = group.id;
          grid.appendChild(createCard(s));
        });
        main.appendChild(section);
      });
    }

    function normalize(str) {
      return str.toLowerCase().trim().replace(/[^\w\s]/g, '');
    }

    function filter() {
      const query = normalize(searchInput.value);
      const activeChip = categoryChips.querySelector('.category-chip.active');
      const activeCategory = activeChip ? activeChip.dataset.category : 'all';
      let visibleCount = 0;

      document.querySelectorAll('.sector-group').forEach(section => {
        const groupId = section.dataset.category;
        const groupMatches = activeCategory === 'all' || activeCategory === groupId;
        let groupVisible = false;

        section.querySelectorAll('.sector-card').forEach(card => {
          const title = normalize(card.dataset.title);
          const desc = normalize(card.querySelector('.sector-card__desc').textContent);
          const matchesSearch = !query || title.includes(query) || desc.includes(query);
          const matchesCategory = groupMatches;
          const visible = matchesSearch && matchesCategory;
          card.style.display = visible ? '' : 'none';
          if (visible) {
            visibleCount++;
            groupVisible = true;
          }
        });

        section.style.display = groupVisible ? '' : 'none';
      });

      resultsCount.textContent = `${visibleCount} calculator${visibleCount !== 1 ? 's' : ''} ${query ? 'matched' : 'available'}`;
      searchClear.style.display = query ? 'flex' : 'none';
    }

    categoryChips.addEventListener('click', e => {
      if (!e.target.classList.contains('category-chip')) return;
      categoryChips.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
      e.target.classList.add('active');
      filter();
    });

    searchInput.addEventListener('input', filter);
    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      filter();
      searchInput.focus();
    });

    render();
    filter();
  </script>
</body>
