    <div class="investment-search">
      <input type="text" id="sectorSearch" placeholder="Search for a sector… e.g. hospital, water factory, restaurant" autocomplete="off" />

    <div class="investment-categories" id="categoryChips">
      <button class="category-chip active" data-category="all">All</button>

      <button class="category-chip" data-category="real-estate">Real Estate & Construction</button>
      <button class="category-chip" data-category="industrial">Industry</button>
      <button class="category-chip" data-category="restaurants">Restaurants & Hospitality</button>
      <button class="category-chip" data-category="education">Education & Technology</button>
      <button class="category-chip" data-category="commerce">Commerce & Logistics</button>
    </div>

    <div class="results-count" id="resultsCount">63 calculators available</div>
  </section>

  <main class="investment-main" id="investmentMain">
    <!-- Filled by JS -->

  <div id="site-footer"></div>

  <script src="../../../site-layout.js?v=3.0.6"></script>
  <script src="../../../page-tracker-v2.js"></script>

          { id: 'villa-construction', icon: '🏡', title: 'Villa Construction', desc: 'Build and sell residential villas.' },
          { id: 'residential-building', icon: '🏢', title: 'Residential Building', desc: 'Build residential apartments for sale.' },
          { id: 'commercial-complex', icon: '🏬', title: 'Commercial Complex', desc: 'Commercial complex for rent.' },
          { id: 'commercial-mall', icon: '🛍️', title: 'Commercial Mall', desc: 'Large commercial mall.' },
          { id: 'hotel-apartments', icon: '🏨', title: 'Hotel Apartments', desc: 'Furnished hotel apartments.' },
          { id: 'warehouses', icon: '🏭', title: 'Warehouses', desc: 'Warehouses for rent.' },
          { id: 'property-rehabilitation', icon: '🔧', title: 'Property Rehabilitation', desc: 'Buy and rehabilitate a distressed property for sale.' },
          { id: 'buy-to-rent', icon: '🏠', title: 'Buy-to-Rent', desc: 'Buy a ready property and rent it out.' },

          { id: 'concrete-structure-cost', icon: '🧱', title: 'Concrete Structure Cost', desc: 'Concrete structure cost estimation.' },

          { id: 'food-factory', icon: '🍞', title: 'Food Factory', desc: 'Food products factory.' },
          { id: 'water-factory', icon: '💧', title: 'Water Factory', desc: 'Drinking water bottling factory.' },
          { id: 'plastic-factory', icon: '🧴', title: 'Plastic Factory', desc: 'Plastic products factory.' },
          { id: 'building-materials-factory', icon: '🧱', title: 'Building Materials Factory', desc: 'Construction materials factory.' },
          { id: 'furniture-factory', icon: '🛋️', title: 'Furniture Factory', desc: 'Home and office furniture factory.' },
          { id: 'textiles-factory', icon: '🧵', title: 'Textiles Factory', desc: 'Textiles and fabrics factory.' },
          { id: 'chemicals-factory', icon: '⚗️', title: 'Chemicals Factory', desc: 'Chemical products factory.' },
          { id: 'packaging-factory', icon: '📦', title: 'Packaging Factory', desc: 'Packaging factory.' },
        ]
      },
      {
        id: 'restaurants',

        desc: 'Restaurants, cafés, hotels, resorts, and tourism services.',
        sectors: [
          { id: 'restaurants', icon: '🍽️', title: 'Restaurant Sector', desc: 'General restaurants and cafés evaluation.' },

          { id: 'food-truck', icon: '🚚', title: 'Food Truck', desc: 'Mobile food truck.' },
          { id: 'fast-food-restaurant', icon: '🍔', title: 'Fast Food Restaurant', desc: 'Fast food restaurant.' },

          { id: 'hotel', icon: '🏨', title: 'Hotel', desc: 'New hotel.' },
          { id: 'tourist-resort', icon: '🏖️', title: 'Tourist Resort', desc: 'Comprehensive tourist resort.' },
          { id: 'tourist-camp', icon: '⛺', title: 'Tourist Camp', desc: 'Tourist camp.' },

        ]
      },
      {
        id: 'education',
        title: 'Education & Technology',
        desc: 'Schools, universities, training centers, and tech companies.',
        sectors: [
          { id: 'education', icon: '🎓', title: 'Education Sector', desc: 'General education sector evaluation.' },
          { id: 'private-school', icon: '🏫', title: 'Private School', desc: 'Private school.' },
          { id: 'nursery', icon: '🧸', title: 'Nursery', desc: 'Children nursery.' },
          { id: 'private-university', icon: '🎓', title: 'Private University', desc: 'Private university.' },
          { id: 'training-center', icon: '📚', title: 'Training Center', desc: 'Vocational and academic training.' },
          { id: 'e-learning-platform', icon: '💻', title: 'E-Learning Platform', desc: 'E-learning platform.' },
          { id: 'technology', icon: '💻', title: 'Technology Sector', desc: 'Software companies, SaaS, and applications.' },
        ]
      },
      {
        id: 'commerce',
        title: 'Commerce & Logistics',
        desc: 'General trade, retail, transport, warehousing, and agriculture.',
        sectors: [
          { id: 'commercial', icon: '🤝', title: 'Commercial Sector', desc: 'Trading agencies, import/export, and general trade.' },
          { id: 'retail', icon: '🛒', title: 'Retail Sector', desc: 'Retail stores, supermarkets, and e-commerce.' },
          { id: 'logistics', icon: '🚛', title: 'Logistics Sector', desc: 'Transportation, warehousing, delivery, and supply chain.' },
          { id: 'shipping-company', icon: '🚢', title: 'Shipping Company', desc: 'Local and international shipping.' },
          { id: 'transport-fleet', icon: '🚛', title: 'Transport Fleet', desc: 'Own and operate a transport fleet.' },
          { id: 'distribution-center', icon: '🏭', title: 'Distribution Center', desc: 'Order sorting and distribution.' },
          { id: 'last-mile-delivery', icon: '🛵', title: 'Last-Mile Delivery', desc: 'Last-mile delivery service.' },
          { id: 'agriculture', icon: '🌾', title: 'Agriculture Sector', desc: 'Farms, poultry farms, and food production.' },
        ]
      }
    ];

    const main = document.getElementById('investmentMain');
    const searchInput = document.getElementById('sectorSearch');
    const searchClear = document.getElementById('searchClear');
    const categoryChips = document.getElementById('categoryChips');
    const resultsCount = document.getElementById('resultsCount');

    function createCard(sector) {
      const card = document.createElement('a');
      card.href = sector.id + '.html';
      card.className = 'sector-card';
      card.dataset.title = sector.title;
      card.dataset.category = sector.categoryId;
      card.innerHTML = `
        <div class="sector-card__icon">${sector.icon}</div>
        <div class="sector-card__title">${sector.title}</div>
        <div class="sector-card__desc">${sector.desc}</div>
      `;
      return card;
    }

    function render() {
      main.innerHTML = '';
      groups.forEach(group => {
        const section = document.createElement('section');
        section.className = 'sector-group';
        section.dataset.category = group.id;
        section.innerHTML = `
          <div class="sector-group__header">
            <h2 class="sector-group__title">${group.title}</h2>
            <p class="sector-group__desc">${group.desc}</p>
          </div>
          <div class="sectors-grid"></div>
        `;
        const grid = section.querySelector('.sectors-grid');
        group.sectors.forEach(s => {
          s.categoryId = group.id;
          grid.appendChild(createCard(s));
        });
        main.appendChild(section);
      });
    }

    function normalize(str) {
      return str.toLowerCase().trim().replace(/[^\w\s]/g, '');
    }

    function filter() {
      const query = normalize(searchInput.value);
      const activeChip = categoryChips.querySelector('.category-chip.active');
      const activeCategory = activeChip ? activeChip.dataset.category : 'all';
      let visibleCount = 0;

      document.querySelectorAll('.sector-group').forEach(section => {
        const groupId = section.dataset.category;
        const groupMatches = activeCategory === 'all' || activeCategory === groupId;
        let groupVisible = false;

        section.querySelectorAll('.sector-card').forEach(card => {
          const title = normalize(card.dataset.title);
          const desc = normalize(card.querySelector('.sector-card__desc').textContent);
          const matchesSearch = !query || title.includes(query) || desc.includes(query);
          const matchesCategory = groupMatches;
          const visible = matchesSearch && matchesCategory;
          card.style.display = visible ? '' : 'none';
          if (visible) {
            visibleCount++;
            groupVisible = true;
          }
        });

        section.style.display = groupVisible ? '' : 'none';
      });

      resultsCount.textContent = `${visibleCount} calculator${visibleCount !== 1 ? 's' : ''} ${query ? 'matched' : 'available'}`;
      searchClear.style.display = query ? 'flex' : 'none';
    }

    categoryChips.addEventListener('click', e => {
      if (!e.target.classList.contains('category-chip')) return;
      categoryChips.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
      e.target.classList.add('active');
      filter();
    });

    searchInput.addEventListener('input', filter);
    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      filter();
      searchInput.focus();
    });

    render();
    filter();
  </script>
</body>
