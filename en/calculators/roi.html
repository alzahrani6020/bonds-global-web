  <script>
    function formatCurrency(value) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(value);
    }

    function updateSharedEnhancements(result, inputs) {
      if (window.BondsEnhancements) {
        window.BondsEnhancements.updateKpiCards({
          becKpiNetProfit: { text: formatCurrency(result.netProfit), color: result.netProfit >= 0 ? '#16a34a' : '#dc2626' },
          becKpiRoi: { text: result.roi.toFixed(2) + '%', color: result.roi >= 0 ? '#16a34a' : '#dc2626' },
          becKpiPayback: { text: result.paybackText, color: result.payback > 0 && result.payback <= inputs.years ? '#16a34a' : '#f59e0b' },
          becKpiNpv: { text: formatCurrency(result.npv), color: result.npv >= 0 ? '#16a34a' : '#dc2626' },
          becKpiAnnualCashFlow: { text: formatCurrency(result.annualNet), color: result.annualNet >= 0 ? '#16a34a' : '#dc2626' },
          becKpiTotalReturn: { text: formatCurrency(result.totalNet), color: result.totalNet >= inputs.investment ? '#16a34a' : '#f59e0b' }
        });
        window.BondsEnhancements.updateSmartAlerts({
          profitMargin: result.roi,
          revenue: inputs.revenue,
          fixedCosts: inputs.costs + inputs.investment,
          netProfit: result.netProfit,
          npv: result.npv,
          payback: result.payback,
          projectYears: inputs.years,
          annualNet: result.annualNet
        });
      }

      window.getCalculatorData = function() {
        return {
          country: 'SA',
          currency: 'USD',
          inputs: inputs,
          kpis: [
            { label: 'Net Profit', value: formatCurrency(result.netProfit), color: result.netProfit >= 0 ? '#16a34a' : '#dc2626' },
            { label: 'ROI', value: result.roi.toFixed(2) + '%', color: result.roi >= 0 ? '#16a34a' : '#dc2626' },
            { label: 'Payback Period', value: result.paybackText, color: result.payback > 0 && result.payback <= inputs.years ? '#16a34a' : '#f59e0b' },
            { label: 'NPV', value: formatCurrency(result.npv), color: result.npv >= 0 ? '#16a34a' : '#dc2626' },
            { label: 'Annual Cash Flow', value: formatCurrency(result.annualNet), color: result.annualNet >= 0 ? '#16a34a' : '#dc2626' }
          ],
          csvRows: [
            ['Item', 'Value'],
            ['Initial Investment', inputs.investment],
            ['Annual Revenue', inputs.revenue],
            ['Annual Operating Costs', inputs.costs],
            ['Project Duration (Years)', inputs.years],
            ['Annual Discount Rate (%)', (inputs.discountRate * 100).toFixed(2)],
            ['', ''],
            ['Annual Cash Flow', result.annualNet],
            ['Total Return', result.totalNet],
            ['Net Profit', result.netProfit],
            ['ROI (%)', result.roi],
            ['Payback Period (Years)', result.payback],
            ['NPV', result.npv]
          ],
          aiPayload: {
            initial_investment: inputs.investment,
            annual_revenue: inputs.revenue,
            annual_costs: inputs.costs,
            project_years: inputs.years,
            discount_rate_pct: inputs.discountRate * 100,
            annual_net_cash_flow: result.annualNet,
            total_return: result.totalNet,
            net_profit: result.netProfit,
            roi_pct: result.roi,
            payback_years: result.payback,
            npv: result.npv
          },
          aiType: 'roi_analysis'
        };
      };
    }

    window.loadCalculatorData = function(data) {
      if (!data || !data.inputs) return;
      var i = data.inputs;
      if (i.investment !== undefined) document.getElementById('initialInvestment').value = i.investment;
      if (i.revenue !== undefined) document.getElementById('annualRevenue').value = i.revenue;
      if (i.costs !== undefined) document.getElementById('annualCosts').value = i.costs;
      if (i.years !== undefined) document.getElementById('projectYears').value = i.years;
      if (i.discountRate !== undefined) document.getElementById('discountRate').value = i.discountRate;
      calculateROI();
    };

    function calculateROI() {
      if (window.BondsAnalytics && window.BondsAnalytics.trackEvent) {
        window.BondsAnalytics.trackEvent('calc_completed', { calculator: 'roi', country: 'SA' });
      }
      window._calcCompleted = true;
      const investment = parseFloat(document.getElementById('initialInvestment').value) || 0;
      const revenue = parseFloat(document.getElementById('annualRevenue').value) || 0;
      const costs = parseFloat(document.getElementById('annualCosts').value) || 0;
      const years = parseFloat(document.getElementById('projectYears').value) || 5;
      const discountRate = (parseFloat(document.getElementById('discountRate').value) || 0) / 100;

      if (investment <= 0) {
        alert('Please enter an initial investment greater than zero.');
        return;
      }

      const annualNet = revenue - costs;
      const totalNet = annualNet * years;
      const netProfit = totalNet - investment;
      const roi = (netProfit / investment) * 100;
      const payback = annualNet > 0 ? (investment / annualNet) : Infinity;

      let npv = -investment;
      for (let i = 1; i <= years; i++) {
        npv += annualNet / Math.pow(1 + discountRate, i);
      }

      const inputs = { investment: investment, revenue: revenue, costs: costs, years: years, discountRate: discountRate };
      const result = {
        annualNet: annualNet,
        totalNet: totalNet,
        netProfit: netProfit,
        roi: roi,
        payback: payback,
        paybackText: isFinite(payback) ? payback.toFixed(2) + ' years' : 'Unlimited',
        npv: npv
      };

      document.getElementById('netProfit').textContent = formatCurrency(netProfit);
      document.getElementById('roiResult').textContent = roi.toFixed(2) + '%';
      document.getElementById('paybackPeriod').textContent = result.paybackText;
      document.getElementById('npvResult').textContent = formatCurrency(npv);
      document.getElementById('annualCashFlow').textContent = formatCurrency(annualNet);
      document.getElementById('resultsPanel').style.display = 'block';
      updateSharedEnhancements(result, inputs);
      document.getElementById('resultsPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  </script>
  <script>
    // Auth-aware action gate: calculator is fully usable without login.
    // Login is only requested when the user tries to save, export, or convert to V3.
    (function () {
      function storeCurrentInputs() {
        try {
          var payload = {};
          ['initialInvestment','annualRevenue','annualCosts','projectYears','discountRate'].forEach(function(id) {
            var el = document.getElementById(id);
            payload[id] = el ? el.value : '';
          });
          sessionStorage.setItem('bonds_roi_draft', JSON.stringify(payload));
        } catch (e) {}
      }

      window.bondsSaveDraft = storeCurrentInputs;

      function trackActionEvent(action) {
        if (window.BondsAnalytics && window.BondsAnalytics.trackEvent) {
          var name = action === 'save' ? 'calc_save_clicked' :
                     action === 'pdf' ? 'calc_export_clicked' :
                     action === 'v3' ? 'calc_v3_clicked' : 'calc_action_clicked';
          window.BondsAnalytics.trackEvent(name, { calculator: 'roi', action: action, country: 'SA' });
        }
      }

      window.checkAuthForAction = async function(action, onAllowed) {
        storeCurrentInputs();
        trackActionEvent(action);
        if (window.BondsAuth && window.BondsAuth.getUser) {
          const { data: userData } = await window.BondsAuth.getUser();
          if (userData?.user) {
            if (onAllowed) onAllowed();
            return true;
          }
        }
        sessionStorage.setItem('auth_redirect', window.location.pathname + window.location.search);
        sessionStorage.setItem('bonds_pending_action', JSON.stringify({ source: window.location.pathname, action: action }));
        if (typeof showAuthModal === 'function') {
          showAuthModal(action, function() {
            if (window.BondsAnalytics && window.BondsAnalytics.trackEvent) {
              window.BondsAnalytics.trackEvent('calc_signup_from_action', { calculator: 'roi', action: action });
            }
            window.location.href = '/calculators/auth/index.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
          }, function() {
            // continue as guest
          });
        } else {
          window.location.href = '/calculators/auth/index.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
        }
        return false;
      };

      window.saveROIProject = function() {
        try {
          if (window.BondsAnalytics && window.BondsAnalytics.trackEvent) {
            window.BondsAnalytics.trackEvent('calc_project_saved', { calculator: 'roi', country: 'SA' });
          }
          var roiText = document.getElementById('roiResult')?.textContent || '—';
          var paybackText = document.getElementById('paybackPeriod')?.textContent || '—';
          var title = 'Return on Investment Study';
          var summary = 'ROI ' + roiText + ' · Payback ' + paybackText;
          var projects = JSON.parse(localStorage.getItem('bonds_guest_projects') || '[]');
          projects.unshift({
            title: title,
            summary: summary,
            href: window.location.pathname + window.location.search,
            createdAt: new Date().toISOString(),
            source: 'roi'
          });
          localStorage.setItem('bonds_guest_projects', JSON.stringify(projects.slice(0, 20)));
          BondsUI.toast('✅ Project saved to your workspace', 'success');
        } catch (e) {
          BondsUI.toast('⚠️ Could not save locally', 'warning');
        }
      };

      window.convertROIToV3 = async function() {
        try {
          BondsUI.toast('Creating V3 project...', 'info');
          var investment = parseFloat(document.getElementById('initialInvestment')?.value) || 0;
          var revenue = parseFloat(document.getElementById('annualRevenue')?.value) || 0;
          var costs = parseFloat(document.getElementById('annualCosts')?.value) || 0;
          var years = parseFloat(document.getElementById('projectYears')?.value) || 5;
          var annualNet = revenue - costs;
          var payload = {
            name: 'Return on Investment Study',
            sector: 'Investment',
            activity: 'Investment Evaluation',
            cityCode: null,
            currency: 'USD',
            capital: investment,
            revenue: revenue * years,
            annualProfit: annualNet * years,
            language: 'en'
          };
          const { data: sessionData } = await window.BondsAuth.getSession();
          const token = sessionData?.session?.access_token;
          const res = await fetch('/api/v3/projects', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(token ? { 'Authorization': 'Bearer ' + token } : {})
            },
            body: JSON.stringify(payload)
          });
          const json = await res.json().catch(() => ({}));
          if (!res.ok) {
            BondsUI.toast('⚠️ ' + (json.error || 'Failed to create project'), 'error');
            return;
          }
          if (json.project?.id) {
            window.location.href = '/en/v3/project?id=' + encodeURIComponent(json.project.id);
          } else {
            BondsUI.toast('⚠️ Project link not received', 'error');
          }
        } catch (e) {
          BondsUI.toast('⚠️ Failed to connect to V3 project', 'error');
        }
      };

      // Track first user interaction
      (function trackFirstInteraction() {
        var tracked = false;
        function once() {
          if (tracked) return;
          tracked = true;
          if (window.BondsAnalytics && window.BondsAnalytics.trackEvent) {
            window.BondsAnalytics.trackEvent('calc_started', { calculator: 'roi', country: 'SA' });
          }
        }
        document.querySelectorAll('input, select').forEach(function(el) {
          el.addEventListener('input', once);
          el.addEventListener('change', once);
        });
      })();

      // Restore draft inputs if user returns from login
      (function restoreDraft() {
        try {
          var raw = sessionStorage.getItem('bonds_roi_draft');
          if (!raw) return;
          var draft = JSON.parse(raw);
          Object.keys(draft).forEach(function(id) {
            var el = document.getElementById(id);
            if (el && draft[id] !== undefined && draft[id] !== '') {
              el.value = draft[id];
            }
          });
          sessionStorage.removeItem('bonds_roi_draft');
        } catch (e) {}
      })();

      // Auto-execute pending action if user just returned from login
      (function handlePendingAction() {
        if (typeof window === 'undefined' || !window.BondsAuth) return;
        window.BondsAuth.getUser().then(function(userData) {
          if (!userData?.user) return;
          try {
            var pendingRaw = sessionStorage.getItem('bonds_pending_action');
            if (!pendingRaw) return;
            var pending = JSON.parse(pendingRaw);
            if (pending.source !== window.location.pathname) return;
            sessionStorage.removeItem('bonds_pending_action');
            if (pending.action === 'save' && window.saveROIProject) window.saveROIProject();
            else if (pending.action === 'pdf' && window.print) window.print();
            else if (pending.action === 'v3' && window.convertROIToV3) window.convertROIToV3();
          } catch (e) {}
        });
      })();
    })();
  </script>
