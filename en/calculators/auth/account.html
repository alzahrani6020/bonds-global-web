<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account — Bonds</title>
  <link rel="stylesheet" href="../../../styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:var(--space-6)}
.account-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-8);flex-wrap:wrap;gap:var(--space-4)}
.account-header h1{font-size:1.8rem;font-weight:800;color:var(--gold)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-6);margin-bottom:var(--space-6)}
.card h2{font-size:1.1rem;font-weight:700;color:var(--gold);margin-bottom:var(--space-4);display:flex;align-items:center;gap:var(--space-3)}
.card h2 span{font-size:1.3rem}
.info-row{display:flex;justify-content:space-between;padding:var(--space-3) 0;border-bottom:1px solid var(--border);font-size:0.95rem}
.info-row:last-child{border-bottom:none}
.info-row .label{color:var(--text-secondary)}
.info-row .value{font-weight:700}
.tier-badge{display:inline-block;padding:0.3rem 0.8rem;border-radius:20px;font-size:0.8rem;font-weight:700}
.tier-free{background:rgba(150,150,150,0.15);color:#aaa}
.tier-pro{background:rgba(212,168,83,0.15);color:var(--gold);border:1px solid rgba(212,168,83,0.3)}
.tier-enterprise{background:rgba(138,43,226,0.15);color:#a855f7;border:1px solid rgba(138,43,226,0.3)}
.btn{padding:var(--space-3) var(--space-6);border-radius:var(--radius-md);font-family:inherit;font-size:0.95rem;font-weight:700;cursor:pointer;border:none;transition:all 0.2s;text-decoration:none;display:inline-block}
.btn-secondary:hover{border-color:var(--gold)}
.btn-danger{background:#3a1515;color:#ff8a8a;border:1px solid #5a2525}
.btn-danger:hover{background:#4a2020}
.actions{display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-6)}
.empty-state{text-align:center;color:var(--text-secondary);padding:var(--space-8)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6)}
.notification-list{display:flex;flex-direction:column;gap:var(--space-3)}
.notification-item{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-4);transition:all 0.2s}
.notification-item:hover{border-color:var(--border-hover)}
.notification-item.unread{border-left:3px solid var(--gold)}
.notification-header{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-2);flex-wrap:wrap}
.notification-subject{font-weight:800;color:var(--gold);font-size:1rem}
.notification-time{font-size:0.75rem;color:var(--text-secondary);white-space:nowrap}
.notification-body{color:var(--text-secondary);font-size:0.9rem;line-height:1.6;white-space:pre-wrap;margin-bottom:var(--space-3)}
.notification-actions{display:flex;gap:var(--space-3);flex-wrap:wrap}
.notification-actions .btn{font-size:0.8rem;padding:0.4rem 0.8rem}
.notification-badge{display:inline-flex;align-items:center;justify-content:center;min-width:1.4rem;height:1.4rem;border-radius:50%;background:var(--danger);color:#fff;font-size:0.7rem;font-weight:800;margin-left:var(--space-2)}
@media(max-width:768px){.grid-2{grid-template-columns:1fr}</style>

    <div class="grid-2">
      <!-- Profile Card -->

        <h2><span><span class="emoji-icon" style="display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;" aria-hidden="true"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#E1E8ED" d="M36 18c0 9.941-8.059 18-18 18S0 27.941 0 18 8.059 0 18 0s18 8.059 18 18z"/><path fill="#CCD6DD" d="M30 18c0 6.628-5.372 12-12 12S6 24.628 6 18 11.372 6 18 6s12 5.372 12 12z"/><path fill="#E1E8ED" d="M29 18c0 6.075-4.925 11-11 11-6.076 0-11-4.925-11-11 0-6.076 4.925-11 11-11s11 4.924 11 11z"/><g fill="#99AAB5"><circle cx="1" cy="1" r="1"/><path d="M0 1h2v7H0z"/><circle cx="5" cy="1" r="1"/><path d="M4 1h2v7H4z"/><circle cx="9" cy="1" r="1"/><path d="M8 1h2v7H8zM3 14h4v20H3z"/><circle cx="5" cy="34" r="2"/><path d="M8 8c0 .552-.448 1-1 1s-1-.448-1-1H4c0 .552-.448 1-1 1s-1-.448-1-1H0c0 3.866 1 7 5 7s5-3.134 5-7H8z"/><circle cx="1" cy="8" r="1"/><circle cx="5" cy="8" r="1"/><circle cx="9" cy="8" r="1"/></g><g fill="#99AAB5"><path d="M30 14h4v20h-4z"/><circle cx="32" cy="34" r="2"/><path d="M32 0c1 0 2 1 2 3v16s-7 2-7-8c0-6 3-11 5-11z"/></g></svg></span>️</span> Profile</h2>
        <div id="profileLoading" class="empty-state">Loading...</div>
        <div id="profileContent" style="display:none;">
          <div class="info-row"><span class="label">Name</span><span class="value" id="accName">—</span></div>
          <div class="info-row"><span class="label">Email</span><span class="value" id="accEmail">—</span></div>
          <div class="info-row"><span class="label">Country</span><span class="value" id="accCountry">—</span></div>
          <div class="info-row"><span class="label">Language</span><span class="value" id="accLang">—</span></div>
        </div>
      </div>

      <!-- Subscription Card -->
      <div class="card">
        <h2><span><span class="emoji-icon" style="display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;" aria-hidden="true"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#FFAC33" d="M4 5C1.791 5 0 6.791 0 9v18c0 2.209 1.791 4 4 4h28c2.209 0 4-1.791 4-4V9s0-4-4-4H4z"/><path fill="#292F33" d="M0 10h36v5H0z"/><path fill="#F4F7F9" d="M4 19h28v6H4z"/><path fill="#8899A6" d="M19 24c-1.703 0-2.341-1.21-2.469-1.801-.547.041-1.08.303-1.805.764C13.961 23.449 13.094 24 12 24c-1.197 0-1.924-.675-2-2-.003-.056.038-.188.021-.188-1.858 0-3.202 1.761-3.215 1.779-.195.267-.499.409-.806.409-.206 0-.413-.063-.591-.194-.445-.327-.542-.953-.215-1.398C5.271 22.303 7.11 20 10 20c1.937 0 2.048 1.375 2.078 1.888l.007.109c.486-.034.991-.354 1.57-.723.961-.61 2.153-1.371 3.75-.962.871.223 1.007 1.031 1.059 1.336.013.076.032.19.049.226.007 0 .146.091.577.13.82.075 1.721-.279 2.675-.653.988-.388 2.01-.788 3.111-.788 3.389 0 4.767 1.635 4.913 1.821.34.435.264 1.063-.171 1.403-.175.137-.381.207-.587.213-.307.009-.613-.123-.817-.384-.024-.027-.93-1.054-3.337-1.054-.723 0-1.528.315-2.381.649-1.009.396-2.434.789-3.496.789z"/></svg></span></span> Subscription</h2>
        <div id="subLoading" class="empty-state">Loading...</div>
        <div id="subContent" style="display:none;">
          <div class="info-row"><span class="label">Plan</span><span class="value" id="accTier">—</span></div>
          <div class="info-row"><span class="label">Status</span><span class="value" id="accStatus">—</span></div>
          <div class="info-row" id="renewalRow" style="display:none;"><span class="label">Renews</span><span class="value" id="accRenewal">—</span></div>
          <div class="actions">
            <button id="btnManageSub" class="btn btn-primary" style="display:none;">Manage Subscription</button>
            <a href="../../pricing.html" id="btnUpgrade" class="btn btn-primary" style="display:none;">Upgrade</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Notifications Card -->
    <div class="card">
      <h2><span><span class="emoji-icon" style="display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;" aria-hidden="true"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#FFAC33" d="M28 13c0 11 5 10 5 15 0 0 0 2-2 2H5c-2 0-2-2-2-2 0-5 5-4 5-15C8 7.478 12.477 3 18 3s10 4.478 10 10z"/><circle fill="#FFAC33" cx="18" cy="3" r="3"/><path fill="#FFAC33" d="M18 36c2.209 0 4-1.791 4-4h-8c0 2.209 1.791 4 4 4z"/></svg></span></span> Notifications <span id="notifBadge" class="notification-badge" style="display:none;">0</span></h2>
      <div id="notificationsLoading" class="empty-state">Loading...</div>
      <div id="notificationsList" style="display:none;"></div>
    </div>

    <!-- Scenarios Card -->
    <div class="card">
      <h2><span><span class="emoji-icon" style="display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;" aria-hidden="true"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#269" d="M0 29c0 2.209 1.791 4 4 4h24c2.209 0 4-1.791 4-4V12c0-2.209-1.791-4-4-4h-9c-3.562 0-3-5-8.438-5H4C1.791 3 0 4.791 0 7v22z"/><path fill="#55ACEE" d="M30 10h-6.562C18 10 18.562 15 15 15H6c-2.209 0-4 1.791-4 4v10c0 .553-.448 1-1 1s-1-.447-1-1c0 2.209 1.791 4 4 4h26c2.209 0 4-1.791 4-4V14c0-2.209-1.791-4-4-4z"/></svg></span></span> Saved Scenarios</h2>
      <div id="scenariosLoading" class="empty-state">Loading...</div>
      <div id="scenariosList" style="display:none;"></div>
    </div>

    <!-- Health Score History -->
    <div class="card" id="healthCard" style="display:none;">
      <h2><span><span class="emoji-icon" style="display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;" aria-hidden="true"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#DD2E44" d="M35.885 11.833c0-5.45-4.418-9.868-9.867-9.868-3.308 0-6.227 1.633-8.018 4.129-1.791-2.496-4.71-4.129-8.017-4.129-5.45 0-9.868 4.417-9.868 9.868 0 .772.098 1.52.266 2.241C1.751 22.587 11.216 31.568 18 34.034c6.783-2.466 16.249-11.447 17.617-19.959.17-.721.268-1.469.268-2.242z"/></svg></span>️</span> Health Score History</h2>
      <div id="healthHistoryList"></div>

    <div class="actions" style="justify-content:center;">
      <button onclick="window.BondsAuth.signOut().then(()=>location.href='../../index.html')" class="btn btn-danger"><span class="emoji-icon" style="display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;" aria-hidden="true"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#BF6952" d="M29 34c0 1.105-.895 2-2 2H9c-1.105 0-2-.895-2-2V2c0-1.105.895-2 2-2h18c1.105 0 2 .895 2 2v32z"/><circle fill="#FFAC33" cx="11" cy="18" r="1.5"/><path fill="#AC5640" d="M25 3c-.552 0-1 .448-1 1v9H11c-.552 0-1 .448-1 1s.448 1 1 1h14c.552 0 1-.448 1-1V4c0-.552-.448-1-1-1zm0 25c.552 0 1 .448 1 1v3c0 .552-.448 1-1 1H11c-.552 0-1-.448-1-1s.448-1 1-1h13v-2c0-.552.448-1 1-1z"/><path fill="#854836" d="M11 33c-.552 0-1-.448-1-1v-3c0-.552.448-1 1-1h14c.552 0 1 .448 1 1s-.448 1-1 1H12v2c0 .552-.448 1-1 1z"/><path fill="#AC5640" d="M25 21c.552 0 1 .448 1 1v3c0 .552-.448 1-1 1H11c-.552 0-1-.448-1-1s.448-1 1-1h13v-2c0-.552.448-1 1-1z"/><path fill="#854836" d="M11 26c-.552 0-1-.448-1-1v-3c0-.552.448-1 1-1h14c.552 0 1 .448 1 1s-.448 1-1 1H12v2c0 .552-.448 1-1 1zm0-11c-.552 0-1-.448-1-1V4c0-.552.448-1 1-1h14c.552 0 1 .448 1 1s-.448 1-1 1H12v9c0 .552-.448 1-1 1z"/></svg></span> Sign Out</button>
    </div>
  </div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3.0.7"></script>
  <script src="/lib/bonds-common.js"></script>
  <script src="../../../calculators/shared-geo.js?v=7"></script>

  <script>
    // Env validation
    setTimeout(function(){
      var env = window.__ENV || {};
      if (!env.SUPABASE_URL || !env.SUPABASE_ANON_KEY) {
        var banner = document.createElement('div');
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#5a1a1a;color:#ff8a8a;padding:12px;text-align:center;z-index:99999;font-size:0.9rem;';
        banner.innerHTML = '⚠️ Environment variables are not configured. Please check the deployment guide.';
        document.body.prepend(banner);
      }
    }, 500);
    (async function() {
      'use strict';

      const { data: sessionData } = await window.BondsAuth.getSession();
      const session = sessionData?.session;
      if (!session) {
        window.location.href = 'index.html?redirect=' + encodeURIComponent(location.pathname);
        return;
      }

      // Ensure geo metadata is available for country lookups.
      await window.BondsGeo.ensureMasterData().catch(() => {});

      const user = session.user;
      const sb = window.BondsAuth.getSupabase();

      // Load profile
      const { data: profile } = await window.BondsAuth.getProfile(user.id);
      document.getElementById('profileLoading').style.display = 'none';
      document.getElementById('profileContent').style.display = 'block';
      document.getElementById('accName').textContent = profile?.restaurant_name || user.user_metadata?.restaurant_name || '—';
      document.getElementById('accEmail').textContent = user.email;
      document.getElementById('accCountry').textContent = profile?.country || user.user_metadata?.country || '—';
      document.getElementById('accLang').textContent = profile?.language === 'en' ? 'English' : 'العربية';

      // Load subscription
      const { data: sub } = await window.BondsAuth.getSubscription(user.id);
      document.getElementById('subLoading').style.display = 'none';
      document.getElementById('subContent').style.display = 'block';

      const tier = sub?.tier || 'free';
      const status = sub?.status || 'inactive';
      const tierLabel = tier === 'enterprise' ? 'Enterprise' : (tier === 'pro' ? 'Pro' : 'Free');
      const tierClass = tier === 'enterprise' ? 'tier-enterprise' : (tier === 'pro' ? 'tier-pro' : 'tier-free');
      const statusLabel = status === 'active' ? 'Active' : (status === 'trialing' ? 'Trialing' : (status === 'past_due' ? 'Past Due' : 'Inactive'));

      document.getElementById('accTier').innerHTML = `<span class="tier-badge ${tierClass}">${tierLabel}</span>`;
      document.getElementById('accStatus').textContent = statusLabel;

      if (sub?.current_period_end) {
        document.getElementById('renewalRow').style.display = 'flex';
        document.getElementById('accRenewal').textContent = new Date(sub.current_period_end).toLocaleDateString('en-US');
      }

      if (tier === 'free') {
        document.getElementById('btnUpgrade').style.display = 'inline-block';
      } else if (sub?.stripe_subscription_id) {
        document.getElementById('btnManageSub').style.display = 'inline-block';
        document.getElementById('btnManageSub').addEventListener('click', async () => {
          try {
            const res = await fetch('/api/billing?action=portal', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + session.access_token
              },
              body: JSON.stringify({ userId: user.id })
            });
            const json = await res.json();
            if (json.url) window.location.href = json.url;
            else alert(json.error || 'Unable to open billing portal');
          } catch(e) { alert('Unable to open billing portal'); }
        });
      }

      // Load scenarios
      const { data: scenarios } = await sb.from('scenarios').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
      document.getElementById('scenariosLoading').style.display = 'none';
      const list = document.getElementById('scenariosList');
      list.style.display = 'block';

      if (!scenarios || scenarios.length === 0) {
        list.innerHTML = '<div class="empty-state">No saved scenarios. <a href="../../calculators/restaurant.html" style="color:var(--gold);">Go to calculator</a></div>';
      } else {
        list.innerHTML = scenarios.map(s => `
          <div class="info-row" style="align-items:center;">
            <div>
              <div style="font-weight:700;">${s.name}</div>
              <div style="font-size:0.8rem;color:var(--text-secondary);">${window.BondsGeo.getCountryName(s.country, 'en')} · ${new Date(s.created_at).toLocaleDateString('en-US')}</div>
            </div>
            <a href="../../calculators/restaurant.html?country=${s.country}&load=${s.id}" class="btn btn-secondary" style="font-size:0.8rem;padding:0.4rem 0.8rem;">Open</a>
          </div>
        `).join('');
      }

      // Load health score history (Pro only)
      if (tier === 'pro' || tier === 'enterprise') {
        const { data: healthScores } = await sb.from('health_scores').select('*').eq('user_id', user.id).order('created_at', { ascending: false }).limit(20);
        if (healthScores && healthScores.length > 0) {
          document.getElementById('healthCard').style.display = 'block';
          document.getElementById('healthHistoryList').innerHTML = healthScores.map(h => `
            <div class="info-row" style="align-items:center;">
              <div>
                <div style="font-weight:700;">${window.BondsGeo.getCountryName(h.country, 'en')}</div>
                <div style="font-size:0.8rem;color:var(--text-secondary);">${new Date(h.created_at).toLocaleDateString('en-US')}</div>
              </div>
              <div class="tier-badge ${h.score >= 80 ? 'tier-pro' : (h.score >= 50 ? 'tier-free' : 'tier-danger')}" style="font-size:0.85rem;padding:0.2rem 0.6rem;">${h.score}/100</div>
            </div>
          `).join('');
        }
      }

      // Load admin notifications
      function BondsCommon.escapeHtml(text) {
        if (text == null) return '';
        return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      async function loadNotifications() {
        const { data: notifications, error } = await sb.from('user_notifications').select('*').eq('user_id', user.id).order('created_at', { ascending: false }).limit(20);
        const loading = document.getElementById('notificationsLoading');
        const list = document.getElementById('notificationsList');
        if (loading) loading.style.display = 'none';
        if (list) list.style.display = 'block';
        if (error || !notifications || notifications.length === 0) {
          if (list) list.innerHTML = '<div class="empty-state">No notifications yet</div>';
          return;
        }
        const unreadCount = notifications.filter(n => !n.read).length;
        const badge = document.getElementById('notifBadge');
        if (badge) { badge.textContent = unreadCount; badge.style.display = unreadCount > 0 ? 'inline-flex' : 'none'; }
        if (list) {
          list.innerHTML = notifications.map(n => `
            <div class="notification-item ${n.read ? '' : 'unread'}">
              <div class="notification-header">
                <span class="notification-subject">${BondsCommon.escapeHtml(n.subject)} ${n.read ? '' : '<span style="font-size:0.7rem;background:rgba(212,168,83,0.15);color:var(--gold);padding:0.1rem 0.4rem;border-radius:50px;margin-left:0.4rem;">New</span>'}</span>
                <span class="notification-time">${new Date(n.created_at).toLocaleString('en-US')}</span>
              </div>
              <div class="notification-body">${BondsCommon.escapeHtml(n.body)}</div>
              <div class="notification-actions">
                ${n.read ? '' : `<button class="btn btn-secondary" onclick="markNotificationRead('${n.id}')">Mark read</button>`}
                <button class="btn btn-danger" onclick="deleteNotification('${n.id}')">Delete</button>
              </div>
            </div>
          `).join('');
        }
      }
      async function markNotificationRead(id) {
        const { error } = await sb.from('user_notifications').update({ read: true }).eq('id', id).eq('user_id', user.id);
        if (!error) loadNotifications();
      }
      async function deleteNotification(id) {
        if (!confirm('Delete this notification?')) return;
        const { error } = await sb.from('user_notifications').delete().eq('id', id).eq('user_id', user.id);
        if (!error) loadNotifications();
      }
      window.markNotificationRead = markNotificationRead;
      window.deleteNotification = deleteNotification;
      loadNotifications();
    })();
  </script>
  <script src="../../../page-tracker-v2.js"></script>
<script src="/components/emoji-icons.js"></script>
<script src="/components/emoji-renderer.js"></script>
</body>
</html>
