<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Created — Bonds</title>
  <link rel="stylesheet" href="../../../styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../../../assets/bonds-mark.svg">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter','Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-4)}
    .container{width:100%;max-width:420px;text-align:center}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-10) var(--space-6)}
    .icon{font-size:4rem;margin-bottom:var(--space-6);display:block}
    .icon svg{width:1em;height:1em;display:block;margin:0 auto}
    h1{font-size:1.5rem;font-weight:800;margin-bottom:var(--space-4);color:var(--gold)}
    p{color:var(--text-secondary);font-size:1rem;line-height:1.7;margin-bottom:var(--space-6)}
    .brand{color:var(--gold);font-weight:700}
    .btn{display:inline-block;width:100%;padding:14px 24px;border-radius:10px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;border:none;transition:all 0.2s;text-decoration:none;background:var(--gold);color:#0c0c0c}
    .btn:hover{background:#d4b76a;transform:translateY(-1px)}
  </style>
  <link rel="canonical" href="https://bonds-global.com/en/calculators/auth/verify-email" />
  <meta property="og:title" content="Account Created — Bonds" />
  <meta property="og:description" content="Specialized financial calculators and economic consulting from Bonds." />

  <meta property="og:url" content="https://bonds-global.com/en/calculators/auth/verify-email" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Account Created — Bonds" />
  <meta name="twitter:description" content="Specialized financial calculators and economic consulting from Bonds." />
  <meta name="twitter:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />

  <meta name="description" content="Specialized financial calculators and economic consulting from Bonds." />

<script src="/calculators/auth-gate.js?v=3"></script>
  </head>
<body>
  <div class="container">
    <div class="card">
      <span class="icon" data-icon="mail"></span>
      <h1>Account Created Successfully!</h1>
      <p>
        Your account has been created at <span class="brand">Bonds Financial Consultancy</span>.<br><br>
        We have sent a confirmation link to your email.<br>
        Please check your inbox and click the link to activate your account.
      </p>
      <a href="./index.html" class="btn">Back to Sign In</a>
    </div>
  </div>
  <script src="../../../page-tracker-v2.js"></script>
<script src="../../../components/ecc-icons.js"></script>
<script>
(function () {
  if (!window.EccIcons) return;
  document.querySelectorAll('.icon[data-icon]').forEach(function (el) {
    el.innerHTML = window.EccIcons.get(el.dataset.icon);
  });
})();
</script>
<script src="/components/emoji-icons.js"></script>
<script src="/components/emoji-renderer.js"></script>
</body>
</html>
