  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter','Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-4)}
    .container{width:100%;max-width:420px;text-align:center}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-10) var(--space-6)}
    .icon{font-size:4rem;margin-bottom:var(--space-6);display:block;animation:pop 0.5s ease}
    .icon svg{width:1em;height:1em;display:block;margin:0 auto}
    @keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
    h1{font-size:1.5rem;font-weight:800;margin-bottom:var(--space-4);color:var(--gold)}
    p{color:var(--text-secondary);font-size:1rem;line-height:1.7;margin-bottom:var(--space-6)}
    .brand{color:var(--gold);font-weight:700}
    .btn{display:inline-block;width:100%;padding:14px 24px;border-radius:10px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;border:none;transition:all 0.2s;text-decoration:none;background:var(--gold);color:#0c0c0c;margin-bottom:var(--space-4)}
    .btn:hover{background:#d4b76a;transform:translateY(-1px)}
    .btn-secondary{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
    .btn-secondary:hover{border-color:var(--gold);color:var(--gold)}
    .spinner{width:24px;height:24px;border:3px solid rgba(200,164,92,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;display:inline-block;margin-bottom:var(--space-4)}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>

<body>
  <div class="container">
    <div class="card" id="card">
      <div class="spinner" id="spinner"></div>
      <p id="status" style="color:var(--text-secondary)">Confirming your account...</p>
    </div>
  </div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3.0.7"></script>
  <script src="/calculators/auth/lead-conversion.js?v=1"></script>
  <script>
    (async () => {
      const card = document.getElementById('card');
      const spinner = document.getElementById('spinner');
      const status = document.getElementById('status');

      await new Promise(r => setTimeout(r, 1500));

      const { data } = await window.BondsAuth.getSession();
      const user = data?.session?.user;

      spinner.style.display = 'none';

      if (user) {
        // Preserve the original destination the user wanted before auth
        const authRedirect = sessionStorage.getItem('auth_redirect');

        // Complete signup if pending password exists (magic link / OAuth signup)
        const pendingPassword = sessionStorage.getItem('otp_pending_password');
        if (pendingPassword) {
          status.textContent = 'Setting up your account...';
          try {
            const { error: pwError } = await window.BondsAuth.updateUser({ password: pendingPassword });
            if (pwError) console.warn('[Confirmed] Password set warning:', pwError);
          } catch (e) { console.warn('[Confirmed] Password set exception:', e); }
          sessionStorage.removeItem('otp_pending_password');
          try {
            const metadata = {
              id: user.id,
              restaurant_name: sessionStorage.getItem('otp_pending_name') || user.user_metadata?.restaurant_name || '',
              country: sessionStorage.getItem('otp_pending_country') || user.user_metadata?.country || '',
              language: 'en'
            };
            await window.BondsAuth.updateProfile(user.id, metadata);
          } catch (profileErr) { console.warn('[Confirmed] Profile update warning:', profileErr); }
          sessionStorage.removeItem('otp_pending_name');
          sessionStorage.removeItem('otp_pending_country');
          if (typeof gtag !== 'undefined') gtag('event', 'sign_up', { method: 'email_otp' });
        }

        window.BondsAuth.getProfile(user.id).then(({ data: profile }) => {
          const needsOnboarding = !profile || !profile.city || !profile.business_type || !profile.bio || !profile.needs;
          if (needsOnboarding) {
            card.innerHTML = `
              <span class="icon" data-icon="celebration"></span>
              <h1>Account Confirmed!</h1>
              <p>
                Welcome <strong>${user.user_metadata?.restaurant_name || user.email}</strong>!<br><br>
                Your account has been confirmed. One last step to complete your profile.
              </p>
              <a href="/en/calculators/auth/onboarding.html" class="btn">Complete your profile</a>
            `;
          } else {
            const destination = authRedirect || '/en/calculators/restaurant.html';
            if (window.BondsLeadConversion) window.BondsLeadConversion.markConverted(user.email);
            card.innerHTML = `
              <span class="icon" data-icon="celebration"></span>
              <h1>Account Confirmed!</h1>
              <p>
                Welcome <strong>${user.user_metadata?.restaurant_name || user.email}</strong>!<br><br>
                Your account at <span class="brand">Bonds Financial Consultancy</span> has been confirmed.<br>
                You can now use all services.
              </p>
              <a href="${destination}" class="btn">Go to Calculator</a>
              <a href="/en/calculators/auth/subscription.html" class="btn btn-secondary">Manage Subscription</a>
            `;
          }
        }).catch(() => {
          card.innerHTML = `
            <span class="icon" data-icon="celebration"></span>
            <h1>Account Confirmed!</h1>
            <p>
              Welcome <strong>${user.user_metadata?.restaurant_name || user.email}</strong>!<br><br>
              Your account has been confirmed.
            </p>
            <a href="/en/calculators/auth/onboarding.html" class="btn">Complete your profile</a>
          `;
        });
        return;
      } else {
        card.innerHTML = `
          <span class="icon" data-icon="checkCircle"></span>
          <h1>Account Confirmed!</h1>
          <p>
            Your email has been confirmed at <span class="brand">Bonds Financial Consultancy</span>.<br><br>
            You can now sign in and use all services.
          </p>
          <a href="./index.html" class="btn">Sign In</a>
        `;
      }
    })();
  </script>

<script>
(function () {
  if (!window.EccIcons) return;
  document.querySelectorAll('.icon[data-icon]').forEach(function (el) {
    el.innerHTML = window.EccIcons.get(el.dataset.icon);
  });
})();
</script>
