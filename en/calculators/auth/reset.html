<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../../styles.css" />
  <title>Reset Password — Bonds</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="../../../assets/bonds-mark.svg" />
  <link rel="stylesheet" href="../../../calculators/auth/auth-shared.css" />
  <style>.logo span{font-weight:800;font-size:1.4rem;color:var(--gold)}
.form-group input{width:100%;padding:var(--space-3) var(--space-4);background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text);font-family:inherit;font-size:1rem}
.btn{width:100%;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;border:none;transition:all 0.2s}</style>
  <link rel="canonical" href="https://bonds-global.com/en/calculators/auth/reset" />
  <meta property="og:title" content="Reset Password — Bonds" />
  <meta property="og:description" content="Specialized financial calculators and economic consulting from Bonds." />
  <meta property="og:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />
  <meta property="og:url" content="https://bonds-global.com/en/calculators/auth/reset" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Reset Password — Bonds" />
  <meta name="twitter:description" content="Specialized financial calculators and economic consulting from Bonds." />
  <meta name="twitter:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />

  <meta name="description" content="Specialized financial calculators and economic consulting from Bonds." />

</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <img src="../../../assets/bonds-logo-2026.webp?v=2026" alt="Bonds" />
        <span>Bonds</span>
      </div>
      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>
      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" required minlength="8" placeholder="Min 8 characters" />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" required placeholder="Re-enter password" />
        </div>
        <button type="submit" class="btn btn-primary">Update Password</button>
      </form>
      <a href="index.html" class="back-link">← Back to Sign In</a>
    </div>
  </div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3"></script>
  <script>
    (function(){
      function showError(msg){var el=document.getElementById('errorMsg');el.textContent=msg;el.style.display='block';document.getElementById('successMsg').style.display='none';}
      function showSuccess(msg){var el=document.getElementById('successMsg');el.textContent=msg;el.style.display='block';document.getElementById('errorMsg').style.display='none';}

      document.getElementById('resetForm').addEventListener('submit',async function(e){
        e.preventDefault();
        var pw=document.getElementById('newPassword').value;
        var conf=document.getElementById('confirmPassword').value;
        if(pw.length<8){showError('Password must be at least 8 characters');return;}
        if(pw!==conf){showError('Passwords do not match');return;}
        var sb=window.BondsAuth.getSupabase();
        if(!sb){showError('System not ready');return;}
        var {error}=await sb.auth.updateUser({password:pw});
        if(error){showError(error.message);return;}
        showSuccess('Password updated! Redirecting...');
        setTimeout(function(){window.location.href='index.html';},1500);
      });
    })();
  </script>
  <script src="../../../page-tracker-v2.js"></script>
</body>
</html>
