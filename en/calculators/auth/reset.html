<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <img src="../../../assets/bonds-logo-2026-sm.webp?v=2026" alt="Bonds" />
        <span>Bonds</span>
      </div>
      <div class="auth-top-nav">
        <a href="../../../index.html" class="auth-home-link">← Home</a>
        <a href="../../../calculators/auth/reset.html" class="auth-lang-link">العربية</a>
      </div>
      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>
      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="pw-wrap">
            <input type="password" id="newPassword" required minlength="8" autocomplete="new-password" placeholder="Min 8 characters" />
            <button type="button" class="pw-toggle" data-target="newPassword" title="Show/Hide"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="pw-wrap">
            <input type="password" id="confirmPassword" required autocomplete="new-password" placeholder="Re-enter password" />
            <button type="button" class="pw-toggle" data-target="confirmPassword" title="Show/Hide"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Update Password</button>
      </form>
      <a href="index.html" class="back-link">← Back to Sign In</a>
    </div>
  </div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3.1.3"></script>
  <script>
    (function(){
      function showError(msg){var el=document.getElementById('errorMsg');el.textContent=msg;el.style.display='block';document.getElementById('successMsg').style.display='none';}
      function showSuccess(msg){var el=document.getElementById('successMsg');el.textContent=msg;el.style.display='block';document.getElementById('errorMsg').style.display='none';}

      document.getElementById('resetForm').addEventListener('submit',async function(e){
        e.preventDefault();
        var pw=document.getElementById('newPassword').value;
        var conf=document.getElementById('confirmPassword').value;
        if(pw.length<8){showError('Password must be at least 8 characters');return;}
        if(pw!==conf){showError('Passwords do not match');return;}
        var sb=window.BondsAuth.getSupabase();
        if(!sb){showError('System not ready');return;}
        var {error}=await sb.auth.updateUser({password:pw});
        if(error){showError(error.message);return;}
        showSuccess('Password updated! Redirecting...');
        setTimeout(function(){window.location.href='index.html';},1500);
      });
      // Password visibility toggle
      const eyeSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
      const eyeOffSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7c.78 0 1.53-.09 2.24-.26"/><path d="M2 2l20 20"/></svg>';
      function setPwToggleIcon(btn, isVisible) {
        btn.innerHTML = isVisible ? eyeOffSvg : eyeSvg;
        btn.setAttribute('aria-pressed', String(isVisible));
      }
      document.querySelectorAll('.pw-toggle').forEach(function(btn) {
        setPwToggleIcon(btn, false);
        btn.addEventListener('click', function() {
          var input = document.getElementById(btn.dataset.target);
          var visible = input.type === 'password';
          input.type = visible ? 'text' : 'password';
          setPwToggleIcon(btn, visible);
        });
      });
    })();
  </script>
