<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="../../../calculators/auth/auth-shared.css?v=2" />
  <style>.auth-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-8) var(--space-6);text-align:center}
h1{font-size:1.2rem;font-weight:800;margin-bottom:var(--space-3);color:var(--gold)}
.subtitle{color:var(--text-secondary);font-size:0.9rem;margin-bottom:var(--space-6);line-height:1.7}
.otp-inputs{display:flex;gap:var(--space-3);justify-content:center;direction:ltr;margin-bottom:var(--space-4)}
.otp-inputs input{width:48px;height:56px;text-align:center;font-size:1.5rem;font-weight:700;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text);transition:border-color 0.2s}
.otp-inputs input:focus{outline:none;border-color:var(--gold)}
.btn-secondary{background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);margin-top:var(--space-3)}
.info-msg{background:#1a2a4a;color:#8ab4ff;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);margin-bottom:var(--space-4);font-size:0.9rem;display:none}
.spinner{width:16px;height:16px;border:2px solid rgba(12,12,12,0.3);border-top-color:#0c0c0c;border-radius:50%;animation:spin 0.8s linear infinite;display:none}
.otp-inputs input{width:42px;height:50px}</style>

  <meta property="og:title" content="Verify Email — Bonds" />
  <meta property="og:description" content="Specialized financial calculators and economic consulting from Bonds." />
  <meta property="og:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />
  <meta property="og:url" content="https://bonds-global.com/en/calculators/auth/verify-otp" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Verify Email — Bonds" />

  <meta name="description" content="Specialized financial calculators and economic consulting from Bonds." />

<script src="/calculators/auth-gate.js?v=2"></script>
  </head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <img src="../../../assets/bonds-logo-2026-sm.webp?v=2026" alt="Bonds" />
        <span>Bonds</span>
      </div>
      <h1>Verify Your Email</h1>
      <p class="subtitle" id="subtitle">Enter the 6-digit code we sent to your email address.</p>
      <p id="emailHint" style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:var(--space-4);line-height:1.6;">
        💡 If you don't see a 6-digit code, the email may contain a <strong style="color:var(--gold)">sign-in link</strong> — click it directly to sign in.
      </p>

      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>
      <div id="infoMsg" class="info-msg"></div>

      <form id="otpForm">
        <div class="otp-inputs" id="otpInputs">
          <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1" />
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" />
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" />
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" />
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" />
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" />
        </div>
        <button type="submit" class="btn btn-primary" id="verifyBtn">
          <span class="spinner"></span>
          <span class="btn-text">Verify Code</span>
        </button>
      </form>

      <button type="button" class="btn btn-secondary" id="resendBtn">
        <span class="spinner"></span>
        <span class="btn-text">Resend Code</span>
      </button>

      <a href="./index.html" class="back-link">← Back to Sign In</a>
    </div>
  </div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3.0.3"></script>
  <script>
    (function() {
      'use strict';

      const params = new URLSearchParams(window.location.search);
      const email = params.get('email') || sessionStorage.getItem('otp_email') || '';
      sessionStorage.setItem('otp_email', email);
      const phone = params.get('phone') || sessionStorage.getItem('otp_phone') || '';
      if (phone) sessionStorage.setItem('otp_phone', phone);

      const subtitle = document.getElementById('subtitle');
      if (phone) {
        document.querySelector('h1').textContent = 'Verify Your Phone';
        subtitle.innerHTML = 'Enter the 6-digit code we sent to <strong style="color:var(--gold)">' + escapeHtml(phone) + '</strong>';
        var emailHint = document.getElementById('emailHint');
        if (emailHint) emailHint.style.display = 'none';
      } else if (email) {
        subtitle.innerHTML = 'Enter the 6-digit code we sent to <strong style="color:var(--gold)">' + escapeHtml(email) + '</strong>';
      }

      const inputs = Array.from(document.querySelectorAll('#otpInputs input'));
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const infoMsg = document.getElementById('infoMsg');

      function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; successMsg.style.display = 'none'; infoMsg.style.display = 'none'; }
      function showSuccess(msg) { successMsg.textContent = msg; successMsg.style.display = 'block'; errorMsg.style.display = 'none'; infoMsg.style.display = 'none'; }
      function showInfo(msg) { infoMsg.textContent = msg; infoMsg.style.display = 'block'; errorMsg.style.display = 'none'; successMsg.style.display = 'none'; }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function setLoading(btnId, loading) {
        const btn = document.getElementById(btnId);
        btn.disabled = loading;
        btn.classList.toggle('loading', loading);
      }

      function getToken() {
        return inputs.map(i => i.value.trim()).join('');
      }

      inputs.forEach((input, idx) => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && idx > 0) {
            inputs[idx - 1].focus();
          }
        });
        input.addEventListener('input', (e) => {
          const val = input.value.replace(/[^0-9]/g, '');
          input.value = val.slice(0, 1);
          if (val && idx < inputs.length - 1) {
            inputs[idx + 1].focus();
          }
          if (getToken().length === 6) {
            document.getElementById('otpForm').dispatchEvent(new Event('submit'));
          }
        });
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0, 6);
          paste.split('').forEach((digit, i) => { if (inputs[i]) inputs[i].value = digit; });
          const nextIdx = Math.min(paste.length, inputs.length - 1);
          inputs[nextIdx].focus();
          if (paste.length === 6) {
            document.getElementById('otpForm').dispatchEvent(new Event('submit'));
          }
        });
      });

      document.getElementById('otpForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = getToken();
        if (token.length !== 6) { showError('Please enter the full 6-digit code'); return; }
        if (!email && !phone) { showError('Email or phone number is missing. Go back to sign in.'); return; }

        setLoading('verifyBtn', true);
        hideMessages();

        try {
          if (phone) {
            // Phone OTP (SMS) verification — login flow
            const sbPhone = window.BondsAuth.getSupabase();
            const { error: vErr } = await sbPhone.auth.verifyOtp({ phone: phone, token: token, type: 'sms' });
            setLoading('verifyBtn', false);
            if (vErr) {
              const vmsg = vErr.message || '';
              if (vmsg.includes('expired')) { showError('Code has expired. Click "Resend Code".'); }
              else if (vmsg.includes('Invalid') || vmsg.includes('token')) { showError('Invalid code. Please check and try again.'); }
              else { showError(vmsg); }
              return;
            }
            sessionStorage.removeItem('otp_phone');
            if (typeof gtag !== 'undefined') gtag('event', 'login', { method: 'phone_otp' });
            showSuccess('Signed in successfully! Redirecting...');
            setTimeout(() => { window.location.href = window.BondsAuth.getRedirectUrl(); }, 800);
            return;
          }

          const { data, error } = await window.BondsAuth.verifyOTP(email, token, 'email');
          if (error) {
            setLoading('verifyBtn', false);
            const msg = error.message || '';
            if (msg.includes('expired')) {
              showError('Code has expired. Click "Resend Code".');
            } else if (msg.includes('Invalid') || msg.includes('token')) {
              showError('Invalid code. Please check and try again.');
            } else {
              showError(msg);
            }
            return;
          }

          showSuccess('Email verified ✅');

          const pendingPassword = sessionStorage.getItem('otp_pending_password');
          if (pendingPassword) {
            const { error: pwError } = await window.BondsAuth.updateUser({ password: pendingPassword });
            if (pwError) console.warn('[OTP] Password set warning:', pwError);
            sessionStorage.removeItem('otp_pending_password');
          }

          const user = data?.user;
          if (user) {
            const metadata = {
              id: user.id,
              restaurant_name: sessionStorage.getItem('otp_pending_name') || user.user_metadata?.restaurant_name || '',
              phone: sessionStorage.getItem('otp_pending_phone') || user.user_metadata?.phone || '',
              country: sessionStorage.getItem('otp_pending_country') || user.user_metadata?.country || '',
              city: sessionStorage.getItem('otp_pending_city') || user.user_metadata?.city || '',
              language: 'en'
            };
            try { await window.BondsAuth.updateProfile(user.id, metadata); } catch (profileErr) { console.warn('[OTP] Profile update warning:', profileErr); }
            sessionStorage.removeItem('otp_pending_name');
            sessionStorage.removeItem('otp_pending_phone');
            sessionStorage.removeItem('otp_pending_country');
            sessionStorage.removeItem('otp_pending_city');
          }

          sessionStorage.removeItem('otp_email');

          if (typeof gtag !== 'undefined') gtag('event', 'sign_up', { method: 'email_otp' });

          showSuccess('Account created successfully! Redirecting...');
          setTimeout(() => {
            window.location.href = './onboarding.html';
          }, 1000);
        } catch (err) {
          setLoading('verifyBtn', false);
          showError('Unexpected error: ' + (err?.message || String(err)));
        }
      });

      document.getElementById('resendBtn').addEventListener('click', async () => {
        if (!email && !phone) { showError('Email or phone number is missing. Go back to sign in.'); return; }
        setLoading('resendBtn', true);
        hideMessages();
        if (phone) {
          const sbResend = window.BondsAuth.getSupabase();
          const { error: rErr } = await sbResend.auth.signInWithOtp({ phone: phone });
          setLoading('resendBtn', false);
          if (rErr) { showError(rErr.message); return; }
          showInfo('Code resent to your phone 📱');
          return;
        }
        const { error } = await window.BondsAuth.signInWithOTP(email, { shouldCreateUser: false });
        setLoading('resendBtn', false);
        if (error) { showError(error.message); return; }
        showInfo('Code resent 📧 Check your inbox (and spam folder).');
      });

      function hideMessages() { errorMsg.style.display = 'none'; successMsg.style.display = 'none'; infoMsg.style.display = 'none'; }
    })();
  </script>
  <script src="../../../page-tracker-v2.js"></script>
</body>
</html>
