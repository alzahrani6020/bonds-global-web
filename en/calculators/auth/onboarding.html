<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../../styles.css" />
  <title>Complete Your Profile | Bonds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../../calculators/auth/auth-shared.css?v=2" />
  <style>.auth-container{width:100%;max-width:520px}
h1{text-align:center;color:var(--gold);font-size:1.25rem;font-weight:800;margin-bottom:0.5rem}
.subtitle{text-align:center;color:var(--text-secondary);font-size:0.9rem;margin-bottom:var(--space-6);line-height:1.7}
.form-group input, .form-group select, .form-group textarea{width:100%;padding:var(--space-3) var(--space-4);background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text);font-family:inherit;font-size:1rem;transition:border-color 0.2s}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{outline:none;border-color:var(--gold)}
.form-group textarea{min-height:80px;resize:vertical}
.progress{display:flex;gap:0.5rem;justify-content:center;margin-bottom:var(--space-6)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.dot.active{background:var(--gold)}
.row{grid-template-columns:1fr}</style>

  <meta property="og:title" content="Complete Your Profile | Bonds" />
  <meta property="og:description" content="Specialized financial calculators and economic consulting from Bonds." />
  <meta property="og:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />
  <meta property="og:url" content="https://bonds-global.com/en/calculators/auth/onboarding" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Complete Your Profile | Bonds" />
  <meta name="twitter:description" content="Specialized financial calculators and economic consulting from Bonds." />
  <meta name="twitter:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />

  <meta name="description" content="Specialized financial calculators and economic consulting from Bonds." />

<link rel="stylesheet" href="../../../components/universal-dropdown.css?v=2.51.8" />
<script src="/calculators/auth-gate.js?v=3"></script>
  </head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <img src="../../../assets/bonds-logo-2026-sm.webp?v=2026" alt="Bonds" />
        <span>Bonds</span>
      </div>
      <div class="auth-top-nav">
        <a href="../../../index.html" class="auth-home-link">← Home</a>
        <a href="../../../calculators/auth/onboarding.html" class="auth-lang-link">العربية</a>
      </div>

      <h1>Complete Your Business Profile</h1>
      <p class="subtitle">Accurate information helps us provide personalized consulting for you.</p>

      <div class="progress">
        <div class="dot active"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>

      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>

      <form id="onboardingForm" novalidate>
        <div class="form-group">
          <label for="restaurantName">Restaurant / Company Name</label>
          <input type="text" id="restaurantName" placeholder="e.g. Gourmet Restaurant" />
        </div>

        <div class="row">
          <div class="form-group">
            <label for="country">Country</label>
            <select data-universal-dropdown="true" data-ud-search="true" data-ud-sort="true" data-ud-deduplicate="true" data-ud-remove-empty="true" id="country">
              <option value="">Select country</option>
            </select>
          </div>
          <div class="form-group">
            <label for="governorate">Governorate / Region</label>
            <select data-universal-dropdown="true" data-ud-search="true" data-ud-sort="true" data-ud-deduplicate="true" data-ud-remove-empty="true" id="governorate">
              <option value="">Select governorate</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="city">City</label>
            <select data-universal-dropdown="true" data-ud-search="true" data-ud-sort="true" data-ud-deduplicate="true" data-ud-remove-empty="true" id="city">
              <option value="">Select city</option>
            </select>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" inputmode="numeric" autocomplete="tel" placeholder="05xxxxxxxx" />
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="businessType">Business Type</label>
            <select data-universal-dropdown="true" id="businessType">
              <option value="">Select type</option>
              <option value="restaurant">Restaurant / Fast Food</option>
              <option value="cafe">Cafe</option>
              <option value="bakery">Bakery / Sweets</option>
              <option value="food_truck">Food Truck</option>
              <option value="catering">Catering</option>
              <option value="retail">Retail Store</option>
              <option value="manufacturing">Food Manufacturing</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="employeeCount">Number of Employees</label>
            <input type="number" id="employeeCount" min="0" inputmode="numeric" placeholder="e.g. 12" />
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="branchCount">Number of Branches</label>
            <input type="number" id="branchCount" min="1" inputmode="numeric" placeholder="e.g. 1" />
          </div>
          <div class="form-group">
            <label for="bio">Business Bio</label>
            <textarea id="bio" rows="3" placeholder="Write a short description of your business..."></textarea>
          </div>
        </div>

        <div class="form-group">
          <label for="needs">Needs & Required Services</label>
          <textarea id="needs" rows="3" placeholder="e.g. financial analysis, feasibility study, pricing..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="saveBtn">
          <span class="spinner"></span>
          <span class="btn-text"><span class="emoji-icon" style="display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;" aria-hidden="true"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#31373D" d="M4 36s-4 0-4-4V4s0-4 4-4h26c1 0 2 1 2 1l3 3s1 1 1 2v26s0 4-4 4H4z"/><path fill="#55ACEE" d="M5 19v-1s0-2 2-2h21c2 0 2 2 2 2v1H5z"/><path fill="#E1E8ED" d="M5 32.021V19h25v13s0 2-2 2H7c-2 0-2-1.979-2-1.979zM10 3s0-1 1-1h18c1.048 0 1 1 1 1v10s0 1-1 1H11s-1 0-1-1V3zm12 10h5V3h-5v10z"/></svg></span> Save &amp; Continue</span>
        </button>
        <button type="button" class="btn btn-secondary" id="skipBtn" style="margin-top:0.75rem;width:100%;">⏭️ Skip for now (complete later)</button>
      </form>
    </div>
  </div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3.0.7"></script>
  <script src="/calculators/auth/lead-conversion.js?v=1"></script>

  <script>
    (function() {
      'use strict';

      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const saveBtn = document.getElementById('saveBtn');
      const countrySelect = document.getElementById('country');
      const governorateSelect = document.getElementById('governorate');
      const citySelect = document.getElementById('city');

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
        successMsg.style.display = 'none';
      }
      function showSuccess(msg) {
        successMsg.textContent = msg;
        successMsg.style.display = 'block';
        errorMsg.style.display = 'none';
      }
      function setLoading(loading) {
        saveBtn.disabled = loading;
        saveBtn.classList.toggle('loading', loading);
      }

      // Country-aware phone validation (Saudi strict, international loose)
      function isValidPhone(phone, country) {
        return window.BondsAuth.isValidPhone(phone, country);
      }

      function populateCountries(selected) {
        const data = window.ARAB_COUNTRIES_GEO || {};
        countrySelect.innerHTML = '<option value="">Select country</option>';
        Object.keys(data).forEach(code => {
          const c = data[code];
          const opt = document.createElement('option');
          opt.value = code;
          opt.setAttribute('data-icon', c.flag || '');
          opt.textContent = c.nameEn;
          countrySelect.appendChild(opt);
        });
        if (selected) countrySelect.value = selected;
      }

      function populateGovernorates(countryCode, selected) {
        const data = window.ARAB_COUNTRIES_GEO || {};
        const country = data[countryCode];
        governorateSelect.innerHTML = '<option value="">Select governorate</option>';
        citySelect.innerHTML = '<option value="">Select city</option>';
        if (!country || !country.governorates) return;
        country.governorates.forEach((gov, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = gov.nameEn;
          governorateSelect.appendChild(opt);
        });
        if (selected !== undefined && selected !== '') governorateSelect.value = selected;
      }

      function populateCities(countryCode, governorateIndex, selected) {
        const data = window.ARAB_COUNTRIES_GEO || {};
        const country = data[countryCode];
        citySelect.innerHTML = '<option value="">Select city</option>';
        if (!country || !country.governorates || !country.governorates[governorateIndex]) return;
        country.governorates[governorateIndex].cities.forEach(city => {
          const opt = document.createElement('option');
          opt.value = city.code;
          opt.textContent = city.nameEn;
          citySelect.appendChild(opt);
        });
        if (selected) citySelect.value = selected;
      }

      countrySelect.addEventListener('change', () => {
        populateGovernorates(countrySelect.value);
      });
      governorateSelect.addEventListener('change', () => {
        populateCities(countrySelect.value, governorateSelect.value);
      });

      async function init() {
        populateCountries();

        const { data: { user } } = await window.BondsAuth.getUser();
        if (!user) return location.href = 'index.html';

        document.getElementById('restaurantName').value = user.user_metadata?.restaurant_name || '';
        document.getElementById('phone').value = user.user_metadata?.phone || '';

        const { data: profile } = await window.BondsAuth.getProfile(user.id);
        if (profile) {
          if (profile.restaurant_name) document.getElementById('restaurantName').value = profile.restaurant_name;
          if (profile.country) {
            populateCountries(profile.country);
            populateGovernorates(profile.country);
            if (profile.governorate !== undefined && profile.governorate !== '') governorateSelect.value = profile.governorate;
            populateCities(profile.country, governorateSelect.value, profile.city_code || profile.city);
            citySelect.value = profile.city_code || profile.city;
          }
          if (profile.business_type) document.getElementById('businessType').value = profile.business_type;
          if (profile.phone) document.getElementById('phone').value = profile.phone;
          if (profile.employee_count !== null && profile.employee_count !== undefined) document.getElementById('employeeCount').value = profile.employee_count;
          if (profile.branch_count !== null && profile.branch_count !== undefined) document.getElementById('branchCount').value = profile.branch_count;
          if (profile.bio) document.getElementById('bio').value = profile.bio;
          if (profile.needs) document.getElementById('needs').value = profile.needs;
        }
      }
      init();

      document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        setLoading(true);

        const { data: { user } } = await window.BondsAuth.getUser();
        if (!user) {
          setLoading(false);
          return location.href = 'index.html';
        }

        const country = countrySelect.value;
        const phone = document.getElementById('phone').value.trim().replace(/\s+/g, '');
        // Allow empty/invalid phone; backend tracks validation_status for leads.
        const phoneInvalid = phone && !isValidPhone(phone, country);
        if (phoneInvalid) {
          console.warn('[onboarding] phone looks invalid, saving anyway:', phone);
        }

        const selectedCity = citySelect.options[citySelect.selectedIndex];
        const payload = {
          id: user.id,
          restaurant_name: document.getElementById('restaurantName').value.trim(),
          country: country,
          governorate: governorateSelect.value,
          city: citySelect.value,
          city_name: selectedCity && selectedCity.value ? selectedCity.textContent : '',
          business_type: document.getElementById('businessType').value,
          phone: phone,
          employee_count: parseInt(document.getElementById('employeeCount').value) || 0,
          branch_count: parseInt(document.getElementById('branchCount').value) || 1,
          bio: document.getElementById('bio').value.trim(),
          needs: document.getElementById('needs').value.trim(),
          language: 'en'
        };

        const { error } = await window.BondsAuth.updateProfile(user.id, payload);
        setLoading(false);

        if (error) {
          showError('Save error: ' + (error.message || error));
          return;
        }

        showSuccess('✅ Saved! Redirecting...');
        if (window.BondsLeadConversion && user?.email) window.BondsLeadConversion.markConverted(user.email);
        const redirect = sessionStorage.getItem('auth_redirect') || '/en/v3/portfolio';
        sessionStorage.removeItem('auth_redirect');
        setTimeout(() => location.href = redirect, 1000);
      });

      document.getElementById('skipBtn').addEventListener('click', async () => {
        setLoading(true);
        const { data: { user } } = await window.BondsAuth.getUser();
        if (!user) {
          setLoading(false);
          return location.href = 'index.html';
        }
        const payload = {
          id: user.id,
          restaurant_name: document.getElementById('restaurantName').value.trim() || (user.email?.split('@')[0] || 'User'),
          country: countrySelect.value || '',
          governorate: governorateSelect.value || '',
          city: citySelect.value || '',
          city_name: '',
          business_type: document.getElementById('businessType').value || 'other',
          phone: (document.getElementById('phone').value.trim() || '').replace(/\s+/g, ''),
          employee_count: parseInt(document.getElementById('employeeCount').value) || 0,
          branch_count: parseInt(document.getElementById('branchCount').value) || 1,
          bio: document.getElementById('bio').value.trim() || '—',
          needs: document.getElementById('needs').value.trim() || '—',
          language: 'en'
        };
        await window.BondsAuth.updateProfile(user.id, payload);
        if (window.BondsLeadConversion && user?.email) window.BondsLeadConversion.markConverted(user.email);
        sessionStorage.setItem('bonds_onboarding_skipped', Date.now().toString());
        setLoading(false);
        const redirect = sessionStorage.getItem('auth_redirect') || '/en/v3/portfolio';
        sessionStorage.removeItem('auth_redirect');
        location.href = redirect;
      });
    })();
  </script>

  <script src="../../../page-tracker-v2.js"></script>
