<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../../styles.css" />
  <title>Complete Your Profile | Bonds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="../../../assets/bonds-mark.svg" type="image/png" />
  <link rel="stylesheet" href="../../../calculators/auth/auth-shared.css" />
  <style>.auth-container{width:100%;max-width:520px}
h1{text-align:center;color:var(--gold);font-size:1.25rem;font-weight:800;margin-bottom:0.5rem}
.subtitle{text-align:center;color:var(--text-secondary);font-size:0.9rem;margin-bottom:var(--space-6);line-height:1.7}
.form-group input, .form-group select, .form-group textarea{width:100%;padding:var(--space-3) var(--space-4);background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text);font-family:inherit;font-size:1rem;transition:border-color 0.2s}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{outline:none;border-color:var(--gold)}
.form-group textarea{min-height:80px;resize:vertical}
.progress{display:flex;gap:0.5rem;justify-content:center;margin-bottom:var(--space-6)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.dot.active{background:var(--gold)}
.row{grid-template-columns:1fr}</style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <img src="../../../assets/bonds-logo-2026.webp?v=2026" alt="Bonds" />
        <span>Bonds</span>
      </div>

      <h1>Complete Your Business Profile</h1>
      <p class="subtitle">Accurate information helps us provide personalized consulting for you.</p>

      <div class="progress">
        <div class="dot active"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>

      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>

      <form id="onboardingForm">
        <div class="form-group">
          <label for="restaurantName">Restaurant / Company Name *</label>
          <input type="text" id="restaurantName" required placeholder="e.g. Gourmet Restaurant" />
        </div>

        <div class="row">
          <div class="form-group">
            <label for="country">Country *</label>
            <select id="country" required>
              <option value="">Select country</option>
            </select>
          </div>
          <div class="form-group">
            <label for="governorate">Governorate / Region *</label>
            <select id="governorate" required>
              <option value="">Select governorate</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="city">City *</label>
            <select id="city" required>
              <option value="">Select city</option>
            </select>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" required placeholder="05xxxxxxxx" />
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="businessType">Business Type *</label>
            <select id="businessType" required>
              <option value="">Select type</option>
              <option value="restaurant">Restaurant / Fast Food</option>
              <option value="cafe">Cafe</option>
              <option value="bakery">Bakery / Sweets</option>
              <option value="food_truck">Food Truck</option>
              <option value="catering">Catering</option>
              <option value="retail">Retail Store</option>
              <option value="manufacturing">Food Manufacturing</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="employeeCount">Number of Employees *</label>
            <input type="number" id="employeeCount" required min="0" placeholder="e.g. 12" />
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="branchCount">Number of Branches *</label>
            <input type="number" id="branchCount" required min="1" placeholder="e.g. 1" />
          </div>
          <div class="form-group">
            <label for="bio">Business Bio *</label>
            <textarea id="bio" required rows="3" placeholder="Write a short description of your business..."></textarea>
          </div>
        </div>

        <div class="form-group">
          <label for="needs">Needs & Required Services *</label>
          <textarea id="needs" required rows="3" placeholder="e.g. financial analysis, feasibility study, pricing..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="saveBtn">
          <span class="spinner"></span>
          <span class="btn-text">💾 Save &amp; Continue</span>
        </button>
      </form>
    </div>
  </div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js"></script>
  <script src="../../../v3/master-data/countries-governorates-cities.js"></script>

  <script>
    (function() {
      'use strict';

      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const saveBtn = document.getElementById('saveBtn');
      const countrySelect = document.getElementById('country');
      const governorateSelect = document.getElementById('governorate');
      const citySelect = document.getElementById('city');

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
        successMsg.style.display = 'none';
      }
      function showSuccess(msg) {
        successMsg.textContent = msg;
        successMsg.style.display = 'block';
        errorMsg.style.display = 'none';
      }
      function setLoading(loading) {
        saveBtn.disabled = loading;
        saveBtn.classList.toggle('loading', loading);
      }

      function isValidPhone(phone, country) {
        const digits = phone.replace(/\D/g, '');
        if (country === 'SA') return /^05\d{8}$/.test(digits);
        return digits.length >= 7;
      }

      function populateCountries(selected) {
        const data = window.ARAB_COUNTRIES_GEO || {};
        countrySelect.innerHTML = '<option value="">Select country</option>';
        Object.keys(data).forEach(code => {
          const c = data[code];
          const opt = document.createElement('option');
          opt.value = code;
          opt.textContent = `${c.flag || ''} ${c.nameEn}`;
          countrySelect.appendChild(opt);
        });
        if (selected) countrySelect.value = selected;
      }

      function populateGovernorates(countryCode, selected) {
        const data = window.ARAB_COUNTRIES_GEO || {};
        const country = data[countryCode];
        governorateSelect.innerHTML = '<option value="">Select governorate</option>';
        citySelect.innerHTML = '<option value="">Select city</option>';
        if (!country || !country.governorates) return;
        country.governorates.forEach((gov, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = gov.nameEn;
          governorateSelect.appendChild(opt);
        });
        if (selected !== undefined && selected !== '') governorateSelect.value = selected;
      }

      function populateCities(countryCode, governorateIndex, selected) {
        const data = window.ARAB_COUNTRIES_GEO || {};
        const country = data[countryCode];
        citySelect.innerHTML = '<option value="">Select city</option>';
        if (!country || !country.governorates || !country.governorates[governorateIndex]) return;
        country.governorates[governorateIndex].cities.forEach(city => {
          const opt = document.createElement('option');
          opt.value = city.code;
          opt.textContent = city.nameEn;
          citySelect.appendChild(opt);
        });
        if (selected) citySelect.value = selected;
      }

      countrySelect.addEventListener('change', () => {
        populateGovernorates(countrySelect.value);
      });
      governorateSelect.addEventListener('change', () => {
        populateCities(countrySelect.value, governorateSelect.value);
      });

      async function init() {
        populateCountries();

        const { data: { user } } = await window.BondsAuth.getUser();
        if (!user) return location.href = 'index.html';

        document.getElementById('restaurantName').value = user.user_metadata?.restaurant_name || '';
        document.getElementById('phone').value = user.user_metadata?.phone || '';

        const { data: profile } = await window.BondsAuth.getProfile(user.id);
        if (profile) {
          if (profile.restaurant_name) document.getElementById('restaurantName').value = profile.restaurant_name;
          if (profile.country) {
            populateCountries(profile.country);
            populateGovernorates(profile.country);
            if (profile.governorate !== undefined && profile.governorate !== '') governorateSelect.value = profile.governorate;
            populateCities(profile.country, governorateSelect.value, profile.city_code || profile.city);
            citySelect.value = profile.city_code || profile.city;
          }
          if (profile.business_type) document.getElementById('businessType').value = profile.business_type;
          if (profile.phone) document.getElementById('phone').value = profile.phone;
          if (profile.employee_count !== null && profile.employee_count !== undefined) document.getElementById('employeeCount').value = profile.employee_count;
          if (profile.branch_count !== null && profile.branch_count !== undefined) document.getElementById('branchCount').value = profile.branch_count;
          if (profile.bio) document.getElementById('bio').value = profile.bio;
          if (profile.needs) document.getElementById('needs').value = profile.needs;
        }
      }
      init();

      document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        setLoading(true);

        const { data: { user } } = await window.BondsAuth.getUser();
        if (!user) {
          setLoading(false);
          return location.href = 'index.html';
        }

        const country = countrySelect.value;
        const phone = document.getElementById('phone').value.trim().replace(/\s+/g, '');
        if (!isValidPhone(phone, country)) {
          setLoading(false);
          return showError(country === 'SA'
            ? 'Phone number must start with 05 and be 10 digits'
            : 'Phone number is invalid');
        }

        const selectedCity = citySelect.options[citySelect.selectedIndex];
        const payload = {
          id: user.id,
          restaurant_name: document.getElementById('restaurantName').value.trim(),
          country: country,
          governorate: governorateSelect.value,
          city: citySelect.value,
          city_name: selectedCity && selectedCity.value ? selectedCity.textContent : '',
          business_type: document.getElementById('businessType').value,
          phone: phone,
          employee_count: parseInt(document.getElementById('employeeCount').value) || 0,
          branch_count: parseInt(document.getElementById('branchCount').value) || 1,
          bio: document.getElementById('bio').value.trim(),
          needs: document.getElementById('needs').value.trim(),
          language: 'en'
        };

        const { error } = await window.BondsAuth.updateProfile(user.id, payload);
        setLoading(false);

        if (error) {
          showError('Save error: ' + (error.message || error));
          return;
        }

        showSuccess('✅ Saved! Redirecting...');
        const redirect = sessionStorage.getItem('auth_redirect') || '/en/calculators/dashboard.html';
        sessionStorage.removeItem('auth_redirect');
        setTimeout(() => location.href = redirect, 1000);
      });
    })();
  </script>

  <script src="../../../page-tracker-v2.js"></script>
</body>
</html>
