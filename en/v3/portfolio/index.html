  <script>
    (function () {
      const start = Date.now();
      const rootId = 'portfolio-root';
      const interval = setInterval(function () {
        if (window.__PORTFOLIO_DASHBOARD_LOADED) {
          clearInterval(interval);
          return;
        }
        if (Date.now() - start > 8000) {
          clearInterval(interval);
          const root = document.getElementById(rootId);
          if (root) {
            root.innerHTML = '<div class="loading" style="max-width:500px;margin:0 auto;"><p>The dashboard is taking longer than expected. Old cached files may be the cause.</p><button class="ecc-btn ecc-btn--primary" onclick="if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}).then(function(){return caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k);}));});}).then(function(){location.href=location.pathname+\'?reload=\'+Date.now();});}else{location.href=location.pathname+\'?reload=\'+Date.now();}">Reload without cache</button></div>';
          }
        }
      }, 1000);
    })();
  </script>
