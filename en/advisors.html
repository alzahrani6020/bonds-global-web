<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bonds-Certified Advisors | Ask an Expert</title>
  <meta name="description" content="Choose a Bonds-certified financial advisor to review your project analysis and answer your investment questions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../styles/page-redesign-2026.css?v=1" />

  <link rel="icon" href="../assets/bonds-mark.svg" type="image/svg+xml" />
  <style>
    .advisors-hero { padding: 6rem 2rem 3rem; text-align: center; background: linear-gradient(180deg, rgba(212,168,83,0.08) 0%, transparent 60%); }
    .advisors-hero h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 900; color: var(--text); margin-bottom: 1rem; }
    .advisors-hero p { color: var(--text-secondary); max-width: 640px; margin: 0 auto 1.5rem; font-size: 1.1rem; }
    .advisors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; max-width: 1200px; margin: 0 auto; padding: 2rem; }
    .advisor-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 1.75rem; transition: transform 0.2s, box-shadow 0.2s; }
    .advisor-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
    .advisor-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .advisor-avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), #8b6914); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; color: #0a0f1a; flex-shrink: 0; }
    .advisor-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .advisor-name { font-size: 1.15rem; font-weight: 800; color: var(--text); }
    .advisor-title { font-size: 0.85rem; color: var(--text-secondary); }
    .advisor-bio { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.7; margin-bottom: 1rem; min-height: 3.5rem; }
    .advisor-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
    .advisor-tag { background: rgba(212,168,83,0.1); color: var(--gold); padding: 0.25rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .advisor-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem; }
    .advisor-meta strong { color: var(--gold); }
    .advisor-cta { display: block; width: 100%; text-align: center; background: var(--gold); color: #0a0f1a; font-weight: 800; padding: 0.75rem; border-radius: 10px; text-decoration: none; }
    .advisors-empty { text-align: center; color: var(--text-secondary); padding: 4rem 2rem; }
    .advisors-loading { text-align: center; color: var(--text-secondary); padding: 4rem 2rem; }
  </style>
  <link rel="canonical" href="https://bonds-global.com/en/advisors" />
  <meta property="og:title" content="Bonds-Certified Advisors | Ask an Expert" />
  <meta property="og:description" content="Choose a Bonds-certified financial advisor to review your project analysis and answer your investment questions." />
  <meta property="og:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />
  <meta property="og:url" content="https://bonds-global.com/en/advisors" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Bonds-Certified Advisors | Ask an Expert" />
  <meta name="twitter:description" content="Choose a Bonds-certified financial advisor to review your project analysis and answer your investment questions." />
  <meta name="twitter:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />

</head>
<body>
  <div id="site-header"></div>

  <section class="advisors-hero v2026">
    <h1>Bonds-Certified Advisors</h1>
    <p>Hand-picked finance and investment experts ready to review your project analysis, answer your questions, and guide you toward a better decision.</p>
    <a href="/en/v3/portfolio" class="btn btn--primary">Request an Advisor Review</a>
  </section>

  <section id="advisorsContainer" class="advisors-loading">Loading advisors...</section>

  <div id="site-footer"></div>

  <script src="../bonds-auth-2026.js?v=3.0.7"></script>
  <script src="/lib/bonds-common.js"></script>
  <script src="../site-layout.js?v=3.2.0"></script>
  <script>
    async function loadAdvisors() {
      const container = document.getElementById('advisorsContainer');
      try {
        const res = await fetch('/api/advisors');
        const json = await res.json();
        if (!json.success || !json.advisors?.length) {
          container.className = 'advisors-empty';
          container.innerHTML = '<p>Our advisor network will be launched soon.</p>';
          return;
        }

        container.className = 'advisors-grid';
        container.innerHTML = json.advisors.map(advisor => `
          <article class="advisor-card">
            <div class="advisor-header">
              <div class="advisor-avatar">
                ${advisor.avatar_url ? `<img src="${advisor.avatar_url}" alt="${BondsCommon.escapeHtml(advisor.name)}">` : advisor.name.charAt(0)}
              </div>
              <div>
                <div class="advisor-name">${BondsCommon.escapeHtml(advisor.name)}</div>
                <div class="advisor-title">${BondsCommon.escapeHtml(advisor.title || '')}</div>
              </div>
            </div>
            <p class="advisor-bio">${BondsCommon.escapeHtml(advisor.bio || '')}</p>
            <div class="advisor-tags">
              ${(advisor.specializations || []).map(s => `<span class="advisor-tag">${BondsCommon.escapeHtml(s)}</span>`).join('')}
            </div>
            <div class="advisor-meta">
              <span>${advisor.years_experience || 0}+ years experience</span>
              <span><strong>${advisor.commission_rate || 25}%</strong> commission</span>
            </div>
            <a class="advisor-cta" href="/en/v3/portfolio?advisor=${advisor.id}">Choose this advisor</a>
          </article>
        `).join('');
      } catch (e) {
        container.className = 'advisors-empty';
        container.innerHTML = '<p>Unable to load advisors. Please try again later.</p>';
      }
    }


    loadAdvisors();
  </script>
<script src="/components/emoji-icons.js"></script>
<script src="/components/emoji-renderer.js"></script>
</body>
</html>
