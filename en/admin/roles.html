<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      --bg: #f5f0e8; --bg-secondary: #ffffff; --bg-card: rgba(255,255,255,0.85);
      --gold: #b8954e; --gold-bright: #d4b87a; --gold-dim: #8a7340;
      --text: #1a1a1a; --text-secondary: #555555; --text-muted: #888888;
      --border: rgba(0,0,0,0.08); --border-hover: rgba(184,149,78,0.4);
      --success: #22c55e; --warning: #eab308; --info: #3b82f6; --danger: #ef4444;
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.4); --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }

    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px; background: var(--bg-secondary); border-right: 1px solid var(--border);
      padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem;
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 0.75rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .sidebar-brand img { height: 40px; width: auto; border-radius: 6px; }
    .sidebar-brand span { font-size: 1.1rem; font-weight: 800; color: var(--gold); }
    .sidebar-nav { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; border-radius: 12px; color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(212,168,83,0.1); color: var(--gold); }
    .sidebar-link svg { width: 20px; height: 20px; opacity: 0.7; }
    .sidebar-footer { padding-top: 1rem; border-top: 1px solid var(--border); }
    .sidebar-user { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-bright)); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #1a1a1a; font-size: 0.85rem; }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: 700; font-size: 0.85rem; }
    .user-role { font-size: 0.75rem; color: var(--text-muted); }

    .main-content { flex: 1; margin-left: 260px; padding: 2rem; }
    .page-header { margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .page-header h1 { font-size: 1.6rem; font-weight: 800; }
    .page-header p { color: var(--text-secondary); font-size: 0.9rem; }

    .alert { padding: 1rem 1.25rem; border-radius: 12px; margin-bottom: 1.5rem; font-weight: 600; }
    .alert--warning { background: rgba(234,179,8,0.1); border: 1px solid rgba(234,179,8,0.3); color: var(--warning); }

    .form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 2rem; }
    .form-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; }
    .form-row { display: grid; grid-template-columns: 2fr 1fr auto; gap: 0.75rem; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .form-group label { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
    .form-input { padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--text); font-family: inherit; font-size: 0.9rem; }
    .form-input::placeholder { color: var(--text-muted); }
    .btn-sm { padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; text-decoration: none; transition: all 0.3s; border: none; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color: #1a1a1a; }
    .btn-danger { background: rgba(239,68,68,0.15); color: var(--danger); }

    .table-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .table-header { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); }
    .table-header h3 { font-size: 1rem; font-weight: 700; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: left; padding: 1rem 1.5rem; font-size: 0.75rem; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.9); }
    .data-table td { padding: 1rem 1.5rem; font-size: 0.85rem; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
    .data-table tr:hover td { background: rgba(212,168,83,0.05); }
    .badge { display: inline-block; padding: 0.3rem 0.75rem; border-radius: 50px; font-size: 0.75rem; font-weight: 700; }
    .badge--super { background: rgba(239,68,68,0.15); color: var(--danger); }
    .badge--admin { background: rgba(212,168,83,0.15); color: var(--gold); }
    .badge--support { background: rgba(59,130,246,0.15); color: var(--info); }
    .badge--viewer { background: rgba(100,116,139,0.15); color: var(--text-secondary); }

    .loading { color: var(--text-muted); font-style: italic; text-align: center; padding: 2rem; }

    @media (max-width: 1024px) {
      .sidebar { width: 80px; padding: 1rem; }
      .sidebar-brand span, .sidebar-link span, .user-info { display: none; }
      .sidebar-link { justify-content: center; padding: 0.85rem; }
      .main-content { margin-left: 80px; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>

<body>

    <aside class="sidebar">
      <div class="sidebar-brand">

        <span>Bonds</span>
      </div>
      <nav class="sidebar-nav">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar">A</div>
          <div class="user-info">
            <span class="user-name">Administrator</span>
            <span class="user-role">Admin</span>
          </div>
        </div>
      </div>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Role Management</h1>
          <p>Manage admin team permissions</p>
        </div>
      </div>

      <div class="alert alert--warning" id="roleAlert" style="display:none;">
        ⚠️ This page is only available to Super Admin
      </div>

      <div class="form-card" id="addRoleForm" style="display:none;">
        <h3>➕ Add New Admin</h3>
        <div class="form-row">
          <div class="form-group">
            <label>User Email or UUID</label>
            <input type="text" class="form-input" id="newAdminEmail" placeholder="user@example.com" />
          </div>
          <div class="form-group">
            <label>Role</label>
            <select data-universal-dropdown="true" class="form-input" id="newAdminRole">
              <option value="admin">Admin</option>
              <option value="support">Support</option>
              <option value="viewer">Viewer</option>
            </select>
          </div>
          <button class="btn-sm btn-primary" onclick="addAdmin()">Add</button>
        </div>
      </div>

      <div class="table-card">
        <div class="table-header">
          <h3>👤 Admin Team</h3>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>User</th>
              <th>Role</th>
              <th>Assigned</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="rolesTable">
            <tr><td colspan="4" class="loading">Loading...</td></tr>
          </tbody>
        </table>
      </div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../admin/admin-auth-v2.js"></script>
  <script>
    const DEMO_ROLES = [
      { id: 'demo-1', user_id: 'user-1', role: 'super_admin', created_at: '2026-01-01T00:00:00Z', profiles: { restaurant_name: 'Super Admin', email: 'super@example.com' } },
      { id: 'demo-2', user_id: 'user-2', role: 'admin', created_at: '2026-03-15T00:00:00Z', profiles: { restaurant_name: 'Admin User', email: 'admin@example.com' } },
      { id: 'demo-3', user_id: 'user-3', role: 'support', created_at: '2026-05-01T00:00:00Z', profiles: { restaurant_name: 'Support Agent', email: 'support@example.com' } },
    ];

    async function fetchRoles() {
      try {
        let token = window.__ADMIN_TOKEN || '';
        if (!token && typeof supabase !== 'undefined' && window.__ENV?.SUPABASE_URL) {
          const client = supabase.createClient(window.__ENV.SUPABASE_URL, window.__ENV.SUPABASE_ANON_KEY);
          const { data: { session } } = await client.auth.getSession();
          token = session?.access_token || '';
        }
        const res = await fetch('/api/admin?action=roles', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data.success) throw new Error(data.error);
        return data.roles || [];
      } catch (e) {
        return DEMO_ROLES;
      }
    }

    function roleBadge(role) {
      const map = { super_admin: 'badge--super', admin: 'badge--admin', support: 'badge--support', viewer: 'badge--viewer' };
      const labels = { super_admin: 'Super Admin', admin: 'Admin', support: 'Support', viewer: 'Viewer' };
      return `<span class="badge ${map[role] || 'badge--viewer'}">${labels[role] || role}</span>`;
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    async function renderRoles() {
      const roles = await fetchRoles();
      const tbody = document.getElementById('rolesTable');

      if (roles.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="loading">No admins found</td></tr>';
        return;
      }

      tbody.innerHTML = roles.map(r => {
        const name = r.profiles?.restaurant_name || 'User';
        const email = r.profiles?.email || r.user_id.slice(0, 8) + '...';
        return `
          <tr>
            <td>
              <div style="display:flex;align-items:center;gap:0.75rem;">
                <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-bright));display:flex;align-items:center;justify-content:center;font-weight:700;color:#1a1a1a;font-size:0.8rem;">${name.charAt(0)}</div>
                <div>
                  <div style="font-weight:700;color:var(--text);">${name}</div>
                  <div style="font-size:0.75rem;color:var(--text-muted);">${email}</div>
                </div>
              </div>
            </td>
            <td>${roleBadge(r.role)}</td>
            <td>${formatDate(r.created_at)}</td>
            <td>
              <button class="btn-sm btn-danger" onclick="removeAdmin('${r.id}')" ${r.role === 'super_admin' ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>Remove</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function addAdmin() {
      const email = document.getElementById('newAdminEmail').value.trim();
      const role = document.getElementById('newAdminRole').value;
      if (!email) return alert('Enter email');
      try {
        let token = window.__ADMIN_TOKEN || '';
        if (!token && typeof supabase !== 'undefined' && window.__ENV?.SUPABASE_URL) {
          const client = supabase.createClient(window.__ENV.SUPABASE_URL, window.__ENV.SUPABASE_ANON_KEY);
          const { data: { session } } = await client.auth.getSession();
          token = session?.access_token || '';
        }
        const res = await fetch('/api/admin?action=roles', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ action: 'add', email, role })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('newAdminEmail').value = '';
          renderRoles();
        } else {
          alert(data.error || 'Failed to add');
        }
      } catch (e) {
        alert('Error adding admin');
      }
    }

    async function removeAdmin(id) {
      if (!confirm('Are you sure you want to remove this admin?')) return;
      try {
        let token = window.__ADMIN_TOKEN || '';
        if (!token && typeof supabase !== 'undefined' && window.__ENV?.SUPABASE_URL) {
          const client = supabase.createClient(window.__ENV.SUPABASE_URL, window.__ENV.SUPABASE_ANON_KEY);
          const { data: { session } } = await client.auth.getSession();
          token = session?.access_token || '';
        }
        const res = await fetch('/api/admin?action=roles', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ action: 'remove', id })
        });
        const data = await res.json();
        if (data.success) renderRoles();
        else alert(data.error || 'Failed to remove');
      } catch (e) {
        alert('Error removing admin');
      }
    }

    window.addEventListener('admin-auth-ready', () => {
      if (window.__ADMIN_ROLE === 'super_admin') {
        document.getElementById('addRoleForm').style.display = 'block';
      } else {
        document.getElementById('roleAlert').style.display = 'block';
        document.getElementById('rolesTable').innerHTML = '<tr><td colspan="4" class="loading">Not authorized</td></tr>';
        return;
      }
      renderRoles();
    });

    setTimeout(() => {
      if (document.getElementById('rolesTable').textContent.includes('Loading')) {
        renderRoles();
      }
    }, 2000);
  </script>

<script src="../../components/universal-dropdown.js?v=2.51.8"></script>
