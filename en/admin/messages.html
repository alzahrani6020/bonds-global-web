<!DOCTYPE html>
<html lang="en" dir="ltr" data-ud-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Messages | Admin | Bonds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="../../assets/bonds-mark.svg" type="image/png" />
  <style>
    :root {
      --bg: #f5f0e8; --bg-secondary: #ffffff; --bg-card: rgba(255,255,255,0.85);
      --gold: #b8954e; --gold-bright: #d4b87a; --gold-dim: #8a7340;
      --text: #1a1a1a; --text-secondary: #555555; --text-muted: #888888;
      --border: rgba(0,0,0,0.08); --border-hover: rgba(184,149,78,0.4);
      --success: #22c55e; --warning: #eab308; --info: #3b82f6; --danger: #ef4444;
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.4); --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }

    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px; background: var(--bg-secondary); border-right: 1px solid var(--border);
      padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem;
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 0.75rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .sidebar-brand img { height: 40px; width: auto; border-radius: 6px; }
    .sidebar-brand span { font-size: 1.1rem; font-weight: 800; color: var(--gold); }
    .sidebar-nav { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; border-radius: 12px; color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(212,168,83,0.1); color: var(--gold); }
    .sidebar-link svg { width: 20px; height: 20px; opacity: 0.7; }
    .sidebar-footer { padding-top: 1rem; border-top: 1px solid var(--border); }
    .sidebar-user { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-bright)); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #1a1a1a; font-size: 0.85rem; }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: 700; font-size: 0.85rem; }
    .user-role { font-size: 0.75rem; color: var(--text-muted); }

    .main-content { flex: 1; margin-left: 260px; padding: 2rem; }
    .page-header { margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .page-header h1 { font-size: 1.6rem; font-weight: 800; }
    .page-header p { color: var(--text-secondary); font-size: 0.9rem; }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; margin-bottom: 2rem; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; transition: all 0.3s; }
    .stat-card:hover { border-color: var(--border-hover); transform: translateY(-3px); }
    .stat-card__num { font-size: 1.7rem; font-weight: 800; line-height: 1; margin-bottom: 0.35rem; }
    .stat-card__label { font-size: 0.8rem; color: var(--text-secondary); }

    .btn-sm { padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; text-decoration: none; transition: all 0.3s; border: none; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color: #1a1a1a; }
    .btn-danger { background: rgba(239,68,68,0.15); color: var(--danger); }

    .message-list { display: flex; flex-direction: column; gap: 1rem; }
    .message-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; transition: all 0.3s; }
    .message-card:hover { border-color: var(--border-hover); }
    .message-card.unread { border-left: 3px solid var(--gold); }
    .message-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .message-sender { font-weight: 700; color: var(--text); }
    .message-time { font-size: 0.8rem; color: var(--text-muted); }
    .message-email { font-size: 0.8rem; color: var(--gold); margin-bottom: 0.5rem; }
    .message-body { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; }
    .message-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }

    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 50px; font-size: 0.7rem; font-weight: 700; }
    .badge--new { background: rgba(212,168,83,0.15); color: var(--gold); }
    .badge--read { background: rgba(100,116,139,0.15); color: var(--text-secondary); }

    .loading { color: var(--text-muted); font-style: italic; text-align: center; padding: 2rem; }

    @media (max-width: 1024px) {
      .sidebar { width: 80px; padding: 1rem; }
      .sidebar-brand span, .sidebar-link span, .user-info { display: none; }
      .sidebar-link { justify-content: center; padding: 0.85rem; }
      .main-content { margin-left: 80px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr; } }
  </style>
  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../admin/admin-auth-v2.js"></script>
  <link rel="canonical" href="https://bonds-global.com/en/admin/messages" />
  <meta property="og:title" content="Messages | Admin | Bonds" />
  <meta property="og:description" content="Specialized financial calculators and economic consulting from Bonds." />
  <meta property="og:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />
  <meta property="og:url" content="https://bonds-global.com/en/admin/messages" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Messages | Admin | Bonds" />
  <meta name="twitter:description" content="Specialized financial calculators and economic consulting from Bonds." />

  <meta name="description" content="Specialized financial calculators and economic consulting from Bonds." />

</head>
<body>

  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="../../assets/bonds-logo-2026-sm.webp?v=2026" alt="Bonds" />
        <span>Bonds</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="users.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Users</span>
        </a>
        <a href="subscriptions.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          <span>Subscriptions</span>
        </a>
        <a href="messages.html" class="sidebar-link active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Messages</span> <span id="msgBadge" style="display:none;background:#ef4444;color:#fff;font-size:0.65rem;padding:0.1rem 0.4rem;border-radius:50px;margin-left:auto;">0</span>
        </a>
        <a href="roles.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Roles</span>
        </a>
        <a href="analytics.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
          <span>Analytics</span>
        </a>
        <a href="../../en/calculators/dashboard.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>User Site</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar">A</div>
          <div class="user-info">
            <span class="user-name">Administrator</span>
            <span class="user-role">Admin</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Messages</h1>
          <p>Contact messages from users and visitors</p>
        </div>
        <button class="btn-sm btn-primary" onclick="refreshMessages()">↻ Refresh</button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card__num" id="totalMessages">—</div>
          <div class="stat-card__label">Total Messages</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__num" id="unreadMessages">—</div>
          <div class="stat-card__label">Unread</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__num" id="todayMessages">—</div>
          <div class="stat-card__label">Today</div>
        </div>
      </div>

      <div class="message-list" id="messageList">
        <div class="loading">Loading...</div>
      </div>
    </main>
  </div>

  <script>
    async function getAdminToken() {
      let token = window.__ADMIN_TOKEN || '';
      if (!token && typeof supabase !== 'undefined' && window.__ENV?.SUPABASE_URL) {
        const client = supabase.createClient(window.__ENV.SUPABASE_URL, window.__ENV.SUPABASE_ANON_KEY);
        const { data: { session } } = await client.auth.getSession();
        token = session?.access_token || '';
      }
      return token;
    }

    async function fetchMessages() {
      try {
        const token = await getAdminToken();
        const res = await fetch('/api/admin?action=messages', {
          headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data.success) throw new Error(data.error);
        if (data.demo) document.getElementById('demoIndicator').style.display = 'inline-block';
        return data.messages || [];
      } catch (e) {
        document.getElementById('demoIndicator').style.display = 'inline-block';
        return [
          { id: 'demo-1', name: 'Ahmad Mohammed', email: 'ahmed@example.com', phone: '+966501234567', sector: 'Manufacturing', service: 'Feasibility', message: 'I would like to inquire about a feasibility study for a plastic factory in Riyadh.', read: false, created_at: new Date(Date.now() - 3600000).toISOString() },
          { id: 'demo-2', name: 'Sara Abdullah', email: 'sara@example.com', phone: '+971501234567', sector: 'Retail', service: 'Financial Analysis', message: 'Need financial analysis for our retail chain expansion.', read: true, created_at: new Date(Date.now() - 86400000).toISOString() },
        ];
      }
    }

    async function toggleRead(id) {
      try {
        await fetch('/api/admin?action=messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (window.__ADMIN_TOKEN || '') },
          body: JSON.stringify({ action: 'mark_read', id })
        });
      } catch(e) {}
      refreshMessages();
    }

    async function deleteMessage(id) {
      if (!confirm('Are you sure you want to delete this message?')) return;
      try {
        await fetch('/api/admin?action=messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (window.__ADMIN_TOKEN || '') },
          body: JSON.stringify({ action: 'delete', id })
        });
      } catch(e) {}
      refreshMessages();
    }

    function timeAgo(dateStr) {
      const d = new Date(dateStr);
      const now = new Date();
      const diff = Math.floor((now - d) / 60000);
      if (diff < 1) return 'Just now';
      if (diff < 60) return diff + 'm ago';
      const hrs = Math.floor(diff / 60);
      if (hrs < 24) return hrs + 'h ago';
      const days = Math.floor(hrs / 24);
      return days + 'd ago';
    }

    async function renderMessages() {
      const msgs = await fetchMessages();
      const total = msgs.length;
      const unread = msgs.filter(m => !m.read).length;
      const today = msgs.filter(m => new Date(m.date || m.created_at).toDateString() === new Date().toDateString()).length;
      document.getElementById('totalMessages').textContent = total;
      document.getElementById('unreadMessages').textContent = unread;
      document.getElementById('todayMessages').textContent = today;
      const container = document.getElementById('messageList');
      if (msgs.length === 0) {
        container.innerHTML = '<div class="loading">No messages</div>';
        return;
      }
      container.innerHTML = msgs.map(m => `
        <div class="message-card ${m.read ? '' : 'unread'}">
          <div class="message-header">
            <span class="message-sender">${m.name} ${m.read ? '' : '<span class="badge badge--new">New</span>'}</span>
            <span class="message-time">${timeAgo(m.created_at)}</span>
          </div>
          <div class="message-email">${m.email}${m.phone ? ' | ' + m.phone : ''}</div>
          <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:0.5rem;">${m.sector || ''} ${m.service ? '→ ' + m.service : ''}</div>
          <div class="message-body">${m.message}</div>
          <div class="message-actions">
            <button class="btn-sm ${m.read ? 'btn-primary' : 'btn-secondary'}" onclick="toggleRead('${m.id}')">${m.read ? 'Mark unread' : 'Mark read'}</button>
            <button class="btn-sm btn-danger" onclick="deleteMessage('${m.id}')">Delete</button>
          </div>
        </div>
      `).join('');
      const badge = document.getElementById('msgBadge');
      if (badge) { badge.textContent = unread; badge.style.display = unread > 0 ? 'inline-block' : 'none'; }
    }

    function refreshMessages() {
      document.getElementById('messageList').innerHTML = '<div class="loading">Refreshing...</div>';
      setTimeout(renderMessages, 300);
    }

    window.addEventListener('load', renderMessages);

  </script>
</body>
</html>
