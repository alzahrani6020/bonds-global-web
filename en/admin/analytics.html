    :root {

      --border: rgba(0,0,0,0.08); --border-hover: rgba(184,149,78,0.4);

      --shadow-lg: 0 10px 40px rgba(0,0,0,0.4); --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }

    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px; background: var(--bg-secondary); border-right: 1px solid var(--border);
      padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem;
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 0.75rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .sidebar-brand img { height: 40px; width: auto; border-radius: 6px; }
    .sidebar-brand span { font-size: 1.1rem; font-weight: 800; color: var(--gold); }
    .sidebar-nav { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; border-radius: 12px; color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(212,168,83,0.1); color: var(--gold); }
    .sidebar-link svg { width: 20px; height: 20px; opacity: 0.7; }
    .sidebar-footer { padding-top: 1rem; border-top: 1px solid var(--border); }
    .sidebar-user { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-bright)); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #1a1a1a; font-size: 0.85rem; }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: 700; font-size: 0.85rem; }
    .user-role { font-size: 0.75rem; color: var(--text-muted); }

    .main-content { flex: 1; margin-left: 260px; padding: 2rem; }
    .page-header { margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .page-header h1 { font-size: 1.6rem; font-weight: 800; }
    .page-header p { color: var(--text-secondary); font-size: 0.9rem; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem; margin-bottom: 2rem; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; transition: all 0.3s; }
    .stat-card:hover { border-color: var(--border-hover); transform: translateY(-3px); }
    .stat-card__num { font-size: 1.7rem; font-weight: 800; line-height: 1; margin-bottom: 0.35rem; }
    .stat-card__label { font-size: 0.8rem; color: var(--text-secondary); }

    .section-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 2rem; }
    .chart-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
    .chart-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
    .chart-box { height: 260px; }
    .chart-box canvas { max-height: 260px; }

    .loading { color: var(--text-muted); font-style: italic; text-align: center; padding: 2rem; }
    .demo-badge { display: inline-block; background: rgba(234,179,8,0.2); color: var(--warning); font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 4px; margin-left: 0.5rem; }

    @media (max-width: 1024px) {
      .sidebar { width: 80px; padding: 1rem; }
      .sidebar-brand span, .sidebar-link span, .user-info { display: none; }
      .sidebar-link { justify-content: center; padding: 0.85rem; }
      .main-content { margin-left: 80px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .section-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr; } }

  <script>
    async function fetchAnalytics() {
      try {
        let token = window.__ADMIN_TOKEN || '';
        if (!token && typeof supabase !== 'undefined' && window.__ENV?.SUPABASE_URL) {
          const client = supabase.createClient(window.__ENV.SUPABASE_URL, window.__ENV.SUPABASE_ANON_KEY);
          const { data: { session } } = await client.auth.getSession();
          token = session?.access_token || '';
        }
        const res = await fetch('/api/admin?action=analytics', {
          headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data.success) throw new Error(data.error);
        if (data.demo) document.getElementById('demoIndicator').style.display = 'inline-block';
        return data.stats;
      } catch (e) {
        document.getElementById('demoIndicator').style.display = 'inline-block';
        return null;
      }
    }

    function calcLabel(name) {
      const map = {
        'factory-cost-sa': 'Factory - Saudi',
        'factory-cost-ae': 'Factory - UAE',
        'factory-cost-eg': 'Factory - Egypt',
        'factory-cost-kw': 'Factory - Kuwait',
        'factory-cost-qa': 'Factory - Qatar',
        'factory-cost-bh': 'Factory - Bahrain',
        'factory-cost-om': 'Factory - Oman',
        'factory-cost-jo': 'Factory - Jordan',
        'factory-cost-iq': 'Factory - Iraq',
        'factory-cost-lb': 'Factory - Lebanon',
        'factory-cost-ma': 'Factory - Morocco',
        'factory-cost-tn': 'Factory - Tunisia',
        'factory-cost-dz': 'Factory - Algeria',
        'factory-cost-tr': 'Factory - Turkey',
        'factory-cost-us': 'Factory - USA',
        'factory-cost-gb': 'Factory - UK',
        'factory-cost-in': 'Factory - India',
        'cash-flow': 'Cash Flow',
        'break-even': 'Break Even',
        'dish-margin': 'Dish Margin'
      };
      return map[name] || name;
    }

    function countryLabel(code) {
      const map = { SA: 'Saudi Arabia', AE: 'UAE', EG: 'Egypt', KW: 'Kuwait', QA: 'Qatar', BH: 'Bahrain', OM: 'Oman', JO: 'Jordan', IQ: 'Iraq', LB: 'Lebanon', MA: 'Morocco', DZ: 'Algeria', TN: 'Tunisia', TR: 'Turkey', US: 'USA', GB: 'UK', IN: 'India' };
      return map[code] || code;
    }

    async function initCharts() {
      const stats = await fetchAnalytics();
      if (!stats) return;

      document.getElementById('totalCalc').textContent = stats.totalCalculations.toLocaleString('en-US');
      document.getElementById('topCalc').textContent = stats.topCalculators[0] ? calcLabel(stats.topCalculators[0].calculator) : '-';
      document.getElementById('topCountry').textContent = stats.topCountries[0] ? countryLabel(stats.topCountries[0].country) : '-';
      const today = stats.dailyUsage.find(d => d.date === new Date().toISOString().slice(0, 10));
      document.getElementById('todayCalc').textContent = today ? today.count.toLocaleString('en-US') : '0';

      new Chart(document.getElementById('dailyChart').getContext('2d'), {
        type: 'bar',
        data: {
          labels: stats.dailyUsage.map(d => new Date(d.date).toLocaleDateString('en-US', { weekday: 'short' })),
          datasets: [{
            label: 'Calculations',
            data: stats.dailyUsage.map(d => d.count),
            backgroundColor: 'rgba(212,168,83,0.7)',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { color: '#555555' } },
            x: { grid: { display: false }, ticks: { color: '#555555' } }
          }
        }
      });

      new Chart(document.getElementById('calcChart').getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: stats.topCalculators.map(c => calcLabel(c.calculator)),
          datasets: [{
            data: stats.topCalculators.map(c => c.count),
            backgroundColor: ['#b8954e', '#3b82f6', '#22c55e', '#a855f7', '#ef4444'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '60%',
          plugins: { legend: { position: 'bottom', labels: { color: '#555555', font: { size: 11 }, padding: 10 } } }
        }
      });

      new Chart(document.getElementById('countryChart').getContext('2d'), {
        type: 'bar',
        data: {
          labels: stats.topCountries.map(c => countryLabel(c.country)),
          datasets: [{
            label: 'Usage',
            data: stats.topCountries.map(c => c.count),
            backgroundColor: 'rgba(59,130,246,0.7)',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { color: '#555555' } },
            x: { grid: { display: false }, ticks: { color: '#555555' } }
          }
        }
      });
    }

    function refreshData() { location.reload(); }

    window.addEventListener('load', initCharts);
  </script>
