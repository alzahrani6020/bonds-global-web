<head>
<meta charset="UTF-8">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Service Request | Bonds">
<meta name="twitter:description" content="Start a Bonds service request by country, sector, activity, and service.">
<meta name="twitter:image" content="https://bonds-global.com/assets/bonds-logo-2026-v2-sm.webp">

<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="/styles/fonts-en.css">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/styles/page-shared.css">
<link rel="stylesheet" href="/styles/institutional-system.css?v=6">
<link rel="stylesheet" href="/components/service-request.css?v=2">
<script src="/api/env" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="/bonds-auth-2026.js?v=3.1.3" defer></script>
<script defer src="/site-layout.js?v=3.8.0"></script>
<script defer src="/components/service-request.js?v=3"></script>
</head>
<body>
<div id="site-header"></div>
<main class="service-request-page">
  <div id="srStatus" class="sr-status"></div>
  <div id="srLoading" class="sr-card">Loading...</div>
  <div id="srContent" hidden>
    <section class="sr-hero">
      <div>
        <div class="sr-eyebrow">Service Request</div>
        <h1 id="srTitle"></h1>
        <p id="srDesc" class="sr-desc"></p>
        <div class="sr-badges"><span id="srDelivery" class="sr-badge"></span><span id="srAvailability" class="sr-badge"></span></div>
        <div id="srAvailabilityWarning" class="sr-warning" hidden></div>
      </div>
      <a id="srDetails" class="sr-secondary" hidden>Service details</a>
    </section>
    <div class="sr-grid">
      <div>
        <section class="sr-card"><h2>Procedures</h2><div id="srProcedures"></div></section>
        <section class="sr-card">
          <h2 id="srFormTitle">Request information</h2>
          <form id="srRequestForm">
            <div id="srDynamicFields" class="sr-form-grid"></div>
            <div class="sr-actions">
              <button id="srSubmit" class="sr-primary" type="submit">Submit service request</button>
              <a id="srSuccessLink" class="sr-secondary" hidden>Go to My Bonds</a>
            </div>
          </form>
        </section>
      </div>
      <aside>
        <section class="sr-card"><h2>Pricing</h2><div id="srPricing"></div></section>
        <section class="sr-card"><h2>Requirements</h2><div id="srRequirements"></div></section>
        <section class="sr-card"><h2>Deliverables</h2><div id="srDeliverables"></div></section>
        <section class="sr-card"><h2>Related services</h2><div id="srDependencies"></div></section>
      </aside>
    </div>
  </div>
</main>
<div id="site-footer"></div>
</body>
</html>
