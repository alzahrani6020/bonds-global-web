<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funding Sources | Bonds</title>
  <meta name="description" content="Directory of banks, funds, investors and government financing programs to support your project." />
  <meta property="og:title" content="Funding Sources | Bonds" />
  <meta property="og:description" content="Directory of banks, funds, investors and government financing programs to support your project." />
  <meta property="og:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp?v=2026" />
  <meta property="og:url" content="https://bonds-global.com/en/funding-sources" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="icon" href="../assets/bonds-mark.svg" type="image/png" />
  <style>
    .page-hero { padding: 8rem 2rem 4rem; text-align: center; background: var(--bg); }
    .page-hero h1 { font-size: 2.4rem; font-weight: 900; color: var(--text); margin-bottom: 1rem; }
    .page-hero h1 span { color: var(--gold); }
    .page-hero p { color: var(--text-secondary); max-width: 640px; margin: 0 auto; font-size: 1.05rem; line-height: 1.8; }

    .filters {
      max-width: 1200px;
      margin: 0 auto 2rem;
      padding: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .filters label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.4rem; }
    .filters select, .filters input {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    .filters select:focus, .filters input:focus { outline: none; border-color: var(--gold); }

    .filter-actions { max-width: 1200px; margin: 0 auto 1rem; padding: 0 1.5rem; display: flex; gap: 0.75rem; }
    .btn-primary, .btn-outline {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.75rem 1.75rem; border-radius: 10px; font-weight: 700;
      font-family: inherit; font-size: 0.95rem; cursor: pointer; border: none; text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--gold); color: #0a0f1a; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

    .results-info { max-width: 1200px; margin: 0 auto 1rem; padding: 0 1.5rem; color: var(--text-secondary); font-size: 0.9rem; }
    .results-info .fallback-note { color: var(--gold); margin-left: 0.5rem; }

    .project-match {
      max-width: 1200px; margin: 0 auto 1.5rem; padding: 1.5rem;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    }
    .project-match h3 { color: var(--gold); margin-bottom: 1rem; font-size: 1.1rem; }
    .project-match .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
    .project-match label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.4rem; }
    .project-match select, .project-match input { width: 100%; padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--text); font-family: inherit; }

    .save-btn { position: absolute; top: 1rem; right: 1rem; background: transparent; border: 1px solid var(--border); color: var(--text-secondary); border-radius: 8px; padding: 0.35rem 0.6rem; font-size: 0.75rem; cursor: pointer; }
    .save-btn.saved { color: var(--gold); border-color: var(--gold); }

    .results-grid {
      max-width: 1200px;
      margin: 0 auto 6rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }
    .source-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }
    .source-card:hover { transform: translateY(-4px); border-color: var(--gold); }
    .source-card .badge {
      display: inline-block;
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .badge-bank { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .badge-fund { background: rgba(168,85,247,0.15); color: #c084fc; }
    .badge-investor { background: rgba(236,72,153,0.15); color: #f472b6; }
    .badge-government_program { background: rgba(34,197,94,0.15); color: #4ade80; }
    .source-card h3 { font-size: 1.15rem; font-weight: 800; color: var(--text); margin-bottom: 0.5rem; }
    .source-card .meta { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem; }
    .source-card .amount { font-size: 0.95rem; color: var(--gold); font-weight: 700; margin-bottom: 0.75rem; }
    .source-card .desc { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.7; margin-bottom: 1rem; }
    .source-card .eligibility { font-size: 0.85rem; color: var(--text-secondary); background: rgba(255,255,255,0.03); padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; }
    .source-card a { color: var(--gold); font-weight: 700; text-decoration: none; font-size: 0.9rem; }

    .loading, .empty { text-align: center; color: var(--text-secondary); padding: 4rem 1rem; }
    .featured-tag { position: absolute; top: 1rem; right: 1rem; background: var(--gold); color: #0a0f1a; font-size: 0.7rem; font-weight: 800; padding: 0.2rem 0.6rem; border-radius: 12px; }

    @media (max-width: 640px) {
      .page-hero h1 { font-size: 1.8rem; }
      .results-grid { grid-template-columns: 1fr; }
    }
  </style>
<link rel="stylesheet" href="../components/universal-dropdown.css?v=2.51.7" />
  <link rel="canonical" href="https://bonds-global.com/en/funding-sources" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Funding Sources | Bonds" />
  <meta name="twitter:description" content="Directory of banks, funds, investors and government financing programs to support your project." />
  <meta name="twitter:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />

</head>
<body>
  <div id="site-header"></div>

  <section class="page-hero">
    <h1>Funding <span>Sources</span></h1>
    <p>A comprehensive directory of banks, funds, investors and government financing programs across multiple countries. Filter by country, sector and entity type.</p>
  </section>

  <section style="padding: 0 2rem;">
    <div class="project-match">
      <h3>🔍 Find funding for your project</h3>
      <div class="grid">
        <div>
          <label for="matchCountry">Country</label>
          <select data-universal-dropdown="true" data-ud-search="true" data-ud-sort="true" data-ud-deduplicate="true" data-ud-remove-empty="true" id="matchCountry">
            <option value="">All</option>
            <option value="SA">Saudi Arabia</option>
            <option value="AE">UAE</option>
            <option value="EG">Egypt</option>
            <option value="JO">Jordan</option>
            <option value="KW">Kuwait</option>
            <option value="QA">Qatar</option>
            <option value="BH">Bahrain</option>
            <option value="OM">Oman</option>
            <option value="MA">Morocco</option>
            <option value="TN">Tunisia</option>
          </select>
        </div>
        <div>
          <label for="matchSector">Sector</label>
          <input type="text" id="matchSector" placeholder="e.g. restaurants, manufacturing" />
        </div>
        <div>
          <label for="matchCapital">Required Capital</label>
          <input type="number" id="matchCapital" placeholder="e.g. 100000" />
        </div>
      </div>
      <button class="btn-primary" id="matchBtn" style="margin-top: 1rem;">Find best matches</button>
    </div>

    <div class="filters">
      <div>
        <label for="filterType">Entity Type</label>
        <select data-universal-dropdown="true" data-ud-search="true" data-ud-sort="true" data-ud-deduplicate="true" data-ud-remove-empty="true" id="filterType">
          <option value="">All</option>
          <option value="bank">Banks</option>
          <option value="fund">Funds</option>
          <option value="investor">Investors</option>
          <option value="government_program">Government Programs</option>
        </select>
      </div>
      <div>
        <label for="filterCountry">Country</label>
        <select data-universal-dropdown="true" data-ud-search="true" data-ud-sort="true" data-ud-deduplicate="true" data-ud-remove-empty="true" id="filterCountry">
          <option value="">All</option>
          <option value="SA">Saudi Arabia</option>
          <option value="AE">UAE</option>
          <option value="EG">Egypt</option>
          <option value="JO">Jordan</option>
          <option value="KW">Kuwait</option>
          <option value="QA">Qatar</option>
          <option value="BH">Bahrain</option>
          <option value="OM">Oman</option>
          <option value="MA">Morocco</option>
          <option value="TN">Tunisia</option>
        </select>
      </div>
      <div>
        <label for="filterSector">Sector</label>
        <input type="text" id="filterSector" placeholder="e.g. technology, manufacturing" />
      </div>
      <div>
        <label for="filterSearch">Search</label>
        <input type="text" id="filterSearch" placeholder="Entity name or keyword" />
      </div>
    </div>

    <div class="filter-actions">
      <button class="btn-primary" id="searchBtn">🔍 Search</button>
      <button class="btn-outline" id="resetBtn">Reset</button>
    </div>

    <div id="savedSection" class="results-info" style="display:none;"><strong>Saved for comparison:</strong></div>

    <div id="resultsInfo" class="results-info" style="display:none;"></div>

    <div id="results" class="results-grid">
      <div class="loading">Loading funding sources...</div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="../site-layout.js?v=2.52.0"></script>
  <script src="../script.js?v=4" defer></script>
  <script>
    (function() {
      const resultsEl = document.getElementById('results');
      const resultsInfo = document.getElementById('resultsInfo');
      const typeEl = document.getElementById('filterType');
      const countryEl = document.getElementById('filterCountry');
      const sectorEl = document.getElementById('filterSector');
      const searchEl = document.getElementById('filterSearch');

      const typeLabels = {
        bank: 'Bank',
        fund: 'Fund',
        investor: 'Investor',
        government_program: 'Government Program'
      };

      const fallbackSources = [
        { type: 'government_program', name_ar: 'برنامج كفالة', name_en: 'Kafala Program', country_code: 'SA', sector: 'all', description: 'Saudi SME financing guarantee program.', eligibility: 'Registered Saudi SMEs operating for at least one year.', min_amount: 10000, max_amount: 2000000, currency: 'SAR', financing_type: 'guarantee', website: 'https://kafala.gov.sa', is_featured: true },
        { type: 'bank', name_ar: 'البنك الأهلي السعودي', name_en: 'Saudi National Bank', country_code: 'SA', sector: 'all', description: 'Corporate and SME financing solutions.', eligibility: 'Registered companies with sound financials.', min_amount: 50000, max_amount: 50000000, currency: 'SAR', financing_type: 'loan', website: 'https://www.alahli.com', is_featured: true },
        { type: 'fund', name_ar: 'صندوق رأس المال الجريء — Monshaat', name_en: 'Monshaat VC Fund', country_code: 'SA', sector: 'technology,manufacturing', description: 'Venture investments in Saudi startups and scale-ups.', eligibility: 'Scalable business model and strong execution team.', min_amount: 500000, max_amount: 10000000, currency: 'SAR', financing_type: 'equity', website: 'https://www.monshaat.gov.sa' },
        { type: 'investor', name_ar: 'مستثمرون خليجيون', name_en: 'Gulf Angel Investors', country_code: 'AE', sector: 'technology,food,healthcare', description: 'Angel network backing early-stage startups.', eligibility: 'Clear MVP and strong team.', min_amount: 100000, max_amount: 2000000, currency: 'SAR', financing_type: 'equity', website: '#' },
        { type: 'bank', name_ar: 'بنك أبوظبي الأول', name_en: 'First Abu Dhabi Bank', country_code: 'AE', sector: 'all', description: 'Business financing solutions in the UAE.', eligibility: 'UAE-registered companies.', min_amount: 100000, max_amount: 10000000, currency: 'AED', financing_type: 'loan', website: 'https://www.bankfab.com' },
        { type: 'government_program', name_ar: 'برنامج تنمية المنشآت الصغيرة — مصر', name_en: 'SME Development Program Egypt', country_code: 'EG', sector: 'all', description: 'Affordable financing for Egyptian SMEs.', eligibility: 'Registered Egyptian enterprises.', min_amount: 5000, max_amount: 500000, currency: 'EGP', financing_type: 'loan', website: '#' }
      ];

      let allSources = [];
      let isFallback = false;
      let savedIds = new Set(JSON.parse(localStorage.getItem('bonds_saved_funding') || '[]'));

      async function load() {
        resultsEl.innerHTML = '<div class="loading">Loading funding sources...</div>';
        resultsInfo.style.display = 'none';
        isFallback = false;
        try {
          const params = new URLSearchParams();
          if (typeEl.value) params.set('type', typeEl.value);
          if (countryEl.value) params.set('country_code', countryEl.value);
          if (sectorEl.value.trim()) params.set('sector', sectorEl.value.trim());
          if (searchEl.value.trim()) params.set('search', searchEl.value.trim());

          const qs = params.toString();
          const res = await fetch('/api/funding-sources' + (qs ? '?' + qs : ''));
          const json = await res.json();
          allSources = json.data || [];
          if (!allSources.length) {
            allSources = fallbackSources;
            isFallback = true;
          }
          render();
        } catch (e) {
          allSources = fallbackSources;
          isFallback = true;
          render();
        }
      }

      function render() {
        const filtered = applyClientFilters(allSources);
        resultsInfo.style.display = 'flex';
        resultsInfo.innerHTML = `<span>Results: <strong>${filtered.length}</strong></span>` +
          (isFallback ? '<span class="fallback-note">(demo data — real sources can be added from the admin panel)</span>' : '');

        renderSaved();

        if (!filtered.length) {
          resultsEl.innerHTML = '<div class="empty">No matching results found.</div>';
          return;
        }
        resultsEl.innerHTML = filtered.map(s => `
          <div class="source-card">
            ${s.is_featured ? '<span class="featured-tag">Featured</span>' : ''}
            <button class="save-btn ${savedIds.has(s.id) ? 'saved' : ''}" onclick="toggleSave('${s.id}')" title="Save for comparison">${savedIds.has(s.id) ? '★' : '☆'}</button>
            <span class="badge badge-${s.type}">${typeLabels[s.type] || s.type}</span>
            <h3>${s.name_en || s.name_ar}</h3>
            <div class="meta">${s.country_code || ''} ${s.sector ? '· ' + s.sector : ''}</div>
            ${s.min_amount || s.max_amount ? `<div class="amount">${formatAmount(s.min_amount)} – ${formatAmount(s.max_amount)} ${s.currency || 'SAR'}</div>` : ''}
            ${s.description ? `<div class="desc">${s.description}</div>` : ''}
            ${s.eligibility ? `<div class="eligibility"><strong>Eligibility:</strong> ${s.eligibility}</div>` : ''}
            ${s.website ? `<a href="${s.website}" target="_blank" rel="noopener">Visit website →</a>` : ''}
          </div>
        `).join('');
      }

      window.toggleSave = function(id) {
        if (savedIds.has(id)) savedIds.delete(id);
        else savedIds.add(id);
        localStorage.setItem('bonds_saved_funding', JSON.stringify(Array.from(savedIds)));
        render();
      };

      function renderSaved() {
        const saved = allSources.filter(s => savedIds.has(s.id));
        const el = document.getElementById('savedSection');
        if (!saved.length) { el.style.display = 'none'; return; }
        el.style.display = 'block';
        el.innerHTML = '<strong>Saved for comparison:</strong> ' +
          saved.map(s => `<span style="display:inline-block;background:rgba(212,168,83,0.15);color:var(--gold);padding:0.2rem 0.6rem;border-radius:12px;margin:0.25rem;font-size:0.8rem;">${s.name_en || s.name_ar}</span>`).join('');
      }

      function applyClientFilters(list) {
        const t = typeEl.value;
        const c = countryEl.value;
        const se = sectorEl.value.trim().toLowerCase();
        const q = searchEl.value.trim().toLowerCase();
        const capital = Number(document.getElementById('matchCapital').value) || 0;
        return list.filter(s => {
          if (t && s.type !== t) return false;
          if (c && s.country_code !== c) return false;
          if (se) {
            const sectorText = (s.sector || '').toLowerCase();
            if (!sectorText.includes(se)) return false;
          }
          if (q) {
            const hay = ((s.name_en || '') + ' ' + (s.name_ar || '') + ' ' + (s.description || '')).toLowerCase();
            if (!hay.includes(q)) return false;
          }
          if (capital > 0) {
            const max = Number(s.max_amount) || Infinity;
            const min = Number(s.min_amount) || 0;
            if (capital < min || capital > max) return false;
          }
          return true;
        });
      }

      function formatAmount(n) {
        if (n == null) return '-';
        return Number(n).toLocaleString('en-US');
      }

      function debounce(fn, ms) {
        let t;
        return function() {
          clearTimeout(t);
          t = setTimeout(fn, ms);
        };
      }

      typeEl.addEventListener('change', render);
      countryEl.addEventListener('change', render);
      sectorEl.addEventListener('input', debounce(render, 400));
      searchEl.addEventListener('input', debounce(render, 400));
      document.getElementById('searchBtn').addEventListener('click', load);
      document.getElementById('resetBtn').addEventListener('click', function(){
        typeEl.value = ''; countryEl.value = ''; sectorEl.value = ''; searchEl.value = '';
        document.getElementById('matchCountry').value = '';
        document.getElementById('matchSector').value = '';
        document.getElementById('matchCapital').value = '';
        load();
      });
      document.getElementById('matchBtn').addEventListener('click', function(){
        countryEl.value = document.getElementById('matchCountry').value;
        sectorEl.value = document.getElementById('matchSector').value;
        render();
      });

      load();
    })();
  </script>
<script src="../components/universal-dropdown.js?v=2.51.7"></script>
<script src="../components/universal-dropdown-init.js"></script>
</body>
</html>
