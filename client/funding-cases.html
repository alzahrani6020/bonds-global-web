  <style>
    .fc-status {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: rgba(212,168,83,0.12);
      color: var(--gold-bright);
      border: 1px solid rgba(212,168,83,0.2);
    }
    .fc-status.new { background: rgba(148,163,184,0.12); color: #94a3b8; border-color: rgba(148,163,184,0.2); }
    .fc-status.approved { background: rgba(34,197,94,0.12); color: #22c55e; border-color: rgba(34,197,94,0.2); }
    .fc-status.declined { background: rgba(239,68,68,0.12); color: #ef4444; border-color: rgba(239,68,68,0.2); }
    .fc-status.closed { background: rgba(148,163,184,0.12); color: #94a3b8; border-color: rgba(148,163,184,0.2); }
    .fc-card__header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .fc-card__ref { font-family: monospace; font-size: 0.9rem; color: var(--gold-bright); }
    .fc-card__title { font-size: 1.1rem; font-weight: 700; color: var(--text); margin: 0 0 0.25rem; }
    .fc-card__meta { font-size: 0.85rem; color: var(--text-secondary); }
    .fc-card__amount { font-size: 1rem; font-weight: 700; color: var(--text); margin-top: 0.75rem; }
    .fc-lookup-link { text-align: center; padding: 1.5rem; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="my-bonds-page">
    <section class="my-bonds-hero">
      <div class="my-bonds-hero__content">
        <h1>حالات التمويل</h1>
        <p>تابع حالة طلبات التمويل الخاصة بك واطلع على المستندات المطلوبة.</p>
      </div>
    </section>

    <section class="my-bonds-container">
      <div id="loading" class="bonds-card my-bonds-empty">
        <p>جاري تحميل حالاتك...</p>
      </div>

      <div id="casesSection" style="display:none;">
        <div class="my-bonds-section">
          <h3 class="my-bonds-section__title">طلباتي</h3>
          <div id="casesList" class="my-bonds-grid"></div>
        </div>
      </div>

      <div class="bonds-card fc-lookup-link">
        <p style="margin-bottom:1rem;color:var(--text-secondary);">لديك رقم مرجعي لطلب قُدّم بدون تسجيل الدخول؟</p>
        <a href="funding-case-lookup.html" class="bonds-btn bonds-btn-secondary">البحث عن طلب بالرقم المرجعي</a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script defer src="../site-layout.js?v=3.2.2"></script>
  <script>
    (function() {
      'use strict';

      const statusClassMap = {
        new: 'new',
        initial_review: '',
        documents_required: '',
        under_assessment: '',
        funding_options: '',
        submitted_to_provider: '',
        provider_review: '',
        approved: 'approved',
        declined: 'declined',
        on_hold: '',
        closed: 'closed'
      };

      function formatDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '—';
        return d.toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' });
      }

      function formatAmount(amount) {
        if (amount === null || amount === undefined || amount === '') return '—';
        return Number(amount).toLocaleString('ar-SA') + ' ر.س';
      }

      function showError(message) {
        const container = document.getElementById('loading');
        container.innerHTML = '<p style="color:#ef4444;">' + BondsCommon.escapeHtml(message) + '</p>';
      }

      async function apiFetch(url, options) {
        const { data: sessionData } = await window.BondsAuth.getSession();
        const token = sessionData?.session?.access_token;
        const headers = {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: 'Bearer ' + token } : {})
        };
        return fetch(url, { ...(options || {}), headers: { ...headers, ...(options?.headers || {}) } });
      }

      async function loadCases() {
        try {
          const res = await apiFetch('/api/admin?action=funding-cases-client-list');
          const json = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(json.error || 'فشل تحميل الحالات');
          }
          renderCases(json.cases || [], json.statusLabels || {});
        } catch (err) {
          showError(err.message);
        }
      }

      function renderCases(cases, labels) {
        document.getElementById('loading').style.display = 'none';
        const section = document.getElementById('casesSection');
        const list = document.getElementById('casesList');
        section.style.display = 'block';

        if (!cases.length) {
          list.innerHTML = `
            <div class="bonds-card my-bonds-empty" style="grid-column:1/-1;">
              <p>لا توجد حالات تمويل مرتبطة بحسابك حالياً.</p>
              <a href="../funding-extraction.html" class="bonds-btn bonds-btn-primary">تقديم طلب تمويل جديد</a>
            </div>
          `;
          return;
        }

        list.innerHTML = cases.map(function(c) {
          const statusLabel = (labels.ar && labels.ar[c.status]) || c.status;
          const statusClass = statusClassMap[c.status] || '';
          return `
            <a href="funding-case.html?id=${encodeURIComponent(c.id)}" class="bonds-card my-bonds-project" style="text-decoration:none;color:inherit;">
              <div class="fc-card__header">
                <span class="fc-card__ref">${BondsCommon.escapeHtml(c.case_reference)}</span>
                <span class="fc-status ${statusClass}">${BondsCommon.escapeHtml(statusLabel)}</span>
              </div>
              <h4 class="fc-card__title">${BondsCommon.escapeHtml(c.company || c.name)}</h4>
              <div class="fc-card__meta">${BondsCommon.escapeHtml(c.financing_type || '—')} · ${BondsCommon.escapeHtml(c.country || '—')}</div>
              <div class="fc-card__amount">${formatAmount(c.amount)}</div>
              <div class="fc-card__meta" style="margin-top:0.5rem;">آخر تحديث: ${formatDate(c.updated_at)}</div>
            </a>
          `;
        }).join('');
      }

      loadCases();
    })();
  </script>
</body>
</html>
