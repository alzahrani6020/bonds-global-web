<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>وحدة الاستشارات المالية | بوندز</title>
  <meta name="description" content="وحدة إدارة الاستشارات المالية: العملاء، المشاريع، دراسات الجدوى، النماذج المالية، المستندات والملاحظات." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="/assets/bonds-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css?v=8" />
  <link rel="stylesheet" href="/styles/design-system.css?v=8" />
  <link rel="stylesheet" href="/admin/financial-advisory/styles.css?v=8" />
  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>
  <script>
    // Sanitize all innerHTML assignments to mitigate XSS from user/API data.
    (function() {
      if (typeof DOMPurify === 'undefined' || !window.Element) return;
      const descriptor = Object.getOwnPropertyDescriptor(window.Element.prototype, 'innerHTML');
      if (!descriptor || typeof descriptor.set !== 'function') return;
      const originalSet = descriptor.set;
      descriptor.set = function(html) {
        if (typeof html === 'string') {
          html = DOMPurify.sanitize(html, { ADD_ATTR: ['onclick','onsubmit','onchange','oninput'], KEEP_CONTENT: true });
        }
        return originalSet.call(this, html);
      };
      Object.defineProperty(window.Element.prototype, 'innerHTML', descriptor);
    })();
  </script>
  <script src="/supabase-client.js"></script>
  <script src="/admin/financial-advisory/service.js?v=10"></script>
  <script src="/admin/financial-advisory/app.js?v=9"></script>
<script src="/calculators/auth-gate.js?v=2"></script>
  <link rel="stylesheet" href="/admin/admin-shared-ux.css" />
</head>
<body>
  <div class="fa-layout">
    <aside class="fa-sidebar">
      <div class="fa-brand">
        <img src="/assets/bonds-logo-2026-header.webp" alt="بوندز" />
        <span>الاستشارات المالية</span>
      </div>
      <ul class="fa-nav">
        <li><a href="#" data-view="dashboard" class="active">لوحة الاستشارات</a></li>
        <li><a href="#" data-view="clients">العملاء</a></li>
        <li><a href="#" data-view="projects">المشاريع</a></li>
        <li><a href="#" data-view="studies">دراسات الجدوى</a></li>
        <li><a href="#" data-view="models">النماذج المالية</a></li>
        <li><a href="#" data-view="activity">السجل الزمني</a></li>
        <li style="margin-top:1.5rem;border-top:1px solid var(--border);padding-top:1rem;"><a href="/admin/dashboard.html">لوحة الإدارة الرئيسية</a></li>
      </ul>
      <div style="margin-top:auto;padding-top:2rem;color:var(--text-secondary);font-size:0.8rem;">
        <div id="fa-user">جارِ التحقق...</div>
      </div>
    </aside>
    <main class="fa-main" id="fa-content">
      <div class="fa-empty"><div class="fa-spinner"></div></div>
    </main>
  </div>
  <script>
    (function () {
      const el = document.getElementById('fa-content');
      function status(msg) { if (el) el.innerHTML = '<div class="fa-empty" style="text-align:center;padding:2rem;"><p>' + msg + '</p></div>'; }
      window.addEventListener('error', function (e) {
        status('خطأ JavaScript: ' + e.message + ' (' + (e.filename || '') + ':' + (e.lineno || '') + ')');
      });
      window.addEventListener('unhandledrejection', function (e) {
        status('خطأ غير متوقع: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
      status('جارِ تهيئة الوحدة...');
    })();
  </script>
  <script src="/admin/admin-embed.js"></script>
  <script src="/admin/admin-accessibility.js"></script>
<script src="/admin/admin-sidebar-icons.js"></script>
</body>
</html>
