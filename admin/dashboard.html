  <style>
    :root {
      --bg: #f5f0e8;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255,255,255,0.9);
      --gold: #b8954e;
      --gold-bright: #d4b87a;
      --gold-dim: #8a7340;
      --text: #1a1a1a;
      --text-secondary: #555555;
      --text-muted: #888888;
      --border: rgba(0,0,0,0.08);
      --border-hover: rgba(184,149,78,0.35);
      --success: #22c55e;
      --warning: #eab308;
      --info: #3b82f6;
      --danger: #ef4444;
      --shadow: 0 4px 20px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.1);
      --radius: 16px;
      --sidebar-width: 270px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Vazirmatn', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow: hidden;
    }

    .admin-shell { display: flex; height: 100vh; }
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      position: fixed;
      right: 0; top: 0; bottom: 0;
      z-index: 100;
      overflow-y: auto;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 0.75rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .sidebar-brand img { height: 42px; width: auto; border-radius: 6px; }
    .sidebar-brand span { font-size: 1.05rem; font-weight: 800; color: var(--gold); }

    .nav-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .nav-label { font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 0 0.75rem; margin-bottom: 0.25rem; }
    .sidebar-link {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.75rem 1rem; border-radius: 12px;
      color: var(--text-secondary); text-decoration: none;
      font-weight: 600; font-size: 0.86rem;
      transition: all 0.2s; cursor: pointer; border: none; background: none; width: 100%; font-family: inherit;
    }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(184,149,78,0.12); color: var(--gold); }
    .sidebar-link svg { width: 20px; height: 20px; opacity: 0.75; flex-shrink: 0; }

    .sidebar-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); }
    .sidebar-user { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-bright));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #1a1a1a; font-size: 0.85rem;
    }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: 700; font-size: 0.85rem; }
    .user-role { font-size: 0.75rem; color: var(--text-muted); }

    .main-content { flex: 1; margin-right: var(--sidebar-width); display: flex; flex-direction: column; height: 100vh; }
    .topbar {
      height: 64px; background: var(--bg-secondary); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; flex-shrink: 0;
    }
    .topbar-title { font-size: 1.15rem; font-weight: 800; }
    .topbar-actions { display: flex; gap: 0.75rem; align-items: center; }
    .btn-sm { padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.8rem; font-weight: 700; border: none; cursor: pointer; text-decoration: none; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color: #1a1a1a; }
    .btn-secondary { background: rgba(0,0,0,0.04); color: var(--text-secondary); border: 1px solid var(--border); }

    .iframe-wrap { flex: 1; overflow: hidden; background: var(--bg); position: relative; }
    .module-frame { width: 100%; height: 100%; border: none; }
    .iframe-loader {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-secondary); gap: 1rem;
    }
    .iframe-loader .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--gold); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .overview { padding: 1.5rem; overflow-y: auto; }
    .page-header { margin-bottom: 1.5rem; }
    .page-header h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.25rem; }
    .page-header p { color: var(--text-secondary); font-size: 0.9rem; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem; margin-bottom: 1.5rem; }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.25rem; box-shadow: var(--shadow); transition: all 0.2s;
    }
    .stat-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
    .stat-card__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .stat-card__icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
    .stat-card__icon--gold { background: rgba(184,149,78,0.12); }
    .stat-card__icon--blue { background: rgba(59,130,246,0.12); }
    .stat-card__icon--green { background: rgba(34,197,94,0.12); }
    .stat-card__icon--purple { background: rgba(168,85,247,0.12); }
    .stat-card__icon--red { background: rgba(239,68,68,0.12); }
    .stat-card__num { font-size: 1.5rem; font-weight: 800; line-height: 1; margin-bottom: 0.25rem; }
    .stat-card__label { font-size: 0.78rem; color: var(--text-secondary); }

    .modules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.25rem; }
    .module-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.25rem; cursor: pointer; transition: all 0.2s; text-decoration: none; color: inherit;
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    .module-card:hover { border-color: var(--border-hover); transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .module-card__icon { width: 48px; height: 48px; border-radius: 12px; background: rgba(184,149,78,0.12); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    .module-card__title { font-size: 1.05rem; font-weight: 800; }
    .module-card__desc { font-size: 0.85rem; color: var(--text-secondary); }

    .mobile-toggle {
      display: none; position: fixed; top: 1rem; right: 1rem; z-index: 110;
      width: 44px; height: 44px; border-radius: 10px;
      background: var(--bg-secondary); border: 1px solid var(--border);
      align-items: center; justify-content: center; cursor: pointer;
      box-shadow: var(--shadow);
    }

    @media (max-width: 1024px) {
      .sidebar { transform: translateX(100%); width: 260px; }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-right: 0; }
      .mobile-toggle { display: flex; }
    }
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {

  <script>
    (function () {
      'use strict';

      const sb = window.BondsAuth?.getSupabase ? window.BondsAuth.getSupabase() : null;
      const overviewEl = document.getElementById('overviewPanel');
      const iframeWrap = document.getElementById('iframeWrap');

      async function loadStats() {
        const counts = {
          users: 0,
          subscriptions: 0,
          revenue: 0,
          messages: 0,
          advisoryClients: 0,
          advisoryProjects: 0,
          recoveryAssets: 0,
          cities: 0,
          aiReviews: 0
        };

        try {
          const [users, subs, msgs, advClients, advProjects, recAssets, cities, aiReviews] = await Promise.allSettled([
            sb?.from('profiles')?.select('*', { count: 'exact', head: true }),
            sb?.from('subscriptions')?.select('*', { count: 'exact', head: true }),
            sb?.from('contact_messages')?.select('*', { count: 'exact', head: true }),
            sb?.from('advisory_clients')?.select('*', { count: 'exact', head: true }),
            sb?.from('advisory_projects')?.select('*', { count: 'exact', head: true }),
            sb?.from('recovery_assets')?.select('*', { count: 'exact', head: true }),
            sb?.from('cities')?.select('*', { count: 'exact', head: true }),
            sb?.from('ai_review_requests')?.select('*', { count: 'exact', head: true })
          ]);

          counts.users = users.value?.count || 0;
          counts.subscriptions = subs.value?.count || 0;
          counts.messages = msgs.value?.count || 0;
          counts.advisoryClients = advClients.value?.count || 0;
          counts.advisoryProjects = advProjects.value?.count || 0;
          counts.recoveryAssets = recAssets.value?.count || 0;
          counts.cities = cities.value?.count || 0;
          counts.aiReviews = aiReviews.value?.count || 0;

          const rev = await sb?.from('subscriptions')?.select('tier')?.eq('status', 'active');
          if (rev?.data) {
            counts.revenue = rev.data.reduce((a, r) => {
              if (r.tier === 'enterprise') return a + 212;
              if (r.tier === 'pro') return a + 82;
              return a;
            }, 0);
          }
        } catch (e) { console.warn('stats load failed', e); }

        return counts;
      }

      function renderOverview(counts) {
        overviewEl.innerHTML = `
          <div class="page-header">
            <h1>لوحة التحكم الموحدة</h1>
            <p>إدارة جميع وحدات بوندز من مكان واحد</p>
          </div>
          <div class="stats-grid">
            <div class="stat-card"><div class="stat-card__header"><div class="stat-card__icon stat-card__icon--blue">👥</div></div><div class="stat-card__num">${counts.users.toLocaleString('ar-SA')}</div><div class="stat-card__label">المستخدمين</div></div>

      function loadModule(url, title) {
        if (url === 'overview') {
          iframeWrap.innerHTML = '<div class="overview" id="overviewPanel"></div>';
          loadStats().then(renderOverview);
          return;
        }
        iframeWrap.innerHTML = '<div class="iframe-loader"><div class="spinner"></div><p>جارِ تحميل القسم...</p></div>';
        const iframe = document.createElement('iframe');
        iframe.className = 'module-frame';
        iframe.src = url;
        iframe.title = title || '';
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-downloads');
        iframe.onload = async () => {
          try {
            const { data: { session } } = await sb.auth.getSession();
            const token = session?.access_token || window.__ADMIN_TOKEN || '';
            iframe.contentWindow.postMessage({ type: 'admin-token', token }, location.origin);
            if (session) {
              iframe.contentWindow.postMessage({ type: 'admin-session', session }, location.origin);
            }
          } catch (e) {}
        };
        iframeWrap.innerHTML = '';
        iframeWrap.appendChild(iframe);
      }

      function setActive(target) {
        document.querySelectorAll('.sidebar-link').forEach(link => {
          link.classList.toggle('active', link.dataset.target === target);
        });
      }

      document.querySelectorAll('.sidebar-link').forEach(link => {
        link.addEventListener('click', () => {
          const target = link.dataset.target;
          const title = link.dataset.title;
          setActive(target);
          loadModule(target, title);
          if (window.innerWidth <= 1024) document.getElementById('sidebar').classList.remove('open');
        });
      });

      document.getElementById('mobileToggle').onclick = () => {
        document.getElementById('sidebar').classList.toggle('open');
      };

      async function initUser() {
        try {
          const { data: { user } } = await sb.auth.getUser();
          if (user) {
            const name = user.user_metadata?.full_name || user.email?.split('@')[0] || 'مدير';
            document.getElementById('userName').textContent = name;
            document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
            document.getElementById('userRole').textContent = window.__ADMIN_ROLE === 'super_admin' ? 'Super Admin' : 'Admin';
          }
        } catch (e) {}
      }

      loadStats().then(renderOverview);
      initUser();
    })();
  </script>
