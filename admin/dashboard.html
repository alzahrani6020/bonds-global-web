<!DOCTYPE html>
<html lang="ar" dir="rtl" data-ud-theme="light">
<head>

  <style>
    :root {
      --bg: #f5f0e8;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255,255,255,0.9);
      --gold: #b8954e;
      --gold-bright: #d4b87a;
      --gold-dim: #8a7340;
      --text: #1a1a1a;
      --text-secondary: #555555;
      --text-muted: #888888;
      --border: rgba(0,0,0,0.08);
      --border-hover: rgba(184,149,78,0.35);
      --success: #22c55e;
      --warning: #eab308;
      --info: #3b82f6;
      --danger: #ef4444;
      --shadow: 0 4px 20px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.1);
      --radius: 16px;
      --sidebar-width: 270px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Vazirmatn', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow: hidden;
    }

    .admin-shell { display: flex; height: 100vh; }
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      position: fixed;
      right: 0; top: 0; bottom: 0;
      z-index: 100;
      overflow-y: auto;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 0.75rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .sidebar-brand img { height: 42px; width: auto; border-radius: 6px; }
    .sidebar-brand span { font-size: 1.05rem; font-weight: 800; color: var(--gold); }

    .nav-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .nav-label { font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 0 0.75rem; margin-bottom: 0.25rem; }
    .sidebar-link {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.75rem 1rem; border-radius: 12px;
      color: var(--text-secondary); text-decoration: none;
      font-weight: 600; font-size: 0.86rem;
      transition: all 0.2s; cursor: pointer; border: none; background: none; width: 100%; font-family: inherit;
    }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(184,149,78,0.12); color: var(--gold); }
    .sidebar-link svg { width: 20px; height: 20px; opacity: 0.75; flex-shrink: 0; }

    .sidebar-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); }
    .sidebar-user { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-bright));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #1a1a1a; font-size: 0.85rem;
    }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: 700; font-size: 0.85rem; }
    .user-role { font-size: 0.75rem; color: var(--text-muted); }

    .main-content { flex: 1; margin-right: var(--sidebar-width); display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
    .topbar {
      height: 64px; background: var(--bg-secondary); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; flex-shrink: 0;
    }
    .topbar-title { font-size: 1.15rem; font-weight: 800; }
    .topbar-actions { display: flex; gap: 0.75rem; align-items: center; }
    .btn-sm { padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.8rem; font-weight: 700; border: none; cursor: pointer; text-decoration: none; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color: #1a1a1a; }
    .btn-secondary { background: rgba(0,0,0,0.04); color: var(--text-secondary); border: 1px solid var(--border); }

    .iframe-wrap { flex: 1; overflow: visible; background: var(--bg); position: relative; }
    .module-frame { width: 100%; height: 100%; border: none; }
    .iframe-loader {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-secondary); gap: 1rem;
    }
    .iframe-loader .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--gold); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .overview { padding: 1.5rem; overflow-y: auto; }
    .page-header { margin-bottom: 1.5rem; }
    .page-header h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.25rem; }
    .page-header p { color: var(--text-secondary); font-size: 0.9rem; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem; margin-bottom: 1.5rem; }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.25rem; box-shadow: var(--shadow); transition: all 0.2s;
    }
    .stat-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
    .stat-card__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .stat-card__icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
    .stat-card__icon--gold { background: rgba(184,149,78,0.12); }
    .stat-card__icon--blue { background: rgba(59,130,246,0.12); }
    .stat-card__icon--green { background: rgba(34,197,94,0.12); }
    .stat-card__icon--purple { background: rgba(168,85,247,0.12); }
    .stat-card__icon--red { background: rgba(239,68,68,0.12); }
    .stat-card__num { font-size: 1.5rem; font-weight: 800; line-height: 1; margin-bottom: 0.25rem; }
    .stat-card__label { font-size: 0.78rem; color: var(--text-secondary); }

    .modules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.25rem; }
    .module-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.25rem; cursor: pointer; transition: all 0.2s; text-decoration: none; color: inherit;
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    .module-card:hover { border-color: var(--border-hover); transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .module-card__icon { width: 48px; height: 48px; border-radius: 12px; background: rgba(184,149,78,0.12); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }

    /* Online Users inline styles */
    .online-toolbar { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .online-toolbar .btn-sm { padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.8rem; font-weight: 700; border: none; cursor: pointer; background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color: #1a1a1a; }
    .online-toolbar .btn-secondary { background: rgba(0,0,0,0.04); color: var(--text-secondary); border: 1px solid var(--border); }
    .live-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); animation: pulse 1.5s infinite; display: inline-block; margin-left: 0.5rem; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); } 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
    .online-table { width: 100%; border-collapse: collapse; }
    .online-table th { text-align: right; padding: 0.9rem 1rem; font-size: 0.75rem; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.9); }
    .online-table td { padding: 0.75rem 1rem; font-size: 0.85rem; color: var(--text-secondary); border-bottom: 1px solid var(--border); vertical-align: middle; }
    .online-table tr:hover td { background: rgba(184,149,78,0.05); cursor: pointer; }
    .country-cell { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; color: var(--text); }
    .country-flag { font-size: 1.2rem; }
    .user-type { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 50px; font-size: 0.7rem; font-weight: 700; }
    .user-type--guest { background: rgba(148,163,184,0.15); color: #64748b; }
    .user-type--user { background: rgba(34,197,94,0.15); color: #16a34a; }
    .page-link { color: var(--gold); text-decoration: none; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; direction: ltr; }
    .time-ago { font-size: 0.75rem; color: var(--text-muted); }
    .timeline-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .timeline-modal.open { display: flex; }
    .timeline-card { background: var(--bg-secondary); border-radius: var(--radius); width: 100%; max-width: 800px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
    .timeline-header { padding: 1.25rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .timeline-header h3 { font-size: 1.1rem; font-weight: 800; color: var(--gold); }
    .timeline-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary); }
    .timeline-body { padding: 1.25rem; overflow-y: auto; flex: 1; }
    .journey-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .journey-item { background: var(--bg); padding: 0.75rem; border-radius: 10px; text-align: center; }
    .journey-item .num { font-size: 1.2rem; font-weight: 800; color: var(--gold); }
    .journey-item .lbl { font-size: 0.75rem; color: var(--text-secondary); }
    .timeline { position: relative; padding-right: 1.25rem; }
    .timeline::before { content: ''; position: absolute; right: 5px; top: 0; bottom: 0; width: 2px; background: var(--border); }
    .timeline-row { position: relative; margin-bottom: 1rem; }
    .timeline-row::before { content: ''; position: absolute; right: -19px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); border: 2px solid var(--bg-secondary); }
    .timeline-time { font-size: 0.75rem; color: var(--text-muted); }
    .timeline-page { font-weight: 700; color: var(--text); }
    .timeline-duration { display: inline-block; background: rgba(184,149,78,0.12); color: var(--gold-dim); padding: 0.15rem 0.4rem; border-radius: 6px; font-size: 0.75rem; font-weight: 700; margin-top: 0.25rem; }
    .module-card__title { font-size: 1.05rem; font-weight: 800; }
    .module-card__desc { font-size: 0.85rem; color: var(--text-secondary); }

    .mobile-toggle {
      display: none; position: fixed; top: 1rem; right: 1rem; z-index: 110;
      width: 44px; height: 44px; border-radius: 10px;
      background: var(--bg-secondary); border: 1px solid var(--border);
      align-items: center; justify-content: center; cursor: pointer;
      box-shadow: var(--shadow);
    }

    @media (max-width: 1024px) {
      .sidebar { transform: translateX(100%); width: 260px; }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-right: 0; }
      .mobile-toggle { display: flex; }
    }
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
      .owner-perms-grid { grid-template-columns: 1fr 1fr; }
    }

    .owner-perms-group { margin-bottom: 0.5rem; }
    .owner-perms-details { position: relative; }
    .owner-perms-summary { list-style: none; cursor: pointer; background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color: #1a1a1a; }
    .owner-perms-summary::-webkit-details-marker { display: none; }
    .owner-perms-summary:hover { filter: brightness(1.05); }
    .owner-perms-details[open] .owner-perms-chevron { transform: rotate(180deg); }
    .owner-perms-submenu { display: flex; flex-direction: column; gap: 0.25rem; padding-right: 1rem; border-right: 2px solid var(--border); margin-right: 1rem; margin-top: 0.25rem; }
    .owner-perms-submenu .sidebar-link { padding: 0.6rem 0.85rem; font-size: 0.82rem; border-radius: 10px; }
    .owner-perms-submenu .sidebar-link:hover { background: rgba(184,149,78,0.12); }

    /* Command palette / unified search */
    .cmd-palette-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      z-index: 1000; display: none; align-items: flex-start; justify-content: center;
      padding-top: 10vh; backdrop-filter: blur(2px);
    }
    .cmd-palette-overlay.open { display: flex; }
    .cmd-palette {
      width: min(560px, 92vw); background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow-lg); overflow: hidden;
    }
    .cmd-palette-input-wrap {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .cmd-palette-input-wrap svg { width: 20px; height: 20px; color: var(--text-muted); flex-shrink: 0; }
    .cmd-palette-input {
      flex: 1; border: none; background: transparent; font: inherit; font-size: 1rem;
      color: var(--text); outline: none;
    }
    .cmd-palette-input::placeholder { color: var(--text-muted); }
    .cmd-palette-list { max-height: 60vh; overflow-y: auto; padding: 0.5rem; }
    .cmd-palette-empty { padding: 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.9rem; }
    .cmd-palette-item {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0.85rem;
      border-radius: 10px; cursor: pointer; color: var(--text-secondary); text-decoration: none;
      transition: background 0.15s;
    }
    .cmd-palette-item:hover, .cmd-palette-item.active {
      background: rgba(184,149,78,0.12); color: var(--gold);
    }
    .cmd-palette-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.8; }
    .cmd-palette-item__meta { margin-right: auto; font-size: 0.75rem; color: var(--text-muted); }
    .cmd-palette-kbd {
      font-size: 0.7rem; padding: 0.15rem 0.4rem; border-radius: 5px;
      background: rgba(0,0,0,0.05); color: var(--text-muted); border: 1px solid var(--border);
    }

    /* Notification bell */
    .notif-bell {
      position: relative; background: transparent; border: none; cursor: pointer;
      color: var(--text-secondary); padding: 0.5rem; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .notif-bell:hover { background: rgba(0,0,0,0.04); color: var(--gold); }
    .notif-bell svg { width: 22px; height: 22px; }
    .notif-badge {
      position: absolute; top: 2px; left: 2px; min-width: 18px; height: 18px;
      background: var(--danger); color: #fff; font-size: 0.7rem; font-weight: 800;
      border-radius: 50%; display: none; align-items: center; justify-content: center;
      padding: 0 4px;
    }
    .notif-badge.visible { display: flex; }
    .notif-dropdown {
      position: absolute; top: calc(100% + 0.5rem); left: 0; width: 320px; max-width: 90vw;
      background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow-lg); z-index: 200; display: none; overflow: hidden;
    }
    .notif-dropdown.open { display: block; }
    .notif-header { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); font-weight: 800; font-size: 0.9rem; }
    .notif-list { max-height: 360px; overflow-y: auto; }
    .notif-item { display: block; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; }
    .notif-item:hover { background: rgba(184,149,78,0.08); }
    .notif-item__title { color: var(--text); font-weight: 700; margin-bottom: 0.15rem; }
    .notif-item__time { font-size: 0.72rem; color: var(--text-muted); }
    .notif-empty { padding: 1.25rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; }

    /* Mobile card tables */
    .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    @media (max-width: 768px) {
      .online-table thead { display: none; }
      .online-table, .online-table tbody, .online-table tr, .online-table td { display: block; }
      .online-table tr {
        background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 0.75rem 1rem; margin-bottom: 0.75rem;
        display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;
      }
      .online-table td { padding: 0; border: none; }
      .online-table td::before {
        content: attr(data-label); display: block; font-size: 0.7rem; font-weight: 700;
        color: var(--gold); text-transform: uppercase; margin-bottom: 0.2rem;
      }
      .online-table td:first-child { grid-column: 1 / -1; }
      .online-table .country-cell { flex-wrap: wrap; }
      .online-table .page-link { max-width: none; white-space: normal; }
    }
  </style>

            </button>
            <button class="sidebar-link" data-target="/admin/audit-log.html?embed=1" data-title="سجل المراجعة">

            <button class="sidebar-link" data-target="/admin/bank-transfers.html?embed=1" data-title="التحويلات البنكية">

            </button>
            <button class="sidebar-link" data-target="/admin/settings.html?embed=1" data-title="إعدادات المنصة">
              <span style="margin-left:0.5rem">⚙️</span> إعدادات المنصة
            </button>
          </div>
        </details>
      </div>

      <div class="nav-group">

  <script>
    (function () {
      'use strict';

      const sb = window.BondsAuth?.getSupabase ? window.BondsAuth.getSupabase() : null;
      const overviewEl = document.getElementById('overviewPanel');
      const iframeWrap = document.getElementById('iframeWrap');

      // Resize iframe based on inner page height so the outer dashboard scrolls
      window.addEventListener('message', (event) => {
        if (event.data?.type === 'iframe-height' && event.data?.height) {
          const iframe = iframeWrap?.querySelector('iframe.module-frame');
          if (iframe) iframe.style.height = event.data.height + 'px';
        }
      });

      function withTimeout(promise, ms = 8000) {
        if (!promise) return Promise.resolve(null);
        return Promise.race([
          promise,
          new Promise(resolve => setTimeout(() => resolve(null), ms))
        ]);
      }

      async function loadStats() {
        const counts = {
          users: 0,
          subscriptions: 0,
          revenue: 0,
          messages: 0,
          advisoryClients: 0,
          advisoryProjects: 0,
          recoveryAssets: 0,
          cities: 0,
          aiReviews: 0,
          onlineUsers: 0,
          _errors: []
        };

        const queries = [
          { key: 'users', q: sb?.from('profiles')?.select('*', { count: 'exact', head: true }) },
          { key: 'subscriptions', q: sb?.from('subscriptions')?.select('*', { count: 'exact', head: true }) },
          { key: 'messages', q: sb?.from('contact_messages')?.select('*', { count: 'exact', head: true }) },
          { key: 'advisoryClients', q: sb?.from('advisory_clients')?.select('*', { count: 'exact', head: true }) },
          { key: 'advisoryProjects', q: sb?.from('advisory_projects')?.select('*', { count: 'exact', head: true }) },
          { key: 'recoveryAssets', q: sb?.from('recovery_assets')?.select('*', { count: 'exact', head: true }) },
          { key: 'cities', q: sb?.from('cities')?.select('*', { count: 'exact', head: true }) },
          { key: 'aiReviews', q: sb?.from('ai_review_requests')?.select('*', { count: 'exact', head: true }) }
        ];

        const results = await Promise.allSettled(
          queries.map(item => withTimeout(item.q, 8000).then(value => ({ key: item.key, value })))
        );

        results.forEach(result => {
          if (result.status === 'fulfilled') {
            const { key, value } = result.value || {};
            if (value && typeof value.count === 'number') counts[key] = value.count;
          } else {
            console.warn('[Dashboard] stat query failed:', result.reason);
            counts._errors.push(String(result.reason || 'unknown'));
          }
        });

        try {
          const rev = await withTimeout(sb?.from('subscriptions')?.select('tier')?.eq('status', 'active'), 8000);
          if (rev?.data) {
            counts.revenue = rev.data.reduce((a, r) => {
              if (r.tier === 'enterprise') return a + 212;
              if (r.tier === 'pro') return a + 82;
              return a;
            }, 0);
          }
        } catch (e) {
          console.warn('[Dashboard] revenue calc failed:', e);
          counts._errors.push('revenue');
        }

        try {
          const fiveMinutesAgo = new Date(Date.now() - 5 * 60 * 1000).toISOString();
          const online = await withTimeout(sb?.from('user_presence')?.select('*', { count: 'exact', head: true })?.gte('last_seen_at', fiveMinutesAgo), 8000);
          if (online && typeof online.count === 'number') counts.onlineUsers = online.count;
        } catch (e) {
          console.warn('[Dashboard] online users count failed:', e);
          counts._errors.push('onlineUsers');
        }

        return counts;
      }

      function renderOverview(counts) {
        const statErrors = counts._errors && counts._errors.length ? `
          <div style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:12px;padding:1rem;margin-bottom:1.5rem;color:var(--text-secondary);font-size:0.85rem;">
            ⚠️ تعذر تحميل بعض الإحصائيات (${counts._errors.length}). تأكد من الاتصال بـ Supabase أو أعد التحميل.
          </div>` : '';

        overviewEl.innerHTML = `
          <div class="page-header">
            <h1>لوحة التحكم الموحدة</h1>
            <p>إدارة جميع وحدات بوندز من مكان واحد</p>
          </div>
          ${statErrors}
          <div class="stats-grid">
            <div class="stat-card"><div class="stat-card__header"><div class="stat-card__icon stat-card__icon--blue">👥</div></div><div class="stat-card__num">${counts.users.toLocaleString('ar-SA')}</div><div class="stat-card__label">المستخدمين</div></div>
            <div class="stat-card"><div class="stat-card__header"><div class="stat-card__icon stat-card__icon--gold">⭐</div></div><div class="stat-card__num">${counts.subscriptions.toLocaleString('ar-SA')}</div><div class="stat-card__label">الاشتراكات</div></div>
            <div class="stat-card"><div class="stat-card__header"><div class="stat-card__icon stat-card__icon--green">💰</div></div><div class="stat-card__num">${counts.revenue.toLocaleString('ar-SA')} ر.س</div><div class="stat-card__label">إيرادات فعالة</div></div>
            <div class="stat-card"><div class="stat-card__header"><div class="stat-card__icon stat-card__icon--purple">✉️</div></div><div class="stat-card__num">${counts.messages.toLocaleString('ar-SA')}</div><div class="stat-card__label">الرسائل</div></div>
            <div class="stat-card"><div class="stat-card__header"><div class="stat-card__icon stat-card__icon--gold">📊</div></div><div class="stat-card__num">${counts.advisoryClients.toLocaleString('ar-SA')}</div><div class="stat-card__label">عملاء الاستشارات</div></div>
            <div class="stat-card"><div class="stat-card__header"><div class="stat-card__icon stat-card__icon--blue">📁</div></div><div class="stat-card__num">${counts.advisoryProjects.toLocaleString('ar-SA')}</div><div class="stat-card__label">مشاريع استشارية</div></div>
            <div class="stat-card"><div class="stat-card__header"><div class="stat-card__icon stat-card__icon--red">🏗️</div></div><div class="stat-card__num">${counts.recoveryAssets.toLocaleString('ar-SA')}</div><div class="stat-card__label">أصول متعثرة</div></div>
            <div class="stat-card"><div class="stat-card__header"><div class="stat-card__icon stat-card__icon--green">🏙️</div></div><div class="stat-card__num">${counts.cities.toLocaleString('ar-SA')}</div><div class="stat-card__label">مدن City Intelligence</div></div>
            <div class="stat-card"><div class="stat-card__header"><div class="stat-card__icon stat-card__icon--purple">🧑‍⚕️</div></div><div class="stat-card__num">${counts.aiReviews.toLocaleString('ar-SA')}</div><div class="stat-card__label">طلبات مراجعة AI</div></div>
            <div class="stat-card"><div class="stat-card__header"><div class="stat-card__icon stat-card__icon--green">🟢</div></div><div class="stat-card__num">${counts.onlineUsers.toLocaleString('ar-SA')}</div><div class="stat-card__label">متواجدون الآن</div></div>
          </div>

          <h2 style="font-size:1.1rem;font-weight:800;margin-bottom:1rem;">الوحدات</h2>
          <div class="modules-grid">
            <button class="module-card" data-target="/admin/users.html?embed=1" data-title="المستخدمين">
              <div class="module-card__icon">👥</div>
              <div class="module-card__title">المستخدمين</div>
              <div class="module-card__desc">إدارة الحسابات والملفات الشخصية</div>
            </button>
            <button class="module-card" data-target="/admin/subscriptions.html?embed=1" data-title="الاشتراكات">
              <div class="module-card__icon">⭐</div>
              <div class="module-card__title">الاشتراكات</div>
              <div class="module-card__desc">متابعة Pro والمدفوعات</div>
            </button>
            <button class="module-card" data-target="/admin/messages.html?embed=1" data-title="الرسائل">
              <div class="module-card__icon">✉️</div>
              <div class="module-card__title">الرسائل</div>
              <div class="module-card__desc">تواصل العملاء والدعم</div>
            </button>
            <button class="module-card" data-target="/admin/executive-dashboard?embed=1" data-title="لوحة المؤشرات التنفيذية">
              <div class="module-card__icon">📈</div>
              <div class="module-card__title">لوحة المؤشرات التنفيذية</div>
              <div class="module-card__desc">إيرادات، أرباح، مشاريع وفرص فورية</div>
            </button>
            <button class="module-card" data-target="/admin/ai-business-advisor?embed=1" data-title="مستشار الأعمال الذكي">
              <div class="module-card__icon">🧠</div>
              <div class="module-card__title">مستشار الأعمال الذكي</div>
              <div class="module-card__desc">تحليل مالي، فرص، مخاطر، حلول تمويلية وتقارير</div>
            </button>
            <button class="module-card" data-target="/admin/data-quality-center?embed=1" data-title="مركز جودة البيانات">
              <div class="module-card__icon">✅</div>
              <div class="module-card__title">مركز جودة البيانات</div>
              <div class="module-card__desc">تكرار، سجلات ناقصة، علاقات مكسورة</div>
            </button>
            <button class="module-card" data-target="/admin/global-search?embed=1" data-title="البحث الموحد">
              <div class="module-card__icon">🔍</div>
              <div class="module-card__title">البحث الموحد</div>
              <div class="module-card__desc">بحث فوري في العملاء والمشاريع والأصول والتقارير</div>
            </button>
            <button class="module-card" data-target="/admin/financial-advisory?embed=1" data-title="الاستشارات المالية">
              <div class="module-card__icon">📊</div>
              <div class="module-card__title">الاستشارات المالية</div>
              <div class="module-card__desc">العملاء والمشاريع ودراسات الجدوى</div>
            </button>
            <button class="module-card" data-target="/admin/distressed-recovery?embed=1" data-title="إنقاذ الأصول المتعثرة">
              <div class="module-card__icon">🏗️</div>
              <div class="module-card__title">إنقاذ الأصول المتعثرة</div>
              <div class="module-card__desc">تقييم الأصول وخطط الإنقاذ</div>
            </button>
            <button class="module-card" data-target="/admin/city-intelligence/index.html?embed=1" data-title="City Intelligence">
              <div class="module-card__icon">🏙️</div>
              <div class="module-card__title">City Intelligence</div>
              <div class="module-card__desc">تحليل المدن والأحياء والتقارير</div>
            </button>
            <button class="module-card" data-target="/admin/ai-reviews.html?embed=1" data-title="مراجعة المتخصص">
              <div class="module-card__icon">🔍</div>
              <div class="module-card__title">مراجعة المتخصص</div>
              <div class="module-card__desc">طلبات مراجعة تحليلات AI</div>
            </button>
            <button class="module-card" data-target="/admin/economic-life.html?embed=1" data-title="العمر الاقتصادي للأصول">
              <div class="module-card__icon">⏳</div>
              <div class="module-card__title">العمر الاقتصادي للأصول</div>
              <div class="module-card__desc">إدارة Economic Life Database</div>
            </button>
            <button class="module-card" data-target="/admin/depreciation-factors.html?embed=1" data-title="عوامل الاستهلاك">
              <div class="module-card__icon">⚙️</div>
              <div class="module-card__title">عوامل الاستهلاك</div>
              <div class="module-card__desc">إدارة BONDS Depreciation Standards</div>
            </button>
            <button class="module-card" data-target="/admin/market-intelligence.html?embed=1" data-title="الذكاء السوقي">
              <div class="module-card__icon">📈</div>
              <div class="module-card__title">الذكاء السوقي</div>
              <div class="module-card__desc">إدارة Market Intelligence Database</div>
            </button>
            <button class="module-card" data-target="/admin/condition-assessment.html?embed=1" data-title="تقييم الحالة">
              <div class="module-card__icon">🔧</div>
              <div class="module-card__title">تقييم الحالة</div>
            </button>
            <button class="module-card" data-target="/admin/risk-intelligence.html?embed=1" data-title="ذكاء المخاطر">
              <div class="module-card__icon">🛡️</div>
              <div class="module-card__title">ذكاء المخاطر</div>
              <div class="module-card__desc">تقييم المخاطر عبر 8 أبعاد وإنتاج Risk Index</div>
            </button>
          </div>`;

        overviewEl.querySelectorAll('.module-card').forEach(card => {
          card.onclick = () => loadModule(card.dataset.target, card.dataset.title);
        });
      }

      let onlineRefreshTimer = null;
      let onlineAutoRefresh = true;

      async function apiGet(action, params) {
        const token = (await sb.auth.getSession())?.data?.session?.access_token || '';
        const url = new URL('/api/admin', location.origin);
        url.searchParams.set('action', action);
        if (params) Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
        const res = await fetch(url.toString(), {
          headers: token ? { 'Authorization': `Bearer ${token}` } : {}
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      }

      function countryFlag(countryCode) {
        if (!countryCode || countryCode.length !== 2) return '🌐';
        const code = countryCode.toUpperCase();
        return String.fromCodePoint(...[...code].map(c => 0x1F1A5 + c.charCodeAt(0)));
      }

      function decodeCity(city) {
        if (!city) return '';
        try { return decodeURIComponent(city); } catch { return city; }
      }

      function timeAgo(iso) {
        if (!iso) return '-';
        const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
        if (sec < 10) return 'الآن';
        if (sec < 60) return `${sec} ث`;
        const min = Math.floor(sec / 60);
        if (min < 60) return `${min} د`;
        const h = Math.floor(min / 60);
        return `${h} س`;
      }

      function formatDuration(sec) {
        if (sec === null || sec === undefined) return '-';
        if (sec < 60) return `${sec} ث`;
        const min = Math.floor(sec / 60);
        const s = sec % 60;
        return `${min} د ${s} ث`;
      }

      function formatTime(iso) {
        if (!iso) return '-';
        return new Date(iso).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }

      function renderOnlineTable(data, container) {
        if (!data || !data.online || data.online.length === 0) {
          container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem">لا يوجد متواجدون حالياً</p>';
          return;
        }
        container.innerHTML = `
          <div class="table-responsive">
            <table class="online-table">
              <thead><tr><th>الدولة</th><th>النوع</th><th>وقت الدخول</th><th>آخر نشاط</th><th>الصفحة الحالية</th><th>اللغة</th></tr></thead>
              <tbody>
                ${data.online.map(u => `
                  <tr data-session="${u.sessionId}">
                    <td data-label="الدولة"><div class="country-cell"><span class="country-flag">${countryFlag(u.countryCode || u.country)}</span><span>${u.countryName || u.countryCode || u.country || 'غير معروف'}</span>${u.city ? `<span style="font-size:0.75rem;color:var(--text-muted)">(${decodeCity(u.city)})</span>` : ''}</div></td>
                    <td data-label="النوع"><span class="user-type ${u.userId ? 'user-type--user' : 'user-type--guest'}">${u.userId ? 'مستخدم' : 'زائر'}</span></td>
                    <td data-label="وقت الدخول">${formatTime(u.startedAt)}<br><span class="time-ago">منذ ${timeAgo(u.startedAt)}</span></td>
                    <td data-label="آخر نشاط">${formatTime(u.lastSeenAt)}<br><span class="time-ago">منذ ${timeAgo(u.lastSeenAt)}</span></td>
                    <td data-label="الصفحة الحالية"><a class="page-link" href="${u.url || '#' }" target="_blank" title="${u.page || ''}">${u.section || u.page || '-'}</a></td>
                    <td data-label="اللغة">${u.lang || '-'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
        container.querySelectorAll('tr[data-session]').forEach(row => {
          row.addEventListener('click', () => showJourney(row.dataset.session));
        });
      }

      function renderOnlineStats(data) {
        const online = data.online || [];
        const guests = online.filter(u => !u.userId).length;
        const users = online.filter(u => u.userId).length;
        const countries = new Set(online.map(u => u.country).filter(Boolean));
        document.getElementById('ouCount').textContent = online.length;
        document.getElementById('ouGuests').textContent = guests;
        document.getElementById('ouUsers').textContent = users;
        document.getElementById('ouCountries').textContent = countries.size;
      }

      async function loadOnlineUsers() {
        try {
          const data = await apiGet('online-users');
          renderOnlineStats(data);
          renderOnlineTable(data, document.getElementById('ouTable'));
          document.getElementById('ouUpdated').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-SA');
        } catch (err) {
          document.getElementById('ouTable').innerHTML = `<p style="text-align:center;color:var(--danger);padding:2rem">فشل التحميل: ${err.message}</p>`;
        }
      }

      async function showJourney(sessionId) {
        const modal = document.getElementById('ouModal');
        const body = document.getElementById('ouModalBody');
        modal.classList.add('open');
        body.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem">جاري التحميل...</p>';
        try {
          const data = await apiGet('user-journey', { session_id: sessionId });
          const p = data.presence || {};
          body.innerHTML = `
            <div class="journey-summary">
              <div class="journey-item"><div class="num">${data.totalPages}</div><div class="lbl">صفحات</div></div>
              <div class="journey-item"><div class="num">${formatDuration(data.totalSeconds)}</div><div class="lbl">المدة</div></div>
              <div class="journey-item"><div class="num">${p.country || 'غير معروف'}</div><div class="lbl">الدولة</div></div>
              <div class="journey-item"><div class="num">${p.city || '-'}</div><div class="lbl">المدينة</div></div>
            </div>
            <div class="timeline">
              ${data.journey.map(j => `
                <div class="timeline-row">
                  <div class="timeline-time">${formatTime(j.enteredAt)}</div>
                  <div class="timeline-page">${j.section || j.page || '-'}</div>
                  <div class="timeline-duration">${formatDuration(j.durationSeconds)}</div>
                </div>
              `).join('')}
            </div>
          `;
        } catch (err) {
          body.innerHTML = `<p style="text-align:center;color:var(--danger);padding:2rem">فشل التحميل: ${err.message}</p>`;
        }
      }

      function closeJourney() {
        document.getElementById('ouModal').classList.remove('open');
      }

      function renderOnlineUsers() {
        const panel = document.getElementById('onlineUsersPanel');
        panel.innerHTML = `
          <div class="page-header">
            <h1><span class="live-dot"></span> المتواجدون الآن</h1>
            <p>متابعة الزوار والمستخدمين المتصلين بالموقع لحظة بلحظة</p>
          </div>
          <div class="online-toolbar">
            <button class="btn-sm" id="ouRefresh">تحديث</button>
            <button class="btn-sm btn-secondary" id="ouToggleAuto">إيقاف التحديث التلقائي</button>
            <span id="ouUpdated" style="font-size:0.8rem;color:var(--text-muted)"></span>
          </div>
          <div class="stats-grid" style="margin-bottom:1.25rem">
            <div class="stat-card"><div class="stat-card__num" id="ouCount">0</div><div class="stat-card__label">متصل الآن</div></div>
            <div class="stat-card"><div class="stat-card__num" id="ouGuests">0</div><div class="stat-card__label">زوار</div></div>
            <div class="stat-card"><div class="stat-card__num" id="ouUsers">0</div><div class="stat-card__label">مستخدمون</div></div>
            <div class="stat-card"><div class="stat-card__num" id="ouCountries">0</div><div class="stat-card__label">دول</div></div>
          </div>
          <div id="ouTable"></div>
          <div class="timeline-modal" id="ouModal">
            <div class="timeline-card">
              <div class="timeline-header"><h3>سير الزائر</h3><button class="timeline-close" id="ouCloseModal">&times;</button></div>
              <div class="timeline-body" id="ouModalBody"></div>
            </div>
          </div>
        `;
        document.getElementById('ouRefresh').addEventListener('click', loadOnlineUsers);
        document.getElementById('ouToggleAuto').addEventListener('click', function () {
          onlineAutoRefresh = !onlineAutoRefresh;
          this.textContent = onlineAutoRefresh ? 'إيقاف التحديث التلقائي' : 'تشغيل التحديث التلقائي';
          if (onlineRefreshTimer) clearInterval(onlineRefreshTimer);
          if (onlineAutoRefresh) onlineRefreshTimer = setInterval(loadOnlineUsers, 30000);
        });
        document.getElementById('ouCloseModal').addEventListener('click', closeJourney);
        document.getElementById('ouModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeJourney(); });
        loadOnlineUsers();
        if (onlineRefreshTimer) clearInterval(onlineRefreshTimer);
        onlineRefreshTimer = setInterval(() => { if (onlineAutoRefresh) loadOnlineUsers(); }, 30000);
      }

      function loadModule(url, title) {
        const titleEl = document.getElementById('pageTitle');
        if (titleEl) titleEl.textContent = title || 'لوحة التحكم الموحدة';
        if (onlineRefreshTimer) { clearInterval(onlineRefreshTimer); onlineRefreshTimer = null; }
        if (url === 'overview') {
          iframeWrap.innerHTML = '<div class="overview" id="overviewPanel"></div>';
          loadStats().then(renderOverview);
          return;
        }
        if (url === 'online-users') {
          iframeWrap.innerHTML = '<div class="overview" id="onlineUsersPanel"></div>';
          renderOnlineUsers();
          return;
        }
        iframeWrap.innerHTML = '<div class="iframe-loader"><div class="spinner"></div><p>جارِ تحميل القسم...</p></div>';
        const iframe = document.createElement('iframe');
        iframe.className = 'module-frame';
        iframe.src = url;
        iframe.title = title || '';
        iframe.scrolling = 'yes';
        iframe.setAttribute('scrolling', 'yes');
        iframe.style.overflow = 'auto';
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-downloads');
        iframe.onload = async () => {
          try {
            const { data: { session } } = await sb.auth.getSession();
            const token = session?.access_token || window.__ADMIN_TOKEN || '';
            iframe.contentWindow.postMessage({ type: 'admin-token', token }, location.origin);
            if (session) {
              iframe.contentWindow.postMessage({ type: 'admin-session', session }, location.origin);
            }
          } catch (e) {}
        };
        iframeWrap.innerHTML = '';
        iframeWrap.appendChild(iframe);
      }

      function setActive(target) {
        document.querySelectorAll('.sidebar-link').forEach(link => {
          link.classList.toggle('active', link.dataset.target === target);
        });
      }

      document.querySelectorAll('.sidebar-link').forEach(link => {
        link.addEventListener('click', () => {
          const target = link.dataset.target;
          if (!target) return;
          const title = link.dataset.title;
          setActive(target);
          loadModule(target, title);
          if (window.innerWidth <= 1024) document.getElementById('sidebar').classList.remove('open');
        });
      });

      document.getElementById('mobileToggle').onclick = () => {
        document.getElementById('sidebar').classList.toggle('open');
      };

      async function initUser() {
        try {
          const { data: { user } } = await sb.auth.getUser();
          if (user) {
            const name = user.user_metadata?.full_name || user.email?.split('@')[0] || 'مدير';
            document.getElementById('userName').textContent = name;
            document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
            document.getElementById('userRole').textContent = window.__ADMIN_ROLE === 'super_admin' ? 'Super Admin' : 'Admin';
          }
        } catch (e) {}
      }

      // --- Unified command palette ---
      const searchOverlay = document.getElementById('cmdPaletteOverlay');
      const searchInput = document.getElementById('cmdPaletteInput');
      const searchList = document.getElementById('cmdPaletteList');
      let searchItems = [];
      let currentFiltered = [];
      let activeSearchIndex = -1;

      function buildSearchIndex() {
        const items = [];
        document.querySelectorAll('.sidebar-link[data-target]').forEach(el => {
          const text = el.textContent.trim();
          const target = el.dataset.target;
          const title = el.dataset.title || text;
          if (target && text && target !== '#') items.push({ text, title, target, type: 'قائمة جانبية' });
        });
        document.querySelectorAll('.module-card[data-target]').forEach(el => {
          const title = el.dataset.title || el.querySelector('.module-card__title')?.textContent.trim() || '';
          const desc = el.querySelector('.module-card__desc')?.textContent.trim() || '';
          const target = el.dataset.target;
          if (target && title) items.push({ text: title + ' ' + desc, title, desc, target, type: 'وحدة' });
        });
        items.push({ text: 'نظرة عامة', title: 'نظرة عامة', target: 'overview', type: 'قائمة جانبية' });
        items.push({ text: 'المتواجدون الآن', title: 'المتواجدون الآن', target: 'online-users', type: 'قائمة جانبية' });
        searchItems = items;
      }

      function openSearch() {
        buildSearchIndex();
        searchOverlay.classList.add('open');
        searchInput.value = '';
        activeSearchIndex = -1;
        renderSearchResults('');
        setTimeout(() => searchInput.focus(), 10);
      }

      function closeSearch() {
        searchOverlay.classList.remove('open');
        activeSearchIndex = -1;
      }

      function renderSearchResults(query) {
        const q = query.trim().toLowerCase();
        currentFiltered = q ? searchItems.filter(i => i.text.toLowerCase().includes(q)) : searchItems.slice(0, 12);
        if (currentFiltered.length === 0) {
          searchList.innerHTML = '<div class="cmd-palette-empty">لا توجد نتائج</div>';
          activeSearchIndex = -1;
          return;
        }
        searchList.innerHTML = currentFiltered.map((item, idx) => `
          <a href="javascript:void(0)" class="cmd-palette-item ${idx === activeSearchIndex ? 'active' : ''}" data-index="${idx}" data-target="${item.target}" data-title="${item.title || item.text}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <div>
              <div>${item.title || item.text}</div>
              ${item.desc ? `<div style="font-size:0.75rem;color:var(--text-muted);">${item.desc}</div>` : ''}
            </div>
            <span class="cmd-palette-item__meta">${item.type}</span>
          </a>
        `).join('');
        searchList.querySelectorAll('.cmd-palette-item').forEach(el => {
          el.addEventListener('click', () => selectSearchItem(el.dataset.target, el.dataset.title));
        });
      }

      function selectSearchItem(target, title) {
        closeSearch();
        setActive(target);
        loadModule(target, title);
      }

      document.addEventListener('keydown', e => {
        if (e.key === '/' && !searchOverlay.classList.contains('open')) {
          if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
          e.preventDefault();
          openSearch();
        }
        if (e.key === 'Escape') {
          closeSearch();
        }
        if (!searchOverlay.classList.contains('open')) return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          activeSearchIndex = Math.min(activeSearchIndex + 1, currentFiltered.length - 1);
          renderSearchResults(searchInput.value);
          const active = searchList.querySelector('.cmd-palette-item.active');
          if (active) active.scrollIntoView({ block: 'nearest' });
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          activeSearchIndex = Math.max(activeSearchIndex - 1, 0);
          renderSearchResults(searchInput.value);
          const active = searchList.querySelector('.cmd-palette-item.active');
          if (active) active.scrollIntoView({ block: 'nearest' });
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          const active = searchList.querySelector('.cmd-palette-item.active');
          if (active) selectSearchItem(active.dataset.target, active.dataset.title);
        }
      });

      searchInput.addEventListener('input', e => {
        activeSearchIndex = 0;
        renderSearchResults(e.target.value);
      });
      searchOverlay.addEventListener('click', e => { if (e.target === searchOverlay) closeSearch(); });
      document.getElementById('searchTrigger').addEventListener('click', openSearch);

      // --- Notifications center ---
      const notifBell = document.getElementById('notifBell');
      const notifBadge = document.getElementById('notifBadge');
      const notifDropdown = document.getElementById('notifDropdown');
      let notifOpen = false;

      async function loadNotifications() {
        const notifications = [];
        try {
          const { data: unread } = await withTimeout(
            sb.from('user_notifications').select('id,title,message,created_at').eq('read', false).order('created_at', { ascending: false }).limit(10),
            5000
          );
          if (unread) {
            unread.forEach(n => notifications.push({
              id: n.id, title: n.title || 'إشعار', body: n.message || '', time: n.created_at,
              type: 'notification', target: null
            }));
          }
        } catch (e) {}
        try {
          const { data: pending } = await withTimeout(
            sb.from('ai_review_requests').select('id,status,created_at').eq('status', 'pending_review').order('created_at', { ascending: false }).limit(10),
            5000
          );
          if (pending) {
            pending.forEach(r => notifications.push({
              id: r.id, title: 'مراجعة AI معلقة', body: 'طلب مراجعة جديد بانتظار التخصيص', time: r.created_at,
              type: 'ai_review', target: '/admin/ai-reviews.html?embed=1'
            }));
          }
        } catch (e) {}
        notifications.sort((a, b) => new Date(b.time) - new Date(a.time));
        const count = notifications.length;
        notifBadge.textContent = count > 99 ? '99+' : count;
        notifBadge.classList.toggle('visible', count > 0);
        renderNotificationsDropdown(notifications);
      }

      function renderNotificationsDropdown(items) {
        if (items.length === 0) {
          notifDropdown.innerHTML = '<div class="notif-header">الإشعارات</div><div class="notif-empty">لا توجد إشعارات جديدة</div>';
          return;
        }
        notifDropdown.innerHTML = '<div class="notif-header">الإشعارات</div><div class="notif-list">' + items.slice(0, 8).map(n => `
          <a href="javascript:void(0)" class="notif-item" data-target="${n.target || ''}">
            <div class="notif-item__title">${n.title}</div>
            <div>${n.body}</div>
            <div class="notif-item__time">${timeAgo(n.time)}</div>
          </a>
        `).join('') + '</div>';
        notifDropdown.querySelectorAll('.notif-item').forEach(el => {
          el.addEventListener('click', () => {
            notifDropdown.classList.remove('open');
            notifOpen = false;
            const target = el.dataset.target;
            if (target) { setActive(target); loadModule(target, 'الإشعارات'); }
          });
        });
      }

      notifBell.addEventListener('click', () => {
        notifOpen = !notifOpen;
        notifDropdown.classList.toggle('open', notifOpen);
        if (notifOpen) loadNotifications();
      });
      document.addEventListener('click', e => {
        if (!notifBell.contains(e.target) && !notifDropdown.contains(e.target)) {
          notifOpen = false;
          notifDropdown.classList.remove('open');
        }
      });

      overviewEl.innerHTML = '<div class="iframe-loader"><div class="spinner"></div><p>جارِ تحميل الإحصائيات...</p></div>';
      loadStats().then(renderOverview);
      initUser();
      loadNotifications();
      setInterval(loadNotifications, 60000);
    })();
  </script>
<script src="/admin/admin-sidebar-icons.js?v=3.0.0"></script>
</body>
