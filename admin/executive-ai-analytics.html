<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Executive & AI Analytics — Bonds Global</title><link rel="stylesheet" href="/admin/admin-shared-ux.css"><style>
body{margin:0;background:#f6f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1650px;margin:auto;padding:1rem}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1rem}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:1rem}.s12{grid-column:span 12}.s6{grid-column:span 6}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:.65rem}.kpi{border:1px solid #e2e8f0;border-radius:12px;padding:.7rem}.kpi b{display:block;font-size:1.2rem}table{width:100%;border-collapse:collapse;font-size:.82rem}th,td{padding:.55rem;border-bottom:1px solid #e2e8f0;text-align:right}.scroll{overflow:auto;max-height:430px}.muted{color:#475569}.btn{border:0;border-radius:9px;padding:.6rem .9rem;font-weight:700;cursor:pointer;background:#172033;color:#fff}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:9px;padding:.65rem;margin:.3rem 0 .7rem}.status{display:none;background:#fee2e2;color:#991b1b;padding:.7rem;border-radius:9px}@media(max-width:900px){.s6{grid-column:span 12}}</style></head><body><main>
<div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap"><div><h1 style="margin:0">Executive & AI Analytics</h1><div class="muted">Revenue · Retention · Funnel · Pipeline · Renewals · Customer Health · AI Cost/Latency</div></div><button class="btn" onclick="loadAll()">تحديث</button></div><div id="status" class="status"></div>
<div class="grid" style="margin-top:1rem"><section class="card s12"><h2>Executive KPIs</h2><div id="execKpis" class="kpis"></div></section>
<section class="card s6"><h2>Funnel</h2><div id="funnel" class="kpis"></div></section><section class="card s6"><h2>AI Operations</h2><div id="aiKpis" class="kpis"></div></section>
<section class="card s6"><h2>Cohorts</h2><div class="scroll"><table><thead><tr><th>Month</th><th>Registered</th><th>Active 30d</th><th>Retention</th><th>Paid</th><th>Conversion</th></tr></thead><tbody id="cohortRows"></tbody></table></div></section>
<section class="card s6"><h2>AI Models / Features</h2><div id="aiBreakdown"></div></section>
<section class="card s12"><h2>AI Controls</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem"><form onsubmit="setKill(event)"><h3>Kill Switch</h3><input id="killFeature" required placeholder="feature"><select id="killDisabled" aria-label="AI kill switch state"><option value="true">Disable</option><option value="false">Enable</option></select><input id="killReason" placeholder="reason"><button class="btn">تطبيق</button></form><form onsubmit="newPrompt(event)"><h3>Prompt Version</h3><input id="promptKey" required placeholder="prompt key"><textarea id="promptContent" required rows="4" placeholder="Prompt content"></textarea><button class="btn">إنشاء نسخة Draft</button></form></div></section>
</div></main><script src="/supabase-client.js"></script><script src="/bonds-auth-2026.js?v=3.1.3"></script><script src="/admin/admin-common.js"></script><script>
let analytics=null,ops=null;const esc=v=>BondsAdminCommon.escapeHtml(v==null?'':String(v));function err(m){const e=document.getElementById('status');e.textContent=m;e.style.display=m?'block':'none'}async function api(url,o={}){const r=await window.BondsAuth.authenticatedFetch(url,{...o,returnTo:location.pathname+location.search});if(r?.__authError)throw new Error(r.status===403?'غير مصرح لهذه الصفحة':'انتهت جلسة الدخول');if(r?.__networkError)throw new Error('تعذر الاتصال بالخادم');if(r?.__serverError)throw new Error('خطأ في الخادم (HTTP '+r.status+')');if(!r||typeof r.json!=='function')throw new Error('استجابة غير صالحة من الخادم');const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.error||('HTTP '+r.status));return d}
function kpis(el,items){document.getElementById(el).innerHTML=items.map(x=>'<div class="kpi"><b>'+esc(x[1])+'</b><span class="muted">'+esc(x[0])+'</span></div>').join('')}
function render(){const e=analytics.executive||{},a=analytics.ai||{},f=analytics.funnel||{};kpis('execKpis',[['MRR',Number(e.mrr||0).toLocaleString('en-US')+' SAR'],['ARR',Number(e.arr||0).toLocaleString('en-US')+' SAR'],['ARPU',e.arpu||0],['Conversion',e.conversionPct+'%'],['Churn',e.churnPct+'%'],['Active 30d',e.activeUsers30d||0],['Pipeline',Number(e.pipelineValue||0).toLocaleString('en-US')],['Weighted Pipeline',Number(e.weightedPipeline||0).toLocaleString('en-US')],['Renewal Risk',Number(e.renewalRisk||0).toLocaleString('en-US')],['Customer Health',e.customerHealth||0]]);
kpis('funnel',[['Registered',f.registered||0],['Activated',f.activated||0],['Paid',f.paid||0],['Active 30d',f.active30d||0]]);
kpis('aiKpis',[['Requests',a.requests||0],['Cost USD',a.costUsd||0],['Failure Rate',(a.failureRatePct||0)+'%'],['P50',a.p50LatencyMs==null?'UNKNOWN':a.p50LatencyMs+'ms'],['P95',a.p95LatencyMs==null?'UNKNOWN':a.p95LatencyMs+'ms'],['Input Tokens',a.inputTokens||0],['Output Tokens',a.outputTokens||0]]);
cohortRows.innerHTML=(analytics.cohorts||[]).map(c=>'<tr><td>'+esc(c.month)+'</td><td>'+esc(c.registered)+'</td><td>'+esc(c.active30)+'</td><td>'+esc(c.retentionPct)+'%</td><td>'+esc(c.paid)+'</td><td>'+esc(c.conversionPct)+'%</td></tr>').join('')||'<tr><td colspan=6>لا توجد Cohorts</td></tr>';
const models=Object.entries(a.byModel||{}),features=Object.entries(a.byFeature||{});aiBreakdown.innerHTML='<h3>Models</h3>'+(models.length?models.map(x=>'<div>'+esc(x[0])+': '+esc(x[1])+'</div>').join(''):'<div class=muted>UNKNOWN — لا توجد AI telemetry بعد</div>')+'<h3>Features</h3>'+features.map(x=>'<div>'+esc(x[0])+': '+esc(x[1])+'</div>').join('');
}
async function loadAll(){err('');try{[analytics,ops]=await Promise.all([api('/api/admin?action=executive-analytics-v2'),api('/api/admin?action=ai-operations')]);render()}catch(e){err('فشل التحميل: '+e.message)}}
async function setKill(ev){ev.preventDefault();try{await api('/api/admin?action=ai-kill-switch-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({feature:killFeature.value.trim(),disabled:killDisabled.value==='true',reason:killReason.value})});ev.target.reset();await loadAll()}catch(e){err(e.message)}}
async function newPrompt(ev){ev.preventDefault();try{await api('/api/admin?action=ai-prompt-version-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt_key:promptKey.value.trim(),content:promptContent.value})});ev.target.reset();await loadAll()}catch(e){err(e.message)}}
if(window.__ADMIN_ROLE)loadAll();else window.addEventListener('admin-auth-ready',loadAll,{once:true});
</script></body></html>
