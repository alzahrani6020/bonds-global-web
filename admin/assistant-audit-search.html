<!DOCTYPE html>
<html lang="ar" dir="rtl" data-ud-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Assistant Audit Search | بوندز</title>
  <link rel="stylesheet" href="/styles/institutional-system.css?v=4">
  <link rel="stylesheet" href="/admin/admin-shared-ux.css?v=1">
  <style>
    body{margin:0;background:#f5f0e8;color:#1f2937;font-family:system-ui,sans-serif}
    .wrap{max-width:1500px;margin:auto;padding:1.25rem}.head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;flex-wrap:wrap}
    .actions,.filters{display:flex;gap:.55rem;flex-wrap:wrap}.btn,input,select{border:1px solid rgba(0,0,0,.14);background:#fff;border-radius:10px;padding:.62rem .75rem;font:inherit}
    .btn{font-weight:700;cursor:pointer;text-decoration:none;color:inherit}.card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:1rem;margin-top:1rem}
    .filters label{display:flex;flex-direction:column;gap:.25rem;font-size:.78rem;color:#6b7280;min-width:150px}.filters input,.filters select{color:#111827}
    .muted{color:#6b7280}.ok{color:#15803d}.error{display:none;background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;padding:.8rem;border-radius:10px;margin-top:1rem}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1180px}th,td{padding:.55rem;border-bottom:1px solid #e5e7eb;text-align:right;font-size:.82rem;vertical-align:top}
    th{position:sticky;top:0;background:#fff}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.pager{display:flex;gap:.5rem;align-items:center;justify-content:flex-end;margin-top:.8rem}
    @media(max-width:760px){.wrap{padding:.8rem}.filters label{min-width:100%;}}
  </style>
  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3.1.3"></script>
  <script>BondsAuth.initAdminGuard();</script>
  <script src="/admin/admin-common.js?v=4"></script>
</head>
<body>
<main class="wrap">
  <div class="head">
    <div>
      <h1 style="margin:.1rem 0">بحث سجل المساعد</h1>
      <div class="muted">بحث قراءة فقط في السجل غير القابل للتعديل · بدون user_id أو session_id أو metadata أو مفاتيح idempotency</div>
    </div>
    <div class="actions">
      <a class="btn" href="/admin/assistant-operations.html">عمليات المساعد</a>
      <a class="btn" href="/admin/platform-center.html">مركز المنصة</a>
    </div>
  </div>

  <div id="errorBox" class="error"></div>
  <section class="card">
    <div class="filters">
      <label>من<input id="fromFilter" type="datetime-local"></label>
      <label>إلى<input id="toFilter" type="datetime-local"></label>
      <label>Action type<input id="actionTypeFilter" maxlength="100" placeholder="مثال: form_save_draft"></label>
      <label>Event type<input id="eventTypeFilter" maxlength="100" placeholder="مثال: execution_succeeded"></label>
      <label>Outcome<input id="outcomeFilter" maxlength="100"></label>
      <label>Risk<select id="riskFilter"><option value="">الكل</option><option>low</option><option>medium</option><option>high</option><option>critical</option></select></label>
      <label>Confirmation<select id="confirmationFilter"><option value="">الكل</option><option value="true">مطلوبة</option><option value="false">غير مطلوبة</option></select></label>
      <label>Action ID<input id="actionIdFilter" maxlength="200"></label>
      <label>Resource ID<input id="resourceIdFilter" maxlength="200"></label>
    </div>
    <div class="actions" style="margin-top:.8rem">
      <button class="btn" id="searchBtn" type="button">بحث</button>
      <button class="btn" id="resetBtn" type="button">مسح الفلاتر</button>
    </div>
    <div id="status" class="muted" style="margin-top:.75rem">بانتظار التحقق من الجلسة…</div>
  </section>

  <section class="card">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>الوقت</th><th>Subject ref</th><th>Action</th><th>Event</th><th>Outcome</th><th>Risk</th><th>Confirmation</th><th>Boundary</th><th>Target</th><th>Action ID</th><th>Resource ID</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="11" class="muted">لا توجد نتائج بعد.</td></tr></tbody>
      </table>
    </div>
    <div class="pager">
      <button class="btn" id="prevBtn" type="button">السابق</button>
      <span id="pageInfo" class="muted">—</span>
      <button class="btn" id="nextBtn" type="button">التالي</button>
    </div>
  </section>
</main>
<script>
(()=>{
'use strict';
const PAGE_SIZE=50;
let offset=0,total=0;
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt=v=>v?new Date(v).toLocaleString('ar-SA'):'—';

function buildUrl(){
  const p=new URLSearchParams({action:'assistant-audit-search',limit:String(PAGE_SIZE),offset:String(offset)});
  const fields=[
    ['from',fromFilter.value],['to',toFilter.value],['action_type',actionTypeFilter.value],
    ['event_type',eventTypeFilter.value],['outcome',outcomeFilter.value],['risk',riskFilter.value],
    ['requires_confirmation',confirmationFilter.value],['action_id',actionIdFilter.value],['resource_id',resourceIdFilter.value]
  ];
  for(const [key,value] of fields)if(String(value||'').trim())p.set(key,String(value).trim());
  return '/api/admin?'+p.toString();
}
async function request(){
  const response=await BondsAuth.authenticatedFetch(buildUrl(),{returnTo:location.pathname+location.search});
  const body=await response.json().catch(()=>({}));
  if(!response.ok||body.success!==true)throw new Error(body.error||('HTTP '+response.status));
  return body;
}
function render(data){
  total=Number(data.count||0);
  const list=Array.isArray(data.events)?data.events:[];
  rows.innerHTML=list.length?list.map(e=>'<tr>'+
    '<td>'+esc(fmt(e.created_at))+'</td>'+
    '<td class="mono">'+esc(e.subject_ref||'—')+'</td>'+
    '<td class="mono">'+esc(e.action_type||'—')+'</td>'+
    '<td class="mono">'+esc(e.event_type||'—')+'</td>'+
    '<td>'+esc(e.outcome||'—')+'</td>'+
    '<td>'+esc(e.risk||'—')+'</td>'+
    '<td>'+esc(e.requires_confirmation?'نعم':'لا')+'</td>'+
    '<td class="mono">'+esc(e.boundary||'—')+'</td>'+
    '<td class="mono">'+esc(e.target||'—')+'</td>'+
    '<td class="mono">'+esc(e.action_id||'—')+'</td>'+
    '<td class="mono">'+esc(e.resource_id||'—')+'</td>'+
  '</tr>').join(''):'<tr><td colspan="11" class="muted">لا توجد نتائج مطابقة.</td></tr>';
  const first=total?offset+1:0,last=Math.min(offset+list.length,total);
  pageInfo.textContent=first+'–'+last+' من '+total.toLocaleString('ar-SA');
  prevBtn.disabled=offset<=0;nextBtn.disabled=offset+PAGE_SIZE>=total;
  status.innerHTML='<span class="ok">تم تحميل '+list.length.toLocaleString('ar-SA')+' سجل.</span>';
}
async function load(){
  errorBox.style.display='none';status.textContent='جارٍ البحث…';searchBtn.disabled=true;
  try{render(await request());}
  catch(err){errorBox.textContent='فشل البحث: '+err.message;errorBox.style.display='block';status.textContent='تعذر تحميل سجل المساعد.';}
  finally{searchBtn.disabled=false;}
}
searchBtn.addEventListener('click',()=>{offset=0;load();});
resetBtn.addEventListener('click',()=>{document.querySelectorAll('.filters input,.filters select').forEach(el=>el.value='');offset=0;load();});
prevBtn.addEventListener('click',()=>{offset=Math.max(0,offset-PAGE_SIZE);load();});
nextBtn.addEventListener('click',()=>{if(offset+PAGE_SIZE<total){offset+=PAGE_SIZE;load();}});
if(window.__ADMIN_ROLE)load();else window.addEventListener('admin-auth-ready',load,{once:true});
})();
</script>
<script src="/admin/admin-embed.js?v=4"></script>
</body>
</html>
