<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent Inbox | بوندز</title>
  <link rel="stylesheet" href="/styles/fonts-ar.css">
  <link rel="stylesheet" href="/admin/agent-inbox/styles.css?v=1">
  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3.1.3"></script>
  <script>BondsAuth.initAdminGuard();</script>
</head>
<body>
  <main class="agent-shell">
    <header class="agent-header">
      <div>
        <h1>صندوق عمل المساعد</h1>
        <p>الحالات التي تحتاج مراجعة أو متابعة بشرية.</p>
      </div>
      <div id="agent-inbox-role"></div>
    </header>
    <section class="agent-toolbar" aria-label="مرشحات الصندوق">
      <select data-agent-filter="status">
        <option value="">الحالات النشطة</option>
        <option value="open">مفتوح</option><option value="assigned">معيّن</option>
        <option value="in_review">قيد المراجعة</option><option value="waiting_user">بانتظار المستخدم</option>
        <option value="resolved">تم الحل</option><option value="dismissed">مستبعد</option>
      </select>
      <select data-agent-filter="priority">
        <option value="">كل الأولويات</option><option value="critical">حرج</option>
        <option value="high">عالٍ</option><option value="medium">متوسط</option><option value="low">منخفض</option>
      </select>
      <button onclick="AgentInboxApp.load()">تحديث</button>
    </section>
    <section id="agent-inbox-root" class="agent-grid" aria-live="polite"></section>
  </main>
  <script src="/admin/agent-inbox/service.js?v=1"></script>
  <script src="/admin/agent-inbox/app.js?v=1"></script>
</body>
</html>
