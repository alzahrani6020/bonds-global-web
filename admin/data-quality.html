<!DOCTYPE html>
<html lang="ar" dir="rtl" data-ud-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>جودة البيانات | لوحة التحكم | بوندز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="../assets/bonds-mark.svg" type="image/svg+xml" />
  <script src="/admin/admin-common.js?v=4"></script>
  <script src="/admin/admin-embed.js?v=4"></script>
  <style>
    :root {
      --bg: #f5f0e8; --bg-secondary: #ffffff; --bg-card: rgba(255,255,255,0.85);
      --gold: #b8954e; --gold-bright: #d4b87a;
      --text: #1a1a1a; --text-secondary: #555555; --text-muted: #888888;
      --border: rgba(0,0,0,0.08);
      --success: #22c55e; --warning: #eab308; --danger: #ef4444; --info: #3b82f6;
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Vazirmatn', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
    .main-content { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    .page-header { margin-bottom: 1.5rem; }
    .page-header h1 { font-size: 1.5rem; font-weight: 800; }
    .page-header p { color: var(--text-secondary); font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
    .card h3 { font-size: 1rem; font-weight: 700; color: var(--gold); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .metric { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
    .metric:last-child { border-bottom: none; }
    .metric-label { font-size: 0.85rem; color: var(--text-secondary); }
    .metric-value { font-size: 1rem; font-weight: 800; }
    .badge { display: inline-block; padding: 0.2rem 0.55rem; border-radius: 50px; font-size: 0.7rem; font-weight: 700; }
    .badge--success { background: rgba(34,197,94,0.12); color: var(--success); }
    .badge--warning { background: rgba(234,179,8,0.12); color: #b48a00; }
    .badge--danger { background: rgba(239,68,68,0.12); color: var(--danger); }
    .loading { text-align: center; padding: 3rem; color: var(--text-muted); }
    .error { text-align: center; padding: 2rem; color: var(--danger); background: rgba(239,68,68,0.05); border-radius: var(--radius); }
    .refresh-bar { display: flex; justify-content: flex-end; margin-bottom: 0.75rem; }
    .btn-sm { padding: 0.45rem 0.9rem; border-radius: 10px; font-size: 0.78rem; font-weight: 700; border: none; cursor: pointer; background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color: #1a1a1a; }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="page-header">
      <h1>تقرير جودة البيانات</h1>
      <p>نظرة عامة على اكتمال وصحة بيانات المستخدمين والعملاء المحتملين.</p>
    </div>

    <div class="refresh-bar">
      <button class="btn-sm" onclick="loadReport()">↻ تحديث</button>
    </div>

    <div id="reportContainer">
      <div class="loading">جاري تحميل التقرير...</div>
    </div>
  </div>

  <script>
    async function loadReport() {
      const container = document.getElementById('reportContainer');
      container.innerHTML = '<div class="loading">جاري تحميل التقرير...</div>';
      try {
        const token = await BondsAdminCommon.getAdminToken();
        const res = await fetch('/api/admin?action=data-quality-report', {
          headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data.success) throw new Error(data.error);
        renderReport(data);
      } catch (e) {
        container.innerHTML = '<div class="error">فشل تحميل التقرير: ' + BondsAdminCommon.escapeHtml(e.message) + '</div>';
      }
    }

    function card(title, rows) {
      return `
        <div class="card">
          <h3>${title}</h3>
          ${rows.map(r => `
            <div class="metric">
              <span class="metric-label">${r.label}</span>
              <span class="metric-value" style="color:${r.color || 'var(--text)'}">${r.value}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderReport(data) {
      const leads = data.calculator_leads || {};
      const contacts = data.contact_messages || {};
      const profiles = data.profiles || {};
      document.getElementById('reportContainer').innerHTML = `
        <div class="grid">
          ${card('ملفات المستخدمين (Profiles)', [
            { label: 'الإجمالي', value: profiles.total, color: 'var(--text)' },
            { label: 'مكتملة 100%', value: profiles.complete, color: 'var(--success)' },
            { label: 'جزئية', value: profiles.partial, color: '#b48a00' },
            { label: 'ناقصة', value: profiles.incomplete, color: 'var(--danger)' }
          ])}
          ${card('العملاء المحتملين (Leads)', [
            { label: 'الإجمالي', value: leads.total, color: 'var(--text)' },
            { label: 'صالحة', value: leads.valid, color: 'var(--success)' },
            { label: 'غير صالحة / ناقصة', value: leads.invalid, color: 'var(--danger)' }
          ])}
          ${card('رسائل التواصل (Contact)', [
            { label: 'الإجمالي', value: contacts.total, color: 'var(--text)' },
            { label: 'صالحة', value: contacts.valid, color: 'var(--success)' },
            { label: 'غير صالحة / ناقصة', value: contacts.invalid, color: 'var(--danger)' }
          ])}
        </div>
        <div class="card">
          <h3>ملخص سريع</h3>
          <div class="metric">
            <span class="metric-label">نسبة الملفات المكتملة</span>
            <span class="metric-value">${profiles.total ? Math.round((profiles.complete / profiles.total) * 100) : 0}%</span>
          </div>
          <div class="metric">
            <span class="metric-label">نسبة Leads صالحة</span>
            <span class="metric-value">${leads.total ? Math.round((leads.valid / leads.total) * 100) : 0}%</span>
          </div>
          <div class="metric">
            <span class="metric-label">نسبة Contact Messages صالحة</span>
            <span class="metric-value">${contacts.total ? Math.round((contacts.valid / contacts.total) * 100) : 0}%</span>
          </div>
        </div>
      `;
    }

    function init() {
      loadReport();
    }

    if (location.search.includes('embed=1')) {
      if (window.__ADMIN_TOKEN) {
        init();
      } else {
        window.addEventListener('admin-token-ready', init, { once: true });
        setTimeout(() => { if (!window.__ADMIN_TOKEN) init(); }, 2500);
      }
    } else {
      window.addEventListener('load', init);
    }
  </script>
</body>
</html>
