<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>طلبات التحويل البنكي | بوندز</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/api/env"></script>
  <script src="..//bonds-auth-2026.js"></script>
  <script src="../auth-guard.js"></script>
  <script src="/bonds-auth-2026.js?v=3"></script>
  <script>BondsAuth.initAdminGuard();</script>
  <style>
    body { background: var(--bg); color: var(--text); font-family: 'Vazirmatn', sans-serif; min-height: 100vh; }
    .admin-layout { display: flex; min-height: 100vh; }
    .admin-sidebar { width: 260px; background: var(--surface); border-left: 1px solid var(--border); padding: 2rem 1rem; position: fixed; inset: 0 auto 0 0; overflow-y: auto; }
    .admin-sidebar a { display: block; padding: 0.75rem 1rem; border-radius: 8px; color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; margin-bottom: 0.25rem; transition: all 0.2s; }
    .admin-sidebar a:hover, .admin-sidebar a.active { background: rgba(212,168,83,0.1); color: var(--gold); }
    .admin-main { flex: 1; margin-right: 260px; padding: 2rem; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .admin-header h1 { font-size: 1.5rem; font-weight: 800; color: var(--gold); }
    .status-badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .status-pending { background: rgba(234,179,8,0.15); color: #eab308; }
    .status-verified { background: rgba(34,197,94,0.15); color: #22c55e; }
    .status-rejected { background: rgba(239,68,68,0.15); color: #ef4444; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: right; padding: 1rem; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
    .data-table td { padding: 1rem; font-size: 0.9rem; border-bottom: 1px solid var(--border); }
    .data-table tr:hover { background: rgba(255,255,255,0.02); }
    .btn-sm { padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.8rem; font-weight: 700; border: none; cursor: pointer; transition: all 0.2s; }
    .btn-verify { background: var(--gold); color: var(--bg); }
    .btn-verify:hover { opacity: 0.9; }
    .btn-reject { background: transparent; color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .btn-reject:hover { background: rgba(239,68,68,0.1); }
    .empty-state { text-align: center; padding: 4rem; color: var(--text-secondary); }
    @media (max-width: 768px) { .admin-sidebar { display: none; } .admin-main { margin-right: 0; } }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div style="padding: 0 1rem 1.5rem;">
        <img src="../assets/bonds-logo-2026-sm.webp?v=2026" alt="Bonds" style="height: 32px;">
      </div>
      <a href="dashboard.html"><svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg> لوحة التحكم</a>
      <a href="users.html"><svg class="bonds-icon bonds-icon--users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> المستخدمين</a>
      <a href="subscriptions.html"><svg class="bonds-icon bonds-icon--credit-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg> الاشتراكات</a>
      <a href="bank-transfers.html" class="active"><svg class="bonds-icon bonds-icon--bank" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L2 11h20L12 2z"></path><rect x="3" y="11" width="18" height="10" rx="2"></rect><line x1="12" y1="11" x2="12" y2="21"></line></svg> التحويلات البنكية</a>
      <a href="analytics.html"><svg class="bonds-icon bonds-icon--trend-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg> الإحصائيات</a>
      <a href="messages.html"><svg class="bonds-icon bonds-icon--mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg> الرسائل</a>
      <a href="roles.html"><svg class="bonds-icon bonds-icon--lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path><circle cx="12" cy="16" r="1"></circle><path d="M12 16v3"></path></svg> الأدوار</a>
      <a href="../index.html" style="margin-top: 2rem; color: #ef4444;"><svg class="bonds-icon bonds-icon--door" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 20V6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v14"></path><path d="M2 20h20"></path><path d="M14 12v.01"></path></svg> خروج</a>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <h1><svg class="bonds-icon bonds-icon--bank" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L2 11h20L12 2z"></path><rect x="3" y="11" width="18" height="10" rx="2"></rect><line x1="12" y1="11" x2="12" y2="21"></line></svg> طلبات التحويل البنكي</h1>
        <div id="adminInfo" style="font-size: 0.85rem; color: var(--text-secondary);"></div>
      </div>

      <div id="loading" style="text-align:center;padding:3rem;">جاري التحميل...</div>
      <div id="tableContainer" style="display:none;">
        <table class="data-table">
          <thead>
            <tr>
              <th>التاريخ</th>
              <th>الاسم</th>
              <th>البريد</th>
              <th>الجوال</th>
              <th>الباقة</th>
              <th>المبلغ</th>
              <th>الحالة</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody id="requestsBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state" style="display:none;">
        <div style="font-size: 3rem; margin-bottom: 1rem;"><svg class="bonds-icon bonds-icon--mailbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 17a2 2 0 0 1-2 2H6l-4-4V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12z"></path><path d="M16 13V5"></path><path d="M16 9h6"></path></svg></div>
        <p>لا توجد طلبات تحويل بنكي حالياً</p>
      </div>
    </main>
  </div>

  <script>
    async function init() {
      const { data: userData } = await window.BondsAuth?.getUser?.() || {};
      const user = userData?.user;
      if (!user) {
        document.getElementById('loading').textContent = 'يجب تسجيل الدخول للوصول إلى لوحة التحكم';
        return;
      }
      const token = userData.session?.access_token || '';
      document.getElementById('adminInfo').textContent = user.email;
      loadRequests(token);
    }

    async function loadRequests(token) {
      try {
        const res = await fetch('/api/admin?action=bank-transfers', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const json = await res.json();

        document.getElementById('loading').style.display = 'none';

        if (!json.data?.length) {
          document.getElementById('emptyState').style.display = 'block';
          return;
        }

        const tbody = document.getElementById('requestsBody');
        tbody.innerHTML = json.data.map(r => {
          const date = new Date(r.created_at).toLocaleDateString('ar-SA');
          const statusClass = r.status === 'pending' ? 'status-pending' : r.status === 'verified' ? 'status-verified' : 'status-rejected';
          const statusText = r.status === 'pending' ? 'قيد الانتظار' : r.status === 'verified' ? 'مُفعل' : 'مرفوض';
          const actions = r.status === 'pending'
            ? `<button class="btn-sm btn-verify" onclick="updateStatus('${r.id}', 'verified', '${token}')"><svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg> تفعيل</button>
               <button class="btn-sm btn-reject" onclick="updateStatus('${r.id}', 'rejected', '${token}')"><svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg> رفض</button>`
            : '<span style="color:var(--text-secondary);font-size:0.8rem;">—</span>';
          return `<tr>
            <td>${date}</td>
            <td style="font-weight:700;">${escapeHtml(r.name)}</td>
            <td>${escapeHtml(r.email)}</td>
            <td>${escapeHtml(r.phone || '-')}</td>
            <td><span style="text-transform:uppercase;font-weight:700;color:var(--gold);">${r.tier}</span></td>
            <td>${r.amount_sar} ر.س</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            <td style="display:flex;gap:0.5rem;">${actions}</td>
          </tr>`;
        }).join('');

        document.getElementById('tableContainer').style.display = 'block';
      } catch (e) {
        document.getElementById('loading').textContent = 'خطأ في التحميل';
      }
    }

    async function updateStatus(id, action, token) {
      if (!confirm(action === 'verified' ? 'تأكيد تفعيل هذا الاشتراك؟' : 'تأكيد رفض هذا الطلب؟')) return;
      try {
        const res = await fetch('/api/admin?action=bank-transfers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ id, action })
        });
        const json = await res.json();
        if (json.success) {
          alert(action === 'verified' ? '<svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg> تم التفعيل' : '<svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg> تم الرفض');
          location.reload();
        } else {
          alert(json.error || 'خطأ');
        }
      } catch (e) {
        alert('فشل الاتصال');
      }
    }

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    init();
  </script>
  <script src="../page-tracker-v2.js"></script>
  <script src="/admin/admin-embed.js"></script>
</body>
</html>
