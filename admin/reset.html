<!DOCTYPE html>
<html lang="ar" dir="rtl" data-ud-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إعادة تعيين كلمة المرور | بوندز</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background: #f5f0e8; color: #1a1a1a; font-family: 'Vazirmatn', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: rgba(255,255,255,0.8); border: 1px solid rgba(197,160,40,0.2); border-radius: 20px; padding: 2.5rem; max-width: 420px; width: 90%; text-align: center; }
    h2 { color: #b8954e; margin-bottom: 0.5rem; }
    p { color: #555555; margin-bottom: 1.5rem; font-size: 0.95rem; }
    input { width: 100%; padding: 1rem; border-radius: 12px; border: 1px solid rgba(197,160,40,0.2); background: rgba(255,255,255,0.03); color: #1a1a1a; font-size: 1rem; box-sizing: border-box; margin-bottom: 1rem; }
    button { width: 100%; padding: 1rem; border-radius: 12px; border: none; background: linear-gradient(135deg, #b8954e, #c8a45c); color: #1a1a1a; font-weight: 800; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 1rem; padding: 1rem; border-radius: 10px; font-size: 0.9rem; }
    .msg.error { background: rgba(239,68,68,0.15); color: #ff8a8a; }
    .msg.success { background: rgba(34,197,94,0.15); color: #22c55e; }
    a { color: #b8954e; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:3rem;margin-bottom:0.5rem;"><svg class="bonds-icon bonds-icon--lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path><circle cx="12" cy="16" r="1"></circle><path d="M12 16v3"></path></svg></div>
    <h2>إعادة تعيين كلمة المرور</h2>
    <p>أدخل بريدك الإلكتروني وسيتم إنشاء رابط مباشر</p>
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <button id="btn" onclick="generate()">إنشاء رابط الإعادة</button>
    <div id="result"></div>
  </div>

  <script src="/api/env"></script>
  <script>
    (function() {
      const env = window.__ENV || {};
      if (env.ADMIN_EMAIL) {
        document.getElementById('email').value = env.ADMIN_EMAIL;
      }
    })();

    async function generate() {
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('btn');
      const result = document.getElementById('result');
      if (!email) { result.innerHTML = '<div class="msg error">أدخل البريد الإلكتروني</div>'; return; }

      btn.disabled = true;
      btn.textContent = 'جاري الإنشاء...';
      result.innerHTML = '';

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.resetLink) {
          result.innerHTML = `
            <div class="msg success">
              <svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg> تم إنشاء الرابط!<br>
              <a href="${data.resetLink}" target="_blank" style="font-weight:800;">اضغط هنا لإعادة التعيين</a>
            </div>
          `;
        } else {
          result.innerHTML = `<div class="msg error">${data.error || 'حدث خطأ'}</div>`;
        }
      } catch (e) {
        result.innerHTML = `<div class="msg error">خطأ في الاتصال</div>`;
      }

      btn.disabled = false;
      btn.textContent = 'إنشاء رابط الإعادة';
    }
  </script>
  <script src="../page-tracker-v2.js"></script>
</body>
</html>
