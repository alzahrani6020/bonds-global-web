<!DOCTYPE html>
<html lang="ar" dir="rtl" data-ud-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إعادة تعيين كلمة المرور | بوندز</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background: #f5f0e8; color: #1a1a1a; font-family: 'Vazirmatn', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: rgba(255,255,255,0.8); border: 1px solid rgba(197,160,40,0.2); border-radius: 20px; padding: 2.5rem; max-width: 420px; width: 90%; text-align: center; }
    h2 { color: #b8954e; margin-bottom: 0.5rem; }
    p { color: #555555; margin-bottom: 1.5rem; font-size: 0.95rem; }
    input { width: 100%; padding: 1rem; border-radius: 12px; border: 1px solid rgba(197,160,40,0.2); background: rgba(255,255,255,0.03); color: #1a1a1a; font-size: 1rem; box-sizing: border-box; margin-bottom: 1rem; }
    button { width: 100%; padding: 1rem; border-radius: 12px; border: none; background: linear-gradient(135deg, #b8954e, #c8a45c); color: #1a1a1a; font-weight: 800; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 1rem; padding: 1rem; border-radius: 10px; font-size: 0.9rem; }
    .msg.error { background: rgba(239,68,68,0.15); color: #ff8a8a; }
    .msg.success { background: rgba(34,197,94,0.15); color: #22c55e; }
    a { color: #b8954e; text-decoration: none; }
  </style>
<script src="/calculators/auth-gate.js?v=3"></script>
  </head>
<body>
  <div class="card">
    <div style="font-size:3rem;margin-bottom:0.5rem;"><span class="emoji-icon" style="display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;" aria-hidden="true"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#AAB8C2" d="M13 3C7.477 3 3 7.477 3 13v10h4V13c0-3.313 2.687-6 6-6s6 2.687 6 6v10h4V13c0-5.523-4.477-10-10-10z"/><path fill="#FFAC33" d="M26 32c0 2.209-1.791 4-4 4H4c-2.209 0-4-1.791-4-4V20c0-2.209 1.791-4 4-4h18c2.209 0 4 1.791 4 4v12z"/><path fill="#C1694F" d="M35 9c0-4.971-4.029-9-9-9s-9 4.029-9 9c0 3.917 2.507 7.24 6 8.477V33.5c0 1.381 1.119 2.5 2.5 2.5 1.213 0 2.223-.864 2.45-2.01.018.001.032.01.05.01.553 0 1-.447 1-1v-1c0-.553-.447-1-1-1v-1c.553 0 1-.447 1-1v-2c0-.553-.447-1-1-1v-2.277c.596-.347 1-.984 1-1.723v-4.523c3.493-1.236 6-4.559 6-8.477zm-9-7c1.104 0 2 .896 2 2s-.896 2-2 2-2-.896-2-2 .896-2 2-2z"/></svg></span></div>
    <h2>إعادة تعيين كلمة المرور</h2>
    <p>أدخل بريدك الإلكتروني وسيتم إنشاء رابط مباشر</p>
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="secret" placeholder="رمز الطوارئ (FORCE_RESET_SECRET)">
    <button id="btn" onclick="generate()">إنشاء رابط الإعادة</button>
    <div id="result"></div>
  </div>

  <script src="/api/env"></script>
  <script src="/admin/admin-common.js?v=4"></script>
  <script>
    (function() {
      const env = window.__ENV || {};
      if (env.ADMIN_EMAIL) {
        document.getElementById('email').value = env.ADMIN_EMAIL;
      }
    })();

    (async function checkAuth() {
      const token = await BondsAdminCommon.getAdminToken();
      if (!token) {
        document.getElementById('result').innerHTML = '<div class="msg error">يجب تسجيل الدخول كمسؤول أولاً</div>';
        document.getElementById('btn').disabled = true;
      }
    })();

    async function generate() {
      const email = document.getElementById('email').value.trim();
      const secret = document.getElementById('secret').value.trim();
      const btn = document.getElementById('btn');
      const result = document.getElementById('result');
      const token = await BondsAdminCommon.getAdminToken();
      if (!token) { result.innerHTML = '<div class="msg error">يجب تسجيل الدخول كمسؤول أولاً</div>'; return; }
      if (!email) { result.innerHTML = '<div class="msg error">أدخل البريد الإلكتروني</div>'; return; }
      if (!secret) { result.innerHTML = '<div class="msg error">أدخل رمز الطوارئ</div>'; return; }

      btn.disabled = true;
      btn.textContent = 'جاري الإنشاء...';
      result.innerHTML = '';

      try {
        const res = await fetch('/api/admin?action=reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ email, secret })
        });
        const data = await res.json();

        if (data.resetLink) {
          result.innerHTML = `
            <div class="msg success">
              ✅ تم إنشاء الرابط!<br>
              <a href="${data.resetLink}" target="_blank" style="font-weight:800;">اضغط هنا لإعادة التعيين</a>
            </div>
          `;
        } else {
          result.innerHTML = `<div class="msg error">${data.error || 'حدث خطأ'}</div>`;
        }
      } catch (e) {
        result.innerHTML = `<div class="msg error">خطأ في الاتصال</div>`;
      }

      btn.disabled = false;
      btn.textContent = 'إنشاء رابط الإعادة';
    }
  </script>
  <script src="../page-tracker-v2.js"></script>
<script src="/components/emoji-icons.js"></script>
<script src="/components/emoji-renderer.js"></script>
</body>
</html>
