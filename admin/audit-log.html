<!DOCTYPE html>
<html lang="ar" dir="rtl" data-ud-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>سجل مراجعة الإداريين | لوحة التحكم | بوندز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="../assets/bonds-mark.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #f5f0e8; --bg-secondary: #ffffff; --bg-card: rgba(255,255,255,0.85);
      --gold: #b8954e; --gold-bright: #d4b87a; --gold-dim: #8a7340;
      --text: #1a1a1a; --text-secondary: #555555; --text-muted: #888888;
      --border: rgba(0,0,0,0.08); --border-hover: rgba(184,149,78,0.4);
      --success: #22c55e; --warning: #eab308; --info: #3b82f6; --danger: #ef4444;
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.4); --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Vazirmatn', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; overflow-y: auto; }

    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px; background: var(--bg-secondary); border-left: 1px solid var(--border);
      padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem;
      position: fixed; right: 0; top: 0; bottom: 0; z-index: 100;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 0.75rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .sidebar-brand img { height: 40px; width: auto; border-radius: 6px; }
    .sidebar-brand span { font-size: 1.1rem; font-weight: 800; color: var(--gold); }
    .sidebar-nav { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; border-radius: 12px; color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(212,168,83,0.1); color: var(--gold); }
    .sidebar-link svg { width: 20px; height: 20px; opacity: 0.7; }

    .main-content { flex: 1; margin-right: 260px; padding: 2rem; }
    .page-header { margin-bottom: 2rem; }
    .page-header h1 { font-size: 1.6rem; font-weight: 800; }
    .page-header p { color: var(--text-secondary); font-size: 0.9rem; }

    .filters { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .filters input, .filters select {
      padding: 0.65rem 0.9rem; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-secondary); color: var(--text); font-family: inherit; font-size: 0.85rem;
    }
    .filters input { flex: 1; min-width: 220px; max-width: 360px; }
    .btn-sm { padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; border: none; cursor: pointer; background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color: #1a1a1a; }

    .table-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: right; padding: 1rem 1.25rem; font-size: 0.75rem; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.9); }
    .data-table td { padding: 0.85rem 1.25rem; font-size: 0.85rem; color: var(--text-secondary); border-bottom: 1px solid var(--border); vertical-align: top; }
    .data-table tr:hover td { background: rgba(212,168,83,0.05); }
    .badge { display: inline-block; padding: 0.25rem 0.65rem; border-radius: 50px; font-size: 0.7rem; font-weight: 700; }
    .badge--super { background: rgba(168,85,247,0.12); color: #a855f7; }
    .badge--admin { background: rgba(59,130,246,0.12); color: #3b82f6; }
    .badge--support { background: rgba(234,179,8,0.12); color: #b48800; }
    .badge--owner { background: rgba(212,168,83,0.15); color: var(--gold); }

    .action-tag { font-family: monospace; font-size: 0.78rem; background: rgba(0,0,0,0.04); padding: 0.2rem 0.5rem; border-radius: 6px; color: var(--text); }
    .details { font-size: 0.78rem; color: var(--text-muted); max-width: 260px; overflow-wrap: break-word; }
    .empty { text-align: center; padding: 3rem; color: var(--text-muted); }

    .pagination { display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 1rem; }
    .page-btn { min-width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-weight: 700; cursor: pointer; transition: all 0.3s; }
    .page-btn:hover, .page-btn.active { background: rgba(212,168,83,0.15); color: var(--gold); border-color: var(--gold); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    @media (max-width: 1024px) {
      .sidebar { width: 80px; padding: 1rem; }
      .sidebar-brand span, .sidebar-link span { display: none; }
      .sidebar-link { justify-content: center; padding: 0.85rem; }
      .main-content { margin-right: 80px; }
    }
  </style>
  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3.0.4"></script>
  <script>BondsAuth.initAdminGuard();</script>
<script src="/calculators/auth-gate.js?v=2"></script>
  </head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="../assets/bonds-logo-2026-sm.webp?v=2026" alt="بوندز" />
        <span>بوندز</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>الرئيسية</span>
        </a>
        <a href="users.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>المستخدمين</span>
        </a>
        <a href="roles.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>الصلاحيات</span>
        </a>
        <a href="audit-log.html" class="sidebar-link active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>سجل المراجعة</span>
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>سجل مراجعة الإداريين</h1>
        <p>تتبع كل إجراء يتم في لوحة التحكم</p>
      </div>

      <div class="filters">
        <input type="text" id="searchInput" placeholder="بحث بالإجراء أو البريد أو الهدف..." oninput="applyFilters()" />
        <select id="roleFilter" onchange="applyFilters()">
          <option value="">كل الأدوار</option>
          <option value="super_admin">Super Admin</option>
          <option value="admin">Admin</option>
          <option value="support">Support</option>
        </select>
        <button class="btn-sm" onclick="refresh()">↻ تحديث</button>
      </div>

      <div class="table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th>الوقت</th>
              <th>الإداري</th>
              <th>الدور</th>
              <th>الإجراء</th>
              <th>الهدف</th>
              <th>التفاصيل</th>
            </tr>
          </thead>
          <tbody id="logTable">
            <tr><td colspan="6" class="empty">جارِ التحميل...</td></tr>
          </tbody>
        </table>
        <div class="pagination" id="pagination"></div>
      </div>
    </main>
  </div>

  <script src="../page-tracker-v2.js"></script>
  <script src="/admin/admin-embed.js"></script>
  <script>
    let allLogs = [];
    let filteredLogs = [];
    let currentPage = 1;
    const pageSize = 25;

    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin) return;
      if (e.data?.type === 'admin-token' && e.data?.token) window.__ADMIN_TOKEN = e.data.token;
    });

    async function getToken() {
      let token = window.__ADMIN_TOKEN || '';
      if (!token && typeof supabase !== 'undefined' && window.__ENV?.SUPABASE_URL) {
        const client = supabase.createClient(window.__ENV.SUPABASE_URL, window.__ENV.SUPABASE_ANON_KEY);
        const { data: { session } } = await client.auth.getSession();
        token = session?.access_token || '';
      }
      return token;
    }

    function roleBadge(role) {
      const map = { super_admin: 'badge--super', admin: 'badge--admin', support: 'badge--support' };
      const label = role === 'super_admin' ? 'Super Admin' : role === 'admin' ? 'Admin' : role === 'support' ? 'Support' : role || '—';
      return `<span class="badge ${map[role] || 'badge--owner'}">${label}</span>`;
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function formatDetails(details) {
      if (!details || typeof details !== 'object') return '—';
      const entries = Object.entries(details).filter(([k]) => k !== 'password');
      if (!entries.length) return '—';
      return entries.map(([k, v]) => `${k}: ${JSON.stringify(v)}`).join('<br>');
    }

    async function refresh() {
      const tbody = document.getElementById('logTable');
      tbody.innerHTML = '<tr><td colspan="6" class="empty">جارِ التحميل...</td></tr>';
      try {
        const token = await getToken();
        const res = await fetch('/api/admin?action=audit-log&limit=500', {
          headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data.success) throw new Error(data.error);
        allLogs = data.logs || [];
        applyFilters();
      } catch (e) {
        console.error('[AuditLog]', e);
        tbody.innerHTML = '<tr><td colspan="6" class="empty">فشل تحميل السجل</td></tr>';
      }
    }

    function applyFilters() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const role = document.getElementById('roleFilter').value;
      filteredLogs = allLogs.filter(log => {
        const text = [
          log.action, log.actor_email, log.target_email, log.target_id, log.target_type
        ].filter(Boolean).join(' ').toLowerCase();
        const matchQ = !q || text.includes(q);
        const matchRole = !role || log.actor_role === role;
        return matchQ && matchRole;
      });
      currentPage = 1;
      render();
    }

    function render() {
      const tbody = document.getElementById('logTable');
      const start = (currentPage - 1) * pageSize;
      const page = filteredLogs.slice(start, start + pageSize);

      if (!page.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">لا يوجد سجلات</td></tr>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      tbody.innerHTML = page.map(log => `
        <tr>
          <td>${formatDate(log.created_at)}</td>
          <td>${log.actor_email || '—'}</td>
          <td>${roleBadge(log.actor_role)}</td>
          <td><span class="action-tag">${log.action || '—'}</span></td>
          <td>
            ${log.target_type || ''}${log.target_type && log.target_id ? '<br>' : ''}
            <span style="font-size:0.75rem;color:var(--text-muted);direction:ltr;display:inline-block;">${log.target_id || ''}</span>
            ${log.target_email ? '<br><span style="font-size:0.75rem;color:var(--text-muted)">' + log.target_email + '</span>' : ''}
          </td>
          <td class="details">${formatDetails(log.details)}</td>
        </tr>
      `).join('');

      renderPagination();
      notifyParentHeight();
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredLogs.length / pageSize);
      const container = document.getElementById('pagination');
      if (totalPages <= 1) { container.innerHTML = ''; return; }
      let html = '';
      html += `<button class="page-btn" onclick="goToPage(currentPage-1)" ${currentPage === 1 ? 'disabled' : ''}>←</button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" onclick="goToPage(currentPage+1)" ${currentPage === totalPages ? 'disabled' : ''}>→</button>`;
      container.innerHTML = html;
    }

    function goToPage(p) {
      const totalPages = Math.ceil(filteredLogs.length / pageSize);
      if (p < 1 || p > totalPages) return;
      currentPage = p;
      render();
    }

    function notifyParentHeight() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'iframe-height', height: document.body.scrollHeight }, '*');
        }
      } catch (e) {}
    }

    window.addEventListener('load', refresh);
  </script>
</body>
</html>
