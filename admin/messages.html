<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الرسائل | لوحة التحكم | بوندز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="../assets/bonds-mark.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #f5f0e8; --bg-secondary: #ffffff; --bg-card: rgba(255,255,255,0.85);
      --gold: #b8954e; --gold-bright: #d4b87a; --gold-dim: #8a7340;
      --text: #1a1a1a; --text-secondary: #555555; --text-muted: #888888;
      --border: rgba(0,0,0,0.08); --border-hover: rgba(184,149,78,0.4);
      --success: #22c55e; --warning: #eab308; --info: #3b82f6; --danger: #ef4444;
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.4); --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Vazirmatn', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }

    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px; background: var(--bg-secondary); border-left: 1px solid var(--border);
      padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem;
      position: fixed; right: 0; top: 0; bottom: 0; z-index: 100;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 0.75rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .sidebar-brand img { height: 40px; width: auto; border-radius: 6px; }
    .sidebar-brand span { font-size: 1.1rem; font-weight: 800; color: var(--gold); }
    .sidebar-nav { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; border-radius: 12px; color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(212,168,83,0.1); color: var(--gold); }
    .sidebar-link svg { width: 20px; height: 20px; opacity: 0.7; }
    .sidebar-footer { padding-top: 1rem; border-top: 1px solid var(--border); }
    .sidebar-user { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-bright)); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #1a1a1a; font-size: 0.85rem; }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: 700; font-size: 0.85rem; }
    .user-role { font-size: 0.75rem; color: var(--text-muted); }

    .main-content { flex: 1; margin-right: 260px; padding: 2rem; }
    .page-header { margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .page-header h1 { font-size: 1.6rem; font-weight: 800; }
    .page-header p { color: var(--text-secondary); font-size: 0.9rem; }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; margin-bottom: 2rem; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; transition: all 0.3s; }
    .stat-card:hover { border-color: var(--border-hover); transform: translateY(-3px); }
    .stat-card__num { font-size: 1.7rem; font-weight: 800; line-height: 1; margin-bottom: 0.35rem; }
    .stat-card__label { font-size: 0.8rem; color: var(--text-secondary); }

    .btn-sm { padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; text-decoration: none; transition: all 0.3s; border: none; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color: #1a1a1a; }
    .btn-secondary { background: rgba(0,0,0,0.05); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--gold); }
    .btn-danger { background: rgba(239,68,68,0.15); color: var(--danger); }
    .btn-whatsapp { background: linear-gradient(135deg, #25d366, #128c7e); color: #fff; }

    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tab-btn { padding: 0.6rem 1.2rem; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); font-weight: 700; cursor: pointer; transition: all 0.3s; }
    .tab-btn:hover { border-color: var(--border-hover); color: var(--gold); }
    .tab-btn.active { background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color: #1a1a1a; border-color: transparent; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .compose-form { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); }
    .form-group input, .form-group textarea { padding: 0.85rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.6); color: var(--text); font-family: inherit; font-size: 0.95rem; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--gold); background: #fff; }
    .form-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .checkbox-label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer; }
    .compose-status { font-size: 0.85rem; min-height: 1.2rem; font-weight: 700; }
    .compose-status.success { color: var(--success); }
    .compose-status.error { color: var(--danger); }

    .message-list { display: flex; flex-direction: column; gap: 1rem; }
    .message-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; transition: all 0.3s; }
    .message-card:hover { border-color: var(--border-hover); }
    .message-card.unread { border-right: 3px solid var(--gold); }
    .message-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; gap: 0.5rem; flex-wrap: wrap; }
    .message-sender { font-weight: 700; color: var(--text); }
    .message-time { font-size: 0.8rem; color: var(--text-muted); }
    .message-email { font-size: 0.8rem; color: var(--gold); margin-bottom: 0.5rem; }
    .message-subject { font-weight: 800; margin-bottom: 0.5rem; color: var(--text); }
    .message-body { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; }
    .message-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }

    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 50px; font-size: 0.7rem; font-weight: 700; }
    .badge--new { background: rgba(212,168,83,0.15); color: var(--gold); }
    .badge--read { background: rgba(100,116,139,0.15); color: var(--text-secondary); }
    .badge--email { background: rgba(59,130,246,0.15); color: var(--info); }

    .loading { color: var(--text-muted); font-style: italic; text-align: center; padding: 2rem; }

    @media (max-width: 1024px) {
      .sidebar { width: 80px; padding: 1rem; }
      .sidebar-brand span, .sidebar-link span, .user-info { display: none; }
      .sidebar-link { justify-content: center; padding: 0.85rem; }
      .main-content { margin-right: 80px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr; } }
  </style>
  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3.0.1"></script>
  <script>BondsAuth.initAdminGuard();</script>
<script src="/calculators/auth-gate.js?v=2"></script>
  </head>
<body>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>الرسائل</h1>

        </div>

          <button class="btn-sm btn-primary" onclick="showTab('compose')">✉ رسالة جديدة</button>

      <div class="tabs">

            <label for="msgRecipient">المستلم (البريد الإلكتروني أو معرف المستخدم)</label>
            <input type="text" id="msgRecipient" placeholder="user@example.com" required />
          </div>

            <label for="msgSubject">الموضوع</label>
            <input type="text" id="msgSubject" placeholder="عنوان الرسالة" required />
          </div>

            <textarea id="msgBody" rows="6" placeholder="اكتب رسالتك هنا..." required></textarea>

            <label class="checkbox-label">
              <input type="checkbox" id="msgSendEmail" checked />

  <script>
    async function getAdminToken() {
      let token = window.__ADMIN_TOKEN || '';
      if (!token && typeof supabase !== 'undefined' && window.__ENV?.SUPABASE_URL) {
        const client = supabase.createClient(window.__ENV.SUPABASE_URL, window.__ENV.SUPABASE_ANON_KEY);
        const { data: { session } } = await client.auth.getSession();
        token = session?.access_token || '';
      }
      return token;
    }

    function showTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
      if (tab === 'sent') renderSentMessages();
      if (tab === 'inbox') renderMessages();
    }

    async function fetchMessages() {
      try {
        const token = await getAdminToken();
        const res = await fetch('/api/admin?action=messages', {
          headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data.success) throw new Error(data.error);
        return data.messages || [];
      } catch (e) {
        return [
          { id: 'demo-1', name: 'أحمد محمد', email: 'ahmed@example.com', phone: '+966501234567', sector: 'صناعة', service: 'دراسة جدوى متكاملة', message: 'أود الاستفسار عن دراسة جدوى متكاملة لمصنع بلاستيك في الرياض.', read: false, created_at: new Date(Date.now() - 3600000).toISOString() },
          { id: 'demo-2', name: 'سارة عبدالله', email: 'sara@example.com', phone: '+971501234567', sector: 'تجارة', service: 'تحليل مالي', message: 'أحتاج تحليل مالي لسلسلة متاجرنا.', read: true, created_at: new Date(Date.now() - 86400000).toISOString() },
        ];
      }
    }

    async function fetchSentMessages() {
      try {
        const token = await getAdminToken();
        const res = await fetch('/api/admin?action=sent-messages', {
          headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data.success) throw new Error(data.error);
        return data.messages || [];
      } catch (e) {
        return [];
      }
    }

    function openWhatsApp(phone, name) {
      const digits = (phone || '').replace(/\D/g, '');
      if (!digits) { alert('لا يوجد رقم واتساب'); return; }
      const text = 'مرحباً ' + (name || '') + '، شكراً لتواصلك مع بوندز. نحن نراجع طلبك وسنرد عليك قريباً.';
      window.open('https://wa.me/' + digits + '?text=' + encodeURIComponent(text), '_blank');
    }

    async function toggleRead(id) {
      try {
        await fetch('/api/admin?action=messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (window.__ADMIN_TOKEN || '') },
          body: JSON.stringify({ action: 'mark_read', id })
        });
      } catch(e) {}
      refreshMessages();
    }

    async function deleteMessage(id) {
      if (!confirm('هل أنت متأكد من حذف هذه الرسالة؟')) return;
      try {
        await fetch('/api/admin?action=messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (window.__ADMIN_TOKEN || '') },
          body: JSON.stringify({ action: 'delete', id })
        });
      } catch(e) {}
      refreshMessages();
    }

    async function sendUserMessage() {
      const status = document.getElementById('composeStatus');
      const btn = document.getElementById('sendBtn');
      const recipient = document.getElementById('msgRecipient').value.trim();
      const subject = document.getElementById('msgSubject').value.trim();
      const body = document.getElementById('msgBody').value.trim();
      const sendEmail = document.getElementById('msgSendEmail').checked;
      if (!recipient || !subject || !body) {
        status.textContent = 'الرجاء تعبئة جميع الحقول';
        status.className = 'compose-status error';
        return;
      }
      status.textContent = 'جارِ الإرسال...';
      status.className = 'compose-status';
      btn.disabled = true;
      try {
        const token = await getAdminToken();
        const res = await fetch('/api/admin?action=messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ action: 'send', recipient, subject, body, send_email: sendEmail })
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'فشل الإرسال');
        status.textContent = 'تم إرسال الرسالة بنجاح' + (data.email_sent ? ' وإرسال نسخة بالبريد' : '');
        status.className = 'compose-status success';
        document.getElementById('composeForm').reset();
        setTimeout(() => showTab('sent'), 800);
      } catch (e) {
        status.textContent = 'خطأ: ' + (e.message || 'تعذر الإرسال');
        status.className = 'compose-status error';
      } finally {
        btn.disabled = false;
      }
    }

    function timeAgo(dateStr) {
      const d = new Date(dateStr);
      const now = new Date();
      const diff = Math.floor((now - d) / 60000);
      if (diff < 1) return 'الآن';
      if (diff < 60) return 'منذ ' + diff + ' دقيقة';
      const hrs = Math.floor(diff / 60);
      if (hrs < 24) return 'منذ ' + hrs + ' ساعة';
      const days = Math.floor(hrs / 24);
      return 'منذ ' + days + ' يوم';
    }

    async function renderMessages() {
      const msgs = await fetchMessages();
      const total = msgs.length;
      const unread = msgs.filter(m => !m.read).length;
      const today = msgs.filter(m => new Date(m.date || m.created_at).toDateString() === new Date().toDateString()).length;
      document.getElementById('totalMessages').textContent = total;
      document.getElementById('unreadMessages').textContent = unread;
      document.getElementById('todayMessages').textContent = today;
      const container = document.getElementById('messageList');
      if (msgs.length === 0) {
        container.innerHTML = '<div class="loading">لا توجد رسائل واردة</div>';
        return;
      }
      container.innerHTML = msgs.map(m => `
        <div class="message-card ${m.read ? '' : 'unread'}">
          <div class="message-header">
            <span class="message-sender">${m.name} ${m.read ? '' : '<span class="badge badge--new">جديد</span>'}</span>
            <span class="message-time">${timeAgo(m.created_at)}</span>
          </div>
          <div class="message-email">${m.email}${m.phone ? ' | ' + m.phone : ''}</div>
          <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:0.5rem;">${m.sector || ''} ${m.service ? '→ ' + m.service : ''}</div>
          <div class="message-body">${m.message}</div>
          <div class="message-actions">
            <button class="btn-sm ${m.read ? 'btn-secondary' : 'btn-primary'}" onclick="toggleRead('${m.id}')">${m.read ? 'تعيين غير مقروء' : 'تعيين مقروء'}</button>
            ${m.phone ? `<button class="btn-sm btn-whatsapp" onclick="openWhatsApp('${m.phone}', '${(m.name || '').replace(/'/g, "\\'")}')">واتساب</button>` : ''}
            <button class="btn-sm btn-danger" onclick="deleteMessage('${m.id}')">حذف</button>
          </div>
        </div>
      `).join('');
      const badge = document.getElementById('msgBadge');
      if (badge) { badge.textContent = unread; badge.style.display = unread > 0 ? 'inline-block' : 'none'; }
    }

    async function renderSentMessages() {
      const container = document.getElementById('sentList');
      container.innerHTML = '<div class="loading">جارِ التحميل...</div>';
      const msgs = await fetchSentMessages();
      if (msgs.length === 0) {
        container.innerHTML = '<div class="loading">لا توجد رسائل مرسلة</div>';
        return;
      }
      container.innerHTML = msgs.map(m => `
        <div class="message-card">
          <div class="message-header">
            <span class="message-sender">إلى: ${m.recipient_name || m.recipient_email || m.user_id}</span>
            <span class="message-time">${timeAgo(m.created_at)}</span>
          </div>
          <div class="message-email">${m.recipient_email || ''} ${m.email_sent ? '<span class="badge badge--email">تم الإرسال بالبريد</span>' : ''}</div>
          <div class="message-subject">${m.subject}</div>
          <div class="message-body">${m.body}</div>
        </div>
      `).join('');
    }

    function refreshMessages() {
      const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab || 'inbox';
      if (activeTab === 'inbox') {
        document.getElementById('messageList').innerHTML = '<div class="loading">جارِ التحديث...</div>';
        setTimeout(renderMessages, 300);
      } else if (activeTab === 'sent') {
        document.getElementById('sentList').innerHTML = '<div class="loading">جارِ التحديث...</div>';
        setTimeout(renderSentMessages, 300);
      }
    }

    window.addEventListener('load', renderMessages);
  </script>
  <script src="/admin/admin-embed.js"></script>
</body>
</html>
