  <style>

    body { background: var(--bg); color: var(--text); font-family: 'Vazirmatn', sans-serif; min-height: 100vh; }

    .admin-layout { display: flex; min-height: 100vh; }

    .admin-sidebar { width: 260px; background: var(--surface); border-left: 1px solid var(--border); padding: 2rem 1rem; position: fixed; inset: 0 auto 0 0; overflow-y: auto; }

    .admin-sidebar a { display: block; padding: 0.75rem 1rem; border-radius: 8px; color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; margin-bottom: 0.25rem; transition: all 0.2s; }

    .admin-sidebar a:hover, .admin-sidebar a.active { background: rgba(212,168,83,0.1); color: var(--gold); }

    .admin-main { flex: 1; margin-right: 260px; padding: 2rem; }

    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }

    .admin-header h1 { font-size: 1.5rem; font-weight: 800; color: var(--gold); }

    .card { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1.5rem; }

    .card h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 1rem; color: var(--text); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }

    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.4rem; }

    .form-group input, .form-group select { width: 100%; padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid var(--border-light); background: rgba(255,255,255,0.03); color: var(--text); font-size: 0.9rem; }

    .btn-add { background: var(--gold); color: var(--bg); border: none; padding: 0.75rem 2rem; border-radius: 10px; font-weight: 800; cursor: pointer; }

    .data-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }

    .data-table th { text-align: right; padding: 1rem; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; border-bottom: 1px solid var(--border); }

    .data-table td { padding: 1rem; font-size: 0.9rem; border-bottom: 1px solid var(--border); }

    .btn-del { background: transparent; color: #ef4444; border: 1px solid rgba(239,68,68,0.3); padding: 0.3rem 0.7rem; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }

    .empty { text-align: center; padding: 3rem; color: var(--text-secondary); }

    @media (max-width: 768px) { .admin-sidebar { display: none; } .admin-main { margin-right: 0; } .form-row { grid-template-columns: 1fr; } }

  </style>

      <div class="admin-header">

        <h1>⭐ استثناءات العملاء</h1>

        <div id="adminInfo" style="font-size: 0.85rem; color: var(--text-secondary);"></div>

      </div>

      <div class="card">

        <h3><span class="emoji-icon" style="display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;" aria-hidden="true"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#31373D" d="M31 15H21V5c0-1.657-1.343-3-3-3s-3 1.343-3 3v10H5c-1.657 0-3 1.343-3 3s1.343 3 3 3h10v10c0 1.657 1.343 3 3 3s3-1.343 3-3V21h10c1.657 0 3-1.343 3-3s-1.343-3-3-3z"/></svg></span> إضافة استثناء</h3>

        <div class="form-row">

          <div class="form-group">

            <label>معرف المستخدم (UUID)</label>

            <input type="text" id="excUserId" placeholder="uuid من صفحة المستخدمين">

          </div>

          <div class="form-group">

            <label>الحاسبة</label>

            <select data-universal-dropdown="true" id="excCalc" data-ud-sort="true" data-ud-deduplicate="true" data-ud-remove-empty="true">
              <option value="all">جميع الحاسبات</option>
            </select>

          </div>

          <div class="form-group">

            <label>الحد الجديد</label>

            <input type="number" id="excLimit" value="9999" min="0">

          </div>

        </div>

        <div class="form-row">

          <div class="form-group">

            <label>تاريخ الانتهاء (اختياري)</label>

            <input type="datetime-local" id="excExpires" style="width:100%;">

          </div>

          <div class="form-group" style="grid-column: span 2;">

            <label>السبب</label>

            <input type="text" id="excReason" placeholder="مثال: عميل VIP, عرض ترويجي..." style="width:100%;">

          </div>

        </div>

        <button class="btn-add" onclick="addException()"><span class="emoji-icon" style="display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;" aria-hidden="true"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#31373D" d="M31 15H21V5c0-1.657-1.343-3-3-3s-3 1.343-3 3v10H5c-1.657 0-3 1.343-3 3s1.343 3 3 3h10v10c0 1.657 1.343 3 3 3s3-1.343 3-3V21h10c1.657 0 3-1.343 3-3s-1.343-3-3-3z"/></svg></span> إضافة استثناء</button>

        <div id="addMsg"></div>

      </div>

      <div class="card">

        <h3><span class="emoji-icon" style="display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;" aria-hidden="true"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#C1694F" d="M32 34c0 1.104-.896 2-2 2H6c-1.104 0-2-.896-2-2V7c0-1.104.896-2 2-2h24c1.104 0 2 .896 2 2v27z"/><path fill="#FFF" d="M29 32c0 .553-.447 1-1 1H8c-.552 0-1-.447-1-1V9c0-.552.448-1 1-1h20c.553 0 1 .448 1 1v23z"/><path fill="#CCD6DD" d="M25 3h-4c0-1.657-1.343-3-3-3s-3 1.343-3 3h-4c-1.104 0-2 .896-2 2v5h18V5c0-1.104-.896-2-2-2z"/><circle fill="#292F33" cx="18" cy="3" r="2"/><path fill="#99AAB5" d="M20 14c0 .552-.447 1-1 1h-9c-.552 0-1-.448-1-1s.448-1 1-1h9c.553 0 1 .448 1 1zm7 4c0 .552-.447 1-1 1H10c-.552 0-1-.448-1-1s.448-1 1-1h16c.553 0 1 .448 1 1zm0 4c0 .553-.447 1-1 1H10c-.552 0-1-.447-1-1 0-.553.448-1 1-1h16c.553 0 1 .447 1 1zm0 4c0 .553-.447 1-1 1H10c-.552 0-1-.447-1-1 0-.553.448-1 1-1h16c.553 0 1 .447 1 1zm0 4c0 .553-.447 1-1 1h-9c-.552 0-1-.447-1-1 0-.553.448-1 1-1h9c.553 0 1 .447 1 1z"/></svg></span> الاستثناءات الحالية</h3>

        <div id="loading" style="text-align:center;padding:2rem;">جاري التحميل...</div>

        <div id="tableWrap" style="display:none;">

          <table class="data-table">

            <thead>

              <tr><th>المستخدم</th><th>الحاسبة</th><th>الحد</th><th>السبب</th><th>الانتهاء</th><th>التاريخ</th><th>حذف</th></tr>

            </thead>

            <tbody id="excBody"></tbody>

          </table>

        </div>

        <div id="emptyState" class="empty" style="display:none;">لا توجد استثناءات</div>

      </div>

    </main>

  </div>

  <script>

    let token = '';

    async function init() {

      const { data: userData } = await window.BondsAuth?.getUser?.() || {};

      const user = userData?.user;

      if (!user) {

        document.getElementById('loading').textContent = 'يجب تسجيل الدخول للوصول إلى لوحة التحكم';

        return;

      }

      const sessionRes = await window.BondsAuth?.getSession?.() || {};
      token = sessionRes.data?.session?.access_token || '';

      document.getElementById('adminInfo').textContent = user.email;

      await loadCalculatorOptions();
      loadExceptions();

    }

    async function loadExceptions() {

      try {

        const res = await fetch('/api/admin?action=exceptions', { headers: { 'Authorization': 'Bearer ' + token } });

        const json = await res.json();

        document.getElementById('loading').style.display = 'none';

        if (!json.data?.length) {

          document.getElementById('emptyState').style.display = 'block';

          return;

        }

        const tbody = document.getElementById('excBody');

        tbody.innerHTML = json.data.map(e => {

          const date = new Date(e.created_at).toLocaleDateString('ar-SA');

          const user = e.profiles?.restaurant_name || e.profiles?.email || e.user_id.substring(0,8);

          let expiry = 'بدون انتهاء';

          if (e.expires_at) {

            const d = new Date(e.expires_at);

            const isExpired = d < new Date();

            expiry = `<span style="color:${isExpired ? '#ef4444' : 'var(--gold)'};">${d.toLocaleString('ar-SA')}${isExpired ? ' (منتهي)' : ''}</span>`;

          }

          return `<tr>

            <td>${user}</td>

            <td>${e.calculator === 'all' ? 'الكل' : e.calculator}</td>

            <td style="color:var(--gold);font-weight:800;">${e.limit_override}</td>

            <td>${e.reason || '-'}</td>

            <td>${expiry}</td>

            <td>${date}</td>

            <td><button class="btn-del" onclick="deleteExc('${e.id}')">🗑 حذف</button></td>

          </tr>`;

        }).join('');

        document.getElementById('tableWrap').style.display = 'block';

      } catch (e) { document.getElementById('loading').textContent = 'خطأ في التحميل'; }

    }

    async function loadCalculatorOptions() {
      try {
        const res = await fetch('calculator-status.json');
        if (!res.ok) return;
        const data = await res.json();
        const select = document.getElementById('excCalc');
        data.calculators.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.name;
          opt.textContent = c.name;
          select.appendChild(opt);
        });
        if (window.initUniversalDropdowns) window.initUniversalDropdowns(select.parentElement);
      } catch (e) { console.warn('[Exceptions] failed to load calculator options:', e); }
    }

    async function addException() {

      const btn = document.querySelector('.btn-add');

      btn.disabled = true; btn.textContent = 'جاري الإضافة...';

      try {

        const res = await fetch('/api/admin?action=exceptions', {

          method: 'POST',

          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },

          body: JSON.stringify({

            user_id: document.getElementById('excUserId').value.trim(),

            calculator: document.getElementById('excCalc').value,

            limit_override: parseInt(document.getElementById('excLimit').value),

            reason: document.getElementById('excReason').value,

            expires_at: document.getElementById('excExpires').value || null,

          }),

        });

        if (res.ok) {

          document.getElementById('addMsg').textContent = '✅ تم الإضافة';

          setTimeout(() => { document.getElementById('addMsg').textContent = ''; location.reload(); }, 1000);

        } else throw new Error('Failed');

      } catch (e) {

        document.getElementById('addMsg').textContent = '❌ فشل الإضافة — تأكد من UUID';

      } finally {

        btn.disabled = false; btn.textContent = '➕ إضافة استثناء';

      }

    }

    async function deleteExc(id) {

      if (!confirm('حذف هذا الاستثناء؟')) return;

      try {

        const res = await fetch('/api/admin?action=exceptions&id=' + id, {

          method: 'DELETE',

          headers: { 'Authorization': 'Bearer ' + token },

        });

        if (res.ok) location.reload();

      } catch (e) { alert('فشل الحذف'); }

    }

    init();

  </script>

  <script defer src="../page-tracker-v2.js"></script>

  <script src="/admin/admin-embed.js?v=4"></script>

<script src="../components/universal-dropdown.js?v=2.51.8"></script>

<script src="../components/universal-dropdown-init.js"></script>

<script src="/components/emoji-icons.js" defer></script>
<script src="/components/emoji-renderer.js" defer></script>
</body>

</html>
