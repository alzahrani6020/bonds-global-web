  <style>

    body { background: var(--bg); color: var(--text); font-family: 'Vazirmatn', sans-serif; min-height: 100vh; }

    .admin-layout { display: flex; min-height: 100vh; }

    .admin-sidebar { width: 260px; background: var(--surface); border-left: 1px solid var(--border); padding: 2rem 1rem; position: fixed; inset: 0 auto 0 0; overflow-y: auto; }

    .admin-sidebar a { display: block; padding: 0.75rem 1rem; border-radius: 8px; color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; margin-bottom: 0.25rem; transition: all 0.2s; }

    .admin-sidebar a:hover, .admin-sidebar a.active { background: rgba(212,168,83,0.1); color: var(--gold); }

    .admin-main { flex: 1; margin-right: 260px; padding: 2rem; }

    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }

    .admin-header h1 { font-size: 1.5rem; font-weight: 800; color: var(--gold); }

    .card { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1.5rem; }

    .card h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 1rem; color: var(--text); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }

    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.4rem; }

    .form-group input, .form-group select { width: 100%; padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid var(--border-light); background: rgba(255,255,255,0.03); color: var(--text); font-size: 0.9rem; }

    .btn-add { background: var(--gold); color: var(--bg); border: none; padding: 0.75rem 2rem; border-radius: 10px; font-weight: 800; cursor: pointer; }

    .data-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }

    .data-table th { text-align: right; padding: 1rem; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; border-bottom: 1px solid var(--border); }

    .data-table td { padding: 1rem; font-size: 0.9rem; border-bottom: 1px solid var(--border); }

    .btn-del { background: transparent; color: #ef4444; border: 1px solid rgba(239,68,68,0.3); padding: 0.3rem 0.7rem; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }

    .empty { text-align: center; padding: 3rem; color: var(--text-secondary); }

    @media (max-width: 768px) { .admin-sidebar { display: none; } .admin-main { margin-right: 0; } .form-row { grid-template-columns: 1fr; } }

  </style>

<link rel="stylesheet" href="../components/universal-dropdown.css?v=2.51.8" />

</head>

<body>

      <div style="padding: 0 1rem 1.5rem;"><img src="../assets/bonds-logo-2026-sm.webp?v=2026" alt="Bonds" style="height: 32px;"></div>

      <a href="dashboard.html"><svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg> لوحة التحكم</a>

      <a href="users.html"><svg class="bonds-icon bonds-icon--users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> المستخدمين</a>

      <a href="subscriptions.html"><svg class="bonds-icon bonds-icon--credit-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg> الاشتراكات</a>

      <a href="bank-transfers.html"><svg class="bonds-icon bonds-icon--bank" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L2 11h20L12 2z"></path><rect x="3" y="11" width="18" height="10" rx="2"></rect><line x1="12" y1="11" x2="12" y2="21"></line></svg> التحويلات البنكية</a>

      <a href="exceptions.html" class="active"><svg class="bonds-icon bonds-icon--star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg> استثناءات العملاء</a>

      <a href="settings.html"><svg class="bonds-icon bonds-icon--settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> الإعدادات</a>

      <a href="analytics.html"><svg class="bonds-icon bonds-icon--trend-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg> الإحصائيات</a>

      <a href="roles.html"><svg class="bonds-icon bonds-icon--lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path><circle cx="12" cy="16" r="1"></circle><path d="M12 16v3"></path></svg> الأدوار</a>

      <a href="../index.html" style="margin-top: 2rem; color: #ef4444;"><svg class="bonds-icon bonds-icon--door" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 20V6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v14"></path><path d="M2 20h20"></path><path d="M14 12v.01"></path></svg> خروج</a>

    <main class="admin-main">

      <div class="admin-header">

        <h1><svg class="bonds-icon bonds-icon--star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg> استثناءات العملاء</h1>

        <div id="adminInfo" style="font-size: 0.85rem; color: var(--text-secondary);"></div>

      </div>

      <div class="card">

        <h3><svg class="bonds-icon bonds-icon--plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> إضافة استثناء</h3>

        <div class="form-row">

          <div class="form-group">

            <label>معرف المستخدم (UUID)</label>

            <input type="text" id="excUserId" placeholder="uuid من صفحة المستخدمين">

          </div>

          <div class="form-group">

            <label>الحاسبة</label>

            <select data-universal-dropdown="true" id="excCalc" data-ud-sort="true" data-ud-deduplicate="true" data-ud-remove-empty="true">

              <option value="all">جميع الحاسبات</option>

              <option value="cash-flow">Cash Flow</option>

              <option value="feasibility">دراسة الجدوى</option>

              <option value="break-even">نقطة التعادل</option>

              <option value="restaurant">مطعم</option>

              <option value="menu-engineering">هندسة المنيو</option>

              <option value="dish-margin">هامش الطبق</option>

              <option value="loan">القروض</option>

              <option value="pricing">التسعير</option>

            </select>

          </div>

          <div class="form-group">

            <label>الحد الجديد</label>

            <input type="number" id="excLimit" value="9999" min="0">

          </div>

        </div>

        <div class="form-row">

          <div class="form-group">

            <label>تاريخ الانتهاء (اختياري)</label>

            <input type="datetime-local" id="excExpires" style="width:100%;">

          </div>

          <div class="form-group" style="grid-column: span 2;">

            <label>السبب</label>

            <input type="text" id="excReason" placeholder="مثال: عميل VIP, عرض ترويجي..." style="width:100%;">

          </div>

        </div>

        <button class="btn-add" onclick="addException()"><svg class="bonds-icon bonds-icon--plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> إضافة استثناء</button>

        <div id="addMsg"></div>

      </div>

      <div class="card">

        <h3><svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg> الاستثناءات الحالية</h3>

        <div id="loading" style="text-align:center;padding:2rem;">جاري التحميل...</div>

        <div id="tableWrap" style="display:none;">

          <table class="data-table">

            <thead>

              <tr><th>المستخدم</th><th>الحاسبة</th><th>الحد</th><th>السبب</th><th>الانتهاء</th><th>التاريخ</th><th>حذف</th></tr>

            </thead>

            <tbody id="excBody"></tbody>

          </table>

        </div>

        <div id="emptyState" class="empty" style="display:none;">لا توجد استثناءات</div>

      </div>

    </main>

  </div>

  <script>

    let token = '';

    async function init() {

      const { data: userData } = await window.BondsAuth?.getUser?.() || {};

      const user = userData?.user;

      if (!user) {

        document.getElementById('loading').textContent = 'يجب تسجيل الدخول للوصول إلى لوحة التحكم';

        return;

      }

      token = userData.session?.access_token || '';

      document.getElementById('adminInfo').textContent = user.email;

      loadExceptions();

    }

    async function loadExceptions() {

      try {

        const res = await fetch('/api/admin?action=exceptions', { headers: { 'Authorization': 'Bearer ' + token } });

        const json = await res.json();

        document.getElementById('loading').style.display = 'none';

        if (!json.data?.length) {

          document.getElementById('emptyState').style.display = 'block';

          return;

        }

        const tbody = document.getElementById('excBody');

        tbody.innerHTML = json.data.map(e => {

          const date = new Date(e.created_at).toLocaleDateString('ar-SA');

          const user = e.profiles?.restaurant_name || e.profiles?.email || e.user_id.substring(0,8);

          let expiry = 'بدون انتهاء';

          if (e.expires_at) {

            const d = new Date(e.expires_at);

            const isExpired = d < new Date();

            expiry = `<span style="color:${isExpired ? '#ef4444' : 'var(--gold)'};">${d.toLocaleString('ar-SA')}${isExpired ? ' (منتهي)' : ''}</span>`;

          }

          return `<tr>

            <td>${user}</td>

            <td>${e.calculator === 'all' ? 'الكل' : e.calculator}</td>

            <td style="color:var(--gold);font-weight:800;">${e.limit_override}</td>

            <td>${e.reason || '-'}</td>

            <td>${expiry}</td>

            <td>${date}</td>

            <td><button class="btn-del" onclick="deleteExc('${e.id}')"><svg class="bonds-icon bonds-icon--trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg> حذف</button></td>

          </tr>`;

        }).join('');

        document.getElementById('tableWrap').style.display = 'block';

      } catch (e) { document.getElementById('loading').textContent = 'خطأ في التحميل'; }

    }

    async function addException() {

      const btn = document.querySelector('.btn-add');

      btn.disabled = true; btn.textContent = 'جاري الإضافة...';

      try {

        const res = await fetch('/api/admin?action=exceptions', {

          method: 'POST',

          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },

          body: JSON.stringify({

            user_id: document.getElementById('excUserId').value.trim(),

            calculator: document.getElementById('excCalc').value,

            limit_override: parseInt(document.getElementById('excLimit').value),

            reason: document.getElementById('excReason').value,

            expires_at: document.getElementById('excExpires').value || null,

          }),

        });

        if (res.ok) {

          document.getElementById('addMsg').textContent = '<svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg> تم الإضافة';

          setTimeout(() => { document.getElementById('addMsg').textContent = ''; location.reload(); }, 1000);

        } else throw new Error('Failed');

      } catch (e) {

        document.getElementById('addMsg').textContent = '<svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg> فشل الإضافة — تأكد من UUID';

      } finally {

        btn.disabled = false; btn.textContent = '<svg class="bonds-icon bonds-icon--plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> إضافة استثناء';

      }

    }

    async function deleteExc(id) {

      if (!confirm('حذف هذا الاستثناء؟')) return;

      try {

        const res = await fetch('/api/admin?action=exceptions&id=' + id, {

          method: 'DELETE',

          headers: { 'Authorization': 'Bearer ' + token },

        });

        if (res.ok) location.reload();

      } catch (e) { alert('فشل الحذف'); }

    }

    init();

  </script>
