  <script>
    (function() {
      if (typeof DOMPurify === 'undefined' || !window.Element) return;
      const descriptor = Object.getOwnPropertyDescriptor(window.Element.prototype, 'innerHTML');
      if (!descriptor || typeof descriptor.set !== 'function') return;
      const originalSet = descriptor.set;
      descriptor.set = function(html) {
        if (typeof html === 'string') {
          html = DOMPurify.sanitize(html, { ADD_ATTR: ['onclick','onsubmit','onchange','oninput'], KEEP_CONTENT: true });
        }
        return originalSet.call(this, html);
      };
      Object.defineProperty(window.Element.prototype, 'innerHTML', descriptor);
    })();
  </script>
