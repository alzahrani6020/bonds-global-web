<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تغيير كلمة المرور — بوندز</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background: #0a0f1a; color: #e8ecf4; font-family: 'Vazirmatn', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: rgba(16,24,45,0.8); border: 1px solid rgba(197,160,40,0.2); border-radius: 20px; padding: 2.5rem; max-width: 420px; width: 90%; text-align: center; }
    h2 { color: #d4a853; margin-bottom: 0.5rem; }
    p { color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.95rem; }
    input { width: 100%; padding: 1rem; border-radius: 12px; border: 1px solid rgba(197,160,40,0.2); background: rgba(255,255,255,0.03); color: #e8ecf4; font-size: 1rem; box-sizing: border-box; margin-bottom: 1rem; }
    button { width: 100%; padding: 1rem; border-radius: 12px; border: none; background: linear-gradient(135deg, #d4a853, #c8a45c); color: #0a0f1a; font-weight: 800; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 1rem; padding: 1rem; border-radius: 10px; font-size: 0.9rem; }
    .msg.error { background: rgba(239,68,68,0.15); color: #ff8a8a; }
    .msg.success { background: rgba(34,197,94,0.15); color: #22c55e; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:3rem;margin-bottom:0.5rem;">🔐</div>
    <h2>تغيير كلمة المرور</h2>
    <p>اضغط الزر لتغيير كلمة المرور مباشرة</p>
    <input type="email" id="email" value="iiffund.dev@gmail.com" readonly>
    <input type="password" id="password" value="Talal*6020">
    <button id="btn" onclick="changePassword()">تغيير كلمة المرور</button>
    <div id="result"></div>
  </div>

  <script>
    async function changePassword() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn');
      const result = document.getElementById('result');
      
      btn.disabled = true;
      btn.textContent = 'جاري التغيير...';
      result.innerHTML = '';

      try {
        const res = await fetch('/api/force-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          result.innerHTML = `<div class="msg success">✅ ${data.message}<br><a href="https://bonds-global.com/calculators/auth/index.html?redirect=https://bonds-global.com/admin/analytics.html" style="color:#22c55e;font-weight:800;">اضغط هنا لتسجيل الدخول</a></div>`;
        } else {
          result.innerHTML = `<div class="msg error">❌ ${data.error}</div>`;
        }
      } catch (e) {
        result.innerHTML = `<div class="msg error">❌ خطأ في الاتصال</div>`;
      }

      btn.disabled = false;
      btn.textContent = 'تغيير كلمة المرور';
    }
  </script>
  <script src="../page-tracker-v2.js"></script>
</body>
</html>
