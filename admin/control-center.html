<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Control Center — Bonds Global</title><link rel="stylesheet" href="/admin/admin-shared-ux.css"><style>
body{margin:0;background:#f6f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1650px;margin:auto;padding:1rem}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1rem}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:1rem}.s12{grid-column:span 12}.s6{grid-column:span 6}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:.65rem}.kpi{border:1px solid #e2e8f0;border-radius:12px;padding:.7rem}.kpi b{display:block;font-size:1.15rem}table{width:100%;border-collapse:collapse;font-size:.8rem}th,td{padding:.5rem;border-bottom:1px solid #e2e8f0;text-align:right}.scroll{overflow:auto;max-height:390px}.muted{color:#475569}.btn{border:0;border-radius:9px;padding:.6rem .9rem;font-weight:700;cursor:pointer;background:#172033;color:#fff}.btn2{background:#eef2f7;color:#172033}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:9px;padding:.65rem;margin:.3rem 0 .7rem}.forms{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.status{display:none;background:#fee2e2;color:#991b1b;padding:.7rem;border-radius:9px}@media(max-width:900px){.s6{grid-column:span 12}.forms{grid-template-columns:1fr}}</style></head><body><main>
<div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap"><div><h1 style="margin:0">Admin Control Center</h1><div class="muted">Tasks · Approvals · SLA · Security Exceptions · Sessions · Config Drift</div></div><button class="btn" onclick="loadAll()">تحديث</button></div><div id="status" class="status"></div>
<div class="grid" style="margin-top:1rem"><section class="card s12"><div id="kpis" class="kpis"></div></section>
<section class="card s6"><h2>Operations Queue</h2><div class="scroll"><table><thead><tr><th>النوع</th><th>العنوان</th><th>الحالة/الشدة</th><th>المرجع</th></tr></thead><tbody id="queueRows"></tbody></table></div></section>
<section class="card s6"><h2>SLA Breaches</h2><div id="sla"></div></section>
<section class="card s6"><h2>Admin Sessions / Devices</h2><div id="sessions"></div></section>
<section class="card s6"><h2>Configuration Drift</h2><div id="drift"></div></section>
<section class="card s12"><h2>Security Controls</h2><div class="forms">
<form onsubmit="revokeSession(event)"><h3>Revoke Session</h3><input id="revokeUser" placeholder="User UUID"><input id="revokeSessionId" placeholder="Session ID"><input id="revokeReason" required placeholder="Reason"><button class="btn">إبطال</button></form>
<form onsubmit="savePolicy(event)"><h3>Access Policy</h3><input id="policyName" required placeholder="Policy name"><select id="policyEnabled" aria-label="Policy enabled status"><option value="false">Disabled</option><option value="true">Enabled</option></select><input id="policyCountries" placeholder="Allowed countries: SA,AE"><input id="policyDeniedCountries" placeholder="Denied countries"><input id="policyIPs" placeholder="Allowed IPs comma separated"><label><input id="trustedOnly" type="checkbox" style="width:auto"> Require trusted device</label><input id="maxSession" type="number" min="5" max="10080" placeholder="Max session minutes"><button class="btn">حفظ السياسة</button></form>
<form onsubmit="trustDevice(event)"><h3>Trust Device</h3><input id="deviceUser" required placeholder="User UUID"><input id="deviceFingerprint" required placeholder="Device fingerprint"><input id="deviceLabel" placeholder="Label"><input id="deviceUntil" type="datetime-local" aria-label="Trusted device expiry"><button class="btn">اعتماد الجهاز</button></form>
<form onsubmit="createCollection(event)"><h3>Collection</h3><input id="collectionUser" placeholder="User UUID"><input id="collectionAmount" type="number" step="0.01" placeholder="Amount due"><input id="collectionDue" type="date" required aria-label="Collection due date"><input id="collectionAction" placeholder="Next action"><button class="btn">إنشاء Collection</button></form>
<form onsubmit="createContract(event)"><h3>Contract</h3><input id="contractTitle" required placeholder="Title"><input id="contractOrg" placeholder="Organization UUID"><input id="contractValue" type="number" step="0.01" placeholder="Value"><input id="contractEnd" type="date" aria-label="Contract end date"><button class="btn">إنشاء Contract</button></form>
<form onsubmit="createRenewal(event)"><h3>Renewal</h3><input id="renewalOrg" placeholder="Organization UUID"><input id="renewalDate" type="date" required aria-label="Renewal date"><input id="renewalValue" type="number" step="0.01" placeholder="Value"><select id="renewalRisk" aria-label="Renewal risk level"><option>low</option><option>medium</option><option>high</option><option>critical</option></select><button class="btn">إنشاء Renewal</button></form>
</div></section></div></main>
<script src="/supabase-client.js"></script><script src="/bonds-auth-2026.js?v=3.1.3"></script><script src="/admin/admin-common.js"></script><script>
let control=null,sec=null,driftState=null;const esc=v=>BondsAdminCommon.escapeHtml(v==null?'':String(v));function err(m){const e=document.getElementById('status');e.textContent=m;e.style.display=m?'block':'none'}async function api(url,o={}){const r=await window.BondsAuth.authenticatedFetch(url,{...o,returnTo:location.pathname+location.search});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.error||('HTTP '+r.status));return d}
async function post(action,body){return api('/api/admin?action='+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
function render(){const taskCount=(control.tasks||[]).length,approvalCount=(control.approvals||[]).length,alertCount=(control.alerts||[]).length,recon=(control.paymentExceptions||[]).length,security=(control.securityExceptions||[]).length,breaches=(control.slaBreaches?.funding||[]).length+(control.slaBreaches?.support||[]).length;
kpis.innerHTML=[['Open Tasks',taskCount],['Approvals',approvalCount],['Alerts',alertCount],['Payment Exceptions',recon],['Security Exceptions',security],['SLA Breaches',breaches],['Live Sessions',(sec.sessions||[]).filter(x=>x.is_online).length],['Config Drift',driftState.count||0]].map(x=>'<div class="kpi"><b>'+esc(x[1])+'</b><span class="muted">'+esc(x[0])+'</span></div>').join('');
const rows=[];(control.tasks||[]).forEach(x=>rows.push(['Task',x.title,x.status,x.request_id||x.entity_id||'—']));(control.approvals||[]).forEach(x=>rows.push(['Approval',x.action_type,x.status,x.target_id||'—']));(control.alerts||[]).forEach(x=>rows.push(['Alert',x.title,x.severity,x.request_id||x.entity_id||'—']));(control.paymentExceptions||[]).forEach(x=>rows.push(['Payment',x.source_type+'/'+x.source_id,x.status,x.id]));(control.securityExceptions||[]).forEach(x=>rows.push(['Security',x.event_type,x.severity,x.request_id||x.id]));
queueRows.innerHTML=rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>').join('')||'<tr><td colspan=4>لا توجد عناصر</td></tr>';
sla.innerHTML='<div><b>Funding:</b> '+(control.slaBreaches?.funding||[]).length+'</div><div><b>Support:</b> '+(control.slaBreaches?.support||[]).length+'</div>';
sessions.innerHTML='<div>Sessions: '+(sec.sessions||[]).length+'</div><div>Trusted devices: '+(sec.trustedDevices||[]).length+'</div><div>Policies: '+(sec.policies||[]).length+'</div><div>Revocations: '+(sec.revokedSessions||[]).length+'</div>';
drift.innerHTML=(driftState.drift||[]).length?(driftState.drift||[]).map(x=>'<div><b>'+esc(x.key)+'</b> · '+esc(Object.keys(x.environments||{}).join(', '))+'</div>').join(''):'<span class=muted>لا يوجد drift مثبت بين snapshots الحالية</span>';
}
async function loadAll(){err('');try{[control,sec,driftState]=await Promise.all([api('/api/admin?action=control-center-overview'),api('/api/admin?action=security-sessions-overview'),api('/api/admin?action=config-drift')]);render()}catch(e){err('فشل التحميل: '+e.message)}}
async function revokeSession(ev){ev.preventDefault();try{await post(['admin','session-revoke'].join('-'),{user_id:revokeUser.value.trim()||null,session_id:revokeSessionId.value.trim()||null,reason:revokeReason.value.trim()});ev.target.reset();await loadAll()}catch(e){err(e.message)}}
async function savePolicy(ev){ev.preventDefault();try{const split=v=>v.split(',').map(x=>x.trim()).filter(Boolean);await post('admin-access-policy-upsert',{name:policyName.value.trim(),enabled:policyEnabled.value==='true',allowed_countries:split(policyCountries.value).map(x=>x.toUpperCase()),denied_countries:split(policyDeniedCountries.value).map(x=>x.toUpperCase()),allowed_ips:split(policyIPs.value),require_trusted_device:trustedOnly.checked,max_session_minutes:maxSession.value?Number(maxSession.value):null});ev.target.reset();await loadAll()}catch(e){err(e.message)}}
async function trustDevice(ev){ev.preventDefault();try{await post('admin-device-trust',{user_id:deviceUser.value.trim(),device_fingerprint:deviceFingerprint.value.trim(),label:deviceLabel.value,trusted_until:deviceUntil.value?new Date(deviceUntil.value).toISOString():null});ev.target.reset();await loadAll()}catch(e){err(e.message)}}
async function createCollection(ev){ev.preventDefault();try{await post('finance-collection-create',{user_id:collectionUser.value.trim()||null,amount_due:Number(collectionAmount.value||0),due_date:collectionDue.value,next_action:collectionAction.value||null});ev.target.reset();await loadAll()}catch(e){err(e.message)}}
async function createContract(ev){ev.preventDefault();try{await post('finance-contract-create',{title:contractTitle.value.trim(),organization_id:contractOrg.value.trim()||null,value_amount:Number(contractValue.value||0),end_date:contractEnd.value||null});ev.target.reset();await loadAll()}catch(e){err(e.message)}}
async function createRenewal(ev){ev.preventDefault();try{await post('crm-renewal-create',{organization_id:renewalOrg.value.trim()||null,renewal_date:renewalDate.value,value_amount:Number(renewalValue.value||0),risk_level:renewalRisk.value});ev.target.reset();await loadAll()}catch(e){err(e.message)}}
if(window.__ADMIN_ROLE)loadAll();else window.addEventListener('admin-auth-ready',loadAll,{once:true});
</script></body></html>
