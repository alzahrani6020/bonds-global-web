<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إدارة التواصل الاجتماعي | بوندز</title>
  <meta name="description" content="إدارة حسابات بوندز على Instagram و YouTube و X" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="/assets/bonds-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/styles/design-system.css?v=1" />
  <link rel="stylesheet" href="/admin/social-media/styles.css?v=1" />
  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3.0.7"></script>
  <script src="/supabase-client.js"></script>
  <script src="/admin/admin-common.js?v=4"></script>
  <script src="/admin/social-media/service.js?v=1"></script>
  <script src="/admin/social-media/app.js?v=1"></script>
</head>
<body>
  <div class="sm-layout">
    <aside class="sm-sidebar">
      <div class="sm-brand">
        <img src="/assets/bonds-logo-2026-header.webp" alt="بوندز" />
        <span>التواصل الاجتماعي</span>
      </div>
      <ul class="sm-nav">
        <li><a href="#" data-view="accounts" class="active">⚙️ حالة الربط</a></li>
        <li><a href="#" data-view="feed">📰 معاينة الـ Feed</a></li>
        <li><a href="#" data-view="compose">✍️ إنشاء منشور</a></li>
        <li><a href="#" data-view="scheduled">📅 المجدولة</a></li>
      </ul>
      <div class="sm-sidebar-footer">
        <a href="/admin/dashboard.html" style="color:var(--text-secondary);text-decoration:none;font-weight:600;font-size:0.85rem;">⬅️ لوحة الإدارة الرئيسية</a>
      </div>
    </aside>

    <main class="sm-main">
      <div class="sm-topbar">
        <div>
          <h1>إدارة التواصل الاجتماعي</h1>
          <p>ربط ونشر ومراقبة حسابات بوندز على Instagram و YouTube و X</p>
        </div>
      </div>
      <div id="sm-content">
        <div class="sm-empty"><div class="sm-spinner"></div><p>جارِ التحميل...</p></div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      const el = document.getElementById('sm-content');
      function status(msg) { if (el) el.innerHTML = '<div class="sm-empty"><p>' + msg + '</p></div>'; }
      window.addEventListener('error', function (e) { status('❌ خطأ JavaScript: ' + e.message); });
      window.addEventListener('unhandledrejection', function (e) { status('❌ خطأ غير متوقع: ' + (e.reason?.message || e.reason)); });
    })();
  </script>
  <script src="/calculators/auth-gate.js?v=3"></script>
  <script src="/admin/admin-embed.js?v=4"></script>
  <script src="/admin/admin-accessibility.js"></script>
  <script src="/admin/admin-sidebar-icons.js"></script>
  <script src="/components/emoji-icons.js"></script>
  <script src="/components/emoji-renderer.js"></script>
  <script>
    if (window.SocialMediaApp) window.SocialMediaApp.init();
  </script>
</body>
</html>
