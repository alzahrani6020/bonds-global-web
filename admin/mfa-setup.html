<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إعداد MFA | لوحة التحكم | بوندز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="../assets/bonds-mark.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #f5f0e8; --bg-secondary: #ffffff; --bg-card: rgba(255,255,255,0.9);
      --gold: #b8954e; --gold-bright: #d4b87a; --gold-dim: #8a7340;
      --text: #1a1a1a; --text-secondary: #555555; --text-muted: #888888;
      --border: rgba(0,0,0,0.08); --success: #22c55e; --danger: #ef4444; --info: #3b82f6;
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Vazirmatn', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 460px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
    h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.5rem; }
    p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.25rem; }
    .step { display: none; }
    .step.active { display: block; }
    .qr-wrap { text-align: center; background: #fff; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; border: 1px solid var(--border); }
    .qr-wrap img, .qr-wrap svg { max-width: 220px; height: auto; }
    .secret-box { background: rgba(0,0,0,0.04); border-radius: 8px; padding: 0.75rem; font-family: monospace; font-size: 0.85rem; word-break: break-all; margin-bottom: 1rem; direction: ltr; text-align: left; }
    label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.4rem; }
    input[type="text"] { width: 100%; padding: 0.85rem 1rem; border-radius: 10px; border: 1px solid var(--border); font-family: inherit; font-size: 1rem; text-align: center; letter-spacing: 0.3rem; direction: ltr; margin-bottom: 1rem; }
    .btn { width: 100%; padding: 0.85rem; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color: #1a1a1a; font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: opacity 0.3s; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: rgba(0,0,0,0.05); color: var(--text); margin-top: 0.75rem; }
    .alert { padding: 0.85rem 1rem; border-radius: 10px; margin-bottom: 1rem; font-size: 0.85rem; font-weight: 600; }
    .alert--success { background: rgba(34,197,94,0.1); color: #15803d; }
    .alert--danger { background: rgba(239,68,68,0.1); color: #b91c1c; }
    .alert--info { background: rgba(59,130,246,0.1); color: #1d4ed8; }
    .loading { text-align: center; color: var(--text-muted); padding: 2rem; }
    .code { font-family: monospace; background: rgba(0,0,0,0.04); padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.85rem; }
  </style>
  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3.0.4"></script>
<script src="/calculators/auth-gate.js?v=2"></script>
  </head>
<body>
  <div class="card" id="card">
    <div class="loading" id="loading">جارِ التحقق من الجلسة...</div>

    <div class="step" id="step-verify">
      <h1>🔐 أدخل رمز المصادقة</h1>
      <p>تم تفعيل MFA مسبقًا. أدخل الرمز من تطبيق Microsoft Authenticator.</p>
      <div id="verifyAlert"></div>
      <label>رمز 6 أرقام</label>
      <input type="text" id="verifyCode" maxlength="6" inputmode="numeric" placeholder="123456" />
      <button class="btn" id="verifyBtn" onclick="verifyExisting()">تحقق</button>
      <button class="btn btn-secondary" onclick="location.href='/calculators/auth/index.html?redirect='+encodeURIComponent(location.pathname)">تسجيل الخروج</button>
    </div>

    <div class="step" id="step-enroll">
      <h1>🔐 فعّل MFA</h1>
      <p>امسح QR code بتطبيق Microsoft Authenticator، ثم أدخل الرمز.</p>
      <div id="enrollAlert"></div>
      <div class="qr-wrap" id="qrWrap"></div>
      <label>أو أدخل السر يدويًا</label>
      <div class="secret-box" id="secretBox">—</div>
      <label>رمز 6 أرقام من التطبيق</label>
      <input type="text" id="enrollCode" maxlength="6" inputmode="numeric" placeholder="123456" />
      <button class="btn" id="enrollBtn" onclick="verifyEnrollment()">تفعيل MFA</button>
      <button class="btn btn-secondary" onclick="location.href='/calculators/auth/index.html?redirect='+encodeURIComponent(location.pathname)">تسجيل الخروج</button>
    </div>

    <div class="step" id="step-done">
      <div class="alert alert--success">✅ تم تفعيل MFA بنجاح.</div>
      <p>الآن يمكنك تفعيل "إلزام MFA" من مركز الأمان.</p>
      <button class="btn" onclick="location.href='/admin/security.html'">الذهاب إلى مركز الأمان</button>
    </div>

    <div class="step" id="step-error">
      <div class="alert alert--danger" id="errorMsg">حدث خطأ.</div>
      <button class="btn btn-secondary" style="margin-top:1rem;" onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </div>

  <script>
    const ADMIN_EMAIL = window.__ENV?.ADMIN_EMAIL || '';
    let sb = null;
    let factorId = null;
    let mode = 'loading';

    function show(id) {
      document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById(id);
      if (el) el.classList.add('active');
    }

    function alertBox(id, msg, type = 'danger') {
      const el = document.getElementById(id);
      if (!el) return;
      el.className = 'alert alert--' + type;
      el.textContent = msg;
    }

    async function init() {
      try {
        if (typeof BondsAuth === 'undefined' || !BondsAuth.getSupabase) {
          throw new Error('Auth system not loaded');
        }
        sb = BondsAuth.getSupabase();
        if (!sb) throw new Error('Supabase not initialized');

        const { data: { session }, error: sessionErr } = await sb.auth.getSession();
        if (sessionErr || !session?.user) throw new Error('يجب تسجيل الدخول');
        const user = session.user;

        // Basic admin check
        const isOwner = ADMIN_EMAIL && user.email === ADMIN_EMAIL;
        let isAdmin = isOwner;
        if (!isAdmin) {
          const { data: roleRow } = await sb.from('admin_roles').select('role').eq('user_id', user.id).single();
          isAdmin = !!roleRow && ['super_admin','admin','support'].includes(roleRow.role);
        }
        if (!isAdmin) throw new Error('ليس لديك صلاحية الوصول الإداري');

        // Check AAL and factors
        const [{ data: aalData }, { data: factorsData }] = await Promise.all([
          sb.auth.mfa.getAuthenticatorAssuranceLevel(),
          sb.auth.mfa.listFactors()
        ]);
        const currentLevel = aalData?.currentLevel || 'aal1';
        const factors = factorsData?.totp || [];

        if (currentLevel === 'aal2') {
          show('step-done');
          return;
        }

        if (factors.length === 0) {
          await startEnrollment();
          show('step-enroll');
        } else {
          factorId = factors[0].id;
          show('step-verify');
        }
      } catch (e) {
        console.error('[MFA Setup]', e);
        document.getElementById('errorMsg').textContent = e.message || 'حدث خطأ غير متوقع';
        show('step-error');
      }
    }

    async function startEnrollment() {
      const { data, error } = await sb.auth.mfa.enroll({
        factorType: 'totp',
        friendlyName: 'Bonds Admin',
        issuer: 'Bonds Global'
      });
      if (error) throw error;
      factorId = data.id;

      const qrWrap = document.getElementById('qrWrap');
      if (data.totp?.qr_code) {
        qrWrap.innerHTML = data.totp.qr_code;
      } else if (data.totp?.uri) {
        qrWrap.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(data.totp.uri)}" alt="QR">`;
      } else {
        qrWrap.innerHTML = '<p>لا يوجد QR code</p>';
      }
      document.getElementById('secretBox').textContent = data.totp?.secret || '—';
    }

    async function verifyCode(factorId, inputId, alertId, btnId) {
      const btn = document.getElementById(btnId);
      btn.disabled = true;
      try {
        const code = document.getElementById(inputId).value.trim();
        if (!/^\d{6}$/.test(code)) throw new Error('أدخل رمزًا مكونًا من 6 أرقام');

        const { data: challenge, error: challengeErr } = await sb.auth.mfa.challenge({ factorId });
        if (challengeErr) throw challengeErr;

        const { data: verify, error: verifyErr } = await sb.auth.mfa.verify({
          factorId,
          challengeId: challenge.id,
          code
        });
        if (verifyErr) throw verifyErr;

        show('step-done');
      } catch (e) {
        console.error('[MFA Verify]', e);
        alertBox(alertId, e.message || 'الرمز غير صحيح، حاول مرة أخرى.');
        btn.disabled = false;
      }
    }

    async function verifyEnrollment() {
      await verifyCode(factorId, 'enrollCode', 'enrollAlert', 'enrollBtn');
    }

    async function verifyExisting() {
      await verifyCode(factorId, 'verifyCode', 'verifyAlert', 'verifyBtn');
    }

    init();
  </script>
</body>
</html>
