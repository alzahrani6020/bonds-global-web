  <style>
    body { background: var(--bg); color: var(--text); font-family: 'Vazirmatn', sans-serif; min-height: 100vh; }
    .admin-layout { display: flex; min-height: 100vh; }
    .admin-sidebar { width: 260px; background: var(--surface); border-left: 1px solid var(--border); padding: 2rem 1rem; position: fixed; inset: 0 auto 0 0; overflow-y: auto; }
    .admin-sidebar a { display: block; padding: 0.75rem 1rem; border-radius: 8px; color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; margin-bottom: 0.25rem; transition: all 0.2s; }
    .admin-sidebar a:hover, .admin-sidebar a.active { background: rgba(212,168,83,0.1); color: var(--gold); }
    .admin-main { flex: 1; margin-right: 260px; padding: 2rem; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .admin-header h1 { font-size: 1.5rem; font-weight: 800; color: var(--gold); }
    .card { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1.5rem; }
    .card h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 1rem; color: var(--text); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.4rem; }
    .form-group input { width: 100%; padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid var(--border-light); background: rgba(255,255,255,0.03); color: var(--text); font-size: 0.9rem; }
    .btn-save { background: var(--gold); color: var(--bg); border: none; padding: 0.75rem 2rem; border-radius: 10px; font-weight: 800; cursor: pointer; }
    .btn-save:hover { opacity: 0.9; }
    .success-msg { color: #22c55e; font-size: 0.9rem; margin-top: 0.5rem; }
    @media (max-width: 768px) { .admin-sidebar { display: none; } .admin-main { margin-right: 0; } .form-row { grid-template-columns: 1fr; } }
  </style>

        <div class="form-row">
          <div class="form-group">
            <label>استخدامات الحاسبات المجانية</label>
            <input type="number" id="calcLimit" placeholder="جارِ التحميل..." min="0" disabled>
          </div>
          <div class="form-group">
            <label>استخدامات دراسة الجدوى المجانية</label>
            <input type="number" id="feasLimit" placeholder="جارِ التحميل..." min="0" disabled>
          </div>
        </div>
      </div>

      <div class="card">
        <h3><span class="emoji-icon" style="display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;" aria-hidden="true"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#FDD888" d="M31.898 23.938C31.3 17.32 28 14 28 14l-6-8h-8l-6 8s-1.419 1.433-2.567 4.275C3.444 18.935 2 20.789 2 23c0 1.448.625 2.742 1.609 3.655C3.233 27.357 3 28.147 3 29c0 1.958 1.136 3.636 2.775 4.456C7.058 35.378 8.772 36 10 36h16c1.379 0 3.373-.779 4.678-3.31C32.609 31.999 34 30.17 34 28c0-1.678-.834-3.154-2.102-4.062zM18 6c.55 0 1.058-.158 1.5-.416.443.258.951.416 1.5.416 1.657 0 4-2.344 4-4 0 0 0-2-2-2-.788 0-1 1-2 1s-1-1-3-1-2 1-3 1-1.211-1-2-1c-2 0-2 2-2 2 0 1.656 2.344 4 4 4 .549 0 1.057-.158 1.5-.416.443.258.951.416 1.5.416z"/><path fill="#BF6952" d="M24 6c0 .552-.447 1-1 1H13c-.552 0-1-.448-1-1s.448-1 1-1h10c.553 0 1 .448 1 1z"/><path fill="#67757F" d="M23.901 24.542c0-4.477-8.581-4.185-8.581-6.886 0-1.308 1.301-1.947 2.811-1.947 2.538 0 2.99 1.569 4.139 1.569.813 0 1.205-.493 1.205-1.046 0-1.284-2.024-2.256-3.965-2.592V12.4c0-.773-.65-1.4-1.454-1.4-.805 0-1.456.627-1.456 1.4v1.283c-2.116.463-3.937 1.875-3.937 4.176 0 4.299 8.579 4.125 8.579 7.145 0 1.047-1.178 2.093-3.111 2.093-2.901 0-3.867-1.889-5.045-1.889-.574 0-1.087.464-1.087 1.164 0 1.113 1.938 2.451 4.603 2.824l-.001.01v1.398c0 .772.652 1.4 1.456 1.4.804 0 1.455-.628 1.455-1.4v-1.398c0-.017-.008-.03-.009-.045 2.398-.43 4.398-1.932 4.398-4.619z"/></svg></span> الأسعار (ريال سعودي)</h3>

            <label>سعر Pro / شهر</label>

          </div>
          <div class="form-group">

      <button class="btn-save" id="saveBtn" onclick="saveSettings()" disabled><span class="emoji-icon" style="display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;" aria-hidden="true"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#31373D" d="M4 36s-4 0-4-4V4s0-4 4-4h26c1 0 2 1 2 1l3 3s1 1 1 2v26s0 4-4 4H4z"/><path fill="#55ACEE" d="M5 19v-1s0-2 2-2h21c2 0 2 2 2 2v1H5z"/><path fill="#E1E8ED" d="M5 32.021V19h25v13s0 2-2 2H7c-2 0-2-1.979-2-1.979zM10 3s0-1 1-1h18c1.048 0 1 1 1 1v10s0 1-1 1H11s-1 0-1-1V3zm12 10h5V3h-5v10z"/></svg></span> حفظ التغييرات</button>
      <div id="saveMsg"></div>
    </main>
  </div>

  <script>
    let token = '';

    async function init() {
      const { data: userData } = await window.BondsAuth?.getUser?.() || {};
      const user = userData?.user;
      if (!user) {
        document.getElementById('saveMsg').textContent = '❌ يجب تسجيل الدخول للوصول إلى لوحة التحكم';
        return;
      }
      const sessionRes = await window.BondsAuth?.getSession?.() || {};
      token = sessionRes.data?.session?.access_token || '';
      document.getElementById('adminInfo').textContent = user.email;
      loadSettings();
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/admin?action=settings', { headers: { 'Authorization': 'Bearer ' + token } });
        const settings = await res.json();
        document.getElementById('calcLimit').value = settings.calc_limit || '';
        document.getElementById('feasLimit').value = settings.feas_limit || '';
        document.getElementById('pricePro').value = settings.price_pro_sar || '';
        document.getElementById('priceEnt').value = settings.price_enterprise_sar || '';
        ['calcLimit','feasLimit','pricePro','priceEnt'].forEach(id => document.getElementById(id).disabled = false);
        document.getElementById('saveBtn').disabled = false;
      } catch (e) {
        console.error(e);
        document.getElementById('saveMsg').textContent = '❌ فشل تحميل الإعدادات';
      }
    }

    async function saveSettings() {
      const btn = document.querySelector('.btn-save');
      btn.disabled = true; btn.textContent = 'جاري الحفظ...';

      try {
        const res = await fetch('/api/admin?action=settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            calc_limit: document.getElementById('calcLimit').value,
            feas_limit: document.getElementById('feasLimit').value,
            price_pro_sar: document.getElementById('pricePro').value,
            price_enterprise_sar: document.getElementById('priceEnt').value,
          }),
        });
        if (res.ok) {
          document.getElementById('saveMsg').textContent = '✅ تم الحفظ بنجاح';
          setTimeout(() => document.getElementById('saveMsg').textContent = '', 3000);
        } else {
          throw new Error('Failed');
        }
      } catch (e) {
        document.getElementById('saveMsg').textContent = '❌ فشل الحفظ';
      } finally {
        btn.disabled = false; btn.textContent = '💾 حفظ التغييرات';
      }
    }

    init();
  </script>
