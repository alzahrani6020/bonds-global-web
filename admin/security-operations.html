<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Operations — Bonds Global</title>
<link rel="stylesheet" href="/admin/admin-shared-ux.css"><style>
body{margin:0;background:#f6f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1550px;margin:auto;padding:1rem}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1rem}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:1rem}.s12{grid-column:span 12}.s6{grid-column:span 6}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}.kpi{border:1px solid #e2e8f0;border-radius:12px;padding:.75rem}.kpi b{display:block;font-size:1.2rem}.pill{display:inline-block;padding:.2rem .5rem;background:#f1f5f9;border-radius:999px;margin:.15rem;font-size:.78rem}.btn{border:0;border-radius:10px;padding:.6rem .9rem;font-weight:700;cursor:pointer;background:#172033;color:#fff}.btn2{background:#eef2f7;color:#172033}input,select{width:100%;box-sizing:border-box;padding:.65rem;border:1px solid #e2e8f0;border-radius:9px;margin:.3rem 0 .7rem}table{width:100%;border-collapse:collapse;font-size:.82rem}th,td{padding:.55rem;border-bottom:1px solid #e2e8f0;text-align:right}.scroll{overflow:auto;max-height:430px}.muted{color:#64748b}.status{display:none;padding:.75rem;background:#fee2e2;color:#991b1b;border-radius:10px}@media(max-width:900px){.s6{grid-column:span 12}}
</style></head><body><main>
<div style="display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap"><div><h1 style="margin:0">Security Operations</h1><div class="muted">RBAC · Permissions · Approvals · Temporary Access · Devices · Events · Break-glass</div></div><button class="btn btn2" onclick="loadSecurityOps()">تحديث</button></div>
<div id="status" class="status"></div><div class="grid" style="margin-top:1rem">
<section class="card s12"><div id="kpis" class="kpis"></div></section>
<section class="card s6"><h2>Security Events</h2><div class="scroll"><table><thead><tr><th>الوقت</th><th>الحدث</th><th>الشدة</th><th>Risk</th><th>Request</th></tr></thead><tbody id="eventRows"></tbody></table></div></section>
<section class="card s6"><h2>Pending Approvals</h2><div class="scroll"><table><thead><tr><th>Action</th><th>Permission</th><th>Status</th><th>Created</th></tr></thead><tbody id="approvalRows"></tbody></table></div></section>
<section class="card s6"><h2>Temporary Access / Delegations</h2><div id="temporary"></div></section>
<section class="card s6"><h2>Permission Simulator</h2><input id="simUserId" placeholder="User UUID"><button class="btn" onclick="simulate()">محاكاة الصلاحيات</button><div id="simResult" style="margin-top:1rem"></div></section>
<section class="card s12"><h2>منح صلاحية مؤقتة</h2><div style="display:grid;grid-template-columns:2fr 2fr 3fr 2fr 1fr;gap:.5rem;align-items:end"><input id="grantUser" placeholder="User UUID"><input id="grantPermission" placeholder="permission مثل users.write"><input id="grantReason" placeholder="السبب"><input id="grantExpiry" type="datetime-local"><button class="btn" onclick="grantTemporary()">منح</button></div></section>
</div></main>
<script src="/supabase-client.js"></script><script src="/bonds-auth-2026.js?v=3.1.3"></script><script src="/admin/admin-common.js"></script><script>
let data=null;const esc=v=>BondsAdminCommon.escapeHtml(v==null?'':String(v));const fmt=v=>v?new Date(v).toLocaleString('ar-SA'):'—';
function err(m){const e=document.getElementById('status');e.textContent=m;e.style.display=m?'block':'none'}async function api(url,options={}){const r=await window.BondsAuth.authenticatedFetch(url,{...options,returnTo:location.pathname+location.search});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.error||('HTTP '+r.status));return d}
function render(){const s=data.summary||{};document.getElementById('kpis').innerHTML=[['Events 24h',s.events24h||0],['High Risk',s.highRiskEvents||0],['Trusted Devices',s.activeTrustedDevices||0],['Temporary',s.temporaryGrants||0],['Delegations',s.activeDelegations||0],['Approvals',s.pendingApprovals||0],['Break-glass',s.breakGlassActive||0]].map(x=>'<div class="kpi"><b>'+esc(x[1])+'</b><span class="muted">'+esc(x[0])+'</span></div>').join('');
document.getElementById('eventRows').innerHTML=(data.events||[]).map(x=>'<tr><td>'+fmt(x.created_at)+'</td><td>'+esc(x.event_type)+'</td><td>'+esc(x.severity)+'</td><td>'+esc(x.risk_score)+'</td><td>'+esc(x.request_id||'—')+'</td></tr>').join('')||'<tr><td colspan="5">لا توجد أحداث</td></tr>';
document.getElementById('approvalRows').innerHTML=(data.approvals||[]).map(x=>'<tr><td>'+esc(x.action_type)+'</td><td>'+esc(x.permission)+'</td><td>'+esc(x.status)+'</td><td>'+fmt(x.created_at)+'</td></tr>').join('')||'<tr><td colspan="4">لا توجد موافقات معلقة</td></tr>';
document.getElementById('temporary').innerHTML='<div><b>Temporary Grants:</b> '+(data.temporaryAccess||[]).length+'</div><div><b>Delegations:</b> '+(data.delegations||[]).length+'</div><div><b>Break-glass active:</b> '+(data.breakGlass||[]).length+'</div>'}
async function loadSecurityOps(){err('');try{data=await api('/api/admin?action=security-operations-overview');render()}catch(e){err('فشل تحميل Security Operations: '+e.message)}}
async function simulate(){const id=simUserId.value.trim();if(!id)return;try{const d=await api('/api/admin?action=permission-simulator&user_id='+encodeURIComponent(id));document.getElementById('simResult').innerHTML='<div><b>'+esc(d.user.email||d.user.id)+'</b> · '+esc(d.role)+'</div><div>'+(d.permissions||[]).map(p=>'<span class="pill">'+esc(p)+'</span>').join('')+'</div>'}catch(e){err('فشل المحاكاة: '+e.message)}}
async function grantTemporary(){try{const expiry=grantExpiry.value?new Date(grantExpiry.value).toISOString():null;await api('/api/admin?action=temporary-permission-grant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:grantUser.value.trim(),permission:grantPermission.value.trim(),reason:grantReason.value.trim(),expires_at:expiry})});await loadSecurityOps()}catch(e){err('فشل منح الصلاحية: '+e.message)}}
if(window.__ADMIN_ROLE)loadSecurityOps();else window.addEventListener('admin-auth-ready',loadSecurityOps,{once:true});
</script></body></html>
