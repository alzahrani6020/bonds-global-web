<!DOCTYPE html>
<html lang="ar" dir="rtl" data-ud-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مراجعة المتخصص | تحليلات AI | بوندز</title>
  <meta name="description" content="إدارة طلبات مراجعة المتخصص لتحليلات AI" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="../assets/bonds-mark.svg" type="image/png" />
  <style>
    :root {
      --bg: #f5f0e8; --bg-secondary: #ffffff; --bg-card: rgba(255,255,255,0.9);
      --gold: #b8954e; --gold-bright: #d4b87a; --gold-dim: #8a7340;
      --text: #1a1a1a; --text-secondary: #555555; --text-muted: #888888;
      --border: rgba(0,0,0,0.08); --border-hover: rgba(184,149,78,0.4);
      --success: #22c55e; --warning: #eab308; --info: #3b82f6; --danger: #ef4444;
      --shadow: 0 4px 20px rgba(0,0,0,0.06); --shadow-lg: 0 10px 40px rgba(0,0,0,0.1);
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Vazirmatn', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }

    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px; background: var(--bg-secondary); border-left: 1px solid var(--border);
      padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem;
      position: fixed; right: 0; top: 0; bottom: 0; z-index: 100;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 0.75rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .sidebar-brand img { height: 40px; width: auto; border-radius: 6px; }
    .sidebar-brand span { font-size: 1.1rem; font-weight: 800; color: var(--gold); }
    .sidebar-nav { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; border-radius: 12px; color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(212,168,83,0.1); color: var(--gold); }
    .sidebar-link svg { width: 20px; height: 20px; opacity: 0.7; }
    .sidebar-footer { padding-top: 1rem; border-top: 1px solid var(--border); }
    .sidebar-user { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-bright)); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #1a1a1a; font-size: 0.85rem; }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: 700; font-size: 0.85rem; }
    .user-role { font-size: 0.75rem; color: var(--text-muted); }

    .main-content { flex: 1; margin-right: 260px; padding: 2rem; }
    .page-header { margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .page-header h1 { font-size: 1.6rem; font-weight: 800; }
    .page-header p { color: var(--text-secondary); font-size: 0.9rem; }

    .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; transition: all 0.2s; }
    .stat-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
    .stat-card__num { font-size: 1.5rem; font-weight: 800; line-height: 1; margin-bottom: 0.35rem; }
    .stat-card__label { font-size: 0.75rem; color: var(--text-secondary); }

    .tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .tab {
      padding: 0.5rem 1rem; border-radius: 50px; border: 1px solid var(--border); background: var(--bg-card);
      color: var(--text-secondary); font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
    }
    .tab:hover, .tab.active { background: rgba(184,149,78,0.12); color: var(--gold); border-color: var(--border-hover); }

    .btn-sm { padding: 0.45rem 0.9rem; border-radius: 8px; font-size: 0.78rem; font-weight: 700; text-decoration: none; transition: all 0.2s; border: none; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color: #1a1a1a; }
    .btn-secondary { background: rgba(0,0,0,0.04); color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-success { background: rgba(34,197,94,0.12); color: var(--success); }
    .btn-danger { background: rgba(239,68,68,0.12); color: var(--danger); }

    .review-list { display: flex; flex-direction: column; gap: 1rem; }
    .review-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; transition: all 0.2s; }
    .review-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow); }
    .review-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 0.75rem; }
    .review-title { font-weight: 800; font-size: 1rem; }
    .review-meta { display: flex; flex-wrap: wrap; gap: 0.75rem; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.75rem; }
    .review-meta span { display: flex; align-items: center; gap: 0.35rem; }
    .review-note { background: rgba(184,149,78,0.08); border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.75rem; }
    .review-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.7rem; border-radius: 50px; font-size: 0.72rem; font-weight: 800; }
    .badge--pending_review { background: rgba(234,179,8,0.12); color: #a16207; }
    .badge--assigned { background: rgba(59,130,246,0.12); color: #1d4ed8; }
    .badge--under_review { background: rgba(139,92,246,0.12); color: #6d28d9; }
    .badge--approved { background: rgba(34,197,94,0.12); color: #15803d; }
    .badge--returned { background: rgba(239,68,68,0.12); color: #b91c1c; }

    .loading { color: var(--text-muted); font-style: italic; text-align: center; padding: 2rem; }
    .empty { text-align: center; padding: 3rem; color: var(--text-muted); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200;
      display: none; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg-secondary); border-radius: var(--radius); width: 100%; max-width: 720px;
      max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
    }
    .modal-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-header h2 { font-size: 1.15rem; font-weight: 800; }
    .modal-close { background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }
    .modal-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.5rem; }

    .detail-section { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }
    .detail-section h3 { font-size: 0.85rem; font-weight: 800; color: var(--gold); margin-bottom: 0.75rem; text-transform: uppercase; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    .detail-item { font-size: 0.85rem; }
    .detail-item strong { color: var(--text-secondary); font-weight: 700; }
    .detail-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .detail-list li { font-size: 0.85rem; padding-right: 1rem; position: relative; color: var(--text-secondary); }
    .detail-list li::before { content: '•'; position: absolute; right: 0; color: var(--gold); font-weight: 800; }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
    .form-group select, .form-group input, .form-group textarea {
      padding: 0.65rem 0.9rem; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-secondary);
      font-family: inherit; font-size: 0.85rem; color: var(--text);
    }
    .form-group textarea { min-height: 90px; resize: vertical; }

    @media (max-width: 1024px) {
      .sidebar { width: 80px; padding: 1rem; }
      .sidebar-brand span, .sidebar-link span, .user-info { display: none; }
      .sidebar-link { justify-content: center; padding: 0.85rem; }
      .main-content { margin-right: 80px; }
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .main-content { margin-right: 0; padding: 1rem; }
      .sidebar { transform: translateX(100%); }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/bonds-auth-2026.js?v=3"></script>
  <script>BondsAuth.initAdminGuard();</script>

  <div class="modal-overlay" id="reviewModal">
    <div class="modal">

        <button class="modal-close" onclick="closeModal()">&times;</button>

      <div class="modal-footer">
        <button class="btn-sm btn-secondary" onclick="closeModal()">إغلاق</button>
        <button class="btn-sm btn-primary" onclick="saveReview()">حفظ التغييرات</button>

  <script>
    const STATUS_CONFIG = {
      all: { label: 'الكل', class: '' },
      pending_review: { label: 'قيد الانتظار', class: 'badge--pending_review' },
      assigned: { label: 'معين', class: 'badge--assigned' },
      under_review: { label: 'قيد المراجعة', class: 'badge--under_review' },
      approved: { label: 'معتمد', class: 'badge--approved' },
      returned: { label: 'مُعاد', class: 'badge--returned' }
    };

    const TYPE_LABELS = {
      credit_assessment: 'الجدارة الائتمانية',
      feasibility_study: 'دراسة الجدوى',
      distressed_project: 'مشروع متعثر',
      city_analysis: 'استخبارات المدينة'
    };

    let allReviews = [];
    let currentFilter = 'all';
    let selectedReview = null;
    let cachedToken = null;

    async function getAuthToken() {
      if (cachedToken) return cachedToken;
      let token = window.__ADMIN_TOKEN || window.__ADMIN_SESSION?.access_token || '';
      if (!token && window.BondsAuth?.getSession) {
        try {
          const { data: { session } } = await window.BondsAuth.getSession();
          token = session?.access_token || '';
        } catch (e) {}
      }
      cachedToken = token;
      return token;
    }

    async function authHeaders() {
      const token = await getAuthToken();
      return token ? { 'Authorization': 'Bearer ' + token } : {};
    }

    async function fetchReviews() {
      const res = await fetch('/api/admin?action=ai-reviews', { headers: await authHeaders() });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      return json.data || [];
    }

    function parseResult(result) {
      if (!result) return null;
      if (typeof result === 'string') {
        try { return JSON.parse(result); } catch (e) { return { executive_summary: result }; }
      }
      return result;
    }

    function formatCurrency(num) {
      const n = Number(num);
      if (!n && n !== 0) return '—';
      return n.toLocaleString('ar-SA') + ' ر.س';
    }

    function timeAgo(dateStr) {
      const d = new Date(dateStr);
      const now = new Date();
      const diff = Math.floor((now - d) / 60000);
      if (diff < 1) return 'الآن';
      if (diff < 60) return 'منذ ' + diff + ' دقيقة';
      const hrs = Math.floor(diff / 60);
      if (hrs < 24) return 'منذ ' + hrs + ' ساعة';
      const days = Math.floor(hrs / 24);
      return 'منذ ' + days + ' يوم';
    }

    function renderTabs() {
      const container = document.getElementById('statusTabs');
      container.innerHTML = Object.entries(STATUS_CONFIG).map(([key, cfg]) => {
        const count = key === 'all' ? allReviews.length : allReviews.filter(r => r.status === key).length;
        return `<button class="tab ${currentFilter === key ? 'active' : ''}" data-status="${key}" onclick="setFilter('${key}')">${cfg.label} (${count})</button>`;
      }).join('');
    }

    function setFilter(status) {
      currentFilter = status;
      renderTabs();
      renderReviews();
    }

    function renderReviews() {
      const filtered = currentFilter === 'all' ? allReviews : allReviews.filter(r => r.status === currentFilter);
      const container = document.getElementById('reviewList');
      if (!filtered.length) {
        container.innerHTML = '<div class="empty">لا توجد طلبات في هذا القسم</div>';
        return;
      }
      container.innerHTML = filtered.map(r => {
        const req = r.ai_requests || {};
        const result = parseResult(req.ai_results?.result);
        const profile = r.profiles || {};
        const statusCfg = STATUS_CONFIG[r.status] || STATUS_CONFIG.pending_review;
        const payload = req.payload || {};
        return `
          <div class="review-card">
            <div class="review-header">
              <div>
                <div class="review-title">${TYPE_LABELS[req.type] || req.type || 'تحليل AI'}</div>
                <div class="review-meta">
                  <span>👤 ${profile.full_name || '—'} (${profile.email || '—'})</span>
                  <span>🎯 النتيجة: ${result?.risk_level || result?.risk_score ?? '—'}</span>
                  <span>💰 ${formatCurrency(payload.monthly_revenue || payload.annual_revenue)} إيراد</span>
                  <span>⏰ ${timeAgo(r.created_at)}</span>
                </div>
              </div>
              <span class="badge ${statusCfg.class}">${statusCfg.label}</span>
            </div>
            ${r.note ? `<div class="review-note">📝 ${r.note}</div>` : ''}
            <div class="review-actions">
              <button class="btn-sm btn-primary" onclick="openReview('${r.id}')">عرض التفاصيل</button>
              ${r.status !== 'under_review' ? `<button class="btn-sm btn-secondary" onclick="quickUpdate('${r.id}', 'under_review')">تعيين قيد المراجعة</button>` : ''}
              ${r.status !== 'approved' ? `<button class="btn-sm btn-success" onclick="quickUpdate('${r.id}', 'approved')">اعتماد</button>` : ''}
              ${r.status !== 'returned' ? `<button class="btn-sm btn-danger" onclick="quickUpdate('${r.id}', 'returned')">إعادة للعميل</button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function updateStats() {
      document.getElementById('statTotal').textContent = allReviews.length.toLocaleString('ar-SA');
      document.getElementById('statPending').textContent = allReviews.filter(r => r.status === 'pending_review').length.toLocaleString('ar-SA');
      document.getElementById('statAssigned').textContent = allReviews.filter(r => r.status === 'assigned').length.toLocaleString('ar-SA');
      document.getElementById('statReview').textContent = allReviews.filter(r => r.status === 'under_review').length.toLocaleString('ar-SA');
      document.getElementById('statApproved').textContent = allReviews.filter(r => r.status === 'approved').length.toLocaleString('ar-SA');
    }

    async function refreshReviews() {
      document.getElementById('reviewList').innerHTML = '<div class="loading">جارِ التحميل...</div>';
      try {
        allReviews = await fetchReviews();
        updateStats();
        renderTabs();
        renderReviews();
      } catch (e) {
        document.getElementById('reviewList').innerHTML = '<div class="empty">فشل تحميل الطلبات: ' + e.message + '</div>';
      }
    }

    function openReview(id) {
      selectedReview = allReviews.find(r => r.id === id);
      if (!selectedReview) return;
      const req = selectedReview.ai_requests || {};
      const result = parseResult(req.ai_results?.result);
      const payload = req.payload || {};
      const profile = selectedReview.profiles || {};
      const statusCfg = STATUS_CONFIG[selectedReview.status] || STATUS_CONFIG.pending_review;

      document.getElementById('modalBody').innerHTML = `
        <div class="detail-section">
          <h3>معلومات الطلب</h3>
          <div class="detail-grid">
            <div class="detail-item"><strong>العميل:</strong> ${profile.full_name || '—'}</div>
            <div class="detail-item"><strong>البريد:</strong> ${profile.email || '—'}</div>
            <div class="detail-item"><strong>نوع التحليل:</strong> ${TYPE_LABELS[req.type] || req.type || '—'}</div>
            <div class="detail-item"><strong>الحالة:</strong> <span class="badge ${statusCfg.class}">${statusCfg.label}</span></div>
            <div class="detail-item"><strong>المدينة:</strong> ${payload.city || '—'}</div>
            <div class="detail-item"><strong>القطاع:</strong> ${payload.sector || '—'}</div>
            <div class="detail-item"><strong>الإيراد الشهري:</strong> ${formatCurrency(payload.monthly_revenue)}</div>
            <div class="detail-item"><strong>التكلفة الشهرية:</strong> ${formatCurrency(payload.monthly_costs)}</div>
            <div class="detail-item"><strong>نموذج AI:</strong> ${req.model || '—'}</div>
            <div class="detail-item"><strong>التكلفة:</strong> ${req.cost_usd ? '$' + req.cost_usd.toFixed(4) : '—'}</div>
          </div>
        </div>

        ${result ? `
        <div class="detail-section">
          <h3>ملخص التحليل AI</h3>
          <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:0.75rem;">${result.executive_summary || ''}</p>
          <div class="detail-grid">
            <div class="detail-item"><strong>درجة المخاطرة:</strong> ${result.risk_score ?? '—'} / 100</div>
            <div class="detail-item"><strong>مستوى المخاطرة:</strong> ${result.risk_level || '—'}</div>
            <div class="detail-item"><strong>الثقة:</strong> ${result.confidence || '—'}</div>
          </div>
        </div>

        ${result.strengths?.length ? `<div class="detail-section"><h3>نقاط القوة</h3><ul class="detail-list">${result.strengths.map(s => `<li>${s}</li>`).join('')}</ul></div>` : ''}
        ${result.weaknesses?.length ? `<div class="detail-section"><h3>نقاط الضعف</h3><ul class="detail-list">${result.weaknesses.map(s => `<li>${s}</li>`).join('')}</ul></div>` : ''}
        ${result.recommendations?.length ? `<div class="detail-section"><h3>التوصيات</h3><ul class="detail-list">${result.recommendations.map(s => `<li>${s}</li>`).join('')}</ul></div>` : ''}
        ` : '<div class="detail-section"><h3>نتيجة AI</h3><p style="font-size:0.85rem;color:var(--text-muted);">لا توجد نتيجة محفوظة لهذا الطلب.</p></div>'}

        <div class="detail-section">
          <h3>إدارة الحالة</h3>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label for="modalStatus">الحالة</label>
              <select data-universal-dropdown="true" id="modalStatus">
                ${Object.entries(STATUS_CONFIG).filter(([k]) => k !== 'all').map(([k, cfg]) => `<option value="${k}" ${selectedReview.status === k ? 'selected' : ''}>${cfg.label}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label for="modalAssigned">معين إلى (بريد المستشار)</label>
              <input type="text" id="modalAssigned" value="${selectedReview.assigned_to || ''}" placeholder="email@example.com" />
            </div>
          </div>
          <div class="form-group" style="margin-top:1rem;">
            <label for="modalNotes">ملاحظات الإدارة</label>
            <textarea id="modalNotes" placeholder="اكتب ملاحظاتك الداخلية هنا...">${selectedReview.admin_notes || ''}</textarea>
          </div>
          ${selectedReview.note ? `<div class="form-group"><label>ملاحظة العميل</label><div style="font-size:0.85rem;color:var(--text-secondary);background:rgba(0,0,0,0.03);padding:0.75rem;border-radius:10px;">${selectedReview.note}</div></div>` : ''}
        </div>
      `;
      document.getElementById('reviewModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('reviewModal').classList.remove('open');
      selectedReview = null;
    }

    async function saveReview() {
      if (!selectedReview) return;
      const status = document.getElementById('modalStatus').value;
      const assigned_to = document.getElementById('modalAssigned').value.trim();
      const admin_notes = document.getElementById('modalNotes').value.trim();
      await updateReview(selectedReview.id, status, assigned_to, admin_notes);
      closeModal();
      await refreshReviews();
    }

    async function quickUpdate(id, status) {
      await updateReview(id, status);
      await refreshReviews();
    }

    async function updateReview(id, status, assigned_to, admin_notes) {
      try {
        const body = { id, status };
        if (assigned_to !== undefined) body.assigned_to = assigned_to;
        if (admin_notes !== undefined) body.admin_notes = admin_notes;
        const res = await fetch('/api/admin?action=ai-reviews', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...(await authHeaders()) },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        if (json.error) throw new Error(json.error);
      } catch (e) {
        alert('فشل حفظ التحديث: ' + e.message);
        throw e;
      }
    }

    document.getElementById('reviewModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    window.addEventListener('load', refreshReviews);
  </script>
  <script src="/admin/admin-embed.js"></script>
<script src="../components/universal-dropdown.js?v=2.51.8"></script>
<script src="../components/universal-dropdown-init.js"></script>
</body>
</html>
