<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إدارة الذكاء السوقي | بوندز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { background: var(--bg); color: var(--text); font-family: Vazirmatn, system-ui, sans-serif; min-height: 100vh; }
    .container { max-width: 1600px; margin: 0 auto; padding: 2rem; }
    h1 { color: var(--gold); margin-bottom: 1rem; }
    h2 { color: var(--text); margin: 2rem 0 1rem; font-size: 1.25rem; }
    .toolbar { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
    input, select, button, textarea { padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); }
    button { background: var(--gold); color: #0a0f1a; font-weight: 700; cursor: pointer; border: none; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
    button.danger { background: transparent; border: 1px solid #f87171; color: #f87171; }
    .table-wrap { overflow-x: auto; background: var(--bg-card); border-radius: 12px; margin-bottom: 2rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 1400px; }
    th, td { padding: 0.5rem 0.5rem; border-bottom: 1px solid var(--border); text-align: right; vertical-align: middle; }
    th { background: rgba(212,168,83,0.1); color: var(--gold); font-weight: 700; position: sticky; top: 0; }
    tr:hover { background: rgba(255,255,255,0.03); }
    .num-input { width: 70px; text-align: center; }
    .dim-input { width: 70px; }
    .notes-input { width: 120px; font-size: 0.75rem; }
    .status { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
    .status.is-open { display: block; }
    .status.success { background: rgba(34,197,94,0.1); color: #4ade80; }
    .status.error { background: rgba(239,68,68,0.1); color: #f87171; }
    .back-link { color: var(--gold); text-decoration: none; display: inline-block; margin-bottom: 1rem; }
    .section { margin-top: 2rem; }
    .source-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; background: var(--bg-card); padding: 1rem; border-radius: 12px; margin-bottom: 1rem; }
    .source-form label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.25rem; }
    .source-form input, .source-form select, .source-form textarea { width: 100%; box-sizing: border-box; }
    .toggle { display: inline-flex; align-items: center; gap: 0.5rem; }
    .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 999px; font-size: 0.7rem; font-weight: 700; }
    .badge-success { background: rgba(74,222,128,0.15); color: #4ade80; }
    .badge-error { background: rgba(248,113,113,0.15); color: #f87171; }
    .badge-neutral { background: rgba(148,163,184,0.15); color: #94a3b8; }
    .actions { display: flex; gap: 0.5rem; }
    .chart-box { height: 260px; margin-top: 1rem; }
    .hidden { display: none; }
  </style>
<script src="/calculators/auth-gate.js?v=2"></script>
  </head>
<body>
  <div class="container">
    <a href="/admin/dashboard.html" class="back-link">⬅️ العودة إلى لوحة الإدارة</a>
    <h1>إدارة الذكاء السوقي (Market Intelligence)</h1>
    <div id="status" class="status"></div>

    <div class="toolbar">
      <select id="assetFilter"><option value="">كل الفئات</option></select>
      <input type="text" id="countryFilter" placeholder="الدولة" />
      <input type="text" id="regionFilter" placeholder="المنطقة" />
      <input type="text" id="cityFilter" placeholder="المدينة" />
      <input type="text" id="sectorFilter" placeholder="القطاع" />
      <input type="text" id="searchInput" placeholder="بحث..." />
      <button id="addBtn" class="secondary">+ إضافة سجل</button>
      <button id="saveBtn">حفظ التغييرات</button>
      <button id="refreshBtn" class="secondary">تحديث</button>
    </div>

    <div class="table-wrap" id="tableContainer"><p style="padding:1rem">جارِ التحميل...</p></div>

    <div class="section">
      <h2>مصادر البيانات (Data Sources)</h2>
      <div id="sourceStatus" class="status"></div>
      <div class="toolbar">
        <button id="refreshSourcesBtn" class="secondary">تشغيل التحديث التلقائي</button>
      </div>
      <form id="sourceForm" class="source-form">
        <input type="hidden" id="sourceId" />
        <div>
          <label>الاسم</label>
          <input type="text" id="sourceName" required />
        </div>
        <div>
          <label>الفئة</label>
          <select id="sourceAsset" required></select>
        </div>
        <div>
          <label>الدولة / المنطقة / المدينة / القطاع</label>
          <div style="display:flex;gap:0.5rem">
            <input type="text" id="sourceCountry" placeholder="الدولة" />
            <input type="text" id="sourceRegion" placeholder="المنطقة" />
            <input type="text" id="sourceCity" placeholder="المدينة" />
            <input type="text" id="sourceSector" placeholder="القطاع" />
          </div>
        </div>
        <div>
          <label>الرابط (URL)</label>
          <input type="url" id="sourceUrl" required />
        </div>
        <div>
          <label>الطريقة</label>
          <select id="sourceMethod"><option>GET</option><option>POST</option></select>
        </div>
        <div>
          <label>Headers (JSON)</label>
          <input type="text" id="sourceHeaders" placeholder='{"Authorization":"Bearer ..."}' />
        </div>
        <div>
          <label>مسار السجلات (record_path)</label>
          <input type="text" id="sourceRecordPath" placeholder="data.records" />
        </div>
        <div>
          <label>تخطيط الحقول (JSON)</label>
          <textarea id="sourceFieldMapping" rows="2" placeholder='{"averageSellingPrice":"price"}'></textarea>
        </div>
        <div>
          <label>جدولة (cron)</label>
          <input type="text" id="sourceSchedule" placeholder="0 6 * * *" />
        </div>
        <div class="toggle">
          <input type="checkbox" id="sourceActive" />
          <label for="sourceActive" style="margin:0">نشط</label>
        </div>
        <div style="display:flex;align-items:end">
          <button type="submit" id="saveSourceBtn">حفظ المصدر</button>
        </div>
      </form>
      <div class="table-wrap" id="sourcesContainer"><p style="padding:1rem">جارِ التحميل...</p></div>
    </div>
  </div>

  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/supabase-client.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    (function () {
      'use strict';

      const ASSET_CLASSES = [
        { value: 'realEstate', label: 'العقارات' },
        { value: 'business', label: 'الشركات' },
        { value: 'factory', label: 'المصانع' },
        { value: 'machineryEquipment', label: 'الآلات والمعدات' },
        { value: 'vehiclesFleet', label: 'المركبات والأساطيل' },
        { value: 'agricultureFarms', label: 'الزراعة والمزارع' },
        { value: 'livestock', label: 'الثروة الحيوانية' },
        { value: 'naturalResourcesMining', label: 'الموارد الطبيعية والتعدين' },
        { value: 'oilGas', label: 'النفط والغاز' },
        { value: 'infrastructure', label: 'البنية التحتية' },
        { value: 'intellectualProperty', label: 'الملكية الفكرية' },
        { value: 'brandsTrademarks', label: 'العلامات التجارية' },
        { value: 'patents', label: 'براءات الاختراع' },
        { value: 'copyrightsContent', label: 'حقوق المؤلف' },
        { value: 'franchises', label: 'الامتيازات التجارية' },
        { value: 'licensesPermits', label: 'التراخيص والتصاريح' },
        { value: 'financialAssets', label: 'الأصول المالية' },
        { value: 'cryptoDigital', label: 'العملات الرقمية' },
        { value: 'commodities', label: 'السلع' },
        { value: 'artCollectibles', label: 'الفنون والمقتنيات' },
        { value: 'jewelryPreciousMetals', label: 'المجوهرات والمعادن' },
        { value: 'softwareTechnology', label: 'البرمجيات والتقنية' },
        { value: 'medicalEquipment', label: 'الأجهزة الطبية' },
        { value: 'educationalEquipment', label: 'التجهيزات التعليمية' },
        { value: 'distressedAsset', label: 'الأصول المتعثرة' },
        { value: 'tourismAsset', label: 'الأصول السياحية' },
        { value: 'personalWealth', label: 'الثروة الشخصية' },
        { value: 'scrapSalvage', label: 'السكراب والخردة' },
        { value: 'maritimeAsset', label: 'الأصول البحرية' },
        { value: 'logisticsAsset', label: 'الأصول اللوجستية' },
        { value: 'fuelStation', label: 'محطات الوقود' },
        { value: 'beautyWellness', label: 'التجميل والصحة' },
        { value: 'giftsStationery', label: 'الهدايا والماليات' },
        { value: 'furnitureAsset', label: 'الأثاث' },
        { value: 'retailBusiness', label: 'نشاط تجاري عام' }
      ];

      const FIELDS = [
        { key: 'average_selling_price', label: 'سعر البيع', type: 'number' },
        { key: 'average_buying_price', label: 'سعر الشراء', type: 'number' },
        { key: 'transaction_count', label: 'الصفقات', type: 'number' },
        { key: 'supply_index', label: 'العرض', type: 'number', min: 1, max: 10 },
        { key: 'demand_index', label: 'الطلب', type: 'number', min: 1, max: 10 },
        { key: 'competitor_count', label: 'المنافسين', type: 'number' },
        { key: 'average_sale_speed_days', label: 'السرعة', type: 'number' },
        { key: 'inflation_rate', label: 'التضخم', type: 'number', step: 0.001 },
        { key: 'interest_rate', label: 'الفائدة', type: 'number', step: 0.001 },
        { key: 'economic_growth_rate', label: 'النمو', type: 'number', step: 0.001 },
        { key: 'risk_score', label: 'المخاطرة', type: 'number', min: 0, max: 10, step: 0.1 },
        { key: 'confidence', label: 'الثقة', type: 'number', min: 0, max: 1, step: 0.01 },
        { key: 'data_quality_score', label: 'الجودة', type: 'number', min: 0, max: 100, step: 1 }
      ];

      const OUTLOOKS = [
        { value: 'positive', label: 'إيجابية' },
        { value: 'neutral', label: 'محايدة' },
        { value: 'negative', label: 'سلبية' }
      ];

      const container = document.getElementById('tableContainer');
      const sourcesContainer = document.getElementById('sourcesContainer');
      const statusEl = document.getElementById('status');
      const sourceStatusEl = document.getElementById('sourceStatus');
      const filterEl = document.getElementById('assetFilter');
      const searchEl = document.getElementById('searchInput');
      const countryFilter = document.getElementById('countryFilter');
      const regionFilter = document.getElementById('regionFilter');
      const cityFilter = document.getElementById('cityFilter');
      const sectorFilter = document.getElementById('sectorFilter');
      let rows = [];
      let sources = [];

      function showStatus(msg, isError, el) {
        const target = el || statusEl;
        target.textContent = msg;
        target.className = 'status is-open ' + (isError ? 'error' : 'success');
        setTimeout(() => target.classList.remove('is-open'), 6000);
      }

      function getClient() {
        return window.supabaseClient || (window.supabase && window.supabase.client);
      }

      async function getToken() {
        const client = getClient();
        if (!client || !client.auth) return null;
        const { data } = await client.auth.getSession();
        return data && data.session && data.session.access_token;
      }

      function renderAssetOptions(select, includeAll) {
        select.innerHTML = includeAll ? '<option value="">كل الفئات</option>' : '';
        ASSET_CLASSES.forEach(cls => {
          const opt = document.createElement('option');
          opt.value = cls.value;
          opt.textContent = cls.label;
          select.appendChild(opt);
        });
      }

      renderAssetOptions(filterEl, true);
      renderAssetOptions(document.getElementById('sourceAsset'), false);

      async function fetchData() {
        container.innerHTML = '<p style="padding:1rem">جارِ التحميل...</p>';
        try {
          const res = await fetch('/api/market-intelligence');
          const json = await res.json();
          if (!json.success) throw new Error(json.error);
          rows = json.data || [];
          render();
        } catch (err) {
          container.innerHTML = '<p style="padding:1rem;color:#f87171">فشل التحميل: ' + err.message + '</p>';
        }
      }

      function matchesFilters(row) {
        const term = searchEl.value.trim().toLowerCase();
        const cls = filterEl.value;
        if (cls && row.asset_class !== cls) return false;
        if (countryFilter.value && (row.country || '') !== countryFilter.value) return false;
        if (regionFilter.value && (row.region || '') !== regionFilter.value) return false;
        if (cityFilter.value && (row.city || '') !== cityFilter.value) return false;
        if (sectorFilter.value && (row.sector || '') !== sectorFilter.value) return false;
        if (term) {
          const label = (ASSET_CLASSES.find(c => c.value === row.asset_class) || {}).label || '';
          const hay = (label + ' ' + row.asset_class + ' ' + (row.country || '') + ' ' + (row.city || '') + ' ' + (row.region || '') + ' ' + (row.sector || '')).toLowerCase();
          if (!hay.includes(term)) return false;
        }
        return true;
      }

      function render() {
        const filtered = rows.filter(matchesFilters);

        let html = '<table><thead><tr>';
        html += '<th>الفئة</th><th>الدولة</th><th>المنطقة</th><th>المدينة</th><th>القطاع</th>';
        FIELDS.forEach(f => html += '<th>' + f.label + '</th>');
        html += '<th>النظرة</th><th>ملاحظات</th><th>المصدر</th><th>التاريخ</th><th></th></tr></thead><tbody>';

        filtered.forEach(row => {
          const label = (ASSET_CLASSES.find(c => c.value === row.asset_class) || {}).label || row.asset_class;
          html += '<tr data-id="' + (row.id || '') + '" data-asset="' + row.asset_class + '">';
          html += '<td><strong>' + label + '</strong></td>';
          html += '<td><input type="text" class="dim-input" data-field="country" value="' + (row.country || '') + '"></td>';
          html += '<td><input type="text" class="dim-input" data-field="region" value="' + (row.region || '') + '"></td>';
          html += '<td><input type="text" class="dim-input" data-field="city" value="' + (row.city || '') + '"></td>';
          html += '<td><input type="text" class="dim-input" data-field="sector" value="' + (row.sector || '') + '"></td>';

          FIELDS.forEach(f => {
            const val = row[f.key] !== undefined ? row[f.key] : '';
            const min = f.min !== undefined ? 'min="' + f.min + '"' : '';
            const max = f.max !== undefined ? 'max="' + f.max + '"' : '';
            const step = f.step !== undefined ? 'step="' + f.step + '"' : 'step="any"';
            html += '<td><input type="' + f.type + '" class="num-input" data-field="' + f.key + '" value="' + val + '" ' + min + ' ' + max + ' ' + step + '></td>';
          });

          html += '<td><select data-field="outlook">';
          OUTLOOKS.forEach(o => {
            html += '<option value="' + o.value + '"' + ((row.outlook || 'neutral') === o.value ? ' selected' : '') + '>' + o.label + '</option>';
          });
          html += '</select></td>';

          html += '<td><input type="text" class="notes-input" data-field="notes" value="' + (row.notes || '') + '"></td>';
          html += '<td><input type="text" class="dim-input" data-field="source" value="' + (row.source || '') + '"></td>';
          html += '<td><input type="date" class="dim-input" data-field="recorded_at" value="' + (row.recorded_at || new Date().toISOString().split('T')[0]) + '"></td>';
          html += '<td class="actions"><button type="button" class="danger delete-row">حذف</button></td>';
          html += '</tr>';
        });

        html += '</tbody></table>';
        container.innerHTML = html;

        container.querySelectorAll('.delete-row').forEach(btn => {
          btn.addEventListener('click', async e => {
            const tr = e.target.closest('tr');
            const id = tr.dataset.id;
            if (!id) { tr.remove(); return; }
            if (!confirm('هل أنت متأكد من حذف هذا السجل؟')) return;
            const client = getClient();
            if (!client) { showStatus('لم يتم العثور على جلسة Supabase', true); return; }
            const { error } = await client.from('market_data').delete().eq('id', id);
            if (error) showStatus('فشل الحذف: ' + error.message, true);
            else { showStatus('تم الحذف', false); await fetchData(); }
          });
        });
      }

      async function save() {
        const token = await getToken();
        if (!token) { showStatus('لا يوجد توكن صالح. يرجى تسجيل الدخول.', true); return; }

        const updates = [];
        container.querySelectorAll('tbody tr').forEach(tr => {
          const payload = { assetClass: tr.dataset.asset };
          tr.querySelectorAll('[data-field]').forEach(el => {
            const field = el.dataset.field;
            if (['country', 'region', 'city', 'sector', 'source', 'outlook', 'notes', 'recorded_at'].includes(field)) {
              payload[field] = el.value;
            } else {
              payload[field] = parseFloat(el.value) || 0;
            }
          });
          updates.push(payload);
        });

        const saveBtn = document.getElementById('saveBtn');
        saveBtn.disabled = true;
        saveBtn.textContent = 'جارِ الحفظ...';

        try {
          for (const payload of updates) {
            const res = await fetch('/api/market-intelligence', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
              body: JSON.stringify(payload)
            });
            const json = await res.json();
            if (!json.success) throw new Error(json.error || 'Save failed');
          }
          showStatus('تم حفظ التغييرات بنجاح.', false);
          await fetchData();
        } catch (err) {
          showStatus('فشل الحفظ: ' + err.message, true);
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = 'حفظ التغييرات';
        }
      }

      document.getElementById('addBtn').addEventListener('click', () => {
        const cls = filterEl.value || ASSET_CLASSES[0].value;
        const empty = {
          asset_class: cls,
          country: '', region: '', city: '', sector: '',
          outlook: 'neutral', notes: '', source: '', recorded_at: new Date().toISOString().split('T')[0]
        };
        rows.unshift(empty);
        render();
      });

      document.getElementById('saveBtn').addEventListener('click', save);
      document.getElementById('refreshBtn').addEventListener('click', fetchData);
      searchEl.addEventListener('input', render);
      filterEl.addEventListener('change', render);
      countryFilter.addEventListener('input', render);
      regionFilter.addEventListener('input', render);
      cityFilter.addEventListener('input', render);
      sectorFilter.addEventListener('input', render);

      // --- Sources management ---
      async function fetchSources() {
        const client = getClient();
        if (!client) { sourcesContainer.innerHTML = '<p style="padding:1rem;color:#f87171">فشل الاتصال</p>'; return; }
        const { data, error } = await client.from('market_data_sources').select('*').order('name');
        if (error) { sourcesContainer.innerHTML = '<p style="padding:1rem;color:#f87171">' + error.message + '</p>'; return; }
        sources = data || [];
        renderSources();
      }

      function renderSources() {
        let html = '<table><thead><tr><th>الاسم</th><th>الفئة</th><th>النطاق</th><th>الرابط</th><th>الجدولة</th><th>نشط</th><th>آخر تحديث</th><th>الحالة</th><th></th></tr></thead><tbody>';
        sources.forEach(s => {
          const scope = [s.country, s.region, s.city, s.sector].filter(Boolean).join(' / ') || 'عالمي';
          const statusBadge = s.last_status === 'success' ? '<span class="badge badge-success">ناجح</span>'
            : s.last_status === 'error' ? '<span class="badge badge-error">فاشل</span>'
            : '<span class="badge badge-neutral">—</span>';
          html += '<tr data-source-id="' + s.id + '">';
          html += '<td>' + s.name + '</td>';
          html += '<td>' + s.asset_class + '</td>';
          html += '<td>' + scope + '</td>';
          html += '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">' + s.url + '</td>';
          html += '<td>' + (s.schedule || '—') + '</td>';
          html += '<td>' + (s.is_active ? 'نعم' : 'لا') + '</td>';
          html += '<td>' + (s.last_fetched_at ? new Date(s.last_fetched_at).toLocaleString('ar-SA') : '—') + '</td>';
          html += '<td>' + statusBadge + '</td>';
          html += '<td class="actions"><button type="button" class="secondary edit-source">تعديل</button><button type="button" class="danger delete-source">حذف</button></td>';
          html += '</tr>';
        });
        html += '</tbody></table>';
        sourcesContainer.innerHTML = html;

        sourcesContainer.querySelectorAll('.edit-source').forEach(btn => {
          btn.addEventListener('click', e => {
            const id = e.target.closest('tr').dataset.sourceId;
            const s = sources.find(x => x.id === id);
            if (!s) return;
            document.getElementById('sourceId').value = s.id;
            document.getElementById('sourceName').value = s.name;
            document.getElementById('sourceAsset').value = s.asset_class;
            document.getElementById('sourceCountry').value = s.country || '';
            document.getElementById('sourceRegion').value = s.region || '';
            document.getElementById('sourceCity').value = s.city || '';
            document.getElementById('sourceSector').value = s.sector || '';
            document.getElementById('sourceUrl').value = s.url;
            document.getElementById('sourceMethod').value = s.method || 'GET';
            document.getElementById('sourceHeaders').value = s.headers ? JSON.stringify(s.headers) : '';
            document.getElementById('sourceRecordPath').value = s.record_path || '';
            document.getElementById('sourceFieldMapping').value = s.field_mapping ? JSON.stringify(s.field_mapping) : '';
            document.getElementById('sourceSchedule').value = s.schedule || '';
            document.getElementById('sourceActive').checked = s.is_active;
          });
        });

        sourcesContainer.querySelectorAll('.delete-source').forEach(btn => {
          btn.addEventListener('click', async e => {
            const id = e.target.closest('tr').dataset.sourceId;
            if (!confirm('هل أنت متأكد من حذف هذا المصدر؟')) return;
            const client = getClient();
            const { error } = await client.from('market_data_sources').delete().eq('id', id);
            if (error) showStatus('فشل الحذف: ' + error.message, true, sourceStatusEl);
            else { showStatus('تم حذف المصدر', false, sourceStatusEl); await fetchSources(); }
          });
        });
      }

      document.getElementById('sourceForm').addEventListener('submit', async e => {
        e.preventDefault();
        const client = getClient();
        if (!client) { showStatus('لا يوجد جلسة', true, sourceStatusEl); return; }

        const parseJson = (raw, fallback) => {
          if (!raw || !raw.trim()) return fallback;
          try { return JSON.parse(raw); } catch { return raw; }
        };

        const payload = {
          name: document.getElementById('sourceName').value,
          asset_class: document.getElementById('sourceAsset').value,
          country: document.getElementById('sourceCountry').value || '',
          region: document.getElementById('sourceRegion').value || '',
          city: document.getElementById('sourceCity').value || '',
          sector: document.getElementById('sourceSector').value || '',
          url: document.getElementById('sourceUrl').value,
          method: document.getElementById('sourceMethod').value,
          headers: parseJson(document.getElementById('sourceHeaders').value, {}),
          record_path: document.getElementById('sourceRecordPath').value || null,
          field_mapping: parseJson(document.getElementById('sourceFieldMapping').value, {}),
          schedule: document.getElementById('sourceSchedule').value || null,
          is_active: document.getElementById('sourceActive').checked,
          updated_at: new Date().toISOString()
        };

        const id = document.getElementById('sourceId').value;
        let error;
        if (id) {
          const res = await client.from('market_data_sources').update(payload).eq('id', id);
          error = res.error;
        } else {
          const res = await client.from('market_data_sources').insert(payload);
          error = res.error;
        }
        if (error) showStatus('فشل الحفظ: ' + error.message, true, sourceStatusEl);
        else {
          showStatus('تم حفظ المصدر', false, sourceStatusEl);
          document.getElementById('sourceForm').reset();
          document.getElementById('sourceId').value = '';
          await fetchSources();
        }
      });

      document.getElementById('refreshSourcesBtn').addEventListener('click', async () => {
        const token = await getToken();
        if (!token) { showStatus('لا يوجد توكن صالح', true, sourceStatusEl); return; }
        const btn = document.getElementById('refreshSourcesBtn');
        btn.disabled = true;
        btn.textContent = 'جارِ التشغيل...';
        try {
          const res = await fetch('/api/market-intelligence', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ action: 'refresh' })
          });
          const json = await res.json();
          if (!json.success) throw new Error(json.error || 'Refresh failed');
          showStatus('تم تحديث ' + json.updated + ' سجل' + (json.failed ? ' (فشل ' + json.failed + ')' : ''), false, sourceStatusEl);
          await Promise.all([fetchData(), fetchSources()]);
        } catch (err) {
          showStatus('فشل التحديث: ' + err.message, true, sourceStatusEl);
        } finally {
          btn.disabled = false;
          btn.textContent = 'تشغيل التحديث التلقائي';
        }
      });

      fetchData();
      fetchSources();
    })();
  </script>
  <script src="/bonds-auth-2026.js?v=3.0.5"></script>
  <script>BondsAuth.initAdminGuard();</script>
  <script src="/admin/admin-embed.js"></script>
</body>
