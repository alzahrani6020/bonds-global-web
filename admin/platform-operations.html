<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platform Operations — Bonds Global</title><link rel="stylesheet" href="/admin/admin-shared-ux.css"><style>
body{margin:0;background:#f6f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1650px;margin:auto;padding:1rem}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1rem;margin-top:1rem}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:1rem}.s12{grid-column:span 12}.s6{grid-column:span 6}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.65rem}.kpi{border:1px solid #e2e8f0;border-radius:12px;padding:.7rem}.kpi b{display:block;font-size:1.15rem}table{width:100%;border-collapse:collapse;font-size:.8rem}th,td{padding:.5rem;border-bottom:1px solid #e2e8f0;text-align:right}.scroll{overflow:auto;max-height:380px}.muted{color:#64748b}.btn{border:0;border-radius:9px;padding:.55rem .85rem;font-weight:700;cursor:pointer;background:#172033;color:white}input,textarea,select{width:100%;box-sizing:border-box;padding:.6rem;border:1px solid #e2e8f0;border-radius:9px;margin:.25rem 0 .6rem}.forms{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.status{display:none;background:#fee2e2;color:#991b1b;padding:.7rem;border-radius:9px}@media(max-width:900px){.s6{grid-column:span 12}.forms{grid-template-columns:1fr}}</style></head><body><main>
<div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap"><div><h1 style="margin:0">Platform Operations</h1><div class="muted">Observability · Incidents · Deployments · Recovery · Configuration</div></div><button class="btn" onclick="loadPlatform()">تحديث</button></div><div id="status" class="status"></div>
<div class="grid"><section class="card s12"><div id="deploy"></div><div id="kpis" class="kpis" style="margin-top:.7rem"></div></section>
<section class="card s6"><h2>Error Inbox</h2><div class="scroll"><table><thead><tr><th>Error</th><th>Route</th><th>Count</th><th>Last seen</th></tr></thead><tbody id="errorRows"></tbody></table></div></section>
<section class="card s6"><h2>Slow Endpoints</h2><div class="scroll"><table><thead><tr><th>Route</th><th>Avg</th><th>Max</th><th>5xx</th></tr></thead><tbody id="routeRows"></tbody></table></div></section>
<section class="card s6"><h2>Incidents</h2><div id="incidents"></div></section><section class="card s6"><h2>Jobs</h2><div id="jobs"></div></section>
<section class="card s6"><h2>Backup & Recovery</h2><div id="recovery"></div></section><section class="card s6"><h2>Configuration & Integrations</h2><div id="config"></div></section>
<section class="card s12"><h2>إجراءات تشغيلية</h2><div class="forms">
<form onsubmit="createIncident(event)"><h3>Incident</h3><input id="incidentTitle" required placeholder="العنوان"><select id="incidentSeverity"><option>medium</option><option>high</option><option>critical</option><option>low</option></select><textarea id="incidentImpact" placeholder="الأثر"></textarea><button class="btn">إنشاء Incident</button></form>
<form onsubmit="recordBackup(event)"><h3>Backup Evidence</h3><input id="backupProvider" required placeholder="provider"><input id="backupResource" required placeholder="resource"><select id="backupStatus"><option>verified</option><option>failed</option><option>unknown</option></select><label><input id="restoreTested" type="checkbox" style="width:auto"> Restore tested</label><button class="btn">تسجيل التحقق</button></form>
</div></section></div></main>
<script src="/supabase-client.js"></script><script src="/bonds-auth-2026.js?v=3.1.3"></script><script src="/admin/admin-common.js"></script><script>
let state=null;const esc=v=>BondsAdminCommon.escapeHtml(v==null?'':String(v));const fmt=v=>v?new Date(v).toLocaleString('ar-SA'):'—';function err(m){const e=document.getElementById('status');e.textContent=m;e.style.display=m?'block':'none'}
async function api(url,o={}){const r=await window.BondsAuth.authenticatedFetch(url,{...o,returnTo:location.pathname+location.search});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error((d.error||('HTTP '+r.status))+(d.requestId?' ['+d.requestId+']':''));return d}
function render(){const s=state.summary||{},d=state.currentDeployment||{};document.getElementById('deploy').innerHTML='<b>Current deployment:</b> '+esc(d.commitSha||'UNKNOWN')+' · '+esc(d.environment||'unknown')+' · '+esc(d.branch||'—')+(state.requestId?' · Request '+esc(state.requestId):'');
document.getElementById('kpis').innerHTML=[['Errors 24h',s.errors24h||0],['Open Incidents',s.openIncidents||0],['Failed Jobs',s.failedJobs||0],['P50',s.p50Ms==null?'—':s.p50Ms+'ms'],['P95',s.p95Ms==null?'—':s.p95Ms+'ms'],['Heap',s.heapUsedMb+' MB'],['RSS',s.rssMb+' MB'],['Backup Unknown',s.backupUnknown||0],['Failed Drills',s.failedRecoveryDrills||0],['Integration Issues',s.degradedIntegrations||0],['Failed Webhooks',s.failedWebhooks||0],['Migration Gaps',s.migrationsNotApplied||0]].map(x=>'<div class="kpi"><b>'+esc(x[1])+'</b><span class="muted">'+esc(x[0])+'</span></div>').join('');
errorRows.innerHTML=(state.errors||[]).map(x=>'<tr><td>'+esc(x.error_code||x.message)+'</td><td>'+esc(x.route||'—')+'</td><td>'+esc(x.occurrence_count)+'</td><td>'+fmt(x.last_seen_at)+'</td></tr>').join('')||'<tr><td colspan=4>لا توجد أخطاء مسجلة</td></tr>';
routeRows.innerHTML=(state.slowRoutes||[]).map(x=>'<tr><td>'+esc(x.route)+'</td><td>'+esc(x.avgMs)+'ms</td><td>'+esc(x.maxMs)+'ms</td><td>'+esc(x.errors)+'</td></tr>').join('')||'<tr><td colspan=4>لا توجد metrics</td></tr>';
incidents.innerHTML=(state.incidents||[]).map(x=>'<div><b>'+esc(x.title)+'</b> · '+esc(x.severity)+' · '+esc(x.status)+'</div>').join('')||'<span class=muted>لا توجد Incidents</span>';
jobs.innerHTML=(state.jobs||[]).slice(0,30).map(x=>'<div>'+esc(x.job_name)+' · '+esc(x.status)+' · '+esc(x.progress==null?'—':x.progress+'%')+'</div>').join('')||'<span class=muted>لا توجد Jobs</span>';
recovery.innerHTML='<div>Backup checks: '+(state.backups||[]).length+'</div><div>Recovery drills: '+(state.recoveryDrills||[]).length+'</div>';
const p=state.configuration?.presence||{};config.innerHTML='<div>Secrets/config presence (values hidden): '+Object.entries(p).map(([k,v])=>'<div>'+esc(k)+' = '+esc(v?'present':'missing')+'</div>').join('')+'</div><div style="margin-top:.5rem">Integrations: '+(state.integrations||[]).length+' · Webhooks: '+(state.webhooks||[]).length+'</div>'}
async function loadPlatform(){err('');try{state=await api('/api/admin?action=platform-overview');render()}catch(e){err('فشل التحميل: '+e.message)}}
async function createIncident(ev){ev.preventDefault();try{await api('/api/admin?action=incident-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:incidentTitle.value,severity:incidentSeverity.value,impact:incidentImpact.value})});ev.target.reset();await loadPlatform()}catch(e){err(e.message)}}
async function recordBackup(ev){ev.preventDefault();try{await api('/api/admin?action=backup-check-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:backupProvider.value,resource:backupResource.value,status:backupStatus.value,restore_tested:restoreTested.checked})});ev.target.reset();await loadPlatform()}catch(e){err(e.message)}}
if(window.__ADMIN_ROLE)loadPlatform();else window.addEventListener('admin-auth-ready',loadPlatform,{once:true});
</script></body></html>
