<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة المؤشرات التنفيذية | بوندز</title>
  <meta name="description" content="لوحة مؤشرات فورية للملاك والإدارة العليا: الإيرادات، الأرباح، التدفقات، المشاريع، الفرص والعملاء." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="/assets/bonds-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/styles/design-system.css?v=1" />
  <link rel="stylesheet" href="/admin/executive-dashboard/styles.css?v=4" />
  <script src="/api/env"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/supabase-client.js"></script>
  <script src="/admin/executive-dashboard/service.js?v=3"></script>
  <script src="/admin/executive-dashboard/app.js?v=3"></script>
</head>
<body>
  <div class="ex-layout">
    <aside class="ex-sidebar" id="ex-sidebar">
      <div class="ex-brand">
        <img src="/assets/bonds-logo-2026-header.webp" alt="بوندز" />
        <span>المؤشرات التنفيذية</span>
      </div>
      <ul class="ex-nav">
        <li><a href="#" data-view="overview" class="active"><svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg> نظرة عامة</a></li>
        <li><a href="#" data-view="revenue"><svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg> الإيرادات والأرباح</a></li>
        <li><a href="#" data-view="projects"><svg class="bonds-icon bonds-icon--folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg> المشاريع والفرص</a></li>
      </ul>
      <div class="ex-sidebar-footer">
        <a href="/admin/dashboard.html"><svg class="bonds-icon bonds-icon--arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> لوحة الإدارة الرئيسية</a>
        <div id="ex-user">جارِ التحقق...</div>
      </div>
    </aside>

    <main class="ex-main" id="ex-main">
      <header class="ex-topbar">
        <div>
          <h1>لوحة المؤشرات التنفيذية</h1>
          <p class="ex-subtitle">مؤشرات فورية للملاك والإدارة العليا</p>
        </div>
        <div class="ex-topbar-actions">
          <span class="ex-live" id="ex-live" title="تحديث لحظي"><svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg> Live</span>
          <span class="ex-last-update" id="ex-last-update">—</span>
          <button class="ecc-btn ecc-btn--ghost" onclick="ExecutiveApp.openSettings()"><svg class="bonds-icon bonds-icon--settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> الإعدادات</button>
          <button class="ecc-btn ecc-btn--primary" onclick="ExecutiveApp.refresh()">↻ تحديث</button>
        </div>
      </header>

      <div id="ex-content">
        <div class="ecc-empty"><div class="loading__spinner"></div><p>جارِ تحميل المؤشرات...</p></div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      const el = document.getElementById('ex-content');
      function status(msg) { if (el) el.innerHTML = '<div class="ecc-empty"><p>' + msg + '</p></div>'; }
      window.addEventListener('error', function (e) { status('<svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg> خطأ JavaScript: ' + e.message); });
      window.addEventListener('unhandledrejection', function (e) { status('<svg class="bonds-icon bonds-icon--emoji" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg> خطأ غير متوقع: ' + (e.reason?.message || e.reason)); });
    })();
  </script>
  <script src="/admin/admin-embed.js"></script>
  <script src="/admin/admin-accessibility.js"></script>
</body>
</html>
