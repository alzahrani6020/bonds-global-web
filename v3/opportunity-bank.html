  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Vazirmatn', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      text-align: center;
    }
    header h1 { margin: 0; color: var(--gold-bright); font-size: 1.8rem; }
    header p { margin: 0.5rem 0 0; color: var(--text-secondary); }
    .container { padding: 2rem; max-width: 1200px; margin: 0 auto; }
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    select, input, button {
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
    }
    select, input { min-width: 180px; }
    button {
      cursor: pointer;
      font-weight: 700;
      transition: background 0.2s;
    }
    .filter-btn {
      background: rgba(212,168,83,0.15);
      border-color: var(--gold);
      color: var(--gold);
    }
    .filter-btn:hover:not(:disabled) { background: rgba(212,168,83,0.25); }
    .filter-btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      background: #EEF1F5;
      border-color: #D9DEE5;
      color: #5D6878;
    }
    .state-panel {
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem;
      text-align: center;
      background: #FFFFFF;
      border: 1px solid #D9DEE5;
      border-radius: 4px;
      color: #5D6878;
    }
    .state-panel strong {
      display: block;
      margin-bottom: 0.5rem;
      color: #0B1F3A;
      font-size: 1.05rem;
    }
    .state-panel.error strong { color: #B42318; }
    .state-panel button {
      margin-top: 1rem;
      min-width: 140px;
      background: #0B1F3A;
      border-color: #0B1F3A;
      color: #FFFFFF;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--gold); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
    .card-header h3 { margin: 0; color: var(--gold-bright); font-size: 1.15rem; }
    .rating {
      font-size: 1.1rem;
      font-weight: 800;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
    }
    .rating.a-plus { background: rgba(240,201,106,0.15); color: var(--gold-bright); }
    .rating.a { background: rgba(34,197,94,0.15); color: var(--success); }
    .rating.b { background: rgba(245,158,11,0.15); color: var(--warning); }
    .rating.c { background: rgba(239,68,68,0.15); color: var(--danger); }
    .score-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .score-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--gold-bright);
    }
    .score-bar {
      flex: 1;
      height: 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 5px;
      overflow: hidden;
    }
    .score-fill {
      height: 100%;
      border-radius: 5px;
      background: linear-gradient(90deg, var(--danger), var(--warning), var(--success), var(--gold-bright));
    }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1rem; margin-bottom: 1rem; }
    .metric { display: flex; justify-content: space-between; font-size: 0.85rem; }
    .metric-label { color: var(--text-secondary); }
    .metric-value { font-weight: 700; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .tag {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.2rem 0.6rem;
      font-size: 0.75rem;
    }
    .actions { display: flex; gap: 0.5rem; }
    .actions a {
      flex: 1;
      text-align: center;
      padding: 0.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .actions a.primary {
      background: rgba(212,168,83,0.15);
      border-color: var(--gold);
      color: var(--gold);
    }
    .loading { text-align: center; padding: 3rem; color: var(--text-secondary); }
    .error { color: var(--danger); text-align: center; padding: 2rem; }
    .footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-top: 3rem;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: var(--gold-bright);
      text-decoration: none;
      font-weight: 700;
    }
    @media (max-width: 768px) {
      .controls { flex-direction: column; align-items: stretch; }
      select, input, button { width: 100%; }
    }
  </style>

  <script>
    const API_URL = '/api/v3';
    const countryNames = {
      DZ: 'الجزائر', BH: 'البحرين', KM: 'جزر القمر', DJ: 'جيبوتي', EG: 'مصر', IQ: 'العراق',
      JO: 'الأردن', KW: 'الكويت', LB: 'لبنان', LY: 'ليبيا', MR: 'موريتانيا', MA: 'المغرب',
      OM: 'عُمان', PS: 'فلسطين', QA: 'قطر', SA: 'السعودية', SO: 'الصومال', SD: 'السودان',
      SY: 'سوريا', TN: 'تونس', AE: 'الإمارات', YE: 'اليمن'
    };
    const MODERN_CITY_CODE = /^[A-Z]{2}-\d{2}-\d{3}$/;
    let activities = [];
    let countryProfiles = new Map();

    async function fetchJson(url, options = {}) {
      const res = await fetch(url, options);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function formatNumber(num) {
      if (num === null || num === undefined) return '-';
      if (num >= 1e9) return (num / 1e9).toFixed(1) + ' مليار';
      if (num >= 1e6) return (num / 1e6).toFixed(1) + ' مليون';
      return Number(num).toLocaleString('ar-SA');
    }

    function demandLabel(value) {
      return { high: 'مرتفع', medium: 'متوسط', low: 'منخفض' }[value] || value || '-';
    }

    function getRating(score, reliability) {
      const r = Number(reliability) || 0;
      if (score >= 80 && r >= 80) return { label: 'A+', cls: 'a-plus' };
      if (score >= 65 && r >= 65) return { label: 'A', cls: 'a' };
      if (score >= 45 && r >= 45) return { label: 'B', cls: 'b' };
      return { label: 'C', cls: 'c' };
    }

    function reliabilityLabel(value) {
      return {
        verified: 'موثوق',
        supported: 'مدعوم',
        indicative: 'استرشادي',
        exploratory: 'استكشافي',
        insufficient: 'أدلة غير كافية'
      }[value] || value || 'غير محدد';
    }

    function decisionStatusLabel(value) {
      return {
        strong: 'فرصة قوية بأدلة قوية',
        supported: 'فرصة مدعومة',
        indicative: 'فرصة استرشادية',
        indicative_only: 'إشارة استرشادية فقط',
        insufficient_evidence: 'أدلة غير كافية للحكم'
      }[value] || value || 'غير محدد';
    }

    function setReadinessState(state, detail = '') {
      const countrySelect = document.getElementById('countrySelect');
      const activitySelect = document.getElementById('activitySelect');
      const filterBtn = document.getElementById('filterBtn');
      const content = document.getElementById('content');
      const ready = state === 'ready';

      countrySelect.disabled = !ready;
      activitySelect.disabled = !ready;
      filterBtn.disabled = !ready;

      const panel = document.createElement('div');
      panel.className = 'state-panel' + (state === 'error' ? ' error' : '');
      panel.setAttribute('role', state === 'error' ? 'alert' : 'status');
      panel.setAttribute('aria-live', state === 'error' ? 'assertive' : 'polite');

      const title = document.createElement('strong');
      const description = document.createElement('span');

      if (state === 'loading') {
        title.textContent = 'جاري تجهيز بنك الفرص';
        description.textContent = 'يتم تحميل الدول والأنشطة والبيانات المرجعية.';
      } else if (state === 'empty') {
        title.textContent = 'بيانات بنك الفرص غير مكتملة';
        description.textContent = detail;
      } else if (state === 'error') {
        title.textContent = 'تعذر تحميل بيانات بنك الفرص';
        description.textContent = detail;
      } else {
        title.textContent = 'بيانات بنك الفرص جاهزة';
        description.textContent = 'اختر المعايير ثم اضغط بحث لعرض الفرص.';
      }

      panel.append(title, description);

      if (state === 'error') {
        const br = document.createElement('br');
        const retry = document.createElement('button');
        retry.type = 'button';
        retry.id = 'retryInit';
        retry.textContent = 'إعادة المحاولة';
        retry.addEventListener('click', init);
        panel.append(br, retry);
      }

      content.replaceChildren(panel);
    }

    async function init() {
      const countrySelect = document.getElementById('countrySelect');
      const activitySelect = document.getElementById('activitySelect');
      setReadinessState('loading');

      try {
        const countriesData = await fetchJson(API_URL + '/catalog/countries');

        if (window.destroyUniversalDropdowns) {
          window.destroyUniversalDropdowns(countrySelect);
          window.destroyUniversalDropdowns(activitySelect);
        }

        const countryRows = (countriesData.countries || []).filter(c => c.is_supported !== false);
        const countries = countryRows.map(c => c.code);
        countryProfiles = new Map(countryRows.map(c => [c.code, c]));

        countrySelect.innerHTML = '<option value="">كل الدول</option>';
        countryRows.forEach(country => {
          countrySelect.innerHTML += `<option value="${country.code}">${country.name_ar}</option>`;
        });

        const storedCountry = window.BondsCountryContext?.getSelected('SA') || 'SA';
        if (countries.includes(storedCountry)) countrySelect.value = storedCountry;

        const activityUrl = countrySelect.value
          ? API_URL + '/catalog/activities?country=' + encodeURIComponent(countrySelect.value)
          : API_URL + '/catalog/activities';
        const activitiesData = await fetchJson(activityUrl);
        activities = activitiesData.activities || [];

        activitySelect.innerHTML = '<option value="">كل الأنشطة</option>';
        activities
          .filter(a => a.country?.availability_status !== 'unavailable')
          .forEach(a => {
            activitySelect.innerHTML += `<option value="${a.code}">${a.name_ar}</option>`;
          });

        if (countries.length === 0 || activities.length === 0) {
          const missing = [];
          if (countries.length === 0) missing.push('المدن/الدول');
          if (activities.length === 0) missing.push('الأنشطة الاقتصادية');
          setReadinessState('empty', 'لا توجد بيانات مهيأة لـ ' + missing.join(' و ') + '.');
          return;
        }

        countrySelect.disabled = false;
        activitySelect.disabled = false;

        if (window.initUniversalDropdowns) {
          window.initUniversalDropdowns(countrySelect);
          window.initUniversalDropdowns(activitySelect);
        }

        if (countrySelect.value) {
          const profile = countryProfiles.get(countrySelect.value);
          window.BondsCountryContext?.setSelected(countrySelect.value, {
            currency_code: profile?.currency_code || null,
            currency_symbol: profile?.currency_symbol || null
          });
        }

        setReadinessState('ready');
      } catch (err) {
        setReadinessState('error', err.message || 'حدث خطأ غير متوقع أثناء تحميل البيانات.');
      }
    }

    document.getElementById('countrySelect').addEventListener('change', async () => {
      const countrySelect = document.getElementById('countrySelect');
      const activitySelect = document.getElementById('activitySelect');
      const profile = countryProfiles.get(countrySelect.value) || null;
      if (countrySelect.value) {
        window.BondsCountryContext?.setSelected(countrySelect.value, {
          currency_code: profile?.currency_code || null,
          currency_symbol: profile?.currency_symbol || null
        });
      }

      try {
        const url = countrySelect.value
          ? API_URL + '/catalog/activities?country=' + encodeURIComponent(countrySelect.value)
          : API_URL + '/catalog/activities';
        const data = await fetchJson(url);
        activities = data.activities || [];
        activitySelect.innerHTML = '<option value="">كل الأنشطة</option>';
        activities
          .filter(a => a.country?.availability_status !== 'unavailable')
          .forEach(a => {
            activitySelect.innerHTML += `<option value="${a.code}">${a.name_ar}</option>`;
          });
      } catch (err) {
        console.warn('Failed to refresh activities for country:', err.message);
      }
    });

    async function loadOpportunities() {
      const country = document.getElementById('countrySelect').value;
      const activity = document.getElementById('activitySelect').value;
      const minScore = document.getElementById('minScore').value;
      const limit = document.getElementById('limitSelect').value;

      const params = new URLSearchParams();
      if (country) params.set('country', country);
      if (activity) params.set('activity', activity);
      if (minScore) params.set('min_score', minScore);
      params.set('limit', limit);

      document.getElementById('content').innerHTML = '<div class="loading">جاري تحميل الفرص...</div>';

      try {
        const data = await fetchJson(`${API_URL}/opportunities/top?${params.toString()}`);
        renderOpportunities(data.opportunities || []);
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="error">فشل التحميل: ${err.message}</div>`;
      }
    }

    function renderOpportunities(opportunities) {
      const content = document.getElementById('content');
      if (opportunities.length === 0) {
        const filters = [];
        const country = document.getElementById('countrySelect').value;
        const activity = document.getElementById('activitySelect');
        const activityName = activity.value ? activity.options[activity.selectedIndex].text : '';
        if (country) filters.push(countryNames[country] || country);
        if (activityName) filters.push(activityName);
        content.innerHTML = `
          <div style="text-align:center; padding: 3rem 1rem; color: var(--text-secondary);">
            <div style="font-size: 2rem; margin-bottom: 1rem;" aria-hidden="true">⌕</div>
            <h3 style="color: var(--text); margin: 0 0 0.5rem;">لا توجد فرص مطابقة</h3>
            <p>لا توجد بيانات سوق كافية للمعايير المحددة${filters.length ? ' (' + filters.join(' + ') + ')' : ''}.</p>
            <p>جرّب تخفيف الحد الأدنى لدرجة القرار، أو اختر دولة/نشاط آخر، أو تحقق من "ذكاء المدن".</p>
          </div>
        `;
        return;
      }

      content.innerHTML = `<div class="grid">${opportunities.map((o, idx) => {
        const city = o.city;
        const activity = o.activity;
        const rawScore = Number(o.rawScore ?? o.score) || 0;
        const decisionScore = Number(o.decisionScore ?? o.score) || 0;
        const reliability = Number(o.reliability) || 0;
        const rating = getRating(decisionScore, reliability);
        return `
          <div class="card">
            <div class="card-header">
              <div>
                <h3>${city?.name_ar || '-'}</h3>
                <small style="color:var(--text-secondary)">${countryNames[city?.country_code] || city?.country_code || '-'} · ${activity?.name_ar || '-'}</small>
              </div>
              <span class="rating ${rating.cls}">${rating.label}</span>
            </div>
            <div class="score-row">
              <span class="score-value">${decisionScore.toFixed(1)}</span>
              <div class="score-bar"><div class="score-fill" style="width:${Math.min(decisionScore,100)}%"></div></div>
            </div>
            <div class="metrics">
              <div class="metric"><span class="metric-label">الترتيب</span><span class="metric-value">#${o.rank || idx + 1}</span></div>
              <div class="metric"><span class="metric-label">حجم السوق</span><span class="metric-value">${window.BondsCountryContext?.formatMoney(o.marketSize, countryProfiles.get(city?.country_code)) || formatNumber(o.marketSize)}</span></div>
              <div class="metric"><span class="metric-label">المنافسون</span><span class="metric-value">${formatNumber(o.competitorsCount)}</span></div>
              <div class="metric"><span class="metric-label">التشبع</span><span class="metric-value">${Number(o.saturation)?.toFixed(0) || '-'}%</span></div>
              <div class="metric"><span class="metric-label">النمو</span><span class="metric-value">${Number(o.growthRate)?.toFixed(1) || '-'}%</span></div>
              <div class="metric"><span class="metric-label">الطلب</span><span class="metric-value">${demandLabel(o.expectedDemand)}</span></div>
            </div>
            <div class="tags">
              <span class="tag">إمكان الفرصة ${rawScore.toFixed(1)}/100</span>
              <span class="tag">موثوقية الأدلة ${reliability.toFixed(0)}% — ${reliabilityLabel(o.reliabilityBand)}</span>
              <span class="tag">${decisionStatusLabel(o.decisionStatus)}</span>
              <span class="tag">نطاق القرار ${Number(o.uncertainty?.low ?? decisionScore).toFixed(0)}–${Number(o.uncertainty?.high ?? decisionScore).toFixed(0)}</span>
              <span class="tag">تغطية أبعاد التقييم ${o.scoringCoverage == null ? 'غير متاحة' : Number(o.scoringCoverage).toFixed(0) + '%'}</span>
              <span class="tag">ثقة المصدر ${Number(o.confidence)?.toFixed(0) || '-'}%</span>
              <span class="tag">متوسط راتب ${formatNumber(o.avgSalary)} ر.س</span>
            </div>
            <div class="actions">
              <a href="/v3/city-intelligence?city=${city?.code || ''}&activity=${activity?.code || ''}" class="primary">تحليل المدينة</a>
              <a href="/v3/city-comparison?activity=${activity?.code || ''}">قارن</a>
            </div>
          </div>
        `;
      }).join('')}</div>`;
    }

    document.getElementById('filterBtn').addEventListener('click', loadOpportunities);

    init();
  </script>
  <div id="site-footer"></div>
<script src="../components/universal-dropdown.js?v=2.51.8"></script>
<script src="../components/universal-dropdown-init.js?v=2"></script>
  <script src="shared-v3-ui.js" defer></script>
<script src="/components/emoji-icons.js" defer></script>
<script src="/components/emoji-renderer.js" defer></script>
</body>
</html>
