<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الخريطة الاستثمارية | Bonds V3</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --bg: #0a0f1a;
      --card: #10182d;
      --border: rgba(197,160,40,0.2);
      --gold: #d4a853;
      --gold-bright: #f0c96a;
      --text: #e8ecf4;
      --text-secondary: #94a3b8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Vazirmatn', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    header h1 { margin: 0; color: var(--gold-bright); font-size: 1.4rem; }
    header p { margin: 0; color: var(--text-secondary); font-size: 0.9rem; }
    .back-link {
      color: var(--gold);
      text-decoration: none;
      font-weight: 700;
    }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 80px);
    }
    .sidebar {
      background: var(--card);
      border-left: 1px solid var(--border);
      padding: 1.5rem;
      overflow-y: auto;
    }
    .control-group { margin-bottom: 1.25rem; }
    .control-group label {
      display: block;
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      font-weight: 700;
    }
    select, input[type="range"] {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
    }
    .range-value {
      color: var(--gold-bright);
      font-weight: 700;
      margin-top: 0.25rem;
      display: inline-block;
    }
    .btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: var(--gold);
      color: #0a0f1a;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 0.75rem;
    }
    .btn:hover { background: var(--gold-bright); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
    }
    .btn-secondary:hover { background: rgba(212,168,83,0.1); }
    .legend {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .legend h4 { margin: 0 0 0.75rem; color: var(--gold-bright); font-size: 0.95rem; }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }
    .dot.hot { background: var(--gold-bright); }
    .dot.good { background: var(--success); }
    .dot.fair { background: var(--warning); }
    .dot.weak { background: var(--danger); }
    #map { height: 100%; width: 100%; background: #050810; }
    .loading, .error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 1rem 2rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      z-index: 1000;
    }
    .error { color: var(--danger); }
    .popup-title { color: var(--gold-bright); font-weight: 700; margin: 0 0 0.5rem; }
    .popup-metric { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.9rem; margin-bottom: 0.25rem; }
    .popup-link {
      display: inline-block;
      margin-top: 0.5rem;
      color: var(--gold);
      text-decoration: none;
      font-weight: 700;
    }
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .sidebar { border-left: none; border-bottom: 1px solid var(--border); max-height: 45vh; }
    }
  </style>
<script src="../site-layout.js"></script>

  <meta property="og:url" content="https://bonds-global.com/v3/investment-map" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="الخريطة الاستثمارية | Bonds V3" />

  <meta name="twitter:image" content="https://bonds-global.com/assets/bonds-logo-2026.webp" />

  <meta name="description" content="حاسبات مالية متخصصة واستشارات اقتصادية من بوندز." />

<link rel="stylesheet" href="../components/universal-dropdown.css" />
</head>
<body>

  <div id="site-header"></div>
  <header>
    <div>
      <h1>🗺️ الخريطة الاستثمارية</h1>
      <p>اكتشف أفضل المدن والفرص حسب النشاط الاقتصادي</p>
    </div>
    <a class="back-link" href="/v3/city-intelligence">← ذكاء المدن</a>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="control-group">
        <label for="countrySelect">الدولة</label>
        <select data-universal-dropdown="true" data-ud-search="true" data-ud-sort="true" data-ud-deduplicate="true" data-ud-remove-empty="true" id="countrySelect"><option value="">كل الدول</option></select>
      </div>

      <div class="control-group">
        <label for="activitySelect">النشاط الاقتصادي</label>
        <select data-universal-dropdown="true" data-ud-search="true" data-ud-sort="true" data-ud-deduplicate="true" data-ud-remove-empty="true" id="activitySelect"><option value="">اختر نشاطاً</option></select>
      </div>

      <div class="control-group">
        <label for="scoreRange">الحد الأدنى للفرصة: <span class="range-value" id="scoreValue">0</span></label>
        <input type="range" id="scoreRange" min="0" max="100" value="0" step="5">
      </div>

      <button class="btn" id="loadBtn">تحديث الخريطة</button>
      <button class="btn btn-secondary" id="topBtn">أعلى 10 فرص</button>

      <div class="legend">
        <h4>مفتاح الألوان</h4>
        <div class="legend-item"><span class="dot hot"></span> فرصة ساخنة (≥80)</div>
        <div class="legend-item"><span class="dot good"></span> فرصة جيدة (60–79)</div>
        <div class="legend-item"><span class="dot fair"></span> فرصة متوسطة (40–59)</div>
        <div class="legend-item"><span class="dot weak"></span> فرصة ضعيفة (&lt;40)</div>
      </div>
    </aside>

    <main style="position: relative;">
      <div id="map"></div>
      <div id="status" class="loading" style="display: none;">جاري التحميل...</div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const API_URL = '/api/v3';
    const countryNames = { SA: 'السعودية', AE: 'الإمارات', QA: 'قطر', EG: 'مصر', JO: 'الأردن' };
    let map, markersLayer;
    let activities = [];
    let citiesData = [];

    async function fetchJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Request failed: ' + res.status);
      return res.json();
    }

    function formatNumber(num) {
      if (num === null || num === undefined) return '-';
      if (num >= 1e9) return (num / 1e9).toFixed(1) + ' مليار';
      if (num >= 1e6) return (num / 1e6).toFixed(1) + ' مليون';
      return num.toLocaleString('ar-SA');
    }

    function classify(score) {
      if (score >= 80) return 'hot';
      if (score >= 60) return 'good';
      if (score >= 40) return 'fair';
      return 'weak';
    }

    function classificationLabel(cls) {
      return { hot: 'ساخنة', good: 'جيدة', fair: 'متوسطة', weak: 'ضعيفة' }[cls] || cls;
    }

    function initMap() {
      map = L.map('map', {
        center: [25, 45],
        zoom: 5,
        minZoom: 3,
        zoomControl: false
      });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 18
      }).addTo(map);
      L.control.zoom({ position: 'bottomleft' }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
    }

    async function initFilters() {
      const [citiesRes, sectorsRes] = await Promise.all([
        fetchJson(API_URL + '/cities'),
        fetchJson(API_URL + '/sectors')
      ]);

      const cities = citiesRes.cities || [];
      activities = [];
      (sectorsRes.sectors || []).forEach(sector => {
        (sector.economic_sub_sectors || []).forEach(sub => {
          (sub.economic_activities || []).forEach(a => {
            activities.push(a);
          });
        });
      });

      const countrySelect = document.getElementById('countrySelect');
      const countries = [...new Set(cities.map(c => c.country_code).filter(Boolean))].sort();
      countries.forEach(code => {
        countrySelect.innerHTML += `<option value="${code}">${countryNames[code] || code}</option>`;
      });

      const activitySelect = document.getElementById('activitySelect');
      activities.forEach(a => {
        activitySelect.innerHTML += `<option value="${a.code}">${a.name_ar}</option>`;
      });
    }

    function renderMarkers(cities) {
      markersLayer.clearLayers();
      const valid = cities.filter(c => c.lat && c.lng && c.opportunity && c.opportunity.score !== null);
      if (valid.length === 0) {
        showStatus('لا توجد مدن تطابق الفلاتر.', true);
        return;
      }
      hideStatus();

      const bounds = L.latLngBounds();
      valid.forEach(city => {
        const score = city.opportunity.score;
        const cls = classify(score);
        const color = {
          hot: '#f0c96a',
          good: '#22c55e',
          fair: '#f59e0b',
          weak: '#ef4444'
        }[cls];

        const icon = L.divIcon({
          className: 'custom-marker',
          html: `<div style="
            width: 24px; height: 24px; border-radius: 50%;
            background: ${color}; border: 2px solid #0a0f1a;
            box-shadow: 0 0 8px ${color}80;
          "></div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });

        const marker = L.marker([city.lat, city.lng], { icon }).addTo(markersLayer);
        marker.bindPopup(`
          <div class="popup-title">${city.name_ar}</div>
          <div class="popup-metric"><span>الدرجة:</span><strong>${score.toFixed(1)} / 100</strong></div>
          <div class="popup-metric"><span>التصنيف:</span><strong>${classificationLabel(cls)}</strong></div>
          <div class="popup-metric"><span>الترتيب:</span><strong>${city.opportunity.rank || '-'}</strong></div>
          <div class="popup-metric"><span>حجم السوق:</span><span>${formatNumber(city.opportunity.marketSize)} ر.س</span></div>
          <div class="popup-metric"><span>المنافسين:</span><span>${formatNumber(city.opportunity.competitorsCount)}</span></div>
          <div class="popup-metric"><span>التشبع:</span><span>${city.opportunity.saturation}%</span></div>
          <a class="popup-link" href="/v3/city-intelligence?city=${city.code}&activity=${document.getElementById('activitySelect').value}" target="_blank">عرض ذكاء المدينة →</a>
        `);
        bounds.extend([city.lat, city.lng]);
      });

      map.fitBounds(bounds, { padding: [40, 40], maxZoom: 10 });
    }

    async function loadMap() {
      updateChatContext();
      const country = document.getElementById('countrySelect').value;
      const activity = document.getElementById('activitySelect').value;
      const minScore = document.getElementById('scoreRange').value;

      if (!activity) {
        showStatus('يرجى اختيار نشاط اقتصادي أولاً.', true);
        return;
      }

      showStatus('جاري تحميل الفرص...');
      try {
        const params = new URLSearchParams({
          include: 'opportunity',
          activity,
          year: '2025'
        });
        if (country) params.set('country', country);
        if (minScore > 0) params.set('min_score', minScore);

        const res = await fetchJson(`${API_URL}/cities?${params.toString()}`);
        citiesData = res.cities || [];
        renderMarkers(citiesData);
      } catch (err) {
        showStatus('فشل تحميل البيانات: ' + err.message, true);
      }
    }

    async function showTop10() {
      updateChatContext();
      const country = document.getElementById('countrySelect').value;
      const activity = document.getElementById('activitySelect').value;
      if (!activity) {
        showStatus('يرجى اختيار نشاط اقتصادي أولاً.', true);
        return;
      }
      showStatus('جاري تحميل أعلى الفرص...');
      try {
        const params = new URLSearchParams({ activity, limit: '10', year: '2025' });
        if (country) params.set('country', country);
        const res = await fetchJson(`${API_URL}/opportunities/top?${params.toString()}`);
        const ops = res.opportunities || [];
        const mapped = ops.map(o => ({
          ...o.city,
          opportunity: {
            score: o.score,
            rank: o.rank,
            marketSize: o.marketSize,
            competitorsCount: o.competitorsCount,
            saturation: o.saturation
          }
        }));
        renderMarkers(mapped);
      } catch (err) {
        showStatus('فشل تحميل أعلى الفرص: ' + err.message, true);
      }
    }

    function showStatus(text, isError) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.style.display = 'block';
      el.className = isError ? 'error' : 'loading';
    }
    function hideStatus() {
      document.getElementById('status').style.display = 'none';
    }

    document.getElementById('scoreRange').addEventListener('input', e => {
      document.getElementById('scoreValue').textContent = e.target.value;
    });
    document.getElementById('loadBtn').addEventListener('click', loadMap);
    document.getElementById('topBtn').addEventListener('click', showTop10);

    function updateChatContext() {
      const country = document.getElementById('countrySelect').value;
      const activity = document.getElementById('activitySelect').value;
      if (window.BondsAIChat && window.BondsAIChat.updateContext) {
        window.BondsAIChat.updateContext({
          countryCode: country || null,
          activityCode: activity || null
        });
      }
    }

    (async function bootstrap() {
      initMap();
      try {
        await initFilters();
        BondsAIChat.mount();
        updateChatContext();
      } catch (err) {
        showStatus('فشل تحميل الفلاتر: ' + err.message, true);
      }
    })();
  </script>
  <script src="/v3/components/ai-chat-widget.js"></script>
  <div id="site-footer"></div>
<script src="../components/universal-dropdown.js"></script>
<script src="../components/universal-dropdown-init.js"></script>
</body>
</html>
