  <style>
    :root {
      --bg: #0a0f1a;
      --bg-card: rgba(16,24,45,0.6);
      --gold: #d4a853;
      --gold-bright: #f0c96a;
      --text: #e8ecf4;
      --text-secondary: #94a3b8;
      --border: rgba(197,160,40,0.15);
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
      --info: #3b82f6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Vazirmatn', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .ecc-shell { max-width: 1440px; margin: 0 auto; padding: 1.5rem; }

    .ecc-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 1rem; margin-bottom: 1.5rem;
    }
    .ecc-header__title h1 { font-size: 1.8rem; font-weight: 800; color: var(--gold-bright); }
    .ecc-header__title p { color: var(--text-secondary); font-size: 0.95rem; margin-top: 0.25rem; }
    .ecc-header__actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    .ecc-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 1.25rem;
    }

    .ecc-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      backdrop-filter: blur(10px);
    }
    .ecc-card__title {
      font-size: 0.9rem; font-weight: 700; color: var(--text-secondary);
      margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.5px;
    }

    .summary-cards { grid-column: span 12; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
    .summary-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
      padding: 1rem; text-align: center; transition: all 0.2s;
    }
    .summary-card:hover { border-color: rgba(212,168,83,0.35); }
    .summary-card__value { font-size: 1.75rem; font-weight: 800; color: var(--gold-bright); margin-bottom: 0.25rem; }
    .summary-card__label { font-size: 0.8rem; color: var(--text-secondary); }

    .chart-section { grid-column: span 4; }
    .mini-chart { height: 200px; display: flex; align-items: center; justify-content: center; }

    .projects-section { grid-column: span 8; }
    .projects-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .projects-table th {
      text-align: right; padding: 0.75rem; color: var(--text-secondary);
      border-bottom: 1px solid var(--border); font-weight: 700;
    }
    .projects-table td { padding: 0.85rem 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
    .projects-table tr:hover td { background: rgba(255,255,255,0.02); }
    .project-name { font-weight: 700; color: var(--gold-bright); cursor: pointer; }
    .project-meta { color: var(--text-secondary); font-size: 0.75rem; }
    .health-badge, .stage-badge {
      display: inline-block; padding: 0.25rem 0.6rem; border-radius: 999px;
      font-size: 0.7rem; font-weight: 700;
    }
    .health--healthy { background: rgba(34,197,94,0.15); color: var(--success); }
    .health--attention { background: rgba(234,179,8,0.15); color: var(--warning); }
    .health--at-risk { background: rgba(239,68,68,0.15); color: var(--danger); }
    .stage-badge { background: rgba(255,255,255,0.06); color: var(--text-secondary); }

    .alerts-section { grid-column: span 7; }
    .actions-section { grid-column: span 5; }

    .alert {
      display: flex; align-items: flex-start; gap: 0.6rem;
      padding: 0.75rem; border-radius: 10px;
      background: rgba(255,255,255,0.03);
      margin-bottom: 0.6rem;
    }
    .alert__icon { font-size: 1.1rem; }
    .alert__title { font-weight: 700; font-size: 0.85rem; }
    .alert__msg { color: var(--text-secondary); font-size: 0.8rem; }
    .alert__project { color: var(--gold); font-size: 0.75rem; margin-top: 0.2rem; }

    .action-item {
      display: flex; align-items: flex-start; gap: 0.75rem;
      padding: 0.85rem; border-radius: 12px;
      background: rgba(255,255,255,0.03); margin-bottom: 0.6rem;
      border-right: 3px solid var(--info);
    }
    .action-item__title { font-weight: 700; font-size: 0.9rem; }
    .action-item__desc { color: var(--text-secondary); font-size: 0.8rem; margin-top: 0.15rem; }
    .action-item__project { color: var(--gold); font-size: 0.75rem; margin-top: 0.25rem; }

    .priority-critical { border-right-color: var(--danger); }
    .priority-high { border-right-color: var(--warning); }
    .priority-medium { border-right-color: var(--info); }
    .priority-low { border-right-color: var(--success); }

    .filter-bar {
      grid-column: span 12;
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      align-items: center; margin-bottom: 0.5rem;
    }
    .ecc-btn {
      padding: 0.6rem 1rem;
      border-radius: 10px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .ecc-btn--primary { background: linear-gradient(135deg, var(--gold), var(--gold-bright)); color: #0a0f1a; }
    .ecc-btn--secondary { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); }
    .ecc-btn:hover { transform: translateY(-1px); }
    .ecc-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .ecc-btn.active { border-color: var(--gold); color: var(--gold-bright); }

    .notification-bell {
      position: relative; cursor: pointer; font-size: 1.25rem;
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      border-radius: 10px; width: 42px; height: 42px; display: flex;
      align-items: center; justify-content: center; user-select: none;
    }
    .notification-bell:hover { border-color: var(--gold); }
    .notification-badge {
      position: absolute; top: -6px; left: -6px;
      background: var(--danger); color: #fff; font-size: 0.65rem;
      font-weight: 800; min-width: 18px; height: 18px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
    }
    .notification-panel {
      position: absolute; top: 52px; left: 0; width: 360px; max-width: 90vw;
      max-height: 480px; overflow-y: auto;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 1rem; z-index: 100;
      backdrop-filter: blur(10px); display: none;
    }
    .notification-panel.open { display: block; }
    .notification-item {
      padding: 0.75rem; border-radius: 10px; margin-bottom: 0.5rem;
      background: rgba(255,255,255,0.03); cursor: pointer;
      border-right: 3px solid transparent;
      transition: background 0.15s;
    }
    .notification-item:hover { background: rgba(255,255,255,0.06); }
    .notification-item.unread { border-right-color: var(--gold); background: rgba(212,168,83,0.08); }
    .notification-item__title { font-weight: 700; font-size: 0.85rem; }
    .notification-item__msg { color: var(--text-secondary); font-size: 0.75rem; margin-top: 0.15rem; }
    .notification-item__meta { color: var(--gold); font-size: 0.7rem; margin-top: 0.25rem; }
    .notification-empty { color: var(--text-secondary); font-size: 0.85rem; text-align: center; padding: 1rem; }
    .notification-actions { display: flex; justify-content: space-between; margin-bottom: 0.75rem; }

    .search-bar {
      grid-column: span 12;
      display: flex; gap: 0.75rem; margin-bottom: 0.5rem;
    }
    .search-input {
      flex: 1; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); background: rgba(255,255,255,0.03);
      color: var(--text); font-family: inherit; font-size: 0.9rem;
    }
    .search-input:focus { outline: none; border-color: var(--gold); }
    .search-results { grid-column: span 12; }
    .search-result {
      padding: 1rem; border-radius: 12px; background: rgba(255,255,255,0.03);
      border: 1px solid var(--border); margin-bottom: 0.75rem; cursor: pointer;
      transition: all 0.2s;
    }
    .search-result:hover { border-color: var(--gold); }
    .search-result__source {
      display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px;
      font-size: 0.65rem; font-weight: 700; background: rgba(212,168,83,0.15);
      color: var(--gold); margin-bottom: 0.4rem; text-transform: uppercase;
    }
    .search-result__title { font-weight: 700; color: var(--gold-bright); margin-bottom: 0.25rem; }
    .search-result__snippet { color: var(--text-secondary); font-size: 0.85rem; }
    .search-result__meta { color: var(--text-secondary); font-size: 0.7rem; margin-top: 0.4rem; }

    .loading {
      grid-column: span 12; text-align: center; padding: 4rem 1rem; color: var(--text-secondary);
    }
    .loading__spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--gold); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error { grid-column: span 12; text-align: center; padding: 3rem 1rem; color: var(--danger); }

    @media (max-width: 1024px) {
      .chart-section, .projects-section, .alerts-section, .actions-section { grid-column: span 12; }
    }
    @media (max-width: 640px) {
      .ecc-header { flex-direction: column; }
      .summary-cards { grid-template-columns: repeat(2, 1fr); }
      .projects-table th, .projects-table td { padding: 0.5rem; font-size: 0.75rem; }
    }
  </style>
